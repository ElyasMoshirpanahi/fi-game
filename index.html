<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06060c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<title>FI Roadmap</title>
<meta name="description" content="A dual-language (Farsi and English) learning game built from a roadmap to financial independence. Educational, not investment advice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #06060c; --card: #0e0f1c; --text: #e8f0ff; --muted: #8d95b5; --border: #232845; --line: #2b3157;
  --accent: #00f0ff; --accent-strong: #8af7ff; --accent-soft: #06262e;
  --gold: #fcee0a; --gold-soft: #2a2806; --gold-strong: #fff566;
  --ok: #2bff9a; --ok-soft: #062b1c; --bad: #ff3b6b; --bad-soft: #360a18;
  --mag: #ff2bd6; --ink: #05060c; /* ink: text on a bright fill */
  --plate: #191c36; --plate-deep: #0a0b17; --well: #11142a; --floor: #0a0a12; --trace: #2a3270; --trace-core: #6470d0;
  --shadow: 0 12px 34px rgba(0, 0, 0, .55); --radius: 4px 18px 4px 18px; --cut: 3px 12px 3px 12px;
  --fa-font: Vazirmatn, Tahoma, sans-serif; --en-font: Inter, system-ui, sans-serif; --hud-font: 'Plus Jakarta Sans', Inter, system-ui, sans-serif;
}
html[lang="fa"] { --hud-font: Vazirmatn, Tahoma, sans-serif; }
html[lang="fa"] *, .t-fa { letter-spacing: 0 !important; } /* letter spacing breaks joined Farsi letters */
* { box-sizing: border-box; }
html { height: 100%; }
body { margin: 0; min-height: 100%; color: var(--text); font-family: var(--en-font); line-height: 1.5; -webkit-font-smoothing: antialiased; background: radial-gradient(900px 520px at 85% -8%, rgba(255, 43, 214, .13), transparent 62%), radial-gradient(800px 520px at -12% 34%, rgba(0, 240, 255, .11), transparent 62%), var(--bg); background-attachment: fixed; }
body::before { content: ""; position: fixed; inset: -44px 0 0 0; z-index: 0; pointer-events: none; background-image: linear-gradient(rgba(0, 240, 255, .04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 240, 255, .04) 1px, transparent 1px); background-size: 44px 44px; -webkit-mask-image: radial-gradient(ellipse at 50% 35%, #000 8%, transparent 78%); mask-image: radial-gradient(ellipse at 50% 35%, #000 8%, transparent 78%); animation: gridmove 16s linear infinite; }
@keyframes gridmove { to { transform: translateY(44px); } }
h1, h2, h3, .kicker, .btn, .footbtn, .count, .xpnum, .coins, .secno, .badge, .node .label, .go, .combo, .picker, .modes, .disc, .planned { font-family: var(--hud-font); }
html[lang="fa"] body { font-family: var(--fa-font); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: var(--cut); box-shadow: 0 0 0 5px rgba(252, 238, 10, .18); }
#app { position: relative; z-index: 1; width: min(480px, 100%); margin: 0 auto; padding-bottom: 150px; }
.t-fa { font-family: var(--fa-font); direction: rtl; unicode-bidi: isolate; display: block; }
.t-en { font-family: var(--en-font); direction: ltr; unicode-bidi: isolate; display: block; }
.under { color: var(--muted); font-size: .92em; margin-top: 6px; }
bdi { unicode-bidi: isolate; }
bdi.nw { white-space: nowrap; }

/* top bar */
.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(12px) saturate(1.4); border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); box-shadow: 0 8px 24px rgba(0, 0, 0, .5); }
.modes { display: inline-flex; border: 1px solid var(--line); border-radius: var(--cut); padding: 2px; background: var(--card); }
.modes button { border: 0; background: transparent; padding: 5px 9px; border-radius: 2px 9px 2px 9px; font-weight: 600; font-size: 12px; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--accent); color: var(--ink); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 60%, transparent); }
.xpbar { position: relative; flex: 1; height: 11px; background: var(--well); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; transform: skewX(-18deg); }
.xpbar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 9px, rgba(6, 6, 12, .85) 9px 11px); }
.xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--mag), var(--accent)); box-shadow: 0 0 12px var(--accent); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.coins { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 14px; color: var(--gold); background: var(--gold-soft); border: 1px solid color-mix(in srgb, var(--gold) 45%, transparent); border-radius: var(--cut); padding: 3px 10px; }
.coins svg { width: 14px; height: 14px; }
.coins { position: relative; }
.coins.bump .n { animation: bump .5s cubic-bezier(.2,1.6,.4,1); display: inline-block; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }
.icon { border: 1px solid var(--line); background: var(--card); width: 34px; height: 34px; border-radius: var(--cut); display: grid; place-items: center; }
.icon svg { width: 18px; height: 18px; }

/* path */
.path { padding: 22px 14px 70px; }
.path h1 { font-size: 26px; font-weight: 700; margin: 0; letter-spacing: -.01em; line-height: 1.25; color: var(--gold); }
.path .sub { margin: 4px 0 16px; color: var(--muted); font-size: 14px; }
.nodes { list-style: none; margin: 0; padding: 0; position: relative; }
.node { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; margin: 0 auto 34px; width: 150px; transform: translateX(calc(var(--x, 0px) * var(--wave, 1))); }
@media (max-width: 350px) { .nodes { --wave: .7; } }
.roadlayer { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.road { width: 100%; height: 100%; overflow: visible; }
.road path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.road .rbase { stroke: var(--trace); stroke-width: 7; }
.road .rcore { stroke: var(--trace-core); stroke-width: 1.5; stroke-dasharray: 2 7; }
.road .rnext { stroke: var(--accent); stroke-width: 3; stroke-dasharray: 3 13; opacity: .75; animation: flow 1s linear infinite; }
.road .rlit { stroke: var(--accent); stroke-width: 4; filter: drop-shadow(0 0 5px var(--accent)) drop-shadow(0 0 14px color-mix(in srgb, var(--accent) 55%, transparent)); }
.road .rflow { stroke: #fff; stroke-width: 2; stroke-dasharray: 5 47; animation: flow 3s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -104; } }
.go { position: absolute; top: -36px; left: 50%; z-index: 2; transform: translateX(-50%); background: var(--gold); color: var(--ink); font-weight: 700; font-size: 12px; letter-spacing: .04em; padding: 3px 11px; border-radius: var(--cut); white-space: nowrap; box-shadow: 0 0 18px color-mix(in srgb, var(--gold) 60%, transparent); animation: bob 1.1s ease-in-out infinite; pointer-events: none; }
.go::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; margin-left: -5px; background: var(--gold); transform: rotate(45deg); z-index: -1; }
@keyframes bob { 50% { transform: translate(-50%, -6px); } }
.scan { position: absolute; inset: -13px; border-radius: 50%; border: 2px dashed color-mix(in srgb, var(--accent) 75%, transparent); animation: spin 9s linear infinite; pointer-events: none; }
.node > .ubtn { position: relative; width: 84px; height: 84px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; transition: transform .12s, filter .2s; filter: drop-shadow(0 6px 0 rgba(0, 0, 0, .6)); }
.node > .ubtn::before, .node > .ubtn::after { content: ""; position: absolute; clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
.node > .ubtn::before { inset: 6px; background: var(--line); }
.node > .ubtn::after { inset: 9px; background: linear-gradient(160deg, var(--plate), var(--plate-deep)); }
@media (hover: hover) { .node > .ubtn:hover { filter: drop-shadow(0 0 12px color-mix(in srgb, var(--accent) 60%, transparent)) drop-shadow(0 6px 0 rgba(0, 0, 0, .6)); } }
.node > .ubtn:active { transform: translateY(4px) scale(.95); }
@property --p { syntax: '<number>'; inherits: true; initial-value: 0; }
.node .ring { position: absolute; inset: -5px; border-radius: 50%; animation: ringin .8s cubic-bezier(.2,.8,.2,1) both; background: conic-gradient(var(--accent) calc(var(--p) * 1%), color-mix(in srgb, var(--line) 70%, transparent) 0); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); transition: background .5s; }
.node.lit > .ubtn { filter: drop-shadow(0 0 14px color-mix(in srgb, var(--gold) 65%, transparent)) drop-shadow(0 6px 0 rgba(0, 0, 0, .6)); }
.node.lit > .ubtn::before { background: #fffbc2; }
.node.lit > .ubtn::after { background: linear-gradient(160deg, var(--gold-strong), var(--gold) 60%, #c9b800); }
.node.lit .ring { background: var(--gold); }
.node.cur > .ubtn { filter: drop-shadow(0 0 12px color-mix(in srgb, var(--accent) 80%, transparent)) drop-shadow(0 6px 0 rgba(0, 0, 0, .6)); }
.node.cur > .ubtn::before { background: linear-gradient(160deg, #fff, var(--accent)); }
@keyframes ringin { from { --p: 0; } }
.node .label { margin-top: 12px; padding: 2px 8px; border-radius: 6px; background: color-mix(in srgb, var(--bg) 86%, transparent); font-weight: 600; font-size: 14px; line-height: 1.3; text-align: center; }
.node .label .under { font-size: 12px; }
.node .badge { position: absolute; top: -6px; inset-inline-end: 6px; z-index: 2; background: var(--ink); color: var(--gold); border: 1px solid var(--gold); border-radius: var(--cut); padding: 1px 8px; font-size: 11px; font-weight: 700; white-space: nowrap; box-shadow: 0 0 10px color-mix(in srgb, var(--gold) 45%, transparent); }
.node .planned { margin-top: 4px; padding: 1px 8px; border-radius: 6px; background: color-mix(in srgb, var(--bg) 86%, transparent); font-size: 12px; color: var(--muted); }
.pathfoot { margin-top: 10px; display: flex; justify-content: center; }
.linkish { border: 0; background: transparent; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 6px; }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; background: var(--bad-soft); color: var(--bad); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.confirm button { border: 1px solid currentColor; background: transparent; border-radius: var(--cut); padding: 5px 12px; font-weight: 700; color: inherit; }

/* station */
.station { padding: 14px 16px 24px; }
.shead { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.prog { flex: 1; height: 12px; background: var(--line); border-radius: var(--cut); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: var(--cut); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.count { font-size: 13px; color: var(--muted); font-weight: 700; min-width: 40px; text-align: end; }
.panel { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 5%, var(--card)), var(--card) 120px); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 20px; box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .05); transition: transform .2s, box-shadow .2s; }
.enter .panel, .enter .feedback { animation: holo .24s cubic-bezier(.2,.8,.2,1) both; }
@keyframes holo { from { opacity: 0; transform: translateY(10px) scale(.985); filter: brightness(1.8) saturate(1.6); } to { opacity: 1; transform: none; filter: none; } }
@media (hover: hover) { .panel.card:hover { transform: translateY(-2px); } }
.kicker { font-size: 13px; font-weight: 600; letter-spacing: .01em; color: var(--accent); margin: 0 0 10px; }
.kicker.fare { color: var(--gold-strong); }
.stagechip { margin-inline-start: 10px; text-transform: none; letter-spacing: 0; font-size: 11px; padding: 2px 9px; vertical-align: middle; }
.panel.callout { border-inline-start: 5px solid var(--accent); background: var(--accent-soft); }
.slot[draggable] { cursor: grab; }
.markbtn { float: inline-end; border: 1px solid var(--line); background: var(--card); width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); margin-top: -6px; }
.markbtn svg { width: 16px; height: 16px; }
.markbtn.on { color: var(--gold-strong); border-color: var(--gold); background: var(--gold-soft); }
.footbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); border-radius: var(--cut); padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--text); transition: border-color .15s, box-shadow .15s, transform .08s; }
.footbtn svg { width: 14px; height: 14px; color: var(--gold-strong); }
.footbtn b { background: var(--gold-soft); color: var(--gold-strong); border-radius: var(--cut); padding: 0 7px; }
.backup { margin-top: 18px; } .backup .brow { justify-content: center; gap: 8px; }
.restore { margin-top: 10px; display: grid; gap: 8px; } .restore textarea, .restore input { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 10px; }
.help.warn { color: var(--gold-strong); text-align: center; } .help.ok { color: var(--ok); text-align: center; }
.footbtn.hot { border-color: var(--accent); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 40%, transparent); } .footbtn.hot b { background: var(--accent); color: var(--ink); }
.footbtn:active { transform: translateY(2px); }
@media (hover: hover) { .footbtn:hover { border-color: var(--accent); } }
.marks { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.mark { border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; background: var(--bg); }
.mark .kicker { margin-bottom: 6px; }
.ctext.small { font-size: 16px; font-weight: 500; margin-bottom: 10px; }
.mark .brow { justify-content: flex-end; }
.ctext { font-size: 19px; font-weight: 500; line-height: 1.6; margin: 0; }
.ctext .t-fa { font-size: 20px; }
.ctext .under { font-size: 17px; font-weight: 400; }
.prompt { font-size: 19px; font-weight: 600; margin: 0 0 16px; line-height: 1.45; }
.addnote { margin: 14px 0 0; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.addnote a { color: var(--accent); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.actions .wide { grid-column: 1 / -1; }
.btn { position: relative; border: 1px solid var(--line); border-bottom-width: 4px; background: linear-gradient(180deg, var(--plate), var(--card)); border-radius: var(--cut); padding: 13px 14px; font-weight: 600; font-size: 16px; text-align: center; color: var(--text); transition: transform .08s, border-color .15s, box-shadow .15s, background .15s; }
@media (hover: hover) { .btn:hover:not([disabled]) { border-color: var(--accent); box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 32%, transparent); } }
.btn:active { transform: translateY(3px); border-bottom-width: 1px; box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 55%, transparent); }
.btn.primary { background: linear-gradient(180deg, var(--accent-strong), var(--accent)); border-color: color-mix(in srgb, var(--accent) 55%, #000); color: var(--ink); font-weight: 700; box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 42%, transparent); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.soft { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 25%, transparent); color: var(--accent-strong); }
.btn.soft[aria-pressed="true"] { border-color: var(--accent); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.opts { display: grid; gap: 10px; margin-top: 6px; }
.opt { text-align: start; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.slots { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; padding: 8px; border: 2px dashed var(--line); border-radius: 12px; margin-bottom: 12px; }
.slot { background: var(--accent-soft); color: var(--accent-strong); border-radius: var(--cut); padding: 6px 12px; font-weight: 700; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.slot b { opacity: .7; }
.help { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
.hint { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--gold-soft); border-inline-start: 4px solid var(--gold); font-size: 15px; }
.hint .kicker { color: var(--gold-strong); margin-bottom: 6px; }
.feedback { scroll-margin-bottom: 84px; margin-top: 14px; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 700; animation: rise .25s ease-out; }
.feedback.ok { background: var(--ok-soft); color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 55%, transparent); box-shadow: 0 0 26px color-mix(in srgb, var(--ok) 22%, transparent); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 55%, transparent); box-shadow: 0 0 26px color-mix(in srgb, var(--bad) 22%, transparent); }
.feedback .btn { flex: 0 0 auto; padding: 10px 18px; }
.feedback.ok .btn { background: var(--ok); border-color: color-mix(in srgb, var(--ok) 70%, #000); color: var(--ink); }
.feedback.bad .btn { background: var(--bad); border-color: color-mix(in srgb, var(--bad) 70%, #000); color: var(--ink); }
.feedback .msg { display: flex; flex-direction: column; gap: 2px; }
.feedback .msg small { font-weight: 600; opacity: .85; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.result { text-align: center; padding: 34px 20px; }
.result .big { width: 120px; height: 120px; margin: 0 auto 16px; border-radius: var(--radius); display: grid; place-items: center; background: var(--gold-soft); color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold), 0 0 34px color-mix(in srgb, var(--gold) 45%, transparent); animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
.result .big svg { width: 56px; height: 56px; }
.result.fail .big { background: var(--bad-soft); color: var(--bad); box-shadow: inset 0 0 0 2px var(--bad), 0 0 34px color-mix(in srgb, var(--bad) 40%, transparent); }
.result h2 { margin: 0 0 6px; font-size: 24px; font-weight: 700; letter-spacing: -.01em; animation: rise .3s ease-out both; }
.result p { margin: 0 0 20px; color: var(--muted); }
.inl .t-en, .inl .t-fa { display: inline; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }

/* disclaimer, always visible */
.disc { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; text-align: center; font-size: 12px; padding: 8px 12px; background: var(--floor); color: var(--gold); border-top: 1px solid color-mix(in srgb, var(--gold) 40%, transparent); }
.disc .t-fa, .disc .t-en { display: inline; }
.disc .sep { margin: 0 8px; opacity: .5; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
/* ---- Station themes: a hue for the main light ---- */
[data-theme="blue"] { --accent: #3d9bff; --accent-strong: #9cc9ff; --accent-soft: #0a1d38; }
[data-theme="red"] { --accent: #ff3b6b; --accent-strong: #ff8fa9; --accent-soft: #360a18; }
[data-theme="green"] { --accent: #2bff9a; --accent-strong: #93ffc9; --accent-soft: #062b1c; }
[data-theme="amber"] { --accent: #ffb300; --accent-strong: #ffd666; --accent-soft: #2e2105; }
[data-theme="purple"] { --accent: #b76bff; --accent-strong: #d9b3ff; --accent-soft: #1f0f38; }
[data-theme="book"], [data-theme="teal"] { --accent: #00f0ff; --accent-strong: #8af7ff; --accent-soft: #06262e; }
/* ---- Path extras ---- */
.sections { display: grid; gap: 10px; }
.sec { border: 1px solid var(--border); border-radius: var(--radius); background: color-mix(in srgb, var(--card) 82%, transparent); scroll-margin-top: 76px; }
.sec.open { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 6%, transparent), transparent 240px); border-color: color-mix(in srgb, var(--accent) 38%, var(--border)); box-shadow: 0 0 26px color-mix(in srgb, var(--accent) 10%, transparent), inset 0 0 44px color-mix(in srgb, var(--accent) 5%, transparent); }
.sec.open { position: relative; }
.sec.open::before, .sec.open::after { content: ""; position: absolute; z-index: 2; width: 16px; height: 16px; pointer-events: none; border: 2px solid var(--accent); opacity: .8; }
.sec.open::before { inset-inline-end: 6px; bottom: 6px; border-inline-start: 0; border-top: 0; }
.sec.open::after { inset-inline-start: 6px; bottom: 6px; border-inline-end: 0; border-top: 0; }
.sechead { display: flex; align-items: center; gap: 12px; width: 100%; text-align: start; padding: 12px 14px; color: var(--text); border-radius: 4px 18px 0 0; }
.sectitle { display: block; margin: 0; font-size: 16px; font-weight: 700; line-height: 1.3; }
.sechead .n { flex: 0 0 auto; width: 30px; height: 30px; border-radius: var(--cut); background: var(--line); display: grid; place-items: center; font-family: var(--hud-font); font-weight: 700; font-size: 13px; }
.sec.book .sechead .n { background: var(--accent-soft); color: var(--accent-strong); }
.sechead .st { flex: 1; min-width: 0; } .sechead .st > span { display: block; font-size: 12px; color: var(--muted); }

  function advance(s, content) {
    if (s.queue.length) {
      const id = s.queue.shift();
      const it = content.item(s.stationId, id);
      s.current = id; s.flipped = false; s.misses = 0; s.hint = false;
      s.phase = it.kind === 'check' ? 'check' : it.kind === 'widget' ? 'widget' : 'card';
      // Resume position: index of this item in the Station's own order, only during the first pass.
      if (s.run && !s.run.returning) s.run.pos = indexIn(content, s.stationId, id);
      return s;
    }
    if (s.returns.length) {
      const cards = s.returns.slice();
      s.returns = [];
      if (s.run) { s.run.returning = true; s.run.pos = content.station(s.stationId).items.length; }
      const checks = checksOf(content, s.stationId);
      s.queue = cards.flatMap((c) => [c, ...checks.filter((k) => k.source === c).map((k) => k.id)]);
      s.events.push('return');
      return advance(s, content);
    }
    return startFare(s, content);
  }

  function startFare(s, content) {
    const pool = checksOf(content, s.stationId).map((k) => k.id);
    const n = Math.min(content.station(s.stationId).fareSize, pool.length);
    // Deterministic rotation: by n when the pool is bigger than the Fare, by 1 when it is not.
    const start = (s.fareAttempt * (n < pool.length ? n : 1)) % pool.length;
    const questions = Array.from({ length: n }, (_, i) => pool[(start + i) % pool.length]);
    s.fareAttempt += 1;
    if (s.run) s.run.pos = content.station(s.stationId).items.length;
    s.fare = { questions, index: 0, missed: [], attempt: s.fareAttempt };
    s.current = questions[0]; s.phase = 'fare'; s.misses = 0; s.hint = false; s.flipped = false;
    s.events.push('fare');
    return s;
  }

  // Legacy book progress (v1 whole-book keys, v2 Unit keys) is dropped; Basics, coins, checklists,
  // journal, habits, shelf and Basics bookmarks stay; XP is recomputed (decision 33, ADR-0010).
  function migrateLegacy(s, content) {
    const legacy = ['lit', 'farePassed', 'rings'].some((key) => Object.keys(s[key] || {}).some((k) => LEGACY_BOOK.test(k)))
      || (s.bookmarks || []).some((b) => LEGACY_BOOK.test(b.stationId)) || !!(s.run && LEGACY_BOOK.test(s.run.stationId));
    // LEGACY_BOOK detects a v1 or v2 document; isBookKey then clears every book key in it (a legacy document holds no v3 keys).
    if (!legacy) return;
    const isBookKey = (k) => /^(b\d\d|sec-b\d\d)/.test(k);
    for (const key of ['lit', 'farePassed', 'rings', 'awarded']) for (const k of Object.keys(s[key] || {})) if (isBookKey(k)) delete s[key][k];
    s.bookmarks = (s.bookmarks || []).filter((b) => !isBookKey(b.stationId));
    if (s.run && isBookKey(s.run.stationId)) s.run = null;
    s.xp = content.allStations().reduce((a, st) => a + (s.lit[st.id] ? st.xp : 0), 0) + (s.milestone ? content.MILESTONE_XP : 0);
  }

  function leave(s) {
    openChest(s); // a chest won and not opened is never lost
    s.tally = null; s.end = null;
    s.screen = 'path'; s.stationId = null; s.phase = null; s.current = null;
    s.queue = []; s.returns = []; s.fare = null; s.fareAttempt = 0; s.hint = false; s.misses = 0; s.run = null; s.review = null; s.notesFor = null;
    return s;
  }

  // Lighting rules. The Library lights only when its Fare passed and every Reading Order book is Lit.
  function light(s, content, stationId) {
    const st = content.station(stationId);
    if (s.lit[stationId]) return;
    if (st.litRule === 'readingOrder' && !content.readingOrder.every((b) => s.lit[content.sectionOf(b).id])) return;
    s.lit[stationId] = true; s.xp += st.xp; s.events.push('lit');
    // A Circle completes when all its Lessons are Lit (+25); a Section when all its Circles are (badge, +50) (decision 37).
    if (st.book) {
      const circle = content.circleOf(st.id);
      if (circle && !s.lit[circle.id] && circle.lessons.every((l) => s.lit[l])) { s.lit[circle.id] = true; s.xp += circle.xp; s.events.push('circle'); }
      const sec = content.sectionOf(st.bookId);
      if (sec && !s.lit[sec.id] && sec.circles.every((c) => s.lit[c.id])) { s.lit[sec.id] = true; s.xp += sec.xp; s.events.push('section'); }
    }
  }
  function relight(s, content) {
    for (const st of content.stations) if (s.farePassed[st.id] && !s.lit[st.id]) light(s, content, st.id);
  }

  function reduce(prev, action, content) {
    const s = JSON.parse(JSON.stringify(prev));
    s.events = []; s.paid = 0;
    switch (action.type) {
      case 'SET_MODE':
        if (MODES.includes(action.value)) s.mode = action.value;
        return s;
      case 'TOGGLE_MUTE':
        s.muted = !s.muted; return s;
      case 'HYDRATE': {
        const d = isMap(action.value) ? JSON.parse(JSON.stringify(action.value)) : {};
        const bad = badKeys(d);
        for (const k of DURABLE) {
          if (d[k] === undefined || k === 'run' || bad.includes(k)) continue;
          if (k === 'sliders' || k === 'checklists') s[k] = { ...s[k], ...d[k] }; else s[k] = d[k];
        }
        if (!MODES.includes(s.mode)) s.mode = 'EN';
        migrateLegacy(s, content);
        // A save from before Coins could be spent holds one number: it is both what is held and what was earned (ADR-0012).
        if (d.earned === undefined || bad.includes('earned') || s.earned < s.coins) s.earned = s.coins;
        openChest(s); s.events = []; s.paid = 0; // a chest won before a reload is paid, quietly
        // Resume at the saved position (owner decision after the Prompt 0 play-test). Returns and Fare are not resumed.
        if (d.run && !bad.includes('run') && !LEGACY_BOOK.test(d.run.stationId) && content.station(d.run.stationId) && content.station(d.run.stationId).items) {
          const st = content.station(d.run.stationId);
          const pos = Math.max(0, Math.min(st.items.length, d.run.pos | 0));
          leave(s);
          s.lastSection = sectionIdOf(content, st.id); // a save from before Continue existed has none
          s.screen = 'station'; s.stationId = st.id; s.run = { stationId: st.id, pos, returning: false };
          begin(s, st.id, action.at);
          s.queue = st.items.slice(pos).map((i) => i.id);
          return advance(s, content);
        }
        return s;
      }
      case 'OPEN_STATION': {
        const st = content.station(action.value);
        if (!st || !st.items || !st.items.length) return s;
        leave(s);
        s.lastSection = sectionIdOf(content, st.id);
        s.screen = 'station'; s.stationId = st.id; s.run = { stationId: st.id, pos: 0, returning: false };
        begin(s, st.id, action.at);
        s.queue = st.items.map((i) => i.id);
        return advance(s, content);
      }
      case 'OPEN_AT': {
        // Open a Station at one of its Cards (from a bookmark). The run continues from there.
        const { stationId, cardId } = action.value || {};
        const st = content.station(stationId);
        const idx = st && st.items ? st.items.findIndex((i) => i.id === cardId && i.kind === 'card') : -1;
        if (idx < 0) return s;
        leave(s);
        s.lastSection = sectionIdOf(content, st.id);
        s.screen = 'station'; s.stationId = st.id; s.run = { stationId: st.id, pos: idx, returning: false };
        begin(s, st.id, action.at);
        s.queue = st.items.slice(idx).map((i) => i.id);
        return advance(s, content);
      }
      case 'BACKUP_DONE':
        s.lastBackup = s.today; if (s.nudge7 === 'due') s.nudge7 = 'done'; return s;
      case 'RESTORE': {
        // Replace progress with a parsed backup; the same HYDRATE path applies the same migrations.
        const fresh = initial(); fresh.today = s.today;
        const out = reduce(fresh, { type: 'HYDRATE', value: action.value }, content);
        out.lastBackup = s.today; // the file just restored is a backup of exactly this progress
        out.events = ['restored'];
        if (s.screen === 'profile' && out.screen === 'path') out.screen = 'profile'; // the player restored from the Profile and reads the result there
        return out;
      }
      case 'TICK':
        if (Number.isInteger(action.value)) s.today = action.value;
        backfill(s, content);
        settleStreak(s);
        dealQuests(s, action.roll);
        return s;
      case 'OPEN_REVIEW': {
        leave(s);
        for (const id of Object.keys(s.deck)) refresh(s, content, id);
        const ids = dueIds(s).slice(0, leftToday(s));
        s.screen = 'review';
        s.review = { ids, index: 0, phase: ids.length ? 'card' : 'done', ok: null, retired: false, nextIn: 0, capped: !ids.length && dueIds(s).length > 0 };
        return s;
      }
      case 'OPEN_RECAP': {
        const sec = content.sections.find((x) => x.id === action.value);
        if (!recapOpen(s, content, sec)) return s;
        const entries = recapEntries(s, content, sec);
        if (!entries.length) return s;
        leave(s);
        const pool = {}; entries.forEach((e, i) => { pool[`r${i}`] = e; });
        s.screen = 'review'; s.lastSection = sec.id;
        s.review = { ids: Object.keys(pool), index: 0, phase: 'check', ok: null, retired: false, nextIn: 0, capped: false, recap: sec.id, pool, right: 0, paid: 0 };
        return s;
      }
      case 'REVIEW_NEXT': {
        if (s.screen !== 'review') return s;
        const r = s.review;
        if (r.phase === 'card' && entryOf(s, r.ids[r.index]) && entryOf(s, r.ids[r.index]).check) { r.phase = 'check'; return s; }
        if (r.phase === 'result') {
          r.index += 1; r.ok = null; r.retired = false; r.nextIn = 0;
          r.phase = r.index >= r.ids.length ? 'done' : r.recap ? 'check' : 'card';
          if (r.phase === 'done' && r.recap) {
            // The first finished Recap of a Section pays once. Every finished Recap counts the day, as a Lesson does.
            if (!s.awarded[`recap:${r.recap}`]) { s.awarded[`recap:${r.recap}`] = true; pay(s, RECAP_PAY); r.paid = RECAP_PAY; }
            s.recaps[r.recap] = true; s.events.push('recap-done');
            quest(s, 'lesson'); r.streak = touchDay(s);
          } else if (r.phase === 'done' && r.ids.length) { quest(s, 'review'); r.streak = touchDay(s); }
        }
        return s;
      }
      case 'REVIEW_ANSWER': {
        if (s.screen !== 'review' || s.review.phase !== 'check') return s;
        const id = s.review.ids[s.review.index];
        const e = entryOf(s, id);
        if (!e || !e.check) return s;
        const ok = same(action.value, e.check.answer);
        if (s.review.recap) {
          // A Recap moves no Card on the ladder. A miss puts the Card in the Deck, the same safety net as a Lesson.
          if (ok) { s.review.right += 1; s.events.push('correct'); comboUp(s); } else { comboDown(s); s.events.push('wrong'); enqueue(s, content, e.stationId, e.cardId, 'missed', e.check.id); }
          s.review.phase = 'result'; s.review.ok = ok;
          return s;
        }
        settle(s, id, ok, true);
        return s;
      }
      case 'REVIEW_RATE': {
        if (s.screen !== 'review' || s.review.phase !== 'card') return s;
        const id = s.review.ids[s.review.index];
        if (!s.deck[id] || s.deck[id].check) return s;
        settle(s, id, action.value === 'knew', false);
        return s;
      }
      case 'OPEN_NOTES':
        if (!content.sectionOf(action.value)) return s;
        leave(s);
        s.screen = 'notes'; s.notesFor = action.value;
        return s;
      case 'SET_NOTE': {
        // `edited` is the day, supplied by the app. An emptied page is removed.
        const { bookId, text, edited } = action.value || {};
        if (!content.sectionOf(bookId) || typeof text !== 'string') return s;
        if (text.trim()) s.notes[bookId] = { text: text.slice(0, NOTE_MAX_CHARS), edited: isDay(edited) ? edited : '' };
        else delete s.notes[bookId];
        return s;
      }
      case 'OPEN_BOOKMARKS':
        leave(s);
        s.screen = 'bookmarks';
        return s;
      case 'OPEN_PROFILE': // spec 12: a screen like Bookmarks; it holds no state of its own
        leave(s);
        s.screen = 'profile';
        return s;
      case 'TOGGLE_BOOKMARK': {
        const { stationId, cardId } = action.value || {};
        const at = s.bookmarks.findIndex((b) => b.stationId === stationId && b.cardId === cardId);
        // A bookmark whose Card no longer exists (re-cut content) can still be removed.
        const it = content.item(stationId, cardId);
        if (at < 0 && (!it || it.kind !== 'card')) return s;
        if (at >= 0) {
          s.bookmarks.splice(at, 1); s.events.push('unbookmark');
          const e = s.deck[cardId];
          if (e) { e.marked = false; if (!e.missed) delete s.deck[cardId]; }
        } else { s.bookmarks.push({ stationId, cardId, text: it.text }); s.events.push('bookmark'); enqueue(s, content, stationId, cardId, 'marked'); }
        return s;
      }
      case 'OPEN_TOOLS': {
        const st = content.station(action.value);
        if (!st) return s;
        leave(s);
        s.screen = 'tools'; s.stationId = st.id;
        return s;
      }
      case 'BACK_TO_PATH':
        return leave(s);
      case 'FLIP':
        if (s.phase === 'card') s.flipped = !s.flipped;
        return s;
      case 'RATE':
        if (s.phase !== 'card') return s;
        if (action.value === 'didnt') { queueReturn(s, s.current); enqueue(s, content, s.stationId, s.current, 'missed'); }
        return advance(s, content);
      case 'ANSWER': {
        if (s.phase !== 'check' && s.phase !== 'fare') return s;
        const k = content.item(s.stationId, s.current);
        const ok = same(action.value, k.answer);
        if (s.phase === 'check') {
          mark(s, k.id, ok);
          if (ok) {
            s.phase = 'correct'; s.events.push('correct'); comboUp(s);
            if (!s.awarded[k.id]) {
              s.awarded[k.id] = true; pay(s, comboPay(s.combo));
              s.rings[s.stationId] = (s.rings[s.stationId] || 0) + 1;
            }
            // A reload after Correct resumes on the next item, not on this Check.
            if (s.run && !s.run.returning) s.run.pos = indexIn(content, s.stationId, k.id) + 1;
          } else {
            s.misses += 1; comboDown(s); s.events.push('wrong');
            // Spec 15: the first wrong answer is the sign the Card was not understood. It Returns in this Lesson and enters the Deck.
            if (s.misses === 1) { s.hint = true; s.events.push('hint'); queueReturn(s, k.source); enqueue(s, content, s.stationId, k.source, 'missed', k.id); }
            else { s.phase = 'revealed'; queueReturn(s, k.source); enqueue(s, content, s.stationId, k.source, 'missed', k.id); s.events.push('revealed'); }
          }
          return s;
        }
        // Fare: no Hints, one attempt per question, result after the last one.
        mark(s, k.id, ok);
        if (ok) comboUp(s); else { comboDown(s); s.fare.missed.push(k.id); enqueue(s, content, s.stationId, k.source, 'missed', k.id); }
        s.events.push(ok ? 'correct' : 'wrong');
        s.fare.index += 1;
        if (s.fare.index < s.fare.questions.length) { s.current = s.fare.questions[s.fare.index]; return s; }
        if (s.fare.missed.length === 0) {
          s.phase = 'fare-passed'; s.events.push('fare-passed');
          s.farePassed[s.stationId] = true;
          light(s, content, s.stationId);
          relight(s, content);
          finish(s, action.at);
        } else {
          s.phase = 'fare-failed'; s.events.push('fare-failed');
        }
        return s;
      }
      case 'CONTINUE':
        if (s.phase === 'card' || s.phase === 'correct' || s.phase === 'revealed' || s.phase === 'widget') return advance(s, content); // spec 15: a Card has one button
        if (s.phase === 'fare-failed') {
          s.returns = [];
          for (const id of s.fare.missed) queueReturn(s, content.item(s.stationId, id).source);
          s.fare = null;
          return advance(s, content);
        }
        if (s.phase === 'fare-passed') {
          // The end of a Lesson: scoreboard, then the chest, then the onward screen, one tap each.
          const e = s.end;
          if (!e || e.step === 'onward') return leave(s);
          e.step = e.step === 'score' && e.chest ? 'chest' : e.step !== 'streak' && e.streak ? 'streak' : 'onward';
        }
        return s;
      case 'BUY_FREEZE':
        // Coins held go down; Coins earned never do (ADR-0012).
        if (s.freezes >= FREEZE_MAX || s.coins < FREEZE_PRICE) return s;
        s.coins -= FREEZE_PRICE; s.freezes += 1; s.events.push('bought');
        return s;
      case 'OPEN_QUEST_CHEST': {
        const q = questsToday(s);
        if (!q || q.chest !== 'ready') return s;
        const r = Number.isFinite(action.value) ? Math.min(0.999999, Math.max(0, action.value)) : 0;
        q.won = QUEST_CHEST[0] + Math.floor(r * (QUEST_CHEST[1] - QUEST_CHEST[0] + 1)); q.chest = 'open';
        pay(s, q.won); s.events.push('chest');
        return s;
      }
      case 'DISMISS_NUDGE':
        if (s.nudge7 === 'due') s.nudge7 = 'done';
        return s;
      case 'DISMISS_STREAK_NOTE':
        s.streakNote = null; return s;
      case 'OPEN_CHEST': {
        const e = s.end;
        if (s.phase !== 'fare-passed' || !e || e.step !== 'chest' || !e.chest || e.chest.open) return s;
        e.chest.won = openChest(s, action.value); e.chest.open = true;
        s.events.push('chest');
        return s;
      }
      case 'SET_SLIDER': {
        const { key, value } = action.value || {};
        if (['capital', 'ret', 'expenses'].includes(key) && Number.isFinite(+value)) s.sliders[key] = +value;
        return s;
      }
      case 'TOGGLE_HABIT': {
        const { habit, day, week } = action.value || {};
        if (!content.habits.some((h) => h.id === habit) || !(day >= 0 && day < 7)) return s;
        // Weekly tracker: the action carries the ISO week key (the engine never reads the clock). A new week starts empty.
        if (typeof week === 'string' && week && week !== s.habitsWeek) { s.habits = {}; s.habitsWeek = week; }
        if (!s.habits[habit]) s.habits[habit] = [false, false, false, false, false, false, false];
        s.habits[habit][day] = !s.habits[habit][day];
        return s;
      }
      case 'SET_JOURNAL': {
        const { text, reviewDate } = action.value || {};
        if (typeof text === 'string') s.journal.text = text.slice(0, 5000);
        if (typeof reviewDate === 'string') s.journal.reviewDate = reviewDate;
        return s;
      }
      case 'TOGGLE_CHECK': {
        const { list, index } = action.value || {};
        const l = content.checklists.find((x) => x.id === list);
        if (!l || !(index >= 0 && index < l.items.length)) return s;
        s.checklists[list][index] = !s.checklists[list][index];
        const all = content.checklists.every((x) => x.items.every((_, i) => s.checklists[x.id][i]));
        if (all && !s.milestone) { s.milestone = true; s.xp += content.MILESTONE_XP; s.events.push('milestone'); }
        return s;
      }
      case 'SET_SHELF': {
        const { bookId, state } = action.value || {};
        if (content.sectionOf(bookId) && SHELF_STATES.includes(state)) s.shelf[bookId] = state;
        return s;
      }
      case 'RESET': {
        const fresh = initial();
        fresh.mode = s.mode; fresh.muted = s.muted; fresh.today = s.today;
        fresh.events = ['reset'];
        return fresh;
      }
      default:
        return s;
    }
  }

  // When to remind the player to back up: 'never' once there is progress and no backup, 'old' after BACKUP_STALE_DAYS.
  const BACKUP_STALE_DAYS = 14;
  const backupNudge = (s) => (!Number.isInteger(s.lastBackup) ? (s.xp > 0 || s.coins > 0 ? 'never' : null) : s.today - s.lastBackup > BACKUP_STALE_DAYS ? 'old' : null);
  // What a backup holds once restored (after the same migrations), for the summary shown before replacing.
  const preview = (data, content) => {
    const st = reduce(initial(), { type: 'HYDRATE', value: { ...data, run: null } }, content);
    return { xp: st.xp, coins: st.coins, lit: Object.keys(st.lit).filter((k) => st.lit[k]).length, deck: Object.keys(st.deck).length, notes: Object.keys(st.notes).length };
  };
  return { initial, reduce, MODES, SHELF_STATES, DURABLE, LADDER, dueCount, backupNudge, preview, badKeys, wordCount, NOTE_PAGE_WORDS, NOTE_MAX_CHARS, continueTarget, comboPay, CLEAN_BONUS, CHEST, reviewMinutes, recapOpen, RECAP_MAX, RECAP_PAY, FREEZE_PRICE, FREEZE_MAX, QUEST_CHEST, STREAK_MILESTONES, streakToday, questsToday };
})();
</script>

<script data-module="store">
// ---------------------------------------------------------------------------
// store: persistence and the backup file. One key, fi-roadmap-v1 (ADR-0003).
// Every read and write swallows errors so the game runs with storage disabled.
// Storage is injected: window.localStorage in the page, fakes in tests.
// ---------------------------------------------------------------------------
FI.store = (() => {
  const KEY = 'fi-roadmap-v1';
  const VERSION = 1;
  const DURABLE = FI.engine.DURABLE;

  const pick = (obj) => {
    const d = {};
    for (const k of DURABLE) if (obj[k] !== undefined) d[k] = obj[k];
    return d;
  };
  const durable = (state) => {
    const d = pick(state);
    if (d.run) d.run = { stationId: d.run.stationId, pos: d.run.pos }; // the Returns pass is never stored (decision 10)
    return d;
  };

  const save = (storage, state) => {
    try {
      if (!storage || typeof storage.setItem !== 'function') return false;
      storage.setItem(KEY, JSON.stringify({ v: VERSION, ...durable(state) }));
      return true;
    } catch (e) { return false; }
  };

  const load = (storage) => {
    try {
      if (!storage || typeof storage.getItem !== 'function') return null;
      const raw = storage.getItem(KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed) || parsed.v !== VERSION) return null;
      const { v, ...rest } = parsed;
      return pick(rest);
    } catch (e) { return null; }
  };

  // Backup file (spec 2): the durable slice wrapped with an app tag and a format number.
  // The export date is supplied by the caller; the store never reads the clock.
  const APP = 'fi-roadmap', FORMAT = 1;
  const backup = (state, exported) => JSON.stringify({ app: APP, format: FORMAT, exported, data: { v: VERSION, ...durable(state) } });
  // Reasons a text is refused: 'not-json', 'not-backup' (another app or no data), 'newer-format', 'damaged' (a value has the wrong shape).
  const parseBackup = (text) => {
    let doc;
    try { doc = JSON.parse(text); } catch (e) { return { ok: false, reason: 'not-json' }; }
    const isMap = (v) => !!v && typeof v === 'object' && !Array.isArray(v);
    if (!isMap(doc) || doc.app !== APP || !isMap(doc.data) || !Number.isInteger(doc.format) || doc.format < 1) return { ok: false, reason: 'not-backup' };
    if (doc.format > FORMAT) return { ok: false, reason: 'newer-format' };
    if (doc.data.v !== VERSION) return { ok: false, reason: 'not-backup' };
    const data = pick(doc.data);
    if (FI.engine.badKeys(data).length) return { ok: false, reason: 'damaged' };
    return { ok: true, data, exported: /^\d{4}-\d{2}-\d{2}$/.test(doc.exported) ? doc.exported : '' };
  };

  const clear = (storage) => { try { storage.removeItem(KEY); return true; } catch (e) { return false; } };

  return { KEY, durable, save, load, clear, backup, parseBackup };
})();

  // ---- Road (spec 8): nodes sit on a wave; a circuit trace joins them -----

  const WAVE = [0, 46, 74, 46, 0, -46, -74, -46]; // 74 leaves room for the current node's glow at 360 px

  function trace(points) {

  // Text of a reward that fx shows in flight, in the player's Language Mode.

  // ---- Continue and search on the Path (spec 7)

  // ---- Profile (spec 12): the player's numbers and Badges, and everything about this device.
  function profileScreen(s, content) {
    const earned = [
      ...content.sections[0].runs.map((u) => content.station(u)).filter((st) => st.badge && s.lit[st.id]).map((st) => st.badge),
      ...content.sections.filter((sec) => sec.kind === 'book' && s.lit[sec.id]).map((sec) => sec.badge),
    ];
    const badges = earned.length ? `<div class="bchips">${earned.map((b) => `<span class="bchip">${ICONS.badge}${pair(b, one(s.mode))}</span>`).join('')}</div>` : `<p class="help">${t('noBadges', s.mode)}</p>`;
    const reset = ui.confirmReset
      ? `<div class="confirm" role="alertdialog" aria-live="polite"><span>${t('resetConfirm', s.mode)}</span><button ${A({ type: 'UI_RESET_CANCEL' })}>${t('cancel', s.mode)}</button><button ${A({ type: 'RESET' })}>${t('confirm', s.mode)}</button></div>`
      : `<button class="linkish" ${A({ type: 'UI_RESET_ASK' })}>${t('reset', s.mode)}</button>`;
    return `<main class="station tools profile" data-theme="teal">
      <div class="shead"><h2 class="ttitle">${t('profile', s.mode)}</h2></div>
      <section class="panel"><p class="kicker">${t('progress', s.mode)}</p>${stats(s, content)}</section>
      <section class="panel"><p class="kicker">${t('streak', s.mode)}</p>${streakPanel(s, true)}</section>
      <section class="panel"><p class="kicker">${t('badges', s.mode)} · ${num(earned.length, s.mode)}</p>${badges}</section>
      <section class="panel"><p class="kicker">${t('settings', s.mode)}</p>
        <div class="setrow"><span>${t('language', s.mode)}</span>${modeGroup(s)}</div>
        <div class="setrow"><span>${t('sound', s.mode)}</span><button class="footbtn" ${A({ type: 'TOGGLE_MUTE' })} aria-pressed="${!s.muted}">${s.muted ? ICONS.muted : ICONS.sound}<span>${s.muted ? t('mute', s.mode) : t('unmute', s.mode)}</span></button></div>
      </section>
      <section class="panel"><p class="kicker">${t('device', s.mode)}</p>${backupPanel(s)}<div class="offline">${offlineBody(s, content)}</div></section>
      <div class="pathfoot">${reset}</div>
    </main>`;
  }

  // ---- Widgets ----------------------------------------------------------
  function slidersWidget(s, content) {
    const v = s.sliders;
    const income = Math.round(v.capital * v.ret / 100);
    const target = v.expenses * 25;
    const pct = Math.min(999, Math.round((v.capital / target) * 100));
    const row = (key, label, min, max, step, fmtv) => `<label class="srow"><span>${t(label, s.mode)}</span><output data-out="${key}">${fmtv}</output>
      <input type="range" data-slider="${key}" min="${min}" max="${max}" step="${step}" value="${Number(v[key]) || 0}" aria-label="${t(label, s.mode)}"></label>`;
    return `<div class="widget sliders" data-widget="sliders">
      ${row('capital', 'capital', 10000, 1000000, 10000, '€' + num(v.capital, s.mode))}
      ${row('ret', 'realReturn', 3, 8, 0.5, num(v.ret, s.mode) + '%')}
      <div class="out" aria-live="polite"><b data-out="income">€${num(income, s.mode)}</b><small>${t('yearlyIncome', s.mode)}</small></div>
      ${row('expenses', 'expenses', 10000, 100000, 1000, '€' + num(v.expenses, s.mode))}
      <div class="out" aria-live="polite"><b data-out="target">€${num(target, s.mode)}</b><small>${t('target25', s.mode)} · <span data-out="pct">${num(pct, s.mode)}%</span> ${t('ofTarget', s.mode)}</small></div>
    </div>`;
  }
  const isoWeek = (d = new Date()) => {
    const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = x.getUTCDay() || 7; x.setUTCDate(x.getUTCDate() + 4 - day);
    const y = new Date(Date.UTC(x.getUTCFullYear(), 0, 1));
    return `${x.getUTCFullYear()}-W${String(Math.ceil(((x - y) / 86400000 + 1) / 7)).padStart(2, '0')}`;
  };
  function habitsWidget(s, content) {
    const days = [0, 1, 2, 3, 4, 5, 6];
    const week = isoWeek();
    const current = s.habitsWeek === week;
    const head = `<tr><th></th>${days.map((d) => `<th>${t('d' + d, s.mode)}</th>`).join('')}</tr>`;
    const rows = content.habits.map((h) => `<tr><th scope="row">${pair(h.label, one(s.mode))}</th>${days.map((d) => {
      const on = current && s.habits[h.id] && s.habits[h.id][d];
      return `<td><button class="cell ${on ? 'on' : ''}" ${A({ type: 'TOGGLE_HABIT', value: { habit: h.id, day: d, week } })} aria-pressed="${!!on}" aria-label="${esc(h.label.en)} ${t('d' + d, s.mode)}">${on ? ICONS.check : ''}</button></td>`;
    }).join('')}</tr>`).join('');
    return `<div class="widget habits" data-widget="habits"><p class="kicker">${t('habitsWeek', s.mode)} · ${esc(week)}</p><table class="habitgrid">${head}${rows}</table></div>`;
  }
  function journalWidget(s, content) {
    return `<div class="widget journal" data-widget="journal">
      <textarea data-journal rows="6" placeholder="${t('journalPlaceholder', s.mode)}" aria-label="${t('journalPlaceholder', s.mode)}">${esc(s.journal.text)}</textarea>
      <p class="help">${s.journal.reviewDate ? `${t('reviewOn', s.mode)} ${esc(s.journal.reviewDate)} · ` : ''}${t('autosaved', s.mode)}</p>
    </div>`;
  }
  function checklistWidget(s, content) {
    const total = content.checklists.reduce((a, l) => a + l.items.length, 0);
    const done = content.checklists.reduce((a, l) => a + l.items.filter((_, i) => s.checklists[l.id][i]).length, 0);
    const pct = Math.round((done / total) * 100);
    const lists = content.checklists.map((l) => `<section class="clist"><h3>${pair(l.title, s.mode)}</h3>${l.items.map((it, i) => {
      const on = s.checklists[l.id][i];
      return `<button class="citem ${on ? 'on' : ''}" ${A({ type: 'TOGGLE_CHECK', value: { list: l.id, index: i } })} aria-pressed="${!!on}"><span class="box">${on ? ICONS.check : ''}</span>${pair(it, s.mode)}</button>`;
    }).join('')}</section>`).join('');
    return `<div class="widget checklist" data-widget="checklist">
      <div class="prog big"><i style="width:${pct}%"></i></div><p class="help">${num(pct, s.mode)}% ${t('percentDone', s.mode)}</p>${lists}
    </div>`;
  }
  function bookCard(s, content, b) {
    const lit = s.lit[b.id];
    const state = s.shelf[b.bookId] || 'toread';
    const noted = noteWords(s, b.bookId);
    const states = FI.engine.SHELF_STATES.map((k) => `<button class="chip ${state === k ? 'on' : ''}" ${A({ type: 'SET_SHELF', value: { bookId: b.bookId, state: k } })} aria-pressed="${state === k}">${t(k, s.mode)}</button>`).join('');
    return `<li class="book ${lit ? 'lit' : ''}" data-id="${b.bookId}">
      <div class="bhead">${cover(b, 'small')}
        <div><b class="t-en" lang="en">${esc(b.title)}</b><span class="meta t-en" lang="en">${esc(b.author.en)} · ${yr(b.year, s.mode)}</span><span class="meta">${b.must ? t('mustRead', s.mode) : t('optionalRead', s.mode)} · ${t('stage', s.mode)} ${num(b.stage, s.mode)}</span></div>
        ${lit ? `<span class="badge">${pair(b.badge, one(s.mode))}</span>` : ''}</div>
      <p class="why">${pair(b.why, s.mode)}</p>
      ${noted ? `<p class="noted">${ICONS.note}<span>${t('notes', s.mode)}: ${num(noted, s.mode)} ${t(noted === 1 ? 'word' : 'words', s.mode)}</span></p>` : ''}
      <div class="brow"><div class="chips">${states}</div>
        ${notesButton(s, b.bookId, 'btn small')}
        <button class="btn small ${lit ? '' : 'primary'}" ${A({ type: 'UI_JUMP', value: b.bookId })}>${ICONS.book}${t('goToSection', s.mode)}</button></div>
    </li>`;
  }
  function shelfGrid(s, content) {
    const q = ui.search.trim().toLowerCase();
    const books = content.sections.filter((b) => b.kind === 'book')
      .filter((b) => ui.stage === 'all' || String(b.stage) === ui.stage)
      .filter((b) => ui.must === 'all' || (ui.must === 'must') === b.must)
      .filter((b) => !q || b.title.toLowerCase().includes(q) || b.author.en.toLowerCase().includes(q) || b.why.en.toLowerCase().includes(q) || b.why.fa.includes(q));
    if (!books.length) return `<p class="help">${t('noBooks', s.mode)}</p>`;
    return `<ul class="books">${books.map((b) => bookCard(s, content, b)).join('')}</ul>`;
  }
  function shelfWidget(s, content, compact) {
    const stages = ['all', '1', '2', '3', '5', '6'].map((k) => `<button class="chip ${ui.stage === k ? 'on' : ''}" ${A({ type: 'UI_STAGE', value: k })} aria-pressed="${ui.stage === k}">${k === 'all' ? t('all', s.mode) : `${t('stage', s.mode)} ${num(k, s.mode)}`}</button>`).join('');
    const musts = [['all', t('all', s.mode)], ['must', '⭐ ' + t('mustRead', s.mode)], ['opt', '○ ' + t('optionalRead', s.mode)]].map(([k, l]) => `<button class="chip ${ui.must === k ? 'on' : ''}" ${A({ type: 'UI_MUST', value: k })} aria-pressed="${ui.must === k}">${l}</button>`).join('');
    const lit = litReadingOrder(s, content);
    const order = content.readingOrder.map((id, i) => {
      const sec = content.sectionOf(id); const on = s.lit[sec.id];
      return `<li class="${on ? 'lit' : ''}"><span class="n">${num(i + 1, s.mode)}</span><button class="linkish" ${A({ type: 'UI_JUMP', value: id })}><span class="t-en" lang="en">${esc(sec.title)}</span></button>${on ? `<span class="tick">${ICONS.check}</span>` : ''}</li>`;
    }).join('');
    const orderSection = `<section class="order"><h3>${t('readingOrder', s.mode)} · ${num(lit, s.mode)}/${num(content.readingOrder.length, s.mode)}</h3><ol class="rorder">${order}</ol><p class="help">${pair(content.item('s6', 's6c2').text, s.mode)}</p></section>`;
    if (compact) return `<div class="widget shelf" data-widget="shelf">${orderSection}<p class="help">${t('shelfInTools', s.mode)}</p></div>`;
    return `<div class="widget shelf" data-widget="shelf">
      ${orderSection}
      <div class="filters"><div class="chips">${stages}</div><div class="chips">${musts}</div>
        <input type="search" data-search placeholder="${t('search', s.mode)}" value="${esc(ui.search)}" aria-label="${t('search', s.mode)}"></div>
      <div class="shelfgrid">${shelfGrid(s, content)}</div>
    </div>`;
  }
  const WIDGET_FN = { sliders: slidersWidget, habits: habitsWidget, journal: journalWidget, checklist: checklistWidget, shelf: shelfWidget };

  function toolsScreen(s, content) {
    const st = content.station(s.stationId);
    const widgets = (st.tools || []).map((w) => `<section class="panel"><p class="kicker">${pair(st.name, one(s.mode))}</p>${WIDGET_FN[w](s, content)}</section>`).join('');
    const overlay = ui.milestone ? `<div class="overlay${ui.dolly ? ' dolly' : ''}"><section class="panel result milestone">${confetti()}<div class="big">${ICONS.star}</div><h2>${t('milestoneTitle', s.mode)}</h2><p>${t('milestoneBody', s.mode)} · +${num(content.MILESTONE_XP, s.mode)} ${t('xp', s.mode)}</p><button class="btn primary" ${A({ type: 'UI_MILESTONE_CLOSE' })} data-focus>${t('milestoneDone', s.mode)}</button></section></div>` : '';
    return `<main class="station tools${ui.milestone && ui.dolly ? ' dolly-bg' : ''}" data-theme="${st.theme}">
      <div class="shead"><button class="icon" ${A({ type: 'BACK_TO_PATH' })} aria-label="${t('back', s.mode)}">${ICONS.close}</button><h2 class="ttitle">${pair(st.name, s.mode)}</h2></div>
      ${widgets}
    </main>${overlay}`;
  }

  // ---- Notes (spec 4): one page per book, the player's own -----------------
  const noteWords = (s, bookId) => (s.notes[bookId] ? FI.engine.wordCount(s.notes[bookId].text) : 0);
  // The count line under the page; also rewritten by patch() while the player types.
  function noteCount(words, mode) {
    const page = FI.engine.NOTE_PAGE_WORDS;
    const done = words >= page;
    // Only the "one page written" moment is announced; the running count is not, or every pause would speak.
    return `<span class="${done ? 'done' : ''}">${num(words, mode)} ${t(words === 1 ? 'word' : 'words', mode)}<span role="status">${done ? ` · ${t('notesDone', mode)}` : ''}</span></span><span>${t('notesPage', mode)} ${num(page, mode)} ${t('words', mode)}</span><i class="notebar"><b style="width:${Math.min(100, Math.floor((words / page) * 100))}%"></b></i>`;
  }
  const notesButton = (s, bookId, cls) => { const n = noteWords(s, bookId); return `<button class="${cls}" ${A({ type: 'OPEN_NOTES', value: bookId })}>${ICONS.note}<span>${t('notes', s.mode)}</span>${n ? `<b>${num(n, s.mode)}</b>` : ''}</button>`; };
  function notesScreen(s, content) {
    const sec = content.sectionOf(s.notesFor);
    const entry = s.notes[s.notesFor];
    const prompts = ['notesPrompt1', 'notesPrompt2', 'notesPrompt3'].map((k) => `<li>${t(k, s.mode)}</li>`).join('');
    const edited = entry && entry.edited ? `<p class="help">${t('notesEdited', s.mode)}: <bdi>${esc(yr(entry.edited, s.mode))}</bdi></p>` : '';
    return `<main class="station tools notes" data-theme="book">
      <div class="shead"><button class="icon" ${A({ type: 'BACK_TO_PATH' })} aria-label="${t('back', s.mode)}">${ICONS.close}</button><h2 class="ttitle">${t('notes', s.mode)}</h2></div>
      <section class="panel">
        <div class="bookhead">${cover(sec, 'small')}<div><b class="t-en" lang="en">${esc(sec.title)}</b><span class="meta t-en" lang="en">${esc(sec.author.en)} · ${yr(sec.year, s.mode)}</span></div></div>
        <p class="kicker">${t('notesKicker', s.mode)}</p>
        <ul class="noteprompts">${prompts}</ul>
        <textarea data-note="${esc(s.notesFor)}" dir="auto" rows="12" maxlength="${FI.engine.NOTE_MAX_CHARS}" data-focus placeholder="${t('notesPlaceholder', s.mode)}" aria-label="${t('notes', s.mode)}: ${esc(sec.title)}">${esc(entry ? entry.text : '')}</textarea>
        <p class="notecount">${noteCount(noteWords(s, s.notesFor), s.mode)}</p>
        ${edited}<p class="help">${t('notesPrivate', s.mode)}</p>
      </section>
    </main>`;
  }

  function bookmarksScreen(s, content) {
    const items = s.bookmarks.map((b) => {
      const st = content.station(b.stationId); const c = st && st.items ? content.item(b.stationId, b.cardId) : null;
      const text = (c && c.text) || b.text;
      if (!st || !text) return '';
      const where = st.book ? `<span class="t-en" lang="en">${esc(content.sectionOf(st.bookId).title)}</span> · ${pair(st.name, one(s.mode))}` : pair(st.name, one(s.mode));
      return `<li class="mark">
        <p class="kicker">${where}</p>
        <p class="ctext small">${pair(text, s.mode)}</p>
        <div class="brow"><button class="btn ghost small" ${A({ type: 'TOGGLE_BOOKMARK', value: b })}>${t('removeBookmark', s.mode)}</button><button class="btn primary small" ${A({ type: 'OPEN_AT', value: b })}>${ICONS.bookmarkOn}${t('openCard', s.mode)}</button></div>
      </li>`;
    }).join('');
    const body = s.bookmarks.length ? `<ul class="marks">${items}</ul>` : `<p class="help">${t('noBookmarks', s.mode)}</p>`;
    return `<main class="station tools" data-theme="teal">
      <div class="shead"><button class="icon" ${A({ type: 'BACK_TO_PATH' })} aria-label="${t('back', s.mode)}">${ICONS.close}</button><h2 class="ttitle">${t('bookmarks', s.mode)} · ${num(s.bookmarks.length, s.mode)}</h2></div>
      <section class="panel">${body}</section>
    </main>`;
  }

  // ---- Review (spec 1) -------------------------------------------------------
  function reviewScreen(s, content) {
    const r = s.review;
    const head = `<div class="shead"><button class="icon" ${A({ type: 'BACK_TO_PATH' })} aria-label="${t('back', s.mode)}">${ICONS.close}</button><h2 class="ttitle">${t(r.recap ? 'recap' : 'review', s.mode)}${r.ids.length ? ` · ${num(Math.min(r.index + 1, r.ids.length), s.mode)}/${num(r.ids.length, s.mode)}` : ''}</h2></div>`;
    const streakLine = r.ids.length && FI.engine.streakToday(s) ? `<p class="streakline"><span class="streakchip on">${ICONS.flame}<span class="n">${num(s.streak.n, s.mode)}</span></span> ${tf(s, 'streakDays', { n: s.streak.n })}</p>` : '';
    if (r.phase === 'done' && r.recap) {
      const sec = content.sections.find((x) => x.id === r.recap);
      const name = !sec ? '' : sec.kind === 'book' ? `<span class="t-en" lang="en">${esc(sec.title)}</span>` : pair(sec.name, one(s.mode));
      return `<main class="station tools run" data-theme="teal">${head}<section class="panel result"><div class="big">${ICONS.badge}</div><h2>${t('recapDone', s.mode)}</h2><p class="inl">${name}</p><p class="recapscore">${tf(s, 'recapScore', { n: r.right, m: r.ids.length })}</p>${r.paid ? `<p class="praise gold" style="--i:1">${tf(s, 'recapPaid', { n: r.paid })}</p>` : ''}${streakLine}<div class="actions col"><button class="btn primary wide" ${A({ type: 'BACK_TO_PATH' })} data-focus>${t('back', s.mode)}</button></div></section></main>`;
    }
    if (r.phase === 'done') {
      const msg = r.ids.length || r.capped ? t('reviewDone', s.mode) : t('reviewEmpty', s.mode);
      return `<main class="station tools run" data-theme="teal">${head}<section class="panel result"><div class="big">${ICONS.check}</div><p>${msg}</p>${streakLine}<div class="actions col"><button class="btn primary wide" ${A({ type: 'BACK_TO_PATH' })} data-focus>${t('back', s.mode)}</button></div></section></main>`;
    }
    const e = r.pool ? r.pool[r.ids[r.index]] : s.deck[r.ids[r.index]];
    const k = e && e.check;
    const answer = !k ? '' : k.type === 'tf' ? t(k.answer ? 'trueLabel' : 'falseLabel', s.mode) : k.type === 'order' ? k.answer.map((i) => pair(k.options[i], one(s.mode))).join(' · ') : pair(k.options[k.answer], s.mode);
    if (r.phase === 'result') {
      const note = r.recap ? (r.ok ? '' : t('recapBack', s.mode)) : !r.ok ? t('reviewBack', s.mode) : r.retired ? t('reviewRetired', s.mode) : `${t('reviewNextIn', s.mode)} ${num(r.nextIn, s.mode)} ${t('days', s.mode)}`;
      return `<main class="station tools run" data-theme="teal">${head}<div class="feedback ${r.ok ? 'ok' : 'bad'}" aria-live="polite"><span class="fbico">${r.ok ? ICONS.check : ICONS.close}</span><span class="msg"><span>${r.ok ? t('correct', s.mode) : t('revealed', s.mode)}</span>${!r.ok && answer ? `<b class="ans">${answer}</b>` : ''}<small>${note}</small></span><button class="btn" ${A({ type: 'REVIEW_NEXT' })} data-focus>${t('continue', s.mode)}</button></div></main>`;
    }
    const card = `<section class="panel card"><p class="kicker">${t('review', s.mode)}</p><p class="ctext">${pair(e.text, s.mode)}</p>`;
    if (r.phase === 'card') {
      const actions = k ? `<div class="actions"><button class="btn primary wide" ${A({ type: 'REVIEW_NEXT' })} data-focus>${t('reviewShow', s.mode)}</button></div>`
        : `<div class="actions"><button class="btn" ${A({ type: 'REVIEW_RATE', value: 'didnt' })}>${t('didnt', s.mode)}</button><button class="btn primary" ${A({ type: 'REVIEW_RATE', value: 'knew' })} data-focus>${t('knew', s.mode)}</button></div>`;
      return `<main class="station tools run" data-theme="teal">${head}${card}${actions}</section></main>`;
    }
    let body = '';
    if (k.type === 'tap') body = `<div class="opts">${k.options.map((o, i) => `<button class="btn opt" ${A({ type: 'REVIEW_ANSWER', value: i })}>${pair(o, s.mode)}</button>`).join('')}</div>`;
    else if (k.type === 'tf') body = `<div class="tf"><button class="btn" ${A({ type: 'REVIEW_ANSWER', value: true })}>${t('trueLabel', s.mode)}</button><button class="btn" ${A({ type: 'REVIEW_ANSWER', value: false })}>${t('falseLabel', s.mode)}</button></div>`;
    else {
      const placed = ui.order;
      const slots = placed.map((i, n) => `<span class="slot"><b>${num(n + 1, s.mode)}</b>${pair(k.options[i], one(s.mode))}</span>`).join('');
      const remaining = k.options.map((o, i) => placed.includes(i) ? '' : `<button class="btn opt" ${A({ type: 'UI_ORDER_ADD', value: i })}>${pair(o, s.mode)}</button>`).join('');
      body = `<p class="help">${t('orderHelp', s.mode)}</p><div class="slots" aria-live="polite">${slots}</div><div class="opts">${remaining}</div><div class="actions"><button class="btn ghost" ${A({ type: 'UI_ORDER_CLEAR' })} ${placed.length ? '' : 'disabled'}>${t('clearOrder', s.mode)}</button><button class="btn primary" ${A({ type: 'REVIEW_ANSWER', value: placed })} ${placed.length === k.options.length ? '' : 'disabled'}>${t('check', s.mode)}</button></div>`;
    }
    return `<main class="station tools run" data-theme="teal">${head}<section class="panel check"><p class="kicker">${t(r.recap ? 'recap' : 'review', s.mode)}</p><h2 class="prompt">${pair(k.prompt, s.mode)}</h2>${body}</section></main>`;
  }
  // The Recap stop: the last thing in every Section on the Path (spec 15). Closed until every Lesson there has a passed Fare.
  function recapStop(s, content, sec) {
    const open = FI.engine.recapOpen(s, content, sec); const done = !!s.recaps[sec.id];
    const state = !open ? 'closed' : done ? 'done' : 'open';
    const sub = !open ? t('recapLocked', s.mode) : done ? t('recapAgain', s.mode) : t('recapSub', s.mode);
    const inner = `<span class="rico">${done ? ICONS.check : ICONS.badge}</span><span class="rt"><small>${t('recapKicker', s.mode)}</small><b>${t('recapGo', s.mode)}</b><span>${sub}</span></span>`;
    return open ? `<div class="recapstop ${state}"><button class="recapbtn" ${A({ type: 'OPEN_RECAP', value: sec.id })}>${inner}</button></div>` : `<div class="recapstop ${state}"><span class="recapbtn" aria-disabled="true">${inner}</span></div>`;
  }

  // ---- Station run ---------------------------------------------------------
  function bookHeader(s, st) {
    if (!st.book) return '';
    const sec = FI.content.sectionOf(st.bookId);

      return;
    }
    if (has('wrong')) { sound('wrong'); glitch(); buzz([30, 40, 30], state); flashScreen('bad', 0.14); burst(at.x, at.y, 14, ['bad', 'mag'], 5); return; }
    if (has('bookmark')) { sound('bookmark'); burst(at.x, at.y, 16, ['gold', 'white'], 4); }
  }
  return { run, tap };
})();
</script>

<script data-module="app">
// glue: dispatch = reduce, save, render (or patch), fx (ADR-0008). Loads a book's Lessons on demand (ADR-0010).
(() => {
  const { content, engine, store, render, fx } = FI;
  let storage = null;
  try { storage = window.localStorage; } catch (e) { storage = null; }
  const root = document.getElementById('app');
  let state = engine.initial();
  const paint = () => render.render(root, state, content);
  // ---- Offline (spec 5). The worker (sw.js) serves the page and cached books with no connection.
  const BOOK_CACHE = 'fi-books-v3'; // the same name as in sw.js; a test holds them together
  const canOffline = 'serviceWorker' in navigator && typeof caches !== 'undefined' && location.protocol !== 'file:';
  // The panel appears only once a worker is registered: without one nothing reads the cache when the connection is gone.
  let workerReady = false;
  const bookIds = () => content.sections.filter((x) => x.kind === 'book').map((x) => x.bookId);
  const bookPath = (bookId) => new URL(content.bookUrl(bookId), location.href).pathname;
  const looksLikeBook = (data, bookId) => !!data && data.id === bookId && Array.isArray(data.circles);
  const onDevice = async (bookId) => { try { return !!(await (await caches.open(BOOK_CACHE)).match(bookPath(bookId))); } catch (e) { return false; } };
  // While the worker controls the page it keeps and refreshes books itself; the page writes a book
  // only before that (the first visit), and never over the worker's fresher copy.
  const keepBook = async (bookId, response) => {
    if (!workerReady || navigator.serviceWorker.controller) return;
    try { await (await caches.open(BOOK_CACHE)).put(bookPath(bookId), response); } catch (e) {}
  };
  async function booksOnDevice() {
    try { const keys = await (await caches.open(BOOK_CACHE)).keys(); const have = keys.map((r) => new URL(r.url).pathname); return bookIds().filter((id) => have.includes(bookPath(id))).length; } catch (e) { return 0; }
  }
  // Tell render what is on the device and repaint only the Offline panel. Counts are read afresh; a slower, older read is dropped.
  let shown = 0;
  async function showOffline(part) {
    if (!workerReady) return;
    const turn = ++shown;
    let standalone = false; try { standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) {}
    render.setOffline({ supported: true, standalone, ...(part || {}) });
    if (!(part && Number.isInteger(part.downloading))) { const ready = await booksOnDevice(); if (turn !== shown) return; render.setOffline({ ready }); }
    render.patch(root, state, content, { type: 'UI_OFFLINE' });
  }
  let downloading = false;
  async function downloadBooks() {
    if (!workerReady || downloading) return;
    downloading = true;
    let failed = 0, unstored = 0; const ids = bookIds();
    for (let i = 0; i < ids.length; i++) {
      await showOffline({ downloading: i + 1, failed: 0, unstored: 0 });
      try {
        const res = await fetch(content.bookUrl(ids[i]));
        if (!res.ok) throw new Error(String(res.status));
        const copy = res.clone();
        if (!looksLikeBook(await res.json(), ids[i])) throw new Error('not a book'); // a captive portal or an error page answered
        await keepBook(ids[i], copy);
        if (!(await onDevice(ids[i]))) unstored++; // fetched but not kept: storage is full or blocked
      } catch (e) { failed++; }
    }
    downloading = false;
    deviceBooksStale = true;
    await showOffline({ downloading: null, failed, unstored });
  }
  // Search covers the Cards of loaded books. Books on the device are loaded into memory when a search needs them:
  // on the first search, and again after more books were downloaded.
  let deviceBooksStale = true;
  async function loadDeviceBooks() {
    if (!deviceBooksStale || !workerReady) return;
    deviceBooksStale = false;
    render.setFinding(true);
    let added = 0;
    try {
      const cache = await caches.open(BOOK_CACHE);
      for (const id of bookIds()) {
        if (content.isLoaded(id)) continue;
        const hit = await cache.match(bookPath(id));
        // A cached file that does not parse is skipped: the book simply stays out of the search.
        if (hit) { try { if (content.registerBook(await hit.json(), id)) added++; } catch (e) {} }
      }
    } catch (e) { /* Cache Storage unavailable: search covers what is already loaded */ }
    render.setFinding(false);
    render.patch(root, state, content, { type: 'UI_FOUND' });
  }
  let installPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installPrompt = e; showOffline({ installable: true }); });
  window.addEventListener('appinstalled', () => { installPrompt = null; showOffline({ installable: false }); });
  async function ensureBook(bookId) {
    if (!bookId || content.isLoaded(bookId)) return true;
    render.setLoading(true); paint();
    try {
      const res = await fetch(content.bookUrl(bookId));
      if (!res.ok) throw Object.assign(new Error(String(res.status)), { noConnection: res.status === 503 });
      const copy = res.clone();
      if (!content.registerBook(await res.json(), bookId)) throw new Error('bad book file');
      keepBook(bookId, copy).then(() => { deviceBooksStale = true; showOffline(); });
      return true;
    } catch (e) {
      // A failed fetch is a TypeError; the worker answers 503 when the book is not on the device and the network is gone.
      render.setError(e instanceof TypeError || e.noConnection || navigator.onLine === false ? 'offline' : true); return false;
    } finally { render.setLoading(false); }
  }
  const lessonOf = (action) => {
    const id = action.type === 'OPEN_STATION' ? action.value : action.type === 'OPEN_AT' ? (action.value || {}).stationId : null;
    const st = id && content.station(id);
    if (action.type === 'OPEN_RECAP') { const sec = content.sections.find((x) => x.id === action.value); return sec && sec.bookId && !content.isLoaded(sec.bookId) ? sec.bookId : null; }
    return st && st.book && !content.isLoaded(st.bookId) ? st.bookId : null;
  };
  function dispatch(action) {
    const need = lessonOf(action);
    if (need) { ensureBook(need).then((ok) => { if (ok) dispatch(action); else paint(); }); return; }
    if (action.type === 'UI_FIND') loadDeviceBooks();
    if (action.type === 'DOWNLOAD_BOOKS') { downloadBooks(); return; }
    if (action.type === 'INSTALL') { if (installPrompt) { installPrompt.prompt(); installPrompt = null; showOffline({ installable: false }); } return; } // a prompt can be used once; the hint below the panel stays
    if (action.type === 'BACKUP') {
      const d = new Date(); const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      try {
        const url = URL.createObjectURL(new Blob([store.backup(state, iso)], { type: 'application/json' }));
        const a = document.createElement('a'); a.href = url; a.download = `fi-roadmap-backup-${iso}.json`; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) { return; }
      dispatch({ type: 'BACKUP_DONE' }); return;
    }
    if (action.type === 'RESTORE_CONFIRM') { const data = render.takeRestore(); if (data) dispatch({ type: 'RESTORE', value: data }); else paint(); return; }
    const uiResult = render.handleUi(action);
    if (uiResult === 'full') { paint(); return; }
    if (uiResult === 'partial') { render.patch(root, state, content, action); return; }
    if (uiResult === 'path') { state = engine.reduce(state, { type: 'BACK_TO_PATH' }, content); render.setSaveFailed(!store.save(storage, state)); paint(); return; }
    const before = { xp: state.xp };
    if (action.type === 'OPEN_CHEST' || action.type === 'OPEN_QUEST_CHEST') action = { ...action, value: Math.random() };
    else if (action.type === 'OPEN_STATION' || action.type === 'OPEN_AT' || action.type === 'ANSWER') action = { ...action, at: Date.now() };
    state = engine.reduce(state, action, content);
    if (action.type === 'RESET') { store.clear(storage); render.setSaveFailed(false); } else render.setSaveFailed(!store.save(storage, state));
    if (action.silent) render.patch(root, state, content, action); else paint();
    fx.run(state.events, state, before);
  }
  (async () => {
    const saved = store.load(storage);
    const resumeSt = saved && saved.run && content.station(saved.run.stationId);
    if (resumeSt && resumeSt.book) await ensureBook(resumeSt.bookId);
    const dayNumber = () => { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); };
    state = engine.reduce(engine.initial(), { type: 'HYDRATE', value: saved }, content);
    state = engine.reduce(state, { type: 'TICK', value: dayNumber(), roll: Math.random() }, content);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && dayNumber() !== state.today) dispatch({ type: 'TICK', value: dayNumber(), roll: Math.random() }); });
    render.setSaveFailed(!store.save(storage, state)); // writes back a migrated document (ADR-0009, ADR-0010)
    render.mount(root, (action) => { fx.tap(action, state); dispatch(action); });
    paint();
    if (canOffline) navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => { workerReady = true; showOffline(); }).catch(() => {});
  })();
})();
</script>
