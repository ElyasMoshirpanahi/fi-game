    if (mode === 'EN') return { top: pair.en, under: null };
    return { top: pair.en, under: pair.fa };
  };

  return { ui, stations, allStations, item, station, text, fmt, faDigits, checklists, habits, readingOrder, MILESTONE_XP, SECTION_XP, UNIT_NAMES, sections, sectionOf, totalXp };
})();

<script data-module="engine">

FI.engine = (() => {
  const MODES = ['EN', 'FA', 'BOTH'];
  const SHELF_STATES = ['toread', 'reading', 'read'];
  const V1_BOOK = /^b\d\d$/; // v1 progress named whole books; v2 names Units (ADR-0009)
  // The one list of what survives a reload. store reads it; HYDRATE iterates it (ADR-0003).
  const DURABLE = ['mode', 'muted', 'coins', 'awarded', 'rings', 'lit', 'farePassed', 'xp', 'run', 'checklists', 'journal', 'habits', 'habitsWeek', 'shelf', 'sliders', 'milestone', 'bookmarks'];

  const initial = () => ({
    mode: 'EN', muted: false,
    screen: 'path', stationId: null, phase: null,
    queue: [], current: null, flipped: false, misses: 0, hint: false,
    returns: [], fare: null, fareAttempt: 0, run: null,
    coins: 0, awarded: {}, rings: {}, lit: {}, farePassed: {}, xp: 0,
    sliders: { capital: 40000, ret: 5, expenses: 30000 },
    habits: {}, habitsWeek: '', journal: { text: '', reviewDate: '' },
    checklists: { before: [false, false, false], after: [false, false, false] },
    shelf: {}, milestone: false, bookmarks: [],
    events: [],
  });

  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const checksOf = (content, stationId) => content.station(stationId).items.filter((i) => i.kind === 'check');
  const queueReturn = (s, cardId) => { if (!s.returns.includes(cardId)) s.returns.push(cardId); };
  const indexIn = (content, stationId, id) => content.station(stationId).items.findIndex((i) => i.id === id);

  function advance(s, content) {
    if (s.queue.length) {
      const id = s.queue.shift();
      const it = content.item(s.stationId, id);
      s.current = id; s.flipped = false; s.misses = 0; s.hint = false;
      s.phase = it.kind === 'check' ? 'check' : it.kind === 'widget' ? 'widget' : 'card';
      // Resume position: index of this item in the Station's own order, only during the first pass.
      if (s.run && !s.run.returning) s.run.pos = indexIn(content, s.stationId, id);
      return s;
    }
    if (s.returns.length) {
      const cards = s.returns.slice();
      s.returns = [];
      if (s.run) { s.run.returning = true; s.run.pos = content.station(s.stationId).items.length; }
      const checks = checksOf(content, s.stationId);
      s.queue = cards.flatMap((c) => [c, ...checks.filter((k) => k.source === c).map((k) => k.id)]);
      s.events.push('return');
      return advance(s, content);
    }
    return startFare(s, content);
  }

  function startFare(s, content) {
    const pool = checksOf(content, s.stationId).map((k) => k.id);
    const n = Math.min(content.station(s.stationId).fareSize, pool.length);
    // Deterministic rotation: by n when the pool is bigger than the Fare, by 1 when it is not.
    const start = (s.fareAttempt * (n < pool.length ? n : 1)) % pool.length;
    const questions = Array.from({ length: n }, (_, i) => pool[(start + i) % pool.length]);
    s.fareAttempt += 1;
    if (s.run) s.run.pos = content.station(s.stationId).items.length;
    s.fare = { questions, index: 0, missed: [], attempt: s.fareAttempt };
    s.current = questions[0]; s.phase = 'fare'; s.misses = 0; s.hint = false; s.flipped = false;
    s.events.push('fare');
    return s;
  }

  // v1 progress named whole books (b01). v2 names Units (b01u1, b01u2, b01u3). A lit book
  // counts as Units 1 and 2 lit; rings are recounted from awarded Checks; bookmarks move
  // to the Unit holding their Card; XP stays as stored (decision 27). Runs once: a v2 document has no b01 keys.
  function migrateV1(s, content) {
    const isBook = (k) => V1_BOOK.test(k) && !!content.sectionOf(k);
    const halves = (k) => content.sectionOf(k).units.slice(0, 2);
    for (const key of ['lit', 'farePassed']) {
      for (const k of Object.keys(s[key] || {})) if (isBook(k)) { delete s[key][k]; for (const u of halves(k)) s[key][u] = true; }
    }
    for (const k of Object.keys(s.rings || {})) if (isBook(k)) {
      delete s.rings[k];
      for (const u of halves(k)) s.rings[u] = content.station(u).items.filter((i) => i.kind === 'check' && s.awarded[i.id]).length;
    }
    s.bookmarks = (s.bookmarks || []).map((b) => isBook(b.stationId) ? { stationId: halves(b.stationId).find((u) => content.item(u, b.cardId)) || halves(b.stationId)[0], cardId: b.cardId } : b);
    if (s.run && isBook(s.run.stationId)) s.run = null;
  }

  function leave(s) {
    s.screen = 'path'; s.stationId = null; s.phase = null; s.current = null;
    s.queue = []; s.returns = []; s.fare = null; s.fareAttempt = 0; s.hint = false; s.misses = 0; s.run = null;
    return s;
  }

  // Lighting rules. The Library lights only when its Fare passed and every Reading Order book is Lit.
  function light(s, content, stationId) {
    const st = content.station(stationId);
    if (s.lit[stationId]) return;
    if (st.litRule === 'readingOrder' && !content.readingOrder.every((b) => s.lit[content.sectionOf(b).id])) return;
    s.lit[stationId] = true; s.xp += st.xp; s.events.push('lit');
    // A book Section completes when all its Units are Lit: the book's Badge and the Section XP (decision 26).
    const sec = st.book ? content.sectionOf(st.bookId) : null;
    if (sec && !s.lit[sec.id] && sec.units.every((u) => s.lit[u])) { s.lit[sec.id] = true; s.xp += sec.xp; s.events.push('section'); }
  }
  function relight(s, content) {
    for (const st of content.stations) if (s.farePassed[st.id] && !s.lit[st.id]) light(s, content, st.id);
  }

  function reduce(prev, action, content) {
    const s = JSON.parse(JSON.stringify(prev));
    s.events = [];
    switch (action.type) {
      case 'SET_MODE':
        if (MODES.includes(action.value)) s.mode = action.value;
        return s;
      case 'TOGGLE_MUTE':
        s.muted = !s.muted; return s;
      case 'HYDRATE': {
        const d = action.value || {};
        for (const k of DURABLE) {
          if (d[k] === undefined || k === 'run') continue;
          if (k === 'sliders' || k === 'checklists') s[k] = { ...s[k], ...d[k] }; else s[k] = d[k];
        }
        if (!MODES.includes(s.mode)) s.mode = 'EN';
        migrateV1(s, content);
        // Resume at the saved position (owner decision after the Prompt 0 play-test). Returns and Fare are not resumed.
        if (d.run && !V1_BOOK.test(d.run.stationId) && content.station(d.run.stationId)) {
          const st = content.station(d.run.stationId);
          const pos = Math.max(0, Math.min(st.items.length, d.run.pos | 0));
          leave(s);
          s.screen = 'station'; s.stationId = st.id; s.run = { stationId: st.id, pos, returning: false };
          s.queue = st.items.slice(pos).map((i) => i.id);
          return advance(s, content);
        }
        return s;
      }
      case 'OPEN_STATION': {
        const st = content.station(action.value);
        if (!st || !st.items.length) return s;
        leave(s);
        s.screen = 'station'; s.stationId = st.id; s.run = { stationId: st.id, pos: 0, returning: false };
        s.queue = st.items.map((i) => i.id);
        return advance(s, content);
      }
      case 'OPEN_AT': {
        // Open a Station at one of its Cards (from a bookmark). The run continues from there.
        const { stationId, cardId } = action.value || {};
        const st = content.station(stationId);
        const idx = st ? st.items.findIndex((i) => i.id === cardId && i.kind === 'card') : -1;
        if (idx < 0) return s;
        leave(s);
        s.screen = 'station'; s.stationId = st.id; s.run = { stationId: st.id, pos: idx, returning: false };
        s.queue = st.items.slice(idx).map((i) => i.id);
        return advance(s, content);
      }
      case 'OPEN_BOOKMARKS':
        leave(s);
        s.screen = 'bookmarks';
        return s;
      case 'TOGGLE_BOOKMARK': {
        const { stationId, cardId } = action.value || {};
        const it = content.item(stationId, cardId);
        if (!it || it.kind !== 'card') return s;
        const at = s.bookmarks.findIndex((b) => b.stationId === stationId && b.cardId === cardId);
        if (at >= 0) { s.bookmarks.splice(at, 1); s.events.push('unbookmark'); }
        else { s.bookmarks.push({ stationId, cardId }); s.events.push('bookmark'); }
        return s;
      }
      case 'OPEN_TOOLS': {
        const st = content.station(action.value);
        if (!st) return s;
        leave(s);
        s.screen = 'tools'; s.stationId = st.id;
        return s;
      }
      case 'BACK_TO_PATH':
        return leave(s);
      case 'FLIP':
        if (s.phase === 'card') s.flipped = !s.flipped;
        return s;
      case 'RATE':
        if (s.phase !== 'card') return s;
        if (action.value === 'didnt') queueReturn(s, s.current);
        return advance(s, content);
      case 'ANSWER': {
        if (s.phase !== 'check' && s.phase !== 'fare') return s;
        const k = content.item(s.stationId, s.current);
        const ok = same(action.value, k.answer);
        if (s.phase === 'check') {
          if (ok) {
            if (!s.awarded[k.id]) {
              s.awarded[k.id] = true; s.coins += 1;
              s.rings[s.stationId] = (s.rings[s.stationId] || 0) + 1;
              s.events.push('coin');
            }
            s.phase = 'correct'; s.events.push('correct');
            // A reload after Correct resumes on the next item, not on this Check.
            if (s.run && !s.run.returning) s.run.pos = indexIn(content, s.stationId, k.id) + 1;
          } else {
            s.misses += 1; s.events.push('wrong');
            if (s.misses === 1) { s.hint = true; s.events.push('hint'); }
            else { s.phase = 'revealed'; queueReturn(s, k.source); s.events.push('revealed'); }
          }
          return s;
        }
        // Fare: no Hints, one attempt per question, result after the last one.
        if (!ok) s.fare.missed.push(k.id);
        s.events.push(ok ? 'correct' : 'wrong');
        s.fare.index += 1;
        if (s.fare.index < s.fare.questions.length) { s.current = s.fare.questions[s.fare.index]; return s; }
        if (s.fare.missed.length === 0) {
          s.phase = 'fare-passed'; s.events.push('fare-passed');
          s.farePassed[s.stationId] = true;
          light(s, content, s.stationId);
          relight(s, content);
        } else {
          s.phase = 'fare-failed'; s.events.push('fare-failed');
        }
        return s;
      }
      case 'CONTINUE':
        if (s.phase === 'correct' || s.phase === 'revealed' || s.phase === 'widget') return advance(s, content);
        if (s.phase === 'fare-failed') {
          s.returns = [];
          for (const id of s.fare.missed) queueReturn(s, content.item(s.stationId, id).source);
          s.fare = null;
          return advance(s, content);
        }
        if (s.phase === 'fare-passed') return leave(s);
        return s;
      case 'SET_SLIDER': {
        const { key, value } = action.value || {};
        if (['capital', 'ret', 'expenses'].includes(key) && Number.isFinite(+value)) s.sliders[key] = +value;
        return s;
      }
      case 'TOGGLE_HABIT': {
        const { habit, day, week } = action.value || {};
        if (!content.habits.some((h) => h.id === habit) || !(day >= 0 && day < 7)) return s;
        // Weekly tracker: the action carries the ISO week key (the engine never reads the clock). A new week starts empty.
        if (typeof week === 'string' && week && week !== s.habitsWeek) { s.habits = {}; s.habitsWeek = week; }
        if (!s.habits[habit]) s.habits[habit] = [false, false, false, false, false, false, false];
        s.habits[habit][day] = !s.habits[habit][day];
        return s;
      }
      case 'SET_JOURNAL': {
        const { text, reviewDate } = action.value || {};
        if (typeof text === 'string') s.journal.text = text.slice(0, 5000);
        if (typeof reviewDate === 'string') s.journal.reviewDate = reviewDate;
        return s;
      }
      case 'TOGGLE_CHECK': {
        const { list, index } = action.value || {};
        const l = content.checklists.find((x) => x.id === list);
        if (!l || !(index >= 0 && index < l.items.length)) return s;
        s.checklists[list][index] = !s.checklists[list][index];
        const all = content.checklists.every((x) => x.items.every((_, i) => s.checklists[x.id][i]));
        if (all && !s.milestone) { s.milestone = true; s.xp += content.MILESTONE_XP; s.events.push('milestone'); }
        return s;
      }
      case 'SET_SHELF': {
        const { bookId, state } = action.value || {};
        if (content.sectionOf(bookId) && SHELF_STATES.includes(state)) s.shelf[bookId] = state;
        return s;
      }
      case 'RESET': {
        const fresh = initial();
        fresh.mode = s.mode; fresh.muted = s.muted;
        fresh.events = ['reset'];
        return fresh;
      }
      default:
        return s;
    }
  }

  return { initial, reduce, MODES, SHELF_STATES, DURABLE };
})();
</script>

<script data-module="store">
// ---------------------------------------------------------------------------
// store: persistence behind three calls. One key, fi-roadmap-v1 (ADR-0003).
// Every read and write swallows errors so the game runs with storage disabled.
// Storage is injected: window.localStorage in the page, fakes in tests.
// ---------------------------------------------------------------------------
FI.store = (() => {
  const KEY = 'fi-roadmap-v1';
  const VERSION = 1;
  const DURABLE = FI.engine.DURABLE;

  const pick = (obj) => {
    const d = {};
    for (const k of DURABLE) if (obj[k] !== undefined) d[k] = obj[k];
    return d;
  };
  const durable = (state) => {
    const d = pick(state);
    if (d.run) d.run = { stationId: d.run.stationId, pos: d.run.pos }; // the Returns pass is never stored (decision 10)
    return d;
  };

  const save = (storage, state) => {
    try {
      if (!storage || typeof storage.setItem !== 'function') return false;
      storage.setItem(KEY, JSON.stringify({ v: VERSION, ...durable(state) }));
      return true;
    } catch (e) { return false; }
  };

  const load = (storage) => {
    try {
      if (!storage || typeof storage.getItem !== 'function') return null;
      const raw = storage.getItem(KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed) || parsed.v !== VERSION) return null;
      const { v, ...rest } = parsed;
      return pick(rest);
    } catch (e) { return null; }
  };

  const clear = (storage) => { try { storage.removeItem(KEY); return true; } catch (e) { return false; } };

  return { KEY, durable, save, load, clear };
})();
</script>

<script data-module="render">
// ---------------------------------------------------------------------------
// render: the whole DOM behind mount() and render(). Full re-render from state.
// Layout per ADR-0007 (Duolingo zigzag path, polished). Both mode is EN-led.
// UI-only state (the Order Check's placed items, the reset confirm, shelf
// filters, the milestone overlay) lives here. Prompt 3 adds widgets, the tools
// screen, the shelf with Book Units, per-Station themes and the Milestone.
// ---------------------------------------------------------------------------
FI.render = (() => {
  const ui = { order: [], confirmReset: false, lastCurrent: null, lastPhase: null, stage: 'all', must: 'all', search: '', milestone: false, seenEvents: null, introDone: false, pullout: null, lastScreen: null, dolly: false, openSection: null, picker: false, scrollTo: null };

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // One isolate per run, parentheses included, so a wrap never re-orders the pieces (see test/rtl.test.mjs).
  // Runs of 24 characters or fewer also refuse to wrap; longer ones wrap inside the single isolate, which bidi orders correctly.
  // Wrapping happens on the raw string and each piece is escaped on its own, so entities never become runs.
  const RUN = /\(?[A-Za-z][A-Za-z0-9 .\/%'’&()-]*[A-Za-z0-9%)]|[A-Za-z]/g;
  const faHtml = (s) => {
    const str = String(s); let out = ''; let last = 0;
    for (const m of str.matchAll(RUN)) {
      out += esc(str.slice(last, m.index)) + `<bdi${m[0].length <= 24 ? ' class="nw"' : ''}>${esc(m[0])}</bdi>`;
      last = m.index + m[0].length;
    }
    return out + esc(str.slice(last));
  };
  const A = (action) => `data-action="${esc(JSON.stringify(action))}"`;
  const num = (n, mode) => FI.content.fmt(n, mode === 'FA' ? 'FA' : 'EN');
  const yr = (y, mode) => (mode === 'FA' ? FI.content.faDigits(String(y)) : String(y));
  const one = (mode) => (mode === 'FA' ? 'FA' : 'EN');

  const pair = (p, mode, cls = '') => {
    if (!p) return '';
    if (mode === 'FA') return `<span class="t-fa ${cls}" lang="fa">${faHtml(p.fa)}</span>`;
    if (mode === 'EN') return `<span class="t-en ${cls}" lang="en">${esc(p.en)}</span>`;
    return `<span class="t-en ${cls}" lang="en">${esc(p.en)}</span><span class="t-fa under" lang="fa">${faHtml(p.fa)}</span>`;
  };
  const both = (p) => `<span class="t-en" lang="en">${esc(p.en)}</span><span class="t-fa under" lang="fa">${faHtml(p.fa)}</span>`;
  const t = (key, mode) => {
    const u = FI.content.ui;
    return esc(mode === 'FA' ? u.fa[key] : u.en[key]);
  };

  const ICONS = {
    s1: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 12h3M13 12h3M8 16h3M13 16h3"/></svg>',
    s2: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>',
    s3: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 8l8 8M16 8l-8 8"/></svg>',
    s4: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l6-6 4 4 6-8"/><path d="M14 8h6v6"/></svg>',
    s5: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    s6: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6a3 3 0 013 3v13a2 2 0 00-2-2H4z"/><path d="M20 4h-6a3 3 0 00-3 3v13a2 2 0 012-2h7z"/></svg>',
    coin: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10" opacity=".35"/><circle cx="12" cy="12" r="6"/></svg>',
    sound: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6"/></svg>',
    muted: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    badge: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M8 14l-2 7 6-3 6 3-2-7"/></svg>',
    retry: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0114-5l2 2M20 4v5h-5"/><path d="M20 12a8 8 0 01-14 5l-2-2M4 20v-5h5"/></svg>',
    tools: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h10M4 17h7"/></svg>',
    bookmark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
    bookmarkOn: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
    chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 7 7 .6-5.3 4.6L18.5 22 12 18l-6.5 4 1.8-7.8L2 9.6 9 9z"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h13a1 1 0 011 1v16a1 1 0 01-1 1H5z"/><path d="M5 3v18M9 7h6"/></svg>',
  };

  function topBar(s, content) {
    const totalXp = content.totalXp();
    const pct = Math.min(100, Math.round((s.xp / totalXp) * 100));
    const mode = (m, label) => `<button ${A({ type: 'SET_MODE', value: m })} aria-pressed="${s.mode === m}">${label}</button>`;
    return `<header class="top">
      <div class="modes" role="group" aria-label="${t('language', s.mode)}">${mode('EN', t('modeEN', s.mode))}${mode('FA', t('modeFA', s.mode))}${mode('BOTH', t('modeBoth', s.mode))}</div>
      <div class="xpbar" role="progressbar" aria-label="${t('xp', s.mode)}" aria-valuenow="${s.xp}" aria-valuemin="0" aria-valuemax="${totalXp}" title="${num(s.xp, s.mode)} / ${num(totalXp, s.mode)} ${t('xp', s.mode)}"><i style="width:${pct}%"></i></div>
      <span class="coins ${s.events.includes('coin') && !ui.coinShown ? 'bump' : ''}" aria-live="polite" aria-label="${t('coins', s.mode)}">${ICONS.coin}<span class="n">${num(s.coins, s.mode)}</span>${s.events.includes('coin') && !ui.coinShown ? `<span class="plus" aria-hidden="true">+${num(1, s.mode)}</span>` : ''}</span>
      <button class="icon" ${A({ type: 'TOGGLE_MUTE' })} aria-pressed="${s.muted}" aria-label="${s.muted ? t('unmute', s.mode) : t('mute', s.mode)}">${s.muted ? ICONS.muted : ICONS.sound}</button>
    </header>`;
  }

  // ---- Path: Sections of Units (ADR-0009, decision 29) -----------------
  const isComplete = (s, sec) => sec.units.every((u) => s.lit[u]);
  const litReadingOrder = (s, content) => content.readingOrder.filter((bk) => s.lit[content.sectionOf(bk).id]).length;
  function unitStop(s, content, st, cur, litBooks) {
    const checks = st.items.filter((i) => i.kind === 'check').length;
    const p = checks ? Math.round(((s.rings[st.id] || 0) / checks) * 100) : 0;
    const cls = (s.lit[st.id] ? 'lit' : cur ? 'cur' : '') + (ui.pullout === st.id ? ' justlit' : '');
    const tools = st.tools ? `<button class="tools" ${A({ type: 'OPEN_TOOLS', value: st.id })}>${ICONS.tools}<span>${t('tools', s.mode)}</span></button>` : '';
    const sub = st.id === 's6' && !s.lit.s6 ? `<span class="planned">${num(litBooks, s.mode)}/${num(content.readingOrder.length, s.mode)} ${t('booksLit', s.mode)}</span>` : '';
    const icon = st.book ? `<span class="unum">${num(st.unit, s.mode)}</span>` : ICONS[st.id];
    return `<li class="node ${cls}" data-theme="${st.theme}" style="--p:${s.lit[st.id] ? 100 : p}">
      <button class="ubtn" ${A({ type: 'OPEN_STATION', value: st.id })} aria-label="${esc(st.book ? st.title + ', ' + st.name[one(s.mode) === 'FA' ? 'fa' : 'en'] : st.name[one(s.mode) === 'FA' ? 'fa' : 'en'])}"><span class="ring"></span><span class="ico">${icon}</span></button>
      ${s.lit[st.id] && st.badge ? `<span class="badge">${pair(st.badge, one(s.mode))}</span>` : ''}
      <span class="label">${pair(st.name, s.mode)}</span>${sub}${tools}
    </li>`;
  }
  function sectionHeader(s, sec, n, open, done) {
    const total = sec.units.length;
    const complete = done === total;
    const count = `<span class="prog ${complete ? 'done' : ''}">${num(done, s.mode)}/${num(total, s.mode)}${complete ? `<span class="tick">${ICONS.check}</span>` : ''}</span>`;
    const toggle = A({ type: 'UI_OPEN_SECTION', value: sec.id });
    if (sec.kind === 'basics') {
      return `<button class="sechead" ${toggle} aria-expanded="${open}"><span class="n">${num(n, s.mode)}</span><span class="st"><b>${pair(sec.name, one(s.mode))}</b><span>${pair(sec.sub, one(s.mode))}</span></span>${count}</button>`;
    }
    const lit = s.lit[sec.id];
    const meta = `<span class="t-en" lang="en">${esc(sec.author.en)} · ${yr(sec.year, s.mode)}</span>`;
    if (open) {
      return `<button class="sechead banner" ${toggle} aria-expanded="true"><span class="cover">${sec.must ? '⭐' : '○'}</span><span class="st"><b class="t-en" lang="en">${esc(sec.title)}</b>${meta}<span class="why">${pair(sec.why, s.mode)}</span></span><span class="side">${count}${lit ? `<span class="badge">${pair(sec.badge, one(s.mode))}</span>` : ''}</span></button>`;
    }
    return `<button class="sechead" ${toggle} aria-expanded="false"><span class="n">${num(n, s.mode)}</span><span class="st"><b class="t-en" lang="en">${esc(sec.title)}</b>${meta}</span>${count}</button>`;
  }
  function pathScreen(s, content) {
    const secs = content.sections;
    const doneOf = (sec) => sec.units.filter((u) => s.lit[u]).length;
    const litBooks = litReadingOrder(s, content);
    const firstOpenSec = secs.find((sec) => !isComplete(s, sec)) || secs[secs.length - 1];
    const openId = ui.openSection === '__none__' ? null : ui.openSection && secs.some((x) => x.id === ui.openSection) ? ui.openSection : firstOpenSec.id;
    const nextUnit = firstOpenSec.units.find((u) => !s.lit[u]);
    const list = secs.map((sec, i) => {
      const open = sec.id === openId;
      const nodes = open ? `<ol class="nodes">${sec.units.map((u) => unitStop(s, content, content.station(u), u === nextUnit, litBooks)).join('')}</ol>` : '';
      return `<section class="sec ${sec.kind} ${open ? 'open' : 'collapsed'} ${isComplete(s, sec) ? 'done' : ''}" id="${esc(sec.id)}">${sectionHeader(s, sec, i + 1, open, doneOf(sec))}${nodes}</section>`;
    }).join('');
    const reset = ui.confirmReset
      ? `<div class="confirm" role="alertdialog" aria-live="polite"><span>${t('resetConfirm', s.mode)}</span><button ${A({ type: 'UI_RESET_CANCEL' })}>${t('cancel', s.mode)}</button><button ${A({ type: 'RESET' })}>${t('confirm', s.mode)}</button></div>`
      : `<button class="linkish" ${A({ type: 'UI_RESET_ASK' })}>${t('reset', s.mode)}</button>`;
    const milestone = s.milestone ? `<div class="milestone-chip">${ICONS.star}<span>${t('milestoneTitle', s.mode)}: ${t('milestoneBody', s.mode)}</span></div>` : '';
    const marks = `<button class="footbtn" ${A({ type: 'OPEN_TOOLS', value: 's6' })}>${ICONS.book}<span>${t('shelfTitle', s.mode)}</span></button><button class="footbtn" ${A({ type: 'OPEN_BOOKMARKS' })}>${ICONS.bookmarkOn}<span>${t('bookmarks', s.mode)}</span><b>${num(s.bookmarks.length, s.mode)}</b></button>`;
    const sheet = ui.picker ? `<div class="sheet" role="dialog" aria-label="${t('sections', s.mode)}"><h3>${t('sections', s.mode)}</h3>${secs.map((sec, i) => `<button class="row ${sec.id === openId ? 'on' : ''}" ${A({ type: 'UI_JUMP_SECTION', value: sec.id })}><span class="n">${num(i + 1, s.mode)}</span><span class="t">${sec.kind === 'basics' ? pair(sec.name, one(s.mode)) : `<span class="t-en" lang="en">${esc(sec.title)}</span>`}</span><span class="p">${num(doneOf(sec), s.mode)}/${num(sec.units.length, s.mode)}</span></button>`).join('')}</div>` : '';
    const cam = !ui.introDone ? ' intro' : ui.pullout ? ' pullout' : '';
    return `<main class="path${cam}">
      <h1>${t('title', s.mode)}</h1><p class="sub">${t('subtitle', s.mode)}</p>
      <div class="pathbar">${marks}</div>
      <div class="sections">${list}</div>${milestone}
      <div class="pathfoot">${reset}</div>
      <button class="picker" ${A({ type: 'UI_PICKER' })} aria-expanded="${!!ui.picker}">${t('jumpTo', s.mode)}${ICONS.chevron}</button>${sheet}
    </main>`;
  }

  // ---- Widgets ----------------------------------------------------------
  function slidersWidget(s, content) {
    const v = s.sliders;
    const income = Math.round(v.capital * v.ret / 100);
    const target = v.expenses * 25;
    const pct = Math.min(999, Math.round((v.capital / target) * 100));
    const row = (key, label, min, max, step, fmtv) => `<label class="srow"><span>${t(label, s.mode)}</span><output data-out="${key}">${fmtv}</output>
      <input type="range" data-slider="${key}" min="${min}" max="${max}" step="${step}" value="${v[key]}" aria-label="${t(label, s.mode)}"></label>`;
    return `<div class="widget sliders" data-widget="sliders">
      ${row('capital', 'capital', 10000, 1000000, 10000, '€' + num(v.capital, s.mode))}
      ${row('ret', 'realReturn', 3, 8, 0.5, num(v.ret, s.mode) + '%')}
      <div class="out" aria-live="polite"><b data-out="income">€${num(income, s.mode)}</b><small>${t('yearlyIncome', s.mode)}</small></div>
      ${row('expenses', 'expenses', 10000, 100000, 1000, '€' + num(v.expenses, s.mode))}
      <div class="out" aria-live="polite"><b data-out="target">€${num(target, s.mode)}</b><small>${t('target25', s.mode)} · <span data-out="pct">${num(pct, s.mode)}%</span> ${t('ofTarget', s.mode)}</small></div>
    </div>`;
  }
  const isoWeek = (d = new Date()) => {
    const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = x.getUTCDay() || 7; x.setUTCDate(x.getUTCDate() + 4 - day);
    const y = new Date(Date.UTC(x.getUTCFullYear(), 0, 1));
    return `${x.getUTCFullYear()}-W${String(Math.ceil(((x - y) / 86400000 + 1) / 7)).padStart(2, '0')}`;
  };
  function habitsWidget(s, content) {
    const days = [0, 1, 2, 3, 4, 5, 6];
    const week = isoWeek();
    const current = s.habitsWeek === week;
    const head = `<tr><th></th>${days.map((d) => `<th>${t('d' + d, s.mode)}</th>`).join('')}</tr>`;
    const rows = content.habits.map((h) => `<tr><th scope="row">${pair(h.label, one(s.mode))}</th>${days.map((d) => {
      const on = current && s.habits[h.id] && s.habits[h.id][d];
      return `<td><button class="cell ${on ? 'on' : ''}" ${A({ type: 'TOGGLE_HABIT', value: { habit: h.id, day: d, week } })} aria-pressed="${!!on}" aria-label="${esc(h.label.en)} ${t('d' + d, s.mode)}">${on ? ICONS.check : ''}</button></td>`;
    }).join('')}</tr>`).join('');
    return `<div class="widget habits" data-widget="habits"><p class="kicker">${t('habitsWeek', s.mode)} · ${esc(week)}</p><table class="habitgrid">${head}${rows}</table></div>`;
  }
  function journalWidget(s, content) {
    return `<div class="widget journal" data-widget="journal">
      <textarea data-journal rows="6" placeholder="${t('journalPlaceholder', s.mode)}" aria-label="${t('journalPlaceholder', s.mode)}">${esc(s.journal.text)}</textarea>
      <p class="help">${s.journal.reviewDate ? `${t('reviewOn', s.mode)} ${esc(s.journal.reviewDate)} · ` : ''}${t('autosaved', s.mode)}</p>
    </div>`;
  }
  function checklistWidget(s, content) {
    const total = content.checklists.reduce((a, l) => a + l.items.length, 0);
    const done = content.checklists.reduce((a, l) => a + l.items.filter((_, i) => s.checklists[l.id][i]).length, 0);
    const pct = Math.round((done / total) * 100);
    const lists = content.checklists.map((l) => `<section class="clist"><h3>${pair(l.title, s.mode)}</h3>${l.items.map((it, i) => {
      const on = s.checklists[l.id][i];
      return `<button class="citem ${on ? 'on' : ''}" ${A({ type: 'TOGGLE_CHECK', value: { list: l.id, index: i } })} aria-pressed="${!!on}"><span class="box">${on ? ICONS.check : ''}</span>${pair(it, s.mode)}</button>`;
    }).join('')}</section>`).join('');
    return `<div class="widget checklist" data-widget="checklist">
      <div class="prog big"><i style="width:${pct}%"></i></div><p class="help">${num(pct, s.mode)}% ${t('percentDone', s.mode)}</p>${lists}
    </div>`;
  }
  function bookCard(s, content, b) {
    const lit = s.lit[b.id];
    const state = s.shelf[b.bookId] || 'toread';
    const states = FI.engine.SHELF_STATES.map((k) => `<button class="chip ${state === k ? 'on' : ''}" ${A({ type: 'SET_SHELF', value: { bookId: b.bookId, state: k } })} aria-pressed="${state === k}">${t(k, s.mode)}</button>`).join('');
    return `<li class="book ${lit ? 'lit' : ''}" data-id="${b.bookId}">
      <div class="bhead"><span class="mark" title="${b.must ? t('mustRead', s.mode) : t('optionalRead', s.mode)}">${b.must ? '⭐' : '○'}</span>
        <div><b class="t-en" lang="en">${esc(b.title)}</b><span class="meta t-en" lang="en">${esc(b.author.en)} · ${yr(b.year, s.mode)}</span></div>
        ${lit ? `<span class="badge">${pair(b.badge, one(s.mode))}</span>` : ''}</div>
      <p class="why">${pair(b.why, s.mode)}</p>
      <div class="brow"><div class="chips">${states}</div>
        <button class="btn small ${lit ? '' : 'primary'}" ${A({ type: 'UI_JUMP', value: b.bookId })}>${ICONS.book}${t('goToSection', s.mode)}</button></div>
    </li>`;
  }
  function shelfGrid(s, content) {
    const q = ui.search.trim().toLowerCase();
    const books = content.sections.filter((b) => b.kind === 'book')
      .filter((b) => ui.stage === 'all' || String(b.stage) === ui.stage)
      .filter((b) => ui.must === 'all' || (ui.must === 'must') === b.must)
      .filter((b) => !q || b.title.toLowerCase().includes(q) || b.author.en.toLowerCase().includes(q) || b.why.en.toLowerCase().includes(q) || b.why.fa.includes(q));
    if (!books.length) return `<p class="help">${t('noBooks', s.mode)}</p>`;
    return `<ul class="books">${books.map((b) => bookCard(s, content, b)).join('')}</ul>`;
  }
  function shelfWidget(s, content, compact) {
    const stages = ['all', '1', '2', '3', '5', '6'].map((k) => `<button class="chip ${ui.stage === k ? 'on' : ''}" ${A({ type: 'UI_STAGE', value: k })} aria-pressed="${ui.stage === k}">${k === 'all' ? t('all', s.mode) : `${t('stage', s.mode)} ${num(k, s.mode)}`}</button>`).join('');
    const musts = [['all', t('all', s.mode)], ['must', '⭐ ' + t('mustRead', s.mode)], ['opt', '○ ' + t('optionalRead', s.mode)]].map(([k, l]) => `<button class="chip ${ui.must === k ? 'on' : ''}" ${A({ type: 'UI_MUST', value: k })} aria-pressed="${ui.must === k}">${l}</button>`).join('');
    const lit = litReadingOrder(s, content);
    const order = content.readingOrder.map((id, i) => {
      const sec = content.sectionOf(id); const on = s.lit[sec.id];
      return `<li class="${on ? 'lit' : ''}"><span class="n">${num(i + 1, s.mode)}</span><button class="linkish" ${A({ type: 'UI_JUMP', value: id })}><span class="t-en" lang="en">${esc(sec.title)}</span></button>${on ? `<span class="tick">${ICONS.check}</span>` : ''}</li>`;
    }).join('');
    const orderSection = `<section class="order"><h3>${t('readingOrder', s.mode)} · ${num(lit, s.mode)}/${num(content.readingOrder.length, s.mode)}</h3><ol class="rorder">${order}</ol><p class="help">${pair(content.item('s6', 's6c2').text, s.mode)}</p></section>`;
    if (compact) return `<div class="widget shelf" data-widget="shelf">${orderSection}<p class="help">${t('shelfInTools', s.mode)}</p></div>`;
    return `<div class="widget shelf" data-widget="shelf">
      ${orderSection}
      <div class="filters"><div class="chips">${stages}</div><div class="chips">${musts}</div>
        <input type="search" data-search placeholder="${t('search', s.mode)}" value="${esc(ui.search)}" aria-label="${t('search', s.mode)}"></div>
      <div class="shelfgrid">${shelfGrid(s, content)}</div>
    </div>`;
  }
  const WIDGET_FN = { sliders: slidersWidget, habits: habitsWidget, journal: journalWidget, checklist: checklistWidget, shelf: shelfWidget };

  function toolsScreen(s, content) {
    const st = content.station(s.stationId);
    const widgets = (st.tools || []).map((w) => `<section class="panel"><p class="kicker">${pair(st.name, one(s.mode))}</p>${WIDGET_FN[w](s, content)}</section>`).join('');
    const overlay = ui.milestone ? `<div class="overlay${ui.dolly ? ' dolly' : ''}"><section class="panel result milestone"><div class="big">${ICONS.star}</div><h2>${t('milestoneTitle', s.mode)}</h2><p>${t('milestoneBody', s.mode)} · +${num(content.MILESTONE_XP, s.mode)} ${t('xp', s.mode)}</p><button class="btn primary" ${A({ type: 'UI_MILESTONE_CLOSE' })} data-focus>${t('milestoneDone', s.mode)}</button></section></div>` : '';
    return `<main class="station tools${ui.milestone && ui.dolly ? ' dolly-bg' : ''}" data-theme="${st.theme}">
      <div class="shead"><button class="icon" ${A({ type: 'BACK_TO_PATH' })} aria-label="${t('back', s.mode)}">${ICONS.close}</button><h2 class="ttitle">${pair(st.name, s.mode)}</h2></div>
      ${widgets}
    </main>${overlay}`;
  }

  function bookmarksScreen(s, content) {
    const items = s.bookmarks.map((b) => {
      const st = content.station(b.stationId); const c = st && content.item(b.stationId, b.cardId);
      if (!st || !c) return '';
      return `<li class="mark">
        <p class="kicker">${st.book ? `<span class="t-en" lang="en">${esc(st.title)}</span> · ${pair(st.name, one(s.mode))}` : pair(st.name, one(s.mode))}</p>
        <p class="ctext small">${pair(c.text, s.mode)}</p>
        <div class="brow"><button class="btn ghost small" ${A({ type: 'TOGGLE_BOOKMARK', value: b })}>${t('removeBookmark', s.mode)}</button><button class="btn primary small" ${A({ type: 'OPEN_AT', value: b })}>${ICONS.bookmarkOn}${t('openCard', s.mode)}</button></div>
      </li>`;
    }).join('');
    const body = s.bookmarks.length ? `<ul class="marks">${items}</ul>` : `<p class="help">${t('noBookmarks', s.mode)}</p>`;
    return `<main class="station tools" data-theme="teal">
      <div class="shead"><button class="icon" ${A({ type: 'BACK_TO_PATH' })} aria-label="${t('back', s.mode)}">${ICONS.close}</button><h2 class="ttitle">${t('bookmarks', s.mode)} · ${num(s.bookmarks.length, s.mode)}</h2></div>
      <section class="panel">${body}</section>
    </main>`;
  }

  // ---- Station run ---------------------------------------------------------
  function bookHeader(s, st) {
    if (!st.book) return '';
    return `<div class="bookhead"><span class="mark">${st.must ? '⭐' : '○'}</span><div><b class="t-en" lang="en">${esc(st.title)}</b><span class="meta"><span class="t-en" lang="en">${esc(st.author.en)} · ${yr(st.year, s.mode)}</span> · ${t('stage', s.mode)} ${num(st.stage, s.mode)} · ${pair(st.name, one(s.mode))}</span></div></div>`;
  }
  function cardPanel(s, content, item, st) {
    let body;
    if (s.flipped && s.mode !== 'BOTH') body = pair(item.text, s.mode === 'FA' ? 'EN' : 'FA');
    else body = pair(item.text, s.mode);
    const add = item.addition ? `<p class="addnote"><span>${t('addition', s.mode)}</span>${/^https?:/.test(item.cite || '') ? `<a href="${esc(item.cite)}" target="_blank" rel="noopener">${t('source', s.mode)}</a>` : ''}</p>` : st.addition ? `<p class="addnote"><span>${t('applyNote', s.mode)}</span></p>` : '';
    const flip = s.mode === 'BOTH' ? '' : `<button class="btn soft wide" ${A({ type: 'FLIP' })} aria-pressed="${s.flipped}">${t('flip', s.mode)}</button>`;
    const chip = item.chip ? `<span class="chip on stagechip">${pair(item.chip, one(s.mode))}</span>` : '';
    const marked = s.bookmarks.some((b) => b.stationId === st.id && b.cardId === item.id);
    const mark = `<button class="markbtn ${marked ? 'on' : ''}" ${A({ type: 'TOGGLE_BOOKMARK', value: { stationId: st.id, cardId: item.id } })} aria-pressed="${marked}" aria-label="${marked ? t('bookmarked', s.mode) : t('bookmark', s.mode)}" title="${marked ? t('bookmarked', s.mode) : t('bookmark', s.mode)}">${marked ? ICONS.bookmarkOn : ICONS.bookmark}</button>`;
    return `<section class="panel card${item.callout ? ' callout' : ''}">
      <p class="kicker">${st.book ? t('bookUnit', s.mode) : pair(st.name, one(s.mode))}${chip}${mark}</p>
      <p class="ctext">${body}</p>${add}
      <div class="actions">${flip}
        <button class="btn" ${A({ type: 'RATE', value: 'didnt' })}>${t('didnt', s.mode)}</button>
        <button class="btn primary" ${A({ type: 'RATE', value: 'knew' })} data-focus>${t('knew', s.mode)}</button>
      </div>
    </section>`;
  }
  function widgetPanel(s, content, item, st) {
    return `<section class="panel"><p class="kicker">${pair(item.title, one(s.mode))}</p>${WIDGET_FN[item.widget](s, content, true)}
      <div class="actions"><button class="btn primary wide" ${A({ type: 'CONTINUE' })} data-focus>${t('continue', s.mode)}</button></div></section>`;
  }
  function checkPanel(s, content, k, st) {
    const locked = s.phase === 'correct' || s.phase === 'revealed';
    const inFare = s.phase === 'fare';
    let body = '';
    if (k.type === 'tap') {
      body = `<div class="opts">${k.options.map((o, i) => {
        const cls = locked && i === k.answer ? 'right' : '';
        return `<button class="btn opt ${cls}" ${locked ? 'disabled' : A({ type: 'ANSWER', value: i })} ${i === 0 ? 'data-focus' : ''}>${pair(o, s.mode)}</button>`;
      }).join('')}</div>`;
    } else if (k.type === 'tf') {
      const b = (v, label) => `<button class="btn ${locked && v === k.answer ? 'right' : ''}" ${locked ? 'disabled' : A({ type: 'ANSWER', value: v })} ${v ? 'data-focus' : ''}>${label}</button>`;
      body = `<div class="tf">${b(true, t('trueLabel', s.mode))}${b(false, t('falseLabel', s.mode))}</div>`;
    } else if (k.type === 'order') {
      const placed = locked ? k.answer : ui.order;
      const slots = placed.map((i, n) => `<span class="slot" ${locked ? '' : `draggable="true" data-slot="${n}"`}><b>${num(n + 1, s.mode)}</b>${pair(k.options[i], one(s.mode))}</span>`).join('');
      const remaining = k.options.map((o, i) => placed.includes(i) ? '' : `<button class="btn opt" ${locked ? 'disabled' : A({ type: 'UI_ORDER_ADD', value: i })}>${pair(o, s.mode)}</button>`).join('');
      body = `<p class="help">${t('orderHelp', s.mode)}</p>
        <div class="slots" aria-live="polite">${slots}</div>
        <div class="opts">${remaining}</div>
        ${locked ? '' : `<div class="actions"><button class="btn ghost" ${A({ type: 'UI_ORDER_CLEAR' })} ${placed.length ? '' : 'disabled'}>${t('clearOrder', s.mode)}</button><button class="btn primary" ${A({ type: 'ANSWER', value: placed })} ${placed.length === k.options.length ? '' : 'disabled'}>${t('check', s.mode)}</button></div>`}`;
    }
    const src = content.item(s.stationId, k.source);
    let hint = '';
    if (s.hint && !inFare) {
      if (st.hints === 'short') {
        const n = st.items.filter((i) => i.kind === 'card').findIndex((i) => i.id === src.id) + 1;
        hint = `<aside class="hint"><p class="kicker">${t('hint', s.mode)}</p><span>${t('hintShort', s.mode)} ${num(n, s.mode)}</span></aside>`;
      } else hint = `<aside class="hint"><p class="kicker">${t('hint', s.mode)}</p>${both(src.text)}</aside>`;
    }
    const kicker = inFare
      ? `<p class="kicker fare">${t('fareTitle', s.mode)} · ${num(s.fare.index + 1, s.mode)}/${num(s.fare.questions.length, s.mode)}</p>`
      : `<p class="kicker">${st.book ? t('bookUnit', s.mode) : pair(st.name, one(s.mode))}</p>`;
    return `<section class="panel check">${kicker}<h2 class="prompt">${pair(k.prompt, s.mode)}</h2>${body}${hint}</section>`;
  }
  function feedback(s, content, k) {
    if (s.phase === 'correct') {
      const coin = s.events.includes('coin') ? `<small>+${num(1, s.mode)} ${t('coins', s.mode)}</small>` : '';
      return `<div class="feedback ok" aria-live="polite"><span class="msg"><span>${t('correct', s.mode)}</span>${coin}</span><button class="btn" ${A({ type: 'CONTINUE' })} data-focus>${t('continue', s.mode)}</button></div>`;
    }
    if (s.phase === 'revealed') {
      const ans = k.type === 'tf' ? (k.answer ? t('trueLabel', s.mode) : t('falseLabel', s.mode)) : k.type === 'tap' ? pair(k.options[k.answer], one(s.mode)) : '';
      return `<div class="feedback bad" aria-live="polite"><span class="msg"><span>${t('revealed', s.mode)}</span><small>${ans}</small></span><button class="btn" ${A({ type: 'CONTINUE' })} data-focus>${t('continue', s.mode)}</button></div>`;
    }
    if (s.phase === 'check' && s.hint) return `<div class="feedback bad" aria-live="polite"><span class="msg"><span>${t('wrong', s.mode)}</span></span></div>`;
    return '<div aria-live="polite"></div>';
  }
  function resultPanel(s, content, st) {
    if (s.phase === 'fare-passed') {
      const litNow = s.lit[st.id];
      const sec = st.book ? content.sectionOf(st.bookId) : null;
      const note = st.litRule === 'readingOrder' && !litNow ? `<p>${t('libraryHint', s.mode)}</p>`
        : sec && s.events.includes('section') ? `<p class="inl">${t('sectionComplete', s.mode)} · ${t('badge', s.mode)}: ${pair(sec.badge, one(s.mode))} · +${num(st.xp + sec.xp, s.mode)} ${t('xp', s.mode)}</p>`
        : sec ? `<p class="inl">${pair(st.name, one(s.mode))} · +${num(st.xp, s.mode)} ${t('xp', s.mode)}</p>`
        : `<p class="inl">${t('badge', s.mode)}: ${pair(st.badge, one(s.mode))} · +${num(st.xp, s.mode)} ${t('xp', s.mode)}</p>`;
      return `<section class="panel result"><div class="big">${ICONS.badge}</div><h2>${t('farePassed', s.mode)}</h2>${note}<button class="btn primary" ${A({ type: 'CONTINUE' })} data-focus>${t('back', s.mode)}</button></section>`;
    }
    return `<section class="panel result fail"><div class="big">${ICONS.retry}</div><h2>${t('fareFailed', s.mode)}</h2><p>${t('fareIntro', s.mode)}</p><button class="btn primary" ${A({ type: 'CONTINUE' })} data-focus>${t('continue', s.mode)}</button></section>`;
  }
  function stationScreen(s, content) {
    const st = content.station(s.stationId);
    const total = st.items.length;
    const pos = s.fare ? total : Math.max(0, st.items.findIndex((i) => i.id === s.current));
    const pct = Math.round((pos / total) * 100);
    const item = content.item(s.stationId, s.current);
    let inner = '';
    if (s.phase === 'card') inner = cardPanel(s, content, item, st);
    else if (s.phase === 'widget') inner = widgetPanel(s, content, item, st);
    else if (s.phase === 'fare-passed' || s.phase === 'fare-failed') inner = resultPanel(s, content, st);
    else inner = checkPanel(s, content, item, st) + feedback(s, content, item);
    return `<main class="station" data-theme="${st.theme}">
      <div class="shead">
        <button class="icon" ${A({ type: 'BACK_TO_PATH' })} aria-label="${t('back', s.mode)}">${ICONS.close}</button>
        <div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
        <span class="count">${num(Math.min(pos + 1, total), s.mode)} ${t('ofCards', s.mode)} ${num(total, s.mode)}</span>
      </div>${bookHeader(s, st)}${inner}
    </main>`;
  }

  function disclaimer(s) {
    const u = FI.content.ui;
    if (s.mode === 'FA') return `<footer class="disc"><span class="t-fa" lang="fa">${esc(u.fa.disclaimer)}</span></footer>`;
    if (s.mode === 'EN') return `<footer class="disc"><span class="t-en" lang="en">${esc(u.en.disclaimer)}</span></footer>`;
    return `<footer class="disc"><span class="t-en" lang="en">${esc(u.en.disclaimer)}</span><span class="sep">·</span><span class="t-fa" lang="fa">${esc(u.fa.disclaimer)}</span></footer>`;
  }

  function render(root, s, content) {
    if (s.current !== ui.lastCurrent || (s.phase === 'check' && ui.lastPhase !== 'check')) ui.order = [];
    if (s.screen !== 'path') ui.confirmReset = false;
    // Consume each events array once; UI-only re-renders reuse the same state object.
    if (s.events !== ui.seenEvents) { ui.seenEvents = s.events; ui.coinShown = false; if (s.events.includes('milestone')) { ui.milestone = true; ui.dolly = true; } } else { ui.coinShown = true; ui.dolly = false; }
    // Camera 2: arriving on the Path right after a Station was lit (fare-passed then Continue).
    ui.pullout = (s.screen === 'path' && ui.lastPhase === 'fare-passed' && ui.lastScreen === 'station' && ui.litJust) ? ui.litJust : null;
    if (s.screen !== 'path') ui.litJust = (s.phase === 'fare-passed' && s.lit[s.stationId]) ? s.stationId : null;
    const html = document.documentElement;
    html.lang = s.mode === 'FA' ? 'fa' : 'en';
    html.dir = s.mode === 'FA' ? 'rtl' : 'ltr';
    const screen = s.screen === 'path' ? pathScreen(s, content) : s.screen === 'tools' ? toolsScreen(s, content) : s.screen === 'bookmarks' ? bookmarksScreen(s, content) : stationScreen(s, content);
    root.innerHTML = topBar(s, content) + screen + disclaimer(s);
    if (s.screen === 'path' && ui.scrollTo) { const el = root.querySelector(`#${CSS.escape(ui.scrollTo)}`); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); ui.scrollTo = null; }
    const changed = s.current !== ui.lastCurrent || s.phase !== ui.lastPhase || ui.milestone;
    ui.lastCurrent = s.current; ui.lastPhase = s.phase; ui.lastScreen = s.screen;
    // Camera 1: on first load, the Path starts wide and eases in toward the current node.
    if (s.screen === 'path' && !ui.introDone) {
      ui.introDone = true;
      const nodes = root.querySelector('.nodes'); const cur = root.querySelector('.node.cur, .node.justlit');
      if (nodes && cur) {
        const a = nodes.getBoundingClientRect(); const b = cur.getBoundingClientRect();
        nodes.style.transformOrigin = `${b.left - a.left + b.width / 2}px ${b.top - a.top + b.height / 2}px`;
        setTimeout(() => { try { cur.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {} }, 400);
      }
    }
    if (changed && s.screen !== 'path') {
      const f = root.querySelector('[data-focus]');
      if (f) { f.focus({ preventScroll: true }); f.scrollIntoView({ block: 'nearest' }); }
    }
  }

  // Partial updates that must not rebuild the DOM under the user's fingers.
  function patch(root, s, content, action) {
    if (action.type === 'SET_SLIDER') {
      const v = s.sliders; const m = s.mode;
      const set = (k, val) => { const el = root.querySelector(`[data-out="${k}"]`); if (el) el.textContent = val; };
      set('capital', '€' + num(v.capital, m)); set('ret', num(v.ret, m) + '%'); set('expenses', '€' + num(v.expenses, m));
      set('income', '€' + num(Math.round(v.capital * v.ret / 100), m)); set('target', '€' + num(v.expenses * 25, m));
      set('pct', num(Math.min(999, Math.round((v.capital / (v.expenses * 25)) * 100)), m) + '%');
    } else if (action.type === 'UI_SEARCH') {
      const g = root.querySelector('.shelfgrid'); if (g) g.innerHTML = shelfGrid(s, content);
    }
  }

  // UI-only actions. Returns 'full' (re-render), 'partial' (patch only) or false.
  function handleUi(action) {
    switch (action.type) {
      case 'UI_ORDER_ADD': if (!ui.order.includes(action.value)) ui.order.push(action.value); return 'full';
      case 'UI_ORDER_CLEAR': ui.order = []; return 'full';
      case 'UI_ORDER_MOVE': { const { from, to } = action.value; if (from !== to && ui.order[from] !== undefined && ui.order[to] !== undefined) { const [x] = ui.order.splice(from, 1); ui.order.splice(to, 0, x); } return 'full'; }
      case 'UI_RESET_ASK': ui.confirmReset = true; return 'full';
      case 'UI_RESET_CANCEL': ui.confirmReset = false; return 'full';
      case 'UI_STAGE': ui.stage = action.value; return 'full';
      case 'UI_MUST': ui.must = action.value; return 'full';
      case 'UI_SEARCH': ui.search = String(action.value || ''); return 'partial';
      case 'UI_MILESTONE_CLOSE': ui.milestone = false; return 'full';
      case 'UI_OPEN_SECTION': ui.openSection = ui.openSection === action.value ? '__none__' : action.value; ui.scrollTo = action.value; return 'full';
      case 'UI_PICKER': ui.picker = !ui.picker; return 'full';
      case 'UI_JUMP_SECTION': ui.openSection = action.value; ui.picker = false; ui.scrollTo = action.value; return 'full';
      case 'UI_JUMP': { const sec = FI.content.sectionOf(action.value); if (!sec) return false; ui.openSection = sec.id; ui.picker = false; ui.scrollTo = sec.id; return 'path'; }
      default: return false;
    }
  }

  function mount(root, dispatch) {
    root.addEventListener('click', (e) => {
      const b = e.target.closest('[data-action]');
      if (!b || b.disabled) return;
      dispatch(JSON.parse(b.getAttribute('data-action')));
    });
    // Drag a placed Order chip onto another to reorder (pointer enhancement over tap-to-place).
    let dragFrom = null;
    root.addEventListener('dragstart', (e) => { const el = e.target.closest('[data-slot]'); if (!el) return; dragFrom = +el.dataset.slot; e.dataTransfer.effectAllowed = 'move'; });
    root.addEventListener('dragover', (e) => { if (dragFrom !== null && e.target.closest('[data-slot]')) e.preventDefault(); });
    root.addEventListener('drop', (e) => { const el = e.target.closest('[data-slot]'); if (dragFrom === null || !el) return; e.preventDefault(); dispatch({ type: 'UI_ORDER_MOVE', value: { from: dragFrom, to: +el.dataset.slot } }); dragFrom = null; });
    let journalTimer = null;
    root.addEventListener('input', (e) => {
      const el = e.target;
      if (el.matches('[data-slider]')) dispatch({ type: 'SET_SLIDER', value: { key: el.getAttribute('data-slider'), value: el.value }, silent: true });
      else if (el.matches('[data-search]')) dispatch({ type: 'UI_SEARCH', value: el.value });
      else if (el.matches('[data-journal]')) {
        clearTimeout(journalTimer);
        const text = el.value;
        journalTimer = setTimeout(() => {
          const d = new Date(); d.setMonth(d.getMonth() + 6);
          dispatch({ type: 'SET_JOURNAL', value: { text, reviewDate: d.toISOString().slice(0, 10) }, silent: true });
        }, 400);
      }
    });
  }

  return { mount, render, patch, handleUi, faHtml };
})();
</script>

<script data-module="fx">
// ---------------------------------------------------------------------------
// fx: Web Audio for the events the engine reports. Lazy AudioContext, created
// on the first user gesture. Respects state.muted. Animation is CSS only.
// ---------------------------------------------------------------------------
FI.fx = (() => {
  let ctx = null;
  const ac = () => {
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (e) { return null; }
  };
  const tone = (freq, start, dur, type = 'sine', gain = 0.08) => {
    const c = ac(); if (!c) return;
    const o = c.createOscillator(); const g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, c.currentTime + start);
    g.gain.exponentialRampToValueAtTime(gain, c.currentTime + start + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
    o.connect(g).connect(c.destination);
    o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + 0.02);
  };
  const SOUNDS = {
    correct: () => { tone(523.25, 0, 0.12); tone(659.25, 0.09, 0.16); },
    wrong: () => { tone(160, 0, 0.18, 'triangle', 0.06); },
    lit: () => { tone(523.25, 0, 0.12); tone(659.25, 0.1, 0.12); tone(783.99, 0.2, 0.12); tone(1046.5, 0.3, 0.3); },
    'fare-failed': () => { tone(220, 0, 0.14, 'triangle', 0.05); tone(180, 0.14, 0.2, 'triangle', 0.05); },
  };
  function run(events, state) {
    if (state.muted || !events || !events.length) return;
    if (events.includes('lit')) return SOUNDS.lit();
    if (events.includes('fare-failed')) return SOUNDS['fare-failed']();
    if (events.includes('correct')) return SOUNDS.correct();
    if (events.includes('wrong')) return SOUNDS.wrong();
  }
  return { run };
})();
</script>

<script data-module="app">
// glue: dispatch = reduce, save, render (or patch), fx (ADR-0008)
(() => {
  const { content, engine, store, render, fx } = FI;
  let storage = null;
  try { storage = window.localStorage; } catch (e) { storage = null; }
  const root = document.getElementById('app');
  let state = engine.reduce(engine.initial(), { type: 'HYDRATE', value: store.load(storage) }, content);
  store.save(storage, state); // writes back a migrated document (ADR-0009)
  function dispatch(action) {
    const uiResult = render.handleUi(action);
    if (uiResult === 'full') { render.render(root, state, content); return; }
    if (uiResult === 'partial') { render.patch(root, state, content, action); return; }
    if (uiResult === 'path') { state = engine.reduce(state, { type: 'BACK_TO_PATH' }, content); store.save(storage, state); render.render(root, state, content); return; }
    state = engine.reduce(state, action, content);
    if (action.type === 'RESET') store.clear(storage); else store.save(storage, state);
    if (action.silent) render.patch(root, state, content, action); else render.render(root, state, content);
    fx.run(state.events, state);
  }
  render.mount(root, dispatch);
  render.render(root, state, content);
})();
</script>
