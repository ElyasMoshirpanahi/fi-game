<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FI Roadmap</title>
<meta name="description" content="A dual-language (Farsi and English) learning game built from a roadmap to financial independence. Educational, not investment advice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f6f8; --card: #ffffff; --text: #1f2937; --muted: #6b7280; --border: #e5e7eb; --line: #d9dee5;
  --accent: #0f766e; --accent-strong: #0b5d57; --accent-soft: #e6f4f1;
  --gold: #d97706; --gold-soft: #fff4e0; --gold-strong: #b45309;
  --ok: #15803d; --ok-soft: #e7f7ec; --bad: #b91c1c; --bad-soft: #fdecec;
  --shadow: 0 10px 30px rgba(17, 24, 39, .08); --radius: 18px;
  --fa-font: Vazirmatn, Tahoma, sans-serif; --en-font: Inter, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1419; --card: #171d25; --text: #e5e7eb; --muted: #9aa3af; --border: #2a3340; --line: #2f3946;
    --accent: #2dd4bf; --accent-strong: #5eead4; --accent-soft: #10302d;
    --gold: #f59e0b; --gold-soft: #3a2a0d; --gold-strong: #fbbf24;
    --ok: #4ade80; --ok-soft: #10301c; --bad: #f87171; --bad-soft: #3a1414;
    --shadow: 0 10px 30px rgba(0, 0, 0, .4);
  }
}
* { box-sizing: border-box; }
html { height: 100%; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--en-font); line-height: 1.5; -webkit-font-smoothing: antialiased; }
html[lang="fa"] body { font-family: var(--fa-font); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 12px; }
#app { width: min(480px, 100%); margin: 0 auto; padding-bottom: 90px; }
.t-fa { font-family: var(--fa-font); direction: rtl; unicode-bidi: isolate; display: block; }
.t-en { font-family: var(--en-font); direction: ltr; unicode-bidi: isolate; display: block; }
.under { color: var(--muted); font-size: .92em; margin-top: 6px; }
bdi { unicode-bidi: isolate; }
bdi.nw { white-space: nowrap; }

/* top bar */
.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.modes { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--card); }
.modes button { border: 0; background: transparent; padding: 5px 10px; border-radius: 999px; font-weight: 700; font-size: 13px; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.xpbar { flex: 1; height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; }
.xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-strong)); border-radius: 999px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
html[dir="rtl"] .xpbar i { margin-inline-start: auto; }
.coins { display: inline-flex; align-items: center; gap: 5px; font-weight: 800; font-size: 14px; color: var(--gold-strong); background: var(--gold-soft); border-radius: 999px; padding: 4px 10px; }
.coins svg { width: 14px; height: 14px; }
.coins { position: relative; }
.coins.bump .n { animation: bump .5s cubic-bezier(.2,1.6,.4,1); display: inline-block; }
.coins .plus { position: absolute; inset-inline-end: 4px; top: -4px; font-size: 12px; animation: floatup .9s ease-out forwards; pointer-events: none; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }
@keyframes floatup { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-18px); opacity: 0; } }
.icon { border: 1px solid var(--line); background: var(--card); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
.icon svg { width: 18px; height: 18px; }

/* path */
.path { padding: 22px 14px 70px; }
.path h1 { font-size: 24px; margin: 0; letter-spacing: -.01em; }
.path .sub { margin: 4px 0 26px; color: var(--muted); font-size: 14px; }
.nodes { list-style: none; margin: 0; padding: 0; position: relative; }
.nodes::before { content: ""; position: absolute; left: 50%; top: 40px; bottom: 40px; width: 4px; margin-left: -2px; background: repeating-linear-gradient(to bottom, var(--line) 0 10px, transparent 10px 20px); border-radius: 2px; }
.node { position: relative; display: flex; flex-direction: column; align-items: center; margin: 0 0 30px; width: 150px; }
.node:nth-child(odd) { margin-inline-start: 8%; }
.node:nth-child(even) { margin-inline-start: auto; margin-inline-end: 8%; }
.node > .ubtn { position: relative; width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--card); box-shadow: 0 7px 0 var(--line), var(--shadow); display: grid; place-items: center; transition: transform .15s, box-shadow .15s; }
.node > .ubtn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--line); }
@property --p { syntax: '<number>'; inherits: true; initial-value: 0; }
.node .ring { position: absolute; inset: -9px; border-radius: 50%; animation: ringin .8s cubic-bezier(.2,.8,.2,1) both; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px)); mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px)); transition: background .5s; }
.node .ico { width: 36px; height: 36px; color: var(--accent); }
.node.lit > .ubtn { background: var(--gold); box-shadow: 0 7px 0 var(--gold-strong), var(--shadow); }
.node.lit .ico { color: #fff; }
.node.lit .ring { background: conic-gradient(var(--gold) 100%, var(--gold) 0); }
.node.dim > .ubtn { background: var(--bg); box-shadow: 0 7px 0 var(--line); }
.node.dim .ico { color: var(--muted); opacity: .6; }
.node.dim .ring { background: var(--line); }
.node.cur > .ubtn { animation: pulse 1.8s ease-in-out infinite; }
@keyframes ringin { from { --p: 0; } }
@keyframes pulse { 0%, 100% { box-shadow: 0 7px 0 var(--line), 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 60% { box-shadow: 0 7px 0 var(--line), 0 0 0 16px transparent; } }
.node .label { margin-top: 14px; font-weight: 700; font-size: 14px; text-align: center; }
.node .label .under { font-size: 12px; }
.node .badge { position: absolute; top: -6px; inset-inline-end: 10px; background: var(--card); color: var(--gold-strong); border: 2px solid var(--gold); border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 800; white-space: nowrap; }
.node .planned { margin-top: 4px; font-size: 11px; color: var(--muted); }
.pathfoot { margin-top: 10px; display: flex; justify-content: center; }
.pathbar { display: flex; gap: 8px; flex-wrap: wrap; margin: -14px 0 14px; }
.linkish { border: 0; background: transparent; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 6px; }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; background: var(--bad-soft); color: var(--bad); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.confirm button { border: 1px solid currentColor; background: transparent; border-radius: 999px; padding: 5px 12px; font-weight: 700; color: inherit; }

/* station */
.station { padding: 14px 16px 24px; }
.shead { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.prog { flex: 1; height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
html[dir="rtl"] .prog i { margin-inline-start: auto; }
.count { font-size: 13px; color: var(--muted); font-weight: 700; min-width: 40px; text-align: end; }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 20px; box-shadow: var(--shadow); transition: transform .2s, box-shadow .2s; }
@media (hover: hover) { .panel.card:hover { transform: translateY(-2px); } }
.kicker { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }
.kicker.fare { color: var(--gold-strong); }
.stagechip { margin-inline-start: 10px; text-transform: none; letter-spacing: 0; font-size: 11px; padding: 2px 9px; vertical-align: middle; }
.panel.callout { border-inline-start: 5px solid var(--accent); background: var(--accent-soft); }
.slot[draggable] { cursor: grab; }
.markbtn { float: inline-end; border: 1px solid var(--line); background: var(--card); width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); margin-top: -6px; }
.markbtn svg { width: 16px; height: 16px; }
.markbtn.on { color: var(--gold-strong); border-color: var(--gold); background: var(--gold-soft); }
.footbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; color: var(--text); }
.footbtn svg { width: 14px; height: 14px; color: var(--gold-strong); }
.footbtn b { background: var(--gold-soft); color: var(--gold-strong); border-radius: 999px; padding: 0 7px; }
.backup { margin-top: 18px; } .backup .brow { justify-content: center; gap: 8px; }
.restore { margin-top: 10px; display: grid; gap: 8px; } .restore textarea, .restore input { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 10px; }
.help.warn { color: var(--gold-strong); text-align: center; } .help.ok { color: var(--ok); text-align: center; }
.footbtn.hot { border-color: var(--accent); } .footbtn.hot b { background: var(--accent); color: #fff; }
.marks { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.mark { border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; background: var(--bg); }
.mark .kicker { margin-bottom: 6px; }
.ctext.small { font-size: 16px; font-weight: 500; margin-bottom: 10px; }
.mark .brow { justify-content: flex-end; }
.ctext { font-size: 20px; font-weight: 600; line-height: 1.5; margin: 0; }
.ctext .t-fa { font-size: 20px; }
.ctext .under { font-size: 17px; font-weight: 400; }
.prompt { font-size: 19px; font-weight: 700; margin: 0 0 16px; line-height: 1.45; }
.addnote { margin: 14px 0 0; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.addnote a { color: var(--accent); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.actions .wide { grid-column: 1 / -1; }
.btn { border: 2px solid var(--line); border-bottom-width: 5px; background: var(--card); border-radius: 14px; padding: 13px 14px; font-weight: 700; font-size: 16px; text-align: center; transition: transform .08s, border-color .15s, background .15s; }
.btn:active { transform: translateY(3px); border-bottom-width: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent-strong); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.soft { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 25%, transparent); color: var(--accent-strong); }
.btn.soft[aria-pressed="true"] { border-color: var(--accent); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.opts { display: grid; gap: 10px; margin-top: 6px; }
.opt { text-align: start; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrongpick { border-color: var(--bad); background: var(--bad-soft); }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.slots { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; padding: 8px; border: 2px dashed var(--line); border-radius: 12px; margin-bottom: 12px; }
.slot { background: var(--accent-soft); color: var(--accent-strong); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.slot b { opacity: .7; }
.help { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
.hint { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--gold-soft); border-inline-start: 4px solid var(--gold); font-size: 15px; }
.hint .kicker { color: var(--gold-strong); margin-bottom: 6px; }
.feedback { scroll-margin-bottom: 84px; margin-top: 14px; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 800; animation: rise .25s ease-out; }
.feedback.ok { background: var(--ok-soft); color: var(--ok); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.feedback .btn { flex: 0 0 auto; padding: 10px 18px; }
.feedback.ok .btn { background: var(--ok); border-color: color-mix(in srgb, var(--ok) 70%, #000); color: #fff; }
.feedback.bad .btn { background: var(--bad); border-color: color-mix(in srgb, var(--bad) 70%, #000); color: #fff; }
.feedback .msg { display: flex; flex-direction: column; gap: 2px; }
.feedback .msg small { font-weight: 600; opacity: .85; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.result { text-align: center; padding: 34px 20px; }
.result .big { width: 120px; height: 120px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center; background: var(--gold-soft); color: var(--gold-strong); box-shadow: 0 8px 0 var(--gold); animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
.result .big svg { width: 56px; height: 56px; }
.result.fail .big { background: var(--bad-soft); color: var(--bad); box-shadow: 0 8px 0 var(--bad); }
.result h2 { margin: 0 0 6px; font-size: 22px; }
.result p { margin: 0 0 20px; color: var(--muted); }
.inl .t-en, .inl .t-fa { display: inline; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }

/* disclaimer, always visible */
.disc { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; text-align: center; font-size: 12px; padding: 8px 12px; background: var(--gold-soft); color: var(--gold-strong); border-top: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); }
.disc .t-fa, .disc .t-en { display: inline; }
.disc .sep { margin: 0 8px; opacity: .5; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
/* ---- Prompt 3: themes per Station ---- */
[data-theme="blue"] { --accent: #2563eb; --accent-strong: #1d4ed8; --accent-soft: #e6eefc; }
[data-theme="red"] { --accent: #dc2626; --accent-strong: #b91c1c; --accent-soft: #fde8e8; }
[data-theme="green"] { --accent: #16a34a; --accent-strong: #15803d; --accent-soft: #e6f6ec; }
[data-theme="amber"] { --accent: #d97706; --accent-strong: #b45309; --accent-soft: #fff1dc; }
[data-theme="purple"] { --accent: #7c3aed; --accent-strong: #6d28d9; --accent-soft: #efe8fd; }
[data-theme="book"] { --accent: #0f766e; --accent-strong: #0b5d57; --accent-soft: #e6f4f1; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) [data-theme="blue"] { --accent: #60a5fa; --accent-strong: #93c5fd; --accent-soft: #0f2340; }
  :root:not([data-theme="light"]) [data-theme="red"] { --accent: #f87171; --accent-strong: #fca5a5; --accent-soft: #3a1414; }
  :root:not([data-theme="light"]) [data-theme="green"] { --accent: #4ade80; --accent-strong: #86efac; --accent-soft: #10301c; }
  :root:not([data-theme="light"]) [data-theme="amber"] { --accent: #fbbf24; --accent-strong: #fcd34d; --accent-soft: #3a2a0d; }
  :root:not([data-theme="light"]) [data-theme="purple"] { --accent: #a78bfa; --accent-strong: #c4b5fd; --accent-soft: #26183f; }
  :root:not([data-theme="light"]) [data-theme="book"] { --accent: #2dd4bf; --accent-strong: #5eead4; --accent-soft: #10302d; }
}
/* ---- Path extras ---- */
.sections { display: grid; gap: 10px; }
.sec { border: 1px solid var(--border); border-radius: 16px; background: var(--card); overflow: hidden; }
.sec.open { background: transparent; }
.sechead { display: flex; align-items: center; gap: 12px; width: 100%; text-align: start; border: 0; background: var(--card); padding: 12px 14px; cursor: pointer; color: var(--text); }
.sechead .n { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; background: var(--line); display: grid; place-items: center; font-weight: 800; font-size: 12px; }
.sec.book .sechead .n { background: var(--accent-soft); color: var(--accent-strong); }
.sechead .st { flex: 1; min-width: 0; } .sechead .st b { display: block; font-size: 15px; line-height: 1.3; } .sechead .st > span { display: block; font-size: 12px; color: var(--muted); }
.sechead .prog { flex: 0 0 auto; font-size: 12px; font-weight: 800; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.sechead .prog .tick { width: 16px; height: 16px; border-radius: 50%; background: var(--gold); color: #fff; display: grid; place-items: center; } .sechead .prog .tick svg { width: 10px; height: 10px; }
.picker svg { width: 14px; height: 14px; vertical-align: -2px; margin-inline-start: 4px; } .sechead .prog.done { color: var(--gold-strong); }
.sec.open .sechead { border-bottom: 1px solid var(--border); }
.sechead.banner { align-items: flex-start; background: linear-gradient(135deg, var(--accent-soft), var(--card)); }
.sechead.banner .cover { flex: 0 0 auto; width: 44px; height: 60px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 20px; }
.sechead.banner .st b { font-size: 17px; } .sechead.banner .why { margin-top: 4px; font-size: 13px; color: var(--text); }
.sechead.banner .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.sechead .badge { position: static; }
.sec .nodes { padding: 16px 0 10px; }
.node .unum { font-size: 26px; font-weight: 800; color: var(--accent); }
.node.lit .unum { color: #fff; }
.picker { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); z-index: 11; border: 0; background: var(--text); color: var(--bg); border-radius: 999px; padding: 10px 18px; font-weight: 800; font-size: 14px; box-shadow: var(--shadow); }
.sheet { position: fixed; inset: auto 0 0 0; z-index: 12; background: var(--card); border-radius: 20px 20px 0 0; padding: 16px 16px 60px; max-height: 70vh; overflow: auto; box-shadow: 0 -10px 30px rgba(0,0,0,.35); width: min(480px, 100%); margin: 0 auto; }
.sheet h3 { margin: 0 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.sheet .row { display: flex; gap: 10px; align-items: center; width: 100%; text-align: start; padding: 10px 4px; border: 0; border-bottom: 1px solid var(--border); background: transparent; color: var(--text); }
.sheet .row.on { color: var(--accent-strong); }
.sheet .row .n { width: 26px; height: 26px; border-radius: 50%; background: var(--line); display: grid; place-items: center; font-size: 11px; font-weight: 800; flex: 0 0 auto; }
.sheet .row .t { flex: 1; font-weight: 600; font-size: 14px; } .sheet .row .p { font-size: 12px; color: var(--muted); font-weight: 700; }
.node .tools { margin-top: 8px; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; color: var(--muted); }
.node .tools svg { width: 13px; height: 13px; }
.milestone-chip { margin: 10px 0 0; display: flex; gap: 10px; align-items: center; background: var(--gold-soft); color: var(--gold-strong); border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: 14px; }
.milestone-chip svg { width: 18px; height: 18px; flex: 0 0 auto; }
/* ---- Tools screen ---- */
.ttitle { margin: 0; font-size: 20px; flex: 1; }
.tools .panel { margin-bottom: 14px; }
.widget { margin-top: 6px; }
.srow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; margin: 12px 0 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
.srow output { font-weight: 800; color: var(--text); }
.srow input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.sliders .out { margin: 6px 0 14px; } .sliders .out b { display: block; font-size: 28px; letter-spacing: -.01em; } .sliders .out small { color: var(--muted); font-weight: 600; }
.habitgrid { width: 100%; border-collapse: collapse; table-layout: fixed; }
.habitgrid th { font-size: 11px; color: var(--muted); font-weight: 700; padding: 4px 2px; text-align: start; }
.habitgrid th[scope="row"] { width: 34%; font-size: 12px; }
.habitgrid td { padding: 3px 2px; text-align: center; }
.cell { width: 100%; aspect-ratio: 1; max-width: 36px; border-radius: 9px; border: 2px solid var(--line); background: var(--card); display: inline-grid; place-items: center; padding: 0; }
.cell svg { width: 16px; height: 16px; color: #fff; }
.cell.on { background: var(--accent); border-color: var(--accent); }
.journal textarea { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 12px; resize: vertical; min-height: 120px; }
.journal textarea:focus { outline: none; border-color: var(--accent); }
.prog.big { height: 14px; margin-bottom: 4px; }
.clist h3 { font-size: 15px; margin: 14px 0 8px; }

<script data-module="engine">
// ---------------------------------------------------------------------------
// engine: the whole loop behind two calls, initial() and reduce(). Pure.
// No DOM, no Date, no Math.random. Content is a parameter. state.events lists
// what happened in this reduce only; render and fx read it (ADR-0008).
// Lifted from the logic prototype (docs/prototypes/logic-engine-verdict.md).
// Prompt 3: widgets, tools screen, per-Station XP, Library rule, Milestone.
// ---------------------------------------------------------------------------
FI.engine = (() => {
  const MODES = ['EN', 'FA', 'BOTH'];
  const SHELF_STATES = ['toread', 'reading', 'read'];
  const LEGACY_BOOK = /^b\d\d(u\d)?$/; // v1 named whole books, v2 named Units; v3 names Lessons (b01c1l1) (ADR-0010)
  // The one list of what survives a reload. store reads it; HYDRATE iterates it (ADR-0003).
  const DURABLE = ['mode', 'muted', 'coins', 'awarded', 'rings', 'lit', 'farePassed', 'xp', 'run', 'checklists', 'journal', 'habits', 'habitsWeek', 'shelf', 'sliders', 'milestone', 'bookmarks', 'deck', 'reviewed', 'lastBackup'];

  const initial = () => ({
    mode: 'EN', muted: false,
    screen: 'path', stationId: null, phase: null,
    queue: [], current: null, flipped: false, misses: 0, hint: false,
    returns: [], fare: null, fareAttempt: 0, run: null,
    coins: 0, awarded: {}, rings: {}, lit: {}, farePassed: {}, xp: 0,
    sliders: { capital: 40000, ret: 5, expenses: 30000 },
    habits: {}, habitsWeek: '', journal: { text: '', reviewDate: '' },
    checklists: { before: [false, false, false], after: [false, false, false] },
    shelf: {}, milestone: false, bookmarks: [], deck: {}, reviewed: null, lastBackup: null,
    today: 0, review: null, // today is a day number sent by the app (TICK); the engine never reads the clock
    events: [],
  });

  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const checksOf = (content, stationId) => content.station(stationId).items.filter((i) => i.kind === 'check');
  const queueReturn = (s, cardId) => { if (!s.returns.includes(cardId)) s.returns.push(cardId); };

  // ---- Review Deck (spec 1): missed and bookmarked Cards come back on a fixed ladder of days.
  const LADDER = [1, 3, 7, 16, 35];
  const SESSION_CAP = 20;
  const dueIds = (s) => Object.keys(s.deck).filter((id) => s.deck[id].due <= s.today).sort((a, b) => s.deck[a].due - s.deck[b].due || a.localeCompare(b));
  // The cap is per day, not per visit: reopening Review never serves more than the day's share.
  const leftToday = (s) => Math.max(0, SESSION_CAP - (s.reviewed && s.reviewed.day === s.today ? s.reviewed.n : 0));
  const dueCount = (s) => Math.min(dueIds(s).length, leftToday(s));
  // Refresh a Deck entry from loaded content, so a corrected text or translation reaches Review.
  // `checkId` names the Check the player missed; without it the entry keeps its Check, or takes the Card's first.
  function refresh(s, content, cardId, checkId) {
    const entry = s.deck[cardId];
    const st = entry && content.station(entry.stationId);
    if (!st || !st.items) return;
    const card = st.items.find((i) => i.id === cardId && i.kind === 'card');
    if (!card) return;
    const own = st.items.filter((i) => i.kind === 'check' && i.source === cardId);
    const want = checkId || (entry.check && entry.check.id);
    const check = own.find((i) => i.id === want) || own[0];
    entry.text = card.text;
    entry.check = check ? { id: check.id, type: check.type, prompt: check.prompt, options: check.options || null, answer: check.answer } : null;
  }
  const newEntry = (s, stationId, cardId, text) => ({ stationId, cardId, text, check: null, box: 0, due: s.today + LADDER[0], missed: false, marked: false });
  function enqueue(s, content, stationId, cardId, reason, checkId) {
    const card = content.item(stationId, cardId);
    if (!card || card.kind !== 'card') return;
    if (!s.deck[cardId]) s.deck[cardId] = newEntry(s, stationId, cardId, card.text);
    refresh(s, content, cardId, checkId);
    const entry = s.deck[cardId];
    // A miss restarts the ladder. A Card already due stays due: a miss must not push it out of today's Review.
    if (reason === 'missed') { entry.missed = true; entry.box = 0; if (entry.due > s.today) entry.due = s.today + LADDER[0]; } else entry.marked = true;
  }
  // Every bookmark belongs in the Deck, including bookmarks saved before Review existed.
  function backfill(s, content) {
    for (const mark of s.bookmarks) {
      if (!s.deck[mark.cardId]) s.deck[mark.cardId] = newEntry(s, mark.stationId, mark.cardId, mark.text);
      s.deck[mark.cardId].marked = true;
      refresh(s, content, mark.cardId);
    }
  }

  function settle(s, cardId, ok) {
    const entry = s.deck[cardId];
    if (!entry) return;
    s.reviewed = { day: s.today, n: (s.reviewed && s.reviewed.day === s.today ? s.reviewed.n : 0) + 1 };
    if (ok) {
      // One Coin per Card and ladder step, ever: leaving and rejoining the Deck cannot farm Coins.
      const paid = `review:${cardId}:${entry.box}`;
      if (!s.awarded[paid]) { s.awarded[paid] = true; s.coins += 1; s.events.push('coin'); }
      s.events.push('correct');
      entry.box += 1;
      if (entry.box >= LADDER.length) { delete s.deck[cardId]; s.review.retired = true; } else { entry.due = s.today + LADDER[entry.box]; s.review.nextIn = LADDER[entry.box]; }
    } else { entry.box = 0; entry.due = s.today + LADDER[0]; s.events.push('wrong'); }
    s.review.phase = 'result'; s.review.ok = ok;
  }
  const indexIn = (content, stationId, id) => content.station(stationId).items.findIndex((i) => i.id === id);

  function advance(s, content) {
    if (s.queue.length) {
      const id = s.queue.shift();
      const it = content.item(s.stationId, id);
      s.current = id; s.flipped = false; s.misses = 0; s.hint = false;
      s.phase = it.kind === 'check' ? 'check' : it.kind === 'widget' ? 'widget' : 'card';
      // Resume position: index of this item in the Station's own order, only during the first pass.
      if (s.run && !s.run.returning) s.run.pos = indexIn(content, s.stationId, id);
      return s;
    }
    if (s.returns.length) {
      const cards = s.returns.slice();
      s.returns = [];
      if (s.run) { s.run.returning = true; s.run.pos = content.station(s.stationId).items.length; }
      const checks = checksOf(content, s.stationId);
      s.queue = cards.flatMap((c) => [c, ...checks.filter((k) => k.source === c).map((k) => k.id)]);
      s.events.push('return');
      return advance(s, content);
    }
    return startFare(s, content);
  }

  function startFare(s, content) {
    const pool = checksOf(content, s.stationId).map((k) => k.id);
    const n = Math.min(content.station(s.stationId).fareSize, pool.length);
    // Deterministic rotation: by n when the pool is bigger than the Fare, by 1 when it is not.
    const start = (s.fareAttempt * (n < pool.length ? n : 1)) % pool.length;
    const questions = Array.from({ length: n }, (_, i) => pool[(start + i) % pool.length]);
    s.fareAttempt += 1;
    if (s.run) s.run.pos = content.station(s.stationId).items.length;
    s.fare = { questions, index: 0, missed: [], attempt: s.fareAttempt };
    s.current = questions[0]; s.phase = 'fare'; s.misses = 0; s.hint = false; s.flipped = false;
    s.events.push('fare');
    return s;
  }

  // Legacy book progress (v1 whole-book keys, v2 Unit keys) is dropped; Basics, coins, checklists,
  // journal, habits, shelf and Basics bookmarks stay; XP is recomputed (decision 33, ADR-0010).
  function migrateLegacy(s, content) {
    const legacy = ['lit', 'farePassed', 'rings'].some((key) => Object.keys(s[key] || {}).some((k) => LEGACY_BOOK.test(k)))
      || (s.bookmarks || []).some((b) => LEGACY_BOOK.test(b.stationId)) || !!(s.run && LEGACY_BOOK.test(s.run.stationId));
    // LEGACY_BOOK detects a v1 or v2 document; isBookKey then clears every book key in it (a legacy document holds no v3 keys).
    if (!legacy) return;
    const isBookKey = (k) => /^(b\d\d|sec-b\d\d)/.test(k);
    for (const key of ['lit', 'farePassed', 'rings', 'awarded']) for (const k of Object.keys(s[key] || {})) if (isBookKey(k)) delete s[key][k];
    s.bookmarks = (s.bookmarks || []).filter((b) => !isBookKey(b.stationId));
    if (s.run && isBookKey(s.run.stationId)) s.run = null;

  }

  function leave(s) {
    s.screen = 'path'; s.stationId = null; s.phase = null; s.current = null;
    s.queue = []; s.returns = []; s.fare = null; s.fareAttempt = 0; s.hint = false; s.misses = 0; s.run = null; s.review = null;
    return s;
  }

  // Lighting rules. The Library lights only when its Fare passed and every Reading Order book is Lit.
  function light(s, content, stationId) {
    const st = content.station(stationId);
    if (s.lit[stationId]) return;
    if (st.litRule === 'readingOrder' && !content.readingOrder.every((b) => s.lit[content.sectionOf(b).id])) return;
