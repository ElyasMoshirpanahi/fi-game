دف سرمایهٔ ۲۵ برابرِ خودت را از شرکت جدا نگه دار تا یک شکست هر دو را نبرد."}},{"kind":"card","id":"b18a2","source":"Chapter 4, Lead Bullets: focus on the road, not the wall","text":{"en":"When a rival ships a better AI tool than yours, do not search for a silver bullet pivot. Horowitz's lead bullets mean a better product and more work on the road in front of you, not on the wall.","fa":"وقتی رقیب ابزار AI بهتری از تو عرضه می‌کند، دنبال pivot گلولهٔ نقره‌ای نگرد. گلوله‌های سربی Horowitz یعنی محصول بهتر و کار بیشتر روی جادهٔ پیش رویت، نه روی دیوار."}},{"kind":"check","id":"b18ak1","type":"tap","source":"b18a2","prompt":{"en":"A rival ships a better tool. What does Horowitz's lead bullets idea tell you to do?","fa":"رقیب ابزار بهتری عرضه کرده. ایدهٔ گلوله‌های سربی Horowitz می‌گوید چه کنی؟"},"options":[{"en":"Search for a silver bullet pivot","fa":"دنبال pivot گلولهٔ نقره‌ای بگرد"},{"en":"A better product and more work on the road","fa":"محصول بهتر و کار بیشتر روی جاده"},{"en":"Cut the price in half","fa":"قیمت را نصف کن"}],"answer":1},{"kind":"card","id":"b18a3","source":"Chapter 5, Take Care of the People, the Products, and the Profits","text":{"en":"As CTO, take care of the people first: train them and hire for strength. A good place to work is what keeps your team when things go wrong, and things will go wrong.","fa":"به‌عنوان CTO اول مراقب آدم‌ها باش: آموزششان بده و برای نقاط قوت استخدام کن. محیط کار خوب همان چیزی است که وقتی اوضاع خراب می‌شود تیمت را نگه می‌دارد، و اوضاع خراب خواهد شد."}},{"kind":"check","id":"b18ak2","type":"tf","source":"b18a3","prompt":{"en":"Horowitz says to hire for lack of weakness rather than for strength.","fa":"Horowitz می‌گوید برای نداشتن ضعف استخدام کن، نه برای نقاط قوت."},"answer":false},{"kind":"card","id":"b18a4","source":"Chapter 6, One-on-One: the employee's meeting","text":{"en":"Run your one-on-ones as the employee's meeting: they set the agenda and do about 90 percent of the talking. Your job is to hear the problems before they become resignations.","fa":"جلسه‌های یک‌به‌یک را به‌عنوان جلسهٔ کارمند اداره کن: او دستور جلسه را تعیین می‌کند و حدود ۹۰ درصد صحبت را او انجام می‌دهد. کار تو شنیدن مشکل‌هاست پیش از آنکه به استعفا برسند."}},{"kind":"check","id":"b18ak3","type":"tap","source":"b18a4","prompt":{"en":"In your one-on-ones, who sets the agenda?","fa":"در جلسه‌های یک‌به‌یک تو، چه کسی دستور جلسه را تعیین می‌کند؟"},"options":[{"en":"The employee","fa":"کارمند"},{"en":"You, the CTO","fa":"تو، CTO"},{"en":"The investors","fa":"سرمایه‌گذاران"}],"answer":0}]]},{"id":"b19","title":"Zero to One","author":{"en":"Peter Thiel with Blake Masters","fa":"Peter Thiel با Blake Masters"},"year":2014,"stage":5,"must":false,"why":{"en":"How to build something with no competitor","fa":"چطور چیزی بسازی که رقیب ندارد"},"badge":{"en":"Competition Is for Losers","fa":"رقابت برای بازنده‌هاست"},"units":[[{"kind":"card","id":"b19c1","source":"Chapter 1, The Challenge of the Future","text":{"en":"Chapter 1, The Challenge of the Future: going from 0 to 1 means creating something new, vertical progress. Going from 1 to n copies what already works, horizontal progress like globalization.","fa":"فصل ۱، The Challenge of the Future: رفتن از ۰ به ۱ یعنی ساختن چیزی نو، پیشرفت عمودی. رفتن از ۱ به n یعنی کپی کردن چیزی که از قبل کار می‌کند، پیشرفت افقی مثل جهانی‌سازی."}},{"kind":"card","id":"b19c2","source":"Preface and Chapter 1: the contrarian question","text":{"en":"The contrarian question: what important truth do very few people agree with you on? Its business version is: what valuable company is nobody building?","fa":"سؤال خلاف‌جریان: کدام حقیقت مهم است که آدم‌های بسیار کمی با تو در آن هم‌نظرند؟ نسخهٔ کسب‌وکاری‌اش این است: کدام شرکت ارزشمند را هیچ‌کس نمی‌سازد؟"}},{"kind":"check","id":"b19k1","type":"tap","source":"b19c1","prompt":{"en":"In Zero to One, what does going from 0 to 1 mean?","fa":"در Zero to One، رفتن از ۰ به ۱ یعنی چه؟"},"options":[{"en":"Creating something new, vertical progress","fa":"ساختن چیزی نو، پیشرفت عمودی"},{"en":"Copying what works into new markets","fa":"کپی کردن چیزی که کار می‌کند در بازارهای جدید"},{"en":"Growing by buying competitors","fa":"رشد از راه خرید رقبا"}],"answer":0},{"kind":"card","id":"b19c3","source":"Chapter 3, All Happy Companies Are Different","text":{"en":"Chapter 3, All Happy Companies Are Different: competition drives profits to zero. Every happy company earns a monopoly by solving a unique problem; failed firms all failed to escape competition.","fa":"فصل ۳، All Happy Companies Are Different: رقابت سود را به صفر می‌رساند. هر شرکت خوشبخت با حل یک مسئلهٔ یکتا به انحصار می‌رسد؛ شرکت‌های شکست‌خورده همه در فرار از رقابت ناکام ماندند."}},{"kind":"check","id":"b19k2","type":"tf","source":"b19c3","prompt":{"en":"Thiel argues competition is the surest path to high profits.","fa":"Thiel استدلال می‌کند رقابت مطمئن‌ترین راه رسیدن به سود بالاست."},"answer":false}],[{"kind":"card","id":"b19c4","source":"Chapter 5, Last Mover Advantage","text":{"en":"Chapter 5, Last Mover Advantage: a monopoly has proprietary technology at least 10x better than the nearest substitute, network effects, economies of scale and branding. Start small and monopolize, then scale.","fa":"فصل ۵، Last Mover Advantage: یک انحصار فناوری اختصاصی دست‌کم ۱۰ برابر بهتر از نزدیک‌ترین جایگزین، اثر شبکه‌ای، صرفهٔ مقیاس و برند دارد. کوچک شروع کن و انحصار بگیر، بعد مقیاس بده."}},{"kind":"check","id":"b19k3","type":"tap","source":"b19c4","prompt":{"en":"How much better should proprietary technology be than its nearest substitute, per Thiel?","fa":"به گفتهٔ Thiel، فناوری اختصاصی باید چقدر از نزدیک‌ترین جایگزین بهتر باشد؟"},"options":[{"en":"At least 10x better","fa":"دست‌کم ۱۰ برابر بهتر"},{"en":"About 2x better","fa":"حدود ۲ برابر بهتر"},{"en":"Equal, but cheaper","fa":"برابر، اما ارزان‌تر"}],"answer":0},{"kind":"card","id":"b19c5","source":"Chapter 7, Follow the Money","text":{"en":"Chapter 7, Follow the Money: venture returns follow a power law. The best single investment in a fund outperforms all the others combined, so only invest in companies that could return the whole fund.","fa":"فصل ۷، Follow the Money: بازده سرمایه‌گذاری خطرپذیر از قانون توان پیروی می‌کند. بهترین سرمایه‌گذاری یک صندوق از مجموع بقیه بیشتر برمی‌گرداند، پس فقط در شرکت‌هایی سرمایه‌گذاری کن که بتوانند کل صندوق را برگردانند."}},{"kind":"card","id":"b19c6","source":"Chapter 11, If You Build It, Will They Come?","text":{"en":"Chapter 11, If You Build It, Will They Come?: no. Superior distribution alone can create a monopoly even without product differentiation, and poor distribution, not a bad product, is the top cause of failure.","fa":"فصل ۱۱، If You Build It, Will They Come?: نه. توزیع برتر به‌تنهایی می‌تواند حتی بدون تمایز محصول انحصار بسازد، و توزیع ضعیف، نه محصول بد، مهم‌ترین علت شکست است."}},{"kind":"check","id":"b19k4","type":"tf","source":"b19c5","prompt":{"en":"Thiel says to invest only in companies that could return the whole fund.","fa":"Thiel می‌گوید فقط در شرکت‌هایی سرمایه‌گذاری کن که بتوانند کل صندوق را برگردانند."},"answer":true}],[{"kind":"card","id":"b19a1","source":"Chapter 1 and the contrarian question: 0 to 1 versus 1 to n","text":{"en":"Before you pick your AI product, write your answer to Thiel's question: what valuable thing is nobody building? If ten tools already do it, you are going from 1 to n, not 0 to 1.","fa":"پیش از انتخاب محصول AI خود، جوابت به سؤال Thiel را بنویس: کدام چیز ارزشمند را هیچ‌کس نمی‌سازد؟ اگر ده ابزار از قبل همان کار را می‌کنند، داری از ۱ به n می‌روی، نه از ۰ به ۱."}},{"kind":"card","id":"b19a2","source":"Chapter 5, Last Mover Advantage: start small and monopolize, 10x better","text":{"en":"Start with a market so small you can own it: one job, one kind of user, and a tool at least 10x better for them than the workaround they use today. Scale only after you own that niche.","fa":"با بازاری آن‌قدر کوچک شروع کن که بتوانی صاحبش شوی: یک کار، یک نوع کاربر، و ابزاری دست‌کم ۱۰ برابر بهتر از راه‌حل موقتی که امروز به کار می‌برند. فقط بعد از تصاحب آن niche مقیاس بده."}},{"kind":"check","id":"b19ak1","type":"tap","source":"b19a2","prompt":{"en":"How does Thiel say to start, applied to your AI product?","fa":"Thiel می‌گوید چطور شروع کنی، وقتی روی محصول AI خودت پیاده می‌کنی؟"},"options":[{"en":"Launch broadly and undercut on price","fa":"گسترده عرضه کن و قیمت را بشکن"},{"en":"Copy the market leader's features","fa":"قابلیت‌های رهبر بازار را کپی کن"},{"en":"Start with a market so small you can own it","fa":"با بازاری آن‌قدر کوچک شروع کن که بتوانی صاحبش شوی"}],"answer":2},{"kind":"card","id":"b19a3","source":"Chapter 11, If You Build It, Will They Come?: distribution","text":{"en":"If you build it, they will not come. Plan how your first 20 paying users hear about the product before you finish the MVP; poor distribution, not a bad product, is the top cause of failure.","fa":"اگر بسازی، نمی‌آیند. پیش از تمام کردن MVP برنامه بریز اولین ۲۰ کاربر پولی چطور از محصول باخبر می‌شوند؛ توزیع ضعیف، نه محصول بد، مهم‌ترین علت شکست است."}},{"kind":"check","id":"b19ak2","type":"tf","source":"b19a3","prompt":{"en":"Thiel says a good product sells itself, so distribution can wait until after launch.","fa":"Thiel می‌گوید محصول خوب خودش فروش می‌رود، پس توزیع می‌تواند تا بعد از عرضه صبر کند."},"answer":false},{"kind":"card","id":"b19a4","source":"Chapter 7, Follow the Money: the power law","text":{"en":"Apply the power law to your 20 percent satellite: one or two bets may return more than all the others, and most will return nothing. Size each bet so losing it does not touch your index core.","fa":"قانون توان را روی ۲۰ درصد satellite خود پیاده کن: یکی‌دو شرط ممکن است بیش از همهٔ بقیه برگردانند و بیشترشان هیچ برنمی‌گردانند. هر شرط را آن‌قدر کوچک بگیر که از دست رفتنش به هستهٔ شاخصی‌ات دست نزند."}},{"kind":"check","id":"b19ak3","type":"tap","source":"b19a4","prompt":{"en":"In your 20 percent satellite, how should you size a bet, following the power law?","fa":"در ۲۰ درصد satellite، طبق قانون توان، اندازهٔ هر شرط را چطور بگیری؟"},"options":[{"en":"So losing it does not touch your index core","fa":"آن‌قدر که از دست رفتنش به هستهٔ شاخصی‌ات دست نزند"},{"en":"Equal to your yearly expenses","fa":"برابر با خرج سالانه‌ات"},{"en":"The same size as the index core","fa":"هم‌اندازهٔ هستهٔ شاخصی"}],"answer":0}]]},{"id":"b20","title":"The Lean Startup","author":{"en":"Eric Ries","fa":"Eric Ries"},"year":2011,"stage":5,"must":false,"why":{"en":"MVP and fast learning","fa":"MVP و یادگیری سریع"},"badge":{"en":"Build-Measure-Learn","fa":"بساز، بسنج، بیاموز"},"units":[[{"kind":"card","id":"b20c1","source":"Chapter 1, Start","text":{"en":"Chapter 1, Start: a startup is a human institution designed to create a new product or service under conditions of extreme uncertainty. Its first job is to learn what customers actually want.","fa":"فصل ۱، Start: استارتاپ نهادی انسانی است که برای ساختن محصول یا خدمتی نو در شرایط عدم‌قطعیت شدید طراحی شده. اولین کارش این است که بفهمد مشتری‌ها واقعاً چه می‌خواهند."}},{"kind":"card","id":"b20c2","source":"Chapter 3, Learn","text":{"en":"Chapter 3, Learn: validated learning is progress proven by real data from real customers, not by shipping features on schedule. Work that doesn't produce such learning is waste.","fa":"فصل ۳، Learn: یادگیری اعتبارسنجی‌شده یعنی پیشرفتی که با دادهٔ واقعی از مشتری واقعی اثبات شود، نه با تحویل به‌موقع قابلیت‌ها. کاری که چنین یادگیری‌ای تولید نکند، اتلاف است."}},{"kind":"check","id":"b20k1","type":"tf","source":"b20c2","prompt":{"en":"In The Lean Startup, shipping features on schedule counts as progress by itself.","fa":"در The Lean Startup، تحویل به‌موقع قابلیت‌ها به‌خودی‌خود پیشرفت محسوب می‌شود."},"answer":false},{"kind":"card","id":"b20c3","source":"Part Two, Steer: the Build-Measure-Learn feedback loop","text":{"en":"Part Two, Steer: the Build-Measure-Learn feedback loop. Build turns ideas into a product, Measure watches how customers respond, Learn decides whether to pivot or persevere; minimize total time through the loop.","fa":"بخش دوم، Steer: حلقهٔ بازخورد Build-Measure-Learn. «بساز» ایده را به محصول تبدیل می‌کند، «بسنج» واکنش مشتری‌ها را می‌بیند، «بیاموز» تصمیم می‌گیرد pivot کنی یا ادامه بدهی؛ زمان کل گذر از حلقه را کمینه کن."}},{"kind":"check","id":"b20k2","type":"order","source":"b20c3","prompt":{"en":"Put the Lean Startup loop in order","fa":"حلقهٔ Lean Startup را مرتب کن"},"options":[{"en":"Measure","fa":"بسنج"},{"en":"Learn","fa":"بیاموز"},{"en":"Build","fa":"بساز"}],"answer":[2,0,1]}],[{"kind":"card","id":"b20c4","source":"Chapter 6, Test: the minimum viable product","text":{"en":"Chapter 6, Test: a minimum viable product (MVP) is the version that starts the Build-Measure-Learn loop with the least effort. Dropbox tested demand with a demo video before building the product.","fa":"فصل ۶، Test: کمینه‌محصول پذیرفتنی (MVP) نسخه‌ای است که حلقهٔ Build-Measure-Learn را با کمترین تلاش راه می‌اندازد. Dropbox پیش از ساختن محصول، تقاضا را با یک ویدئوی دمو آزمود."}},{"kind":"card","id":"b20c5","source":"Chapter 7, Measure: innovation accounting","text":{"en":"Chapter 7, Measure: innovation accounting replaces vanity metrics like total users and page views with actionable metrics from cohort analysis and split tests. Good metrics are actionable, accessible and auditable.","fa":"فصل ۷، Measure: حسابداری نوآوری به‌جای معیارهای پوچ مثل تعداد کل کاربران و بازدید صفحه، معیارهای عمل‌پذیر از تحلیل cohort و آزمون‌های split می‌گذارد. معیار خوب عمل‌پذیر، در دسترس و قابل حسابرسی است."}},{"kind":"check","id":"b20k3","type":"tap","source":"b20c5","prompt":{"en":"Which of these does Ries call a vanity metric?","fa":"Ries کدام‌یک را معیار پوچ می‌نامد؟"},"options":[{"en":"Total users and page views","fa":"تعداد کل کاربران و بازدید صفحه"},{"en":"Cohort conversion rates","fa":"نرخ تبدیل cohort"},{"en":"Split test results","fa":"نتایج آزمون split"}],"answer":0},{"kind":"card","id":"b20c6","source":"Chapter 8, Pivot or Persevere; Chapter 10, Grow","text":{"en":"Chapter 8, Pivot or Persevere: a pivot is a structured course correction designed to test a new fundamental hypothesis. Chapter 10 names three engines of growth: sticky, viral and paid.","fa":"فصل ۸، Pivot or Persevere: pivot یک تغییر مسیر ساختاریافته است برای آزمودن یک فرضیهٔ بنیادی تازه. فصل ۱۰ سه موتور رشد را نام می‌برد: چسبنده، ویروسی و پولی."}},{"kind":"check","id":"b20k4","type":"tap","source":"b20c6","prompt":{"en":"What are the three engines of growth?","fa":"سه موتور رشد کدام‌اند؟"},"options":[{"en":"Sticky, viral and paid","fa":"چسبنده، ویروسی و پولی"},{"en":"Seed, Series A and IPO","fa":"Seed، Series A و IPO"},{"en":"Ads, PR and sales calls","fa":"تبلیغات، روابط عمومی و تماس فروش"}],"answer":0}],[{"kind":"card","id":"b20a1","source":"Chapter 6, Test: the minimum viable product","text":{"en":"Your first AI product is an MVP, not a platform: the smallest version that starts Build-Measure-Learn. Like Dropbox's demo video, a landing page with a price can test demand before you write the model code.","fa":"اولین محصول AI تو یک MVP است، نه یک پلتفرم: کوچک‌ترین نسخه‌ای که Build-Measure-Learn را راه می‌اندازد. مثل ویدئوی دموی Dropbox، یک صفحهٔ فرود با قیمت می‌تواند پیش از نوشتن کد مدل، تقاضا را بسنجد."}},{"kind":"card","id":"b20a2","source":"Chapter 3, Learn: validated learning versus waste","text":{"en":"Count only validated learning as progress: a real person paying real money. Shipping features on schedule feels productive, but without customer data it is waste.","fa":"فقط یادگیری اعتبارسنجی‌شده را پیشرفت حساب کن: یک آدم واقعی که پول واقعی می‌دهد. تحویل به‌موقع قابلیت‌ها حس بهره‌وری می‌دهد، اما بدون دادهٔ مشتری اتلاف است."}},{"kind":"check","id":"b20ak1","type":"tap","source":"b20a1","prompt":{"en":"What makes your first AI product an MVP in Ries's sense?","fa":"چه چیزی اولین محصول AI تو را به معنای Ries یک MVP می‌کند؟"},"options":[{"en":"It is the smallest version that starts Build-Measure-Learn","fa":"کوچک‌ترین نسخه‌ای است که Build-Measure-Learn را راه می‌اندازد"},{"en":"It has every feature a competitor has","fa":"همهٔ قابلیت‌های رقیب را دارد"},{"en":"It stays free until it is polished","fa":"تا صیقل خوردن رایگان می‌ماند"}],"answer":0},{"kind":"card","id":"b20a3","source":"Chapter 7, Measure: innovation accounting, actionable not vanity metrics","text":{"en":"Track actionable metrics, not vanity ones: how many of this week's sign-ups paid, not total visitors. Your €100 goal is itself a cohort metric: paying users times price.","fa":"معیارهای عمل‌پذیر را دنبال کن، نه پوچ را: چند نفر از ثبت‌نام‌های این هفته پول دادند، نه تعداد کل بازدیدکننده‌ها. هدف ۱۰۰ یورویی‌ات خودش یک معیار cohort است: کاربران پولی ضرب در قیمت."}},{"kind":"check","id":"b20ak2","type":"tf","source":"b20a2","prompt":{"en":"Shipping features on schedule counts as validated learning.","fa":"تحویل به‌موقع قابلیت‌ها یادگیری اعتبارسنجی‌شده محسوب می‌شود."},"answer":false},{"kind":"card","id":"b20a4","source":"Chapter 8, Pivot or Persevere: a structured course correction","text":{"en":"Set a date to decide pivot or persevere, and write the decision in your decision journal. A pivot is a structured correction of one hypothesis, not a new idea every weekend.","fa":"برای تصمیم pivot یا ادامه تاریخ بگذار و تصمیم را در دفتر تصمیمت بنویس. pivot تصحیح ساختاریافتهٔ یک فرضیه است، نه یک ایدهٔ تازه در هر آخر هفته."}},{"kind":"check","id":"b20ak3","type":"tap","source":"b20a3","prompt":{"en":"Which number is an actionable metric for your €100 goal?","fa":"کدام عدد برای هدف ۱۰۰ یورویی‌ات معیار عمل‌پذیر است؟"},"options":[{"en":"Total visitors this month","fa":"تعداد کل بازدیدکننده‌های این ماه"},{"en":"How many of this week's sign-ups paid","fa":"چند نفر از ثبت‌نام‌های این هفته پول دادند"},{"en":"Followers on social media","fa":"دنبال‌کننده‌ها در شبکه‌های اجتماعی"}],"answer":1}]]},{"id":"b21","title":"Angel","author":{"en":"Jason Calacanis","fa":"Jason Calacanis"},"year":2017,"stage":5,"must":false,"why":{"en":"A practical guide to angel investing","fa":"راهنمای عملی angel investing"},"badge":{"en":"Bet on the Founder","fa":"روی بنیان‌گذار شرط ببند"},"units":[[{"kind":"card","id":"b21c1","source":"Angel, on portfolio size and the power law","text":{"en":"Angel investing means writing checks you can afford to lose: most startups you back will fail, and one or two big winners must pay for all the rest. Calacanis says to diversify across at least 30 startups.","fa":"سرمایه‌گذاری فرشته یعنی چک‌هایی بنویسی که از دست رفتنشان را تاب بیاوری: بیشتر استارتاپ‌هایی که پشتشان می‌ایستی شکست می‌خورند و یکی‌دو برندهٔ بزرگ باید هزینهٔ بقیه را بدهند. Calacanis می‌گوید روی دست‌کم ۳۰ استارتاپ پخش کن."}},{"kind":"check","id":"b21k1","type":"tap","source":"b21c1","prompt":{"en":"Across how many startups does Calacanis say to diversify?","fa":"Calacanis می‌گوید روی چند استارتاپ پخش کنی؟"},"options":[{"en":"At least 30 startups","fa":"دست‌کم ۳۰ استارتاپ"},{"en":"Three carefully chosen startups","fa":"سه استارتاپ با دقت انتخاب‌شده"},{"en":"Just one you believe in","fa":"فقط یکی که به آن باور داری"}],"answer":0},{"kind":"card","id":"b21c2","source":"Angel, on starting with syndicates","text":{"en":"Start small: join a syndicate on AngelList, put small checks into about ten deals, and only then lead your own deals. You learn the game before the stakes get high.","fa":"کوچک شروع کن: به یک syndicate در AngelList بپیوند، چک‌های کوچک در حدود ده معامله بگذار، و فقط بعد از آن خودت معامله‌ها را رهبری کن. پیش از آنکه ریسک بالا برود، بازی را یاد می‌گیری."}},{"kind":"check","id":"b21k2","type":"order","source":"b21c2","prompt":{"en":"Order Calacanis's path for a new angel","fa":"مسیر Calacanis برای یک فرشتهٔ تازه‌کار را مرتب کن"},"options":[{"en":"Lead your own deals","fa":"خودت معامله‌ها را رهبری کن"},{"en":"Join a syndicate on AngelList","fa":"به یک syndicate در AngelList بپیوند"},{"en":"Put small checks into about ten deals","fa":"چک‌های کوچک در حدود ده معامله بگذار"}],"answer":[1,2,0]}],[{"kind":"card","id":"b21c3","source":"Angel, on founder meetings","text":{"en":"Bet on the founder, not the idea. In the meeting ask: what are you working on, why are you doing this, why now, and what is your unfair advantage?","fa":"روی بنیان‌گذار شرط ببند، نه روی ایده. در جلسه بپرس: روی چه کار می‌کنی، چرا این کار را می‌کنی، چرا حالا، و مزیت ناعادلانه‌ات چیست؟"}},{"kind":"card","id":"b21c4","source":"Angel, on deal memos","text":{"en":"Write a deal memo for every investment: why you invested, what has to go right and what could kill the company. Re-read your memos later to sharpen your judgment.","fa":"برای هر سرمایه‌گذاری یک deal memo بنویس: چرا سرمایه‌گذاری کردی، چه چیزی باید درست پیش برود و چه چیزی می‌تواند شرکت را نابود کند. بعداً یادداشت‌هایت را دوباره بخوان تا قضاوتت تیزتر شود."}},{"kind":"check","id":"b21k3","type":"tf","source":"b21c3","prompt":{"en":"Calacanis says to bet on the idea rather than the founder.","fa":"Calacanis می‌گوید روی ایده شرط ببند، نه روی بنیان‌گذار."},"answer":false},{"kind":"card","id":"b21c5","source":"Angel, on pro rata rights and monthly updates","text":{"en":"Ask for pro rata rights so you can keep your ownership share in later rounds. Insist on monthly updates; a founder who stops sending them is a red flag.","fa":"حق pro rata بخواه تا بتوانی سهم مالکیتت را در دورهای بعدی حفظ کنی. روی گزارش ماهانه پافشاری کن؛ بنیان‌گذاری که فرستادنش را قطع می‌کند، زنگ خطر است."}},{"kind":"card","id":"b21c6","source":"Angel, on being useful to founders","text":{"en":"Give founders value beyond money: introductions, help with hiring and honest feedback. Angels who are useful earn the best deal flow.","fa":"به بنیان‌گذاران چیزی فراتر از پول بده: معرفی به آدم‌ها، کمک در استخدام و بازخورد صادقانه. فرشته‌هایی که مفیدند بهترین deal flow را به دست می‌آورند."}},{"kind":"check","id":"b21k4","type":"tap","source":"b21c5","prompt":{"en":"Which right lets an angel keep their ownership share in later rounds?","fa":"کدام حق به فرشته اجازه می‌دهد سهم مالکیتش را در دورهای بعدی حفظ کند؟"},"options":[{"en":"Pro rata rights","fa":"حق pro rata"},{"en":"Liquidation preference","fa":"liquidation preference"},{"en":"A board observer seat","fa":"کرسی ناظر در هیئت‌مدیره"}],"answer":0}],[{"kind":"card","id":"b21a1","source":"Angel, on checks you can afford to lose and the 30-startup spread","text":{"en":"With about €40k of capital, angel checks belong only in the 20 percent satellite, and only money you can afford to lose. Calacanis's 30-startup spread is far beyond that; know this before your first check.","fa":"با حدود ۴۰ هزار یورو سرمایه، چک‌های فرشته فقط در ۲۰ درصد satellite جا دارند، و فقط با پولی که از دست رفتنش را تاب می‌آوری. پخش ۳۰ استارتاپی Calacanis خیلی فراتر از این است؛ پیش از اولین چک این را بدان."}},{"kind":"card","id":"b21a2","source":"Angel, on starting with syndicates","text":{"en":"If you want to learn the angel game, start the way the book describes: a syndicate with small checks, around ten deals, before leading anything. Treat it as tuition, not as your path to 25x.","fa":"اگر می‌خواهی بازی فرشته را یاد بگیری، همان‌طور که کتاب می‌گوید شروع کن: یک syndicate با چک‌های کوچک، حدود ده معامله، پیش از رهبری هر چیزی. آن را شهریه بدان، نه مسیر رسیدن به ۲۵ برابر."}},{"kind":"check","id":"b21ak1","type":"tap","source":"b21a1","prompt":{"en":"Where do angel checks belong in your portfolio, following the book?","fa":"طبق کتاب، چک‌های فرشته در پرتفوی تو کجا جا دارند؟"},"options":[{"en":"In the 80 percent index core","fa":"در هستهٔ ۸۰ درصدی شاخصی"},{"en":"Only in the 20 percent satellite, with money you can afford to lose","fa":"فقط در ۲۰ درصد satellite، با پولی که از دست رفتنش را تاب می‌آوری"},{"en":"In a separate emergency fund","fa":"در یک صندوق اضطراری جداگانه"}],"answer":1},{"kind":"card","id":"b21a3","source":"Angel, on founder meetings: why now, unfair advantage","text":{"en":"When you ask a founder why now and what is your unfair advantage, turn the questions on your own AI product too. If you cannot answer them for yourself, an angel will not either.","fa":"وقتی از بنیان‌گذار می‌پرسی چرا حالا و مزیت ناعادلانه‌ات چیست، همین سؤال‌ها را روی محصول AI خودت هم برگردان. اگر نمی‌توانی برای خودت جوابشان بدهی، فرشته هم نمی‌تواند."}},{"kind":"check","id":"b21ak2","type":"tf","source":"b21a2","prompt":{"en":"Calacanis's path says to lead your own deals first, then join a syndicate.","fa":"مسیر Calacanis می‌گوید اول خودت معامله‌ها را رهبری کن، بعد به syndicate بپیوند."},"answer":false},{"kind":"card","id":"b21a4","source":"Angel, on deal memos","text":{"en":"Write a deal memo before any bet, in the satellite or a startup: why, what must go right, what could kill it. It is the same decision journal your roadmap asks you to re-read six months later.","fa":"پیش از هر شرط، چه در satellite و چه در یک استارتاپ، یک deal memo بنویس: چرا، چه چیزی باید درست پیش برود، چه چیزی می‌تواند نابودش کند. همان دفتر تصمیمی است که نقشهٔ راهت می‌خواهد شش ماه بعد دوباره بخوانی."}},{"kind":"check","id":"b21ak3","type":"tap","source":"b21a4","prompt":{"en":"What goes into a deal memo?","fa":"در deal memo چه می‌نویسی؟"},"options":[{"en":"Why, what must go right, what could kill it","fa":"چرا، چه چیزی باید درست پیش برود، چه چیزی می‌تواند نابودش کند"},{"en":"The founder's salary and office address","fa":"حقوق بنیان‌گذار و نشانی دفتر"},{"en":"A list of competitors' prices","fa":"فهرست قیمت‌های رقبا"}],"answer":0}]]},{"id":"b22","title":"Paul Graham Essays (free)","author":{"en":"Paul Graham","fa":"Paul Graham"},"year":2001,"stage":5,"must":false,"why":{"en":"paulgraham.com; read them all","fa":"paulgraham.com؛ همه را بخوان"},"badge":{"en":"Make Something People Want","fa":"چیزی بساز که مردم بخواهند"},"units":[[{"kind":"card","id":"b22c1","source":"How to Start a Startup (2005)","text":{"en":"How to Start a Startup (2005): you need three things: start with good people, make something customers actually want, and spend as little money as possible. Most failures break one of these.","fa":"How to Start a Startup (۲۰۰۵): سه چیز لازم داری: با آدم‌های خوب شروع کن، چیزی بساز که مشتری‌ها واقعاً بخواهند، و تا جای ممکن کم خرج کن. بیشتر شکست‌ها یکی از این سه را نقض می‌کنند."}},{"kind":"check","id":"b22k1","type":"tap","source":"b22c1","prompt":{"en":"Which three things does Graham say a startup needs?","fa":"به گفتهٔ Graham، استارتاپ به کدام سه چیز نیاز دارد؟"},"options":[{"en":"Good people, something customers want, spending little money","fa":"آدم‌های خوب، چیزی که مشتری‌ها بخواهند، کم خرج کردن"},{"en":"A big idea, a patent and a large office","fa":"یک ایدهٔ بزرگ، یک patent و یک دفتر بزرگ"},{"en":"Venture funding, a CTO and a press launch","fa":"سرمایهٔ خطرپذیر، یک CTO و یک رونمایی مطبوعاتی"}],"answer":0},{"kind":"card","id":"b22c2","source":"How to Get Startup Ideas (2012)","text":{"en":"How to Get Startup Ideas (2012): don't try to think of startup ideas. Look for problems, preferably problems you have yourself; live in the future, then build what's missing.","fa":"How to Get Startup Ideas (۲۰۱۲): سعی نکن به ایدهٔ استارتاپی فکر کنی. دنبال مشکل بگرد، ترجیحاً مشکلی که خودت داری؛ در آینده زندگی کن، بعد چیزی را بساز که کم است."}},{"kind":"check","id":"b22k2","type":"tf","source":"b22c2","prompt":{"en":"Graham recommends sitting down to brainstorm startup ideas.","fa":"Graham توصیه می‌کند بنشینی و برای ایدهٔ استارتاپی طوفان فکری کنی."},"answer":false},{"kind":"card","id":"b22c3","source":"Do Things That Don't Scale (2013)","text":{"en":"Do Things That Don't Scale (2013): recruit your first users manually, one at a time, and delight them. Airbnb's founders went door to door in New York to photograph hosts' listings.","fa":"Do Things That Don't Scale (۲۰۱۳): اولین کاربرانت را دستی و یکی‌یکی جذب کن و شگفت‌زده‌شان کن. بنیان‌گذاران Airbnb در نیویورک خانه‌به‌خانه می‌رفتند تا از آگهی میزبان‌ها عکس بگیرند."}}],[{"kind":"card","id":"b22c4","source":"Maker's Schedule, Manager's Schedule (2009)","text":{"en":"Maker's Schedule, Manager's Schedule (2009): managers slice the day into hour blocks; makers need units of half a day or more. One badly placed meeting can wreck a maker's whole afternoon.","fa":"Maker's Schedule, Manager's Schedule (۲۰۰۹): مدیرها روز را به بلوک‌های یک‌ساعته تقسیم می‌کنند؛ سازنده‌ها به واحدهای نیم‌روزه یا بیشتر نیاز دارند. یک جلسهٔ بدجا می‌تواند کل بعدازظهر یک سازنده را خراب کند."}},{"kind":"check","id":"b22k3","type":"tap","source":"b22c4","prompt":{"en":"Why can one meeting wreck a maker's afternoon?","fa":"چرا یک جلسه می‌تواند بعدازظهر یک سازنده را خراب کند؟"},"options":[{"en":"Makers need units of half a day or more","fa":"سازنده‌ها به واحدهای نیم‌روزه یا بیشتر نیاز دارند"},{"en":"Makers prefer to work only at night","fa":"سازنده‌ها ترجیح می‌دهند فقط شب کار کنند"},{"en":"Meetings cost the company money","fa":"جلسه‌ها برای شرکت هزینه دارند"}],"answer":0},{"kind":"card","id":"b22c5","source":"Default Alive or Default Dead? (2015)","text":{"en":"Default Alive or Default Dead (2015): at current growth and spending, do you reach profitability before the money runs out? Yes means default alive, no means default dead; most founders can't answer.","fa":"Default Alive or Default Dead (۲۰۱۵): با نرخ رشد و خرج فعلی، پیش از تمام شدن پول به سودآوری می‌رسی؟ «بله» یعنی default alive، «نه» یعنی default dead؛ بیشتر بنیان‌گذاران جواب را نمی‌دانند."}},{"kind":"check","id":"b22k4","type":"tf","source":"b22c5","prompt":{"en":"A default dead startup reaches profitability before its money runs out.","fa":"استارتاپ default dead پیش از تمام شدن پولش به سودآوری می‌رسد."},"answer":false}],[{"kind":"card","id":"b22a1","source":"Do Things That Don't Scale (2013)","text":{"en":"Recruit the first users of your AI product by hand: message ten people, onboard each one yourself, fix what they trip over. The first €100 comes from people you can name.","fa":"اولین کاربران محصول AI خود را با دست جذب کن: به ده نفر پیام بده، هر کدام را خودت راه بینداز، هر جا گیر کردند درستش کن. اولین ۱۰۰ یورو از آدم‌هایی می‌آید که اسمشان را می‌دانی."}},{"kind":"card","id":"b22a2","source":"How to Get Startup Ideas (2012)","text":{"en":"Do not brainstorm an AI product; notice a problem you have as a CTO and solve that. You live in the future already; build what is missing.","fa":"برای محصول AI طوفان فکری نکن؛ مشکلی را که خودت به‌عنوان CTO داری ببین و همان را حل کن. تو همین حالا در آینده زندگی می‌کنی؛ چیزی را بساز که کم است."}},{"kind":"check","id":"b22ak1","type":"tap","source":"b22a1","prompt":{"en":"How does Graham say to get your first users?","fa":"Graham می‌گوید اولین کاربرانت را چطور به دست بیاوری؟"},"options":[{"en":"By hand, onboard each one yourself","fa":"با دست، هر کدام را خودت راه بینداز"},{"en":"Through a paid ad campaign","fa":"با یک کمپین تبلیغاتی پولی"},{"en":"By waiting for a press launch","fa":"با انتظار برای رونمایی مطبوعاتی"}],"answer":0},{"kind":"card","id":"b22a3","source":"Default Alive or Default Dead? (2015)","text":{"en":"Ask the default-alive question of your own finances: at current spending and income, does your capital move toward 25 times annual expenses? Answer it every three months in your net worth log.","fa":"سؤال default alive را از مالی خودت بپرس: با خرج و درآمد فعلی، سرمایه‌ات به سمت ۲۵ برابر خرج سالانه حرکت می‌کند؟ هر سه ماه در دفتر دارایی خالصت جوابش بده."}},{"kind":"check","id":"b22ak2","type":"tf","source":"b22a3","prompt":{"en":"Graham's default-alive question applies only to companies, never to your own finances.","fa":"سؤال default alive در Graham فقط برای شرکت‌هاست و هرگز به مالی خودت ربطی ندارد."},"answer":false},{"kind":"card","id":"b22a4","source":"Maker's Schedule, Manager's Schedule (2009)","text":{"en":"Protect maker time for the product: block half a day with no meetings, and keep the CTO's manager hours in a separate part of the week. One badly placed call can wreck the build session.","fa":"وقت سازندگی را برای محصول حفظ کن: نیم روز بدون هیچ جلسه‌ای بلوک کن و ساعت‌های مدیریتی CTO را در بخش جداگانه‌ای از هفته نگه دار. یک تماس بدجا می‌تواند کل جلسهٔ ساخت را خراب کند."}},{"kind":"check","id":"b22ak3","type":"tap","source":"b22a4","prompt":{"en":"How much time should you block for maker work, per Graham?","fa":"طبق Graham، چقدر وقت برای کار سازندگی بلوک کنی؟"},"options":[{"en":"One hour between meetings","fa":"یک ساعت بین جلسه‌ها"},{"en":"Half a day with no meetings","fa":"نیم روز بدون هیچ جلسه‌ای"},{"en":"Fifteen minutes each morning","fa":"پانزده دقیقه هر صبح"}],"answer":1}]]},{"id":"b23","title":"Atomic Habits","author":{"en":"James Clear","fa":"James Clear"},"year":2018,"stage":6,"must":true,"why":{"en":"Systems instead of willpower","fa":"سیستم به جای اراده"},"badge":{"en":"One Percent Better","fa":"هر روز ۱ درصد بهتر"},"units":[[{"kind":"card","id":"b23c1","source":"Ch. 1, The Surprising Power of Atomic Habits","text":{"en":"Habits are the compound interest of self-improvement. Getting 1 percent better every day compounds to about 37 times better after a year.","fa":"عادت‌ها بهرهٔ مرکبِ خودسازی‌اند. هر روز ۱ درصد بهتر شدن، پس از یک سال به حدود ۳۷ برابر بهتر شدن می‌انجامد."}},{"kind":"card","id":"b23c2","source":"Ch. 1, Forget About Goals, Focus on Systems","text":{"en":"Goals set a direction, but systems make progress. You do not rise to the level of your goals; you fall to the level of your systems.","fa":"هدف جهت را تعیین می‌کند، اما سیستم پیشرفت می‌سازد. تو به سطح هدف‌هایت بالا نمی‌روی؛ به سطح سیستم‌هایت سقوط می‌کنی."}},{"kind":"check","id":"b23k1","type":"tap","source":"b23c2","prompt":{"en":"According to Clear, what do you fall to the level of?","fa":"به گفتهٔ Clear، به سطح چه چیزی سقوط می‌کنی؟"},"options":[{"en":"Your systems","fa":"سیستم‌هایت"},{"en":"Your goals","fa":"هدف‌هایت"},{"en":"Your motivation","fa":"انگیزه‌ات"}],"answer":0},{"kind":"card","id":"b23c3","source":"Ch. 2, How Your Habits Shape Your Identity","text":{"en":"Lasting change is identity-based: decide who you want to be, then prove it with small wins. Every action is a vote for the type of person you wish to become.","fa":"تغییر ماندگار مبتنی بر هویت است: تصمیم بگیر چه کسی می‌خواهی باشی، بعد با بردهای کوچک آن را ثابت کن. هر کار، یک رأی به آن آدمی است که می‌خواهی بشوی."}},{"kind":"check","id":"b23k2","type":"tf","source":"b23c3","prompt":{"en":"Clear argues lasting change should start from outcomes, not from identity.","fa":"Clear می‌گوید تغییر ماندگار باید از نتایج شروع شود، نه از هویت."},"answer":false}],[{"kind":"card","id":"b23c4","source":"Ch. 3, How to Build Better Habits in 4 Simple Steps","text":{"en":"Every habit runs through a loop of four steps: cue, craving, response, reward. The Four Laws of Behavior Change turn each step into a lever.","fa":"هر عادت از حلقه‌ای چهارمرحله‌ای می‌گذرد: نشانه (cue)، میل (craving)، پاسخ (response)، پاداش (reward). چهار قانون تغییر رفتار هر مرحله را به یک اهرم تبدیل می‌کند."}},{"kind":"card","id":"b23c5","source":"Ch. 3, The Four Laws of Behavior Change","text":{"en":"The Four Laws: make it obvious, make it attractive, make it easy, make it satisfying. To break a bad habit, invert them: invisible, unattractive, difficult, unsatisfying.","fa":"چهار قانون: آشکارش کن، جذابش کن، آسانش کن، رضایت‌بخشش کن. برای ترک عادت بد، وارونه‌شان کن: نامرئی، ناجذاب، دشوار، نارضایت‌بخش."}},{"kind":"check","id":"b23k3","type":"order","source":"b23c5","prompt":{"en":"Put the Four Laws of Behavior Change in order","fa":"چهار قانون تغییر رفتار را به ترتیب بچین"},"options":[{"en":"Make it easy","fa":"آسانش کن"},{"en":"Make it obvious","fa":"آشکارش کن"},{"en":"Make it satisfying","fa":"رضایت‌بخشش کن"},{"en":"Make it attractive","fa":"جذابش کن"}],"answer":[1,3,0,2]},{"kind":"card","id":"b23c6","source":"Ch. 13, The Two-Minute Rule; Ch. 16, Never Miss Twice","text":{"en":"The Two-Minute Rule: scale a new habit down until it takes under two minutes to start. Track your habits, and when you miss a day, never miss twice.","fa":"قانون دو دقیقه: عادت تازه را آن‌قدر کوچک کن که شروعش کمتر از دو دقیقه طول بکشد. عادت‌هایت را ردیابی کن و اگر روزی را از دست دادی، هرگز دو بار پشت سر هم از دست نده."}},{"kind":"check","id":"b23k4","type":"tap","source":"b23c6","prompt":{"en":"What does the Two-Minute Rule tell you to do with a new habit?","fa":"قانون دو دقیقه می‌گوید با عادت تازه چه کنی؟"},"options":[{"en":"Scale it down until it takes under two minutes to start","fa":"آن‌قدر کوچکش کن که شروعش کمتر از دو دقیقه طول بکشد"},{"en":"Repeat it every two minutes through the day","fa":"هر دو دقیقه در طول روز تکرارش کن"},{"en":"Skip it on busy days","fa":"در روزهای شلوغ از آن بگذر"}],"answer":0}],[{"kind":"card","id":"b23a1","source":"Ch. 1, Forget About Goals, Focus on Systems","text":{"en":"Treat the daily hour of financial reading as a system, not a goal. Clear's systems-over-goals rule: the hour you repeat matters more than the 2 books a month you aim at.","fa":"یک ساعت مطالعهٔ مالی روزانه را یک سیستم بدان، نه یک هدف. قانون «سیستم به جای هدف» Clear: ساعتی که هر روز تکرار می‌کنی مهم‌تر از آن ۲ کتاب در ماه است که هدف گرفته‌ای."}},{"kind":"card","id":"b23a2","source":"Ch. 2, identity-based habits (every action is a vote)","text":{"en":"Identity first: every Feynman note in your own language is a vote for the person who understands money. Log net worth each quarter as proof of that identity, not as a scoreboard.","fa":"اول هویت: هر یادداشت فاینمنی به زبان خودت، یک رأی به آدمی است که پول را می‌فهمد. دارایی خالص را هر فصل به‌عنوان مدرکِ آن هویت ثبت کن، نه به‌عنوان جدول امتیاز."}},{"kind":"check","id":"b23ak1","type":"tap","source":"b23a1","prompt":{"en":"In Clear's terms, what is the daily hour of financial reading?","fa":"به زبان Clear، ساعت مطالعهٔ مالی روزانه چیست؟"},"options":[{"en":"A system, not a goal","fa":"یک سیستم، نه یک هدف"},{"en":"A goal with a deadline","fa":"هدفی با ضرب‌الاجل"},{"en":"A reward for finishing 2 books","fa":"پاداشی برای تمام کردن ۲ کتاب"}],"answer":0},{"kind":"card","id":"b23a3","source":"Ch. 5, habit stacking (make it obvious)","text":{"en":"Make it obvious with a habit stack: after the morning coffee, open the finance book; after closing the laptop, write one line in the decision journal.","fa":"با انباشت عادت (habit stacking) آشکارش کن: بعد از قهوهٔ صبح، کتاب مالی را باز کن؛ بعد از بستن لپ‌تاپ، یک خط در دفتر تصمیم بنویس."}},{"kind":"check","id":"b23ak2","type":"tf","source":"b23a3","prompt":{"en":"Habit stacking means doing the new habit whenever a free moment appears.","fa":"انباشت عادت یعنی عادت تازه را هر وقت لحظه‌ای خالی پیدا شد انجام بدهی."},"answer":false},{"kind":"card","id":"b23a4","source":"Ch. 3, the inverted laws; Ch. 16, Never Miss Twice","text":{"en":"Invert the laws to break FOMO trading: make it difficult (no broker app on your phone) and unsatisfying. If a tired evening skips the reading hour, never miss twice.","fa":"برای ترک معاملهٔ از سر FOMO قانون‌ها را وارونه کن: دشوارش کن (اپ کارگزار روی گوشی‌ات نباشد) و نارضایت‌بخش. اگر یک شبِ خسته ساعت مطالعه را از دست داد، هرگز دو بار پشت سر هم از دست نده."}},{"kind":"check","id":"b23ak3","type":"tap","source":"b23a4","prompt":{"en":"Which inverted law stops FOMO trading on a tired evening?","fa":"کدام قانون وارونه، معاملهٔ از سر FOMO را در یک شب خسته متوقف می‌کند؟"},"options":[{"en":"Make it difficult: no broker app on your phone","fa":"دشوارش کن: اپ کارگزار روی گوشی‌ات نباشد"},{"en":"Make it attractive: follow more crypto accounts","fa":"جذابش کن: اکانت‌های کریپتوی بیشتری دنبال کن"},{"en":"Make it obvious: keep price charts open","fa":"آشکارش کن: نمودار قیمت را باز نگه دار"}],"answer":0}]]},{"id":"b24","title":"Deep Work","author":{"en":"Cal Newport","fa":"Cal Newport"},"year":2016,"stage":6,"must":true,"why":{"en":"Hours of focus are your main capital","fa":"ساعت‌های تمرکز = سرمایه اصلی تو"},"badge":{"en":"Four Deep Hours","fa":"چهار ساعت عمیق"},"units":[[{"kind":"card","id":"b24c1","source":"Introduction, definition of deep work","text":{"en":"Deep work is distraction-free concentration that pushes your cognitive abilities to their limit. It creates new value, improves your skill and is hard to replicate.","fa":"کار عمیق (deep work) تمرکزِ بدون حواس‌پرتی است که توانایی‌های شناختی‌ات را تا مرزشان پیش می‌برد. ارزش تازه می‌آفریند، مهارتت را بالا می‌برد و به‌سختی تکرارشدنی است."}},{"kind":"check","id":"b24k1","type":"tap","source":"b24c1","prompt":{"en":"In Newport's definition, what is deep work?","fa":"در تعریف Newport، کار عمیق چیست؟"},"options":[{"en":"Distraction-free concentration that pushes your abilities to their limit","fa":"تمرکز بدون حواس‌پرتی که توانایی‌هایت را تا مرزشان پیش می‌برد"},{"en":"Logistical tasks done while half-distracted","fa":"کارهای لجستیکی که نیمه‌حواس‌پرت انجام می‌شوند"},{"en":"Long hours of email and meetings","fa":"ساعت‌های طولانی ایمیل و جلسه"}],"answer":0},{"kind":"card","id":"b24c2","source":"Introduction, The Deep Work Hypothesis; Ch. 1, Deep Work Is Valuable","text":{"en":"The Deep Work Hypothesis: deep work grows rarer exactly as it grows more valuable. It feeds the two core abilities of the new economy: mastering hard things fast and producing at an elite level.","fa":"فرضیهٔ کار عمیق: کار عمیق درست همان‌طور که ارزشمندتر می‌شود، کمیاب‌تر هم می‌شود. این کار دو توانایی اصلی اقتصاد جدید را می‌سازد: یادگیری سریع چیزهای سخت و تولید در سطح نخبه."}},{"kind":"card","id":"b24c3","source":"Ch. 1, Deep Work Is Valuable (attention residue)","text":{"en":"High-quality work produced = time spent x intensity of focus. Every glance at email leaves attention residue that drags down the next task.","fa":"کار باکیفیتِ تولیدشده = زمان صرف‌شده × شدت تمرکز. هر نگاه به ایمیل، «پسماند توجه» (attention residue) به جا می‌گذارد که کار بعدی را پایین می‌کشد."}},{"kind":"check","id":"b24k2","type":"tf","source":"b24c3","prompt":{"en":"Newport says a quick glance at email costs nothing if you switch back fast.","fa":"Newport می‌گوید یک نگاه سریع به ایمیل، اگر زود برگردی، هزینه‌ای ندارد."},"answer":false}],[{"kind":"card","id":"b24c4","source":"Part 2, The Rules","text":{"en":"Part 2 gives four rules: 1 Work Deeply, 2 Embrace Boredom, 3 Quit Social Media, 4 Drain the Shallows. Boredom training matters because a mind that craves distraction cannot focus.","fa":"بخش دوم چهار قانون می‌دهد: ۱ عمیق کار کن (Work Deeply)، ۲ کسالت را بپذیر (Embrace Boredom)، ۳ شبکه‌های اجتماعی را ترک کن (Quit Social Media)، ۴ کارهای سطحی را خشک کن (Drain the Shallows). تمرین کسالت مهم است، چون ذهنی که تشنهٔ حواس‌پرتی است نمی‌تواند تمرکز کند."}},{"kind":"check","id":"b24k3","type":"order","source":"b24c4","prompt":{"en":"Put Newport's four rules in order","fa":"چهار قانون Newport را به ترتیب بچین"},"options":[{"en":"Quit Social Media","fa":"شبکه‌های اجتماعی را ترک کن"},{"en":"Work Deeply","fa":"عمیق کار کن"},{"en":"Drain the Shallows","fa":"کارهای سطحی را خشک کن"},{"en":"Embrace Boredom","fa":"کسالت را بپذیر"}],"answer":[1,3,0,2]},{"kind":"card","id":"b24c5","source":"Rule 1, Work Deeply","text":{"en":"Rule 1, Work Deeply: choose a philosophy (monastic, bimodal, rhythmic or journalistic), ritualize where and how long you work, and close each day with a shutdown ritual.","fa":"قانون ۱، عمیق کار کن: یک فلسفه انتخاب کن (رهبانی، دووجهی، ریتمیک یا روزنامه‌نگارانه)، جا و مدت کارت را آیینی کن و هر روز را با یک آیین خاموشی (shutdown ritual) ببند."}},{"kind":"card","id":"b24c6","source":"Rule 2, Embrace Boredom; Rule 3, Quit Social Media; Rule 4, Drain the Shallows","text":{"en":"Rule 2: schedule internet use, never take breaks from focus; Rule 3: keep a tool only if its benefits clearly outweigh its costs. Rule 4: plan each minute and cap shallow work; experts manage about four deep hours daily.","fa":"قانون ۲: استفاده از اینترنت را زمان‌بندی کن، هرگز از تمرکز استراحت نگیر؛ قانون ۳: ابزاری را نگه دار فقط اگر سودش آشکارا از هزینه‌اش بیشتر باشد. قانون ۴: هر دقیقه را برنامه‌ریزی کن و کار سطحی را سقف بگذار؛ حتی خبره‌ها روزی حدود چهار ساعت کار عمیق می‌کنند."}},{"kind":"check","id":"b24k4","type":"tap","source":"b24c6","prompt":{"en":"What does Rule 2 ask you to do?","fa":"قانون ۲ از تو چه می‌خواهد؟"},"options":[{"en":"Schedule internet use, never take breaks from focus","fa":"استفاده از اینترنت را زمان‌بندی کن، هرگز از تمرکز استراحت نگیر"},{"en":"Quit the internet completely","fa":"اینترنت را کاملاً کنار بگذار"},{"en":"Take a short break every twenty minutes","fa":"هر بیست دقیقه یک استراحت کوتاه بگیر"}],"answer":0}],[{"kind":"card","id":"b24a1","source":"Rule 1, Work Deeply (rhythmic philosophy, rituals)","text":{"en":"Use the rhythmic philosophy for the daily reading hour: same time, same desk, phone in another room. Newport's ritual turns a plan into a habit that needs no fresh decision.","fa":"برای ساعت مطالعهٔ روزانه فلسفهٔ ریتمیک را به کار بگیر: همان ساعت، همان میز، گوشی در اتاقی دیگر. آیین Newport برنامه را به عادتی تبدیل می‌کند که به تصمیم تازه نیاز ندارد."}},{"kind":"check","id":"b24ak1","type":"tap","source":"b24a1","prompt":{"en":"Which Deep Work philosophy fits a daily reading hour at a fixed time?","fa":"کدام فلسفهٔ Deep Work با یک ساعت مطالعهٔ روزانه در زمان ثابت جور است؟"},"options":[{"en":"The rhythmic philosophy","fa":"فلسفهٔ ریتمیک"},{"en":"The monastic philosophy","fa":"فلسفهٔ رهبانی"},{"en":"The journalistic philosophy","fa":"فلسفهٔ روزنامه‌نگارانه"}],"answer":0},{"kind":"card","id":"b24a2","source":"Ch. 1, attention residue; Rule 4, Drain the Shallows","text":{"en":"As a CTO your day is meetings and chat; attention residue means one glance at Slack before reading wastes half the hour. Block the hour on the calendar like a customer meeting.","fa":"به‌عنوان CTO روزت پر از جلسه و چت است؛ پسماند توجه یعنی یک نگاه به Slack پیش از مطالعه، نیمی از ساعت را هدر می‌دهد. آن ساعت را مثل جلسه با مشتری در تقویم بلاک کن."}},{"kind":"check","id":"b24ak2","type":"tf","source":"b24a2","prompt":{"en":"By attention residue, a quick look at Slack right before the reading hour costs nothing.","fa":"طبق پسماند توجه، یک نگاه سریع به Slack درست پیش از ساعت مطالعه هزینه‌ای ندارد."},"answer":false},{"kind":"card","id":"b24a3","source":"Rule 4, four deep hours a day; Rule 1, the shutdown ritual","text":{"en":"Four deep hours a day is the ceiling, so spend them on the small AI product, your path to €100 of ownership income. Close with a shutdown ritual so sleep is not spent on open loops.","fa":"چهار ساعت کار عمیق در روز سقف است، پس آن را خرج محصول کوچک AI کن، مسیرت به ۱۰۰ یورو درآمد مالکیتی. روز را با آیین خاموشی ببند تا خواب صرف حلقه‌های باز نشود."}},{"kind":"check","id":"b24ak3","type":"tap","source":"b24a3","prompt":{"en":"Where should your limited deep hours go?","fa":"ساعت‌های عمیق محدودت باید کجا بروند؟"},"options":[{"en":"On the small AI product","fa":"روی محصول کوچک AI"},{"en":"On answering email faster","fa":"روی سریع‌تر جواب دادن ایمیل"},{"en":"On reading market news","fa":"روی خواندن اخبار بازار"}],"answer":0},{"kind":"card","id":"b24a4","source":"Rule 2, Embrace Boredom; Rule 3, Quit Social Media","text":{"en":"Rules 2 and 3 apply to money too: a mind trained to crave feeds will crave price charts. Schedule when you check markets, and keep only tools whose benefit clearly beats their cost.","fa":"قانون ۲ و ۳ دربارهٔ پول هم صادق‌اند: ذهنی که به فیدها معتاد شده، نمودار قیمت را هم طلب می‌کند. زمان چک کردن بازار را برنامه‌ریزی کن و فقط ابزارهایی را نگه دار که سودشان آشکارا از هزینه‌شان بیشتر است."}}]]},{"id":"b25","title":"Antifragile","author":{"en":"Nassim Nicholas Taleb","fa":"Nassim Nicholas Taleb"},"year":2012,"stage":6,"must":true,"why":{"en":"How to gain from volatility instead of losing","fa":"چطور از نوسان سود ببری نه ضرر"},"badge":{"en":"Gain From Disorder","fa":"سود از بی‌نظمی"},"units":[[{"kind":"card","id":"b25c1","source":"Prologue; Book I, Ch. 1, Between Damocles and Hydra","text":{"en":"Taleb's triad: the fragile breaks under shocks, the robust shrugs them off, and the antifragile gets stronger from them. Antifragility is beyond resilience: it gains from disorder.","fa":"سه‌گانهٔ Taleb: شکننده زیر ضربه می‌شکند، استوار (robust) آن را تاب می‌آورد، و ضدشکننده از آن قوی‌تر می‌شود. ضدشکنندگی فراتر از تاب‌آوری است: از بی‌نظمی سود می‌برد."}},{"kind":"check","id":"b25k1","type":"tap","source":"b25c1","prompt":{"en":"In Taleb's triad, what does the antifragile do under shocks?","fa":"در سه‌گانهٔ Taleb، ضدشکننده زیر ضربه چه می‌کند؟"},"options":[{"en":"Gets stronger from them","fa":"از آن‌ها قوی‌تر می‌شود"},{"en":"Stays exactly the same","fa":"دقیقاً همان‌طور می‌ماند"},{"en":"Breaks, but slowly","fa":"می‌شکند، اما آهسته"}],"answer":0},{"kind":"card","id":"b25c2","source":"Book I, Ch. 2, Overcompensation and Overreaction Everywhere","text":{"en":"Small doses of stress followed by recovery make living systems overcompensate and grow stronger (hormesis). Remove every stressor and you weaken what you protect.","fa":"دوزهای کوچک استرس همراه با زمان بهبودی، سیستم‌های زنده را به جبرانِ بیش‌ازحد وامی‌دارد و قوی‌تر می‌کند (hormesis). همهٔ استرس‌ها را حذف کنی، همان چیزی را که محافظت می‌کنی ضعیف کرده‌ای."}},{"kind":"card","id":"b25c3","source":"Book IV, Ch. 11, Never Marry the Rock Star (the barbell)","text":{"en":"The barbell strategy: be extremely safe with most of your capital, say 90 percent, and extremely speculative with the rest, with nothing in the middle. You cap the downside and keep the upside.","fa":"استراتژی هالتر (barbell): با بیشتر سرمایه‌ات، مثلاً ۹۰ درصد، به‌شدت محافظه‌کار باش و با باقی آن به‌شدت سفته‌بازانه، و هیچ‌چیز در میانه. زیان را سقف می‌زنی و سود را باز نگه می‌داری."}},{"kind":"check","id":"b25k2","type":"tf","source":"b25c3","prompt":{"en":"The barbell strategy puts most of your capital in medium-risk assets.","fa":"استراتژی هالتر بیشتر سرمایه‌ات را در دارایی‌های با ریسک متوسط می‌گذارد."},"answer":false}],[{"kind":"card","id":"b25c4","source":"Book IV, Ch. 12, Thales' Sweet Grapes (optionality)","text":{"en":"Optionality means asymmetry: small, bounded losses and large open-ended gains. With it you do not need to predict; like Thales and the olive presses, you only need many cheap tries.","fa":"اختیار (optionality) یعنی عدم تقارن: زیان‌های کوچک و محدود، سودهای بزرگ و بی‌سقف. با آن نیازی به پیش‌بینی نداری؛ مثل Thales و دستگاه‌های روغن‌کشی زیتون، فقط به تلاش‌های ارزان و متعدد نیاز داری."}},{"kind":"check","id":"b25k3","type":"tap","source":"b25c4","prompt":{"en":"What does optionality give you?","fa":"اختیار (optionality) چه چیزی به تو می‌دهد؟"},"options":[{"en":"Small bounded losses and large open-ended gains","fa":"زیان‌های کوچک و محدود، سودهای بزرگ و بی‌سقف"},{"en":"Accurate predictions of the future","fa":"پیش‌بینی دقیق آینده"},{"en":"Steady returns with no volatility","fa":"بازده ثابت بدون نوسان"}],"answer":0},{"kind":"card","id":"b25c5","source":"Book VI, Via Negativa; Ch. 20, Time and Fragility (Lindy effect)","text":{"en":"Via negativa: improve by removing what harms you (debt, bad habits, noise) rather than adding fixes. The Lindy effect: a book or idea that has lasted 40 years is likely to last another 40.","fa":"Via negativa: با حذف آنچه آسیبت می‌زند (بدهی، عادت بد، نویز) بهتر شو، نه با افزودن راه‌حل. اثر Lindy: کتاب یا ایده‌ای که ۴۰ سال دوام آورده، احتمالاً ۴۰ سال دیگر هم دوام می‌آورد."}},{"kind":"card","id":"b25c6","source":"Book VII, Ch. 23, Skin in the Game; Ch. 7, Naive Intervention","text":{"en":"Skin in the game: trust no advice from someone who does not share your downside. Taleb calls harm done by well-meaning intervention iatrogenics, and its fans fragilistas.","fa":"پوست در بازی (skin in the game): به توصیهٔ کسی که در زیانِ تو شریک نیست اعتماد نکن. Taleb آسیبِ مداخلهٔ خیرخواهانه را iatrogenics می‌نامد و هوادارانش را fragilista."}},{"kind":"check","id":"b25k4","type":"tf","source":"b25c6","prompt":{"en":"Taleb says to trust advice only from people who share your downside.","fa":"Taleb می‌گوید فقط به توصیهٔ کسانی اعتماد کن که در زیانِ تو شریک‌اند."},"answer":true}],[{"kind":"card","id":"b25a1","source":"Book IV, Ch. 11, the barbell strategy","text":{"en":"The roadmap already has a barbell shape: capital kept safe in index ETFs, with a small slice in ownership bets. Taleb's rule is nothing in the middle, no half-safe bets you cannot explain.","fa":"نقشهٔ راه از قبل شکل هالتر دارد: سرمایه در ETF شاخصی امن نگه داشته می‌شود و تکهٔ کوچکی در شرط‌های مالکیتی. قانون Taleb: هیچ‌چیز در میانه، هیچ شرط نیمه‌امنی که نتوانی توضیحش بدهی."}},{"kind":"check","id":"b25ak1","type":"tap","source":"b25a1","prompt":{"en":"In Taleb's barbell, what goes in the middle?","fa":"در هالتر Taleb، چه چیزی در میانه قرار می‌گیرد؟"},"options":[{"en":"Nothing in the middle","fa":"هیچ‌چیز"},{"en":"Medium-risk funds","fa":"صندوق‌های با ریسک متوسط"},{"en":"Half of the capital","fa":"نیمی از سرمایه"}],"answer":0},{"kind":"card","id":"b25a2","source":"Book IV, Ch. 12, optionality (Thales and the olive presses)","text":{"en":"Optionality: the first AI product is one cheap try, bounded by a few weekends, with open upside. Run many such tries instead of predicting which one will pay.","fa":"اختیار (optionality): اولین محصول AI یک تلاش ارزان است، محدود به چند آخر هفته، با سودِ بی‌سقف. به‌جای پیش‌بینی اینکه کدام جواب می‌دهد، چندین تلاش از این دست انجام بده."}},{"kind":"check","id":"b25ak2","type":"tf","source":"b25a2","prompt":{"en":"Optionality means you must first predict which AI product will succeed.","fa":"اختیار یعنی اول باید پیش‌بینی کنی کدام محصول AI موفق می‌شود."},"answer":false},{"kind":"card","id":"b25a3","source":"Book VI, via negativa; Book I, Ch. 2, hormesis","text":{"en":"Via negativa first: remove what harms you (debt, the broker app on your phone, late nights) before adding anything. Hormesis needs recovery, so sleep is part of the strategy, not a luxury.","fa":"اول via negativa: پیش از افزودن هر چیز، آنچه آسیبت می‌زند را حذف کن (بدهی، اپ کارگزار روی گوشی، شب‌بیداری). Hormesis به بهبودی نیاز دارد، پس خواب بخشی از استراتژی است، نه تجمل."}},{"kind":"card","id":"b25a4","source":"Book VII, Ch. 23, skin in the game","text":{"en":"Skin in the game: pick a mentor who has walked the path and shares your downside, not a seller of courses. Re-read the decision journal after six months to see which advice held.","fa":"پوست در بازی: مربی‌ای انتخاب کن که این مسیر را رفته و در زیانِ تو شریک است، نه فروشندهٔ دوره. دفتر تصمیم را بعد از شش ماه دوباره بخوان تا ببینی کدام توصیه درست از آب درآمد."}},{"kind":"check","id":"b25ak3","type":"tap","source":"b25a4","prompt":{"en":"Which mentor has skin in the game?","fa":"کدام مربی پوست در بازی دارد؟"},"options":[{"en":"One who has walked the path and shares your downside","fa":"کسی که مسیر را رفته و در زیانِ تو شریک است"},{"en":"One who sells a course about the path","fa":"کسی که دوره‌ای دربارهٔ مسیر می‌فروشد"},{"en":"One who follows markets every day","fa":"کسی که هر روز بازار را دنبال می‌کند"}],"answer":0}]]},{"id":"b26","title":"Poor Charlie's Almanack","author":{"en":"Charlie Munger, edited by Peter D. Kaufman","fa":"Charlie Munger، ویراستهٔ Peter D. Kaufman"},"year":2005,"stage":6,"must":false,"why":{"en":"Multidisciplinary mental models","fa":"مدل‌های ذهنی چندرشته‌ای"},"badge":{"en":"Latticework of Models","fa":"شبکهٔ مدل‌های ذهنی"},"units":[[{"kind":"card","id":"b26c1","source":"Talk: A Lesson on Elementary, Worldly Wisdom (USC, 1994)","text":{"en":"Munger's core advice: build a latticework of mental models from many disciplines and hang your experience on it. To the man with only a hammer, every problem looks like a nail.","fa":"توصیهٔ اصلی Munger: شبکه‌ای (latticework) از مدل‌های ذهنی از رشته‌های گوناگون بساز و تجربه‌ات را روی آن بیاویز. برای کسی که فقط چکش دارد، هر مسئله‌ای شبیه میخ است."}},{"kind":"check","id":"b26k1","type":"tap","source":"b26c1","prompt":{"en":"What does Munger say you should build?","fa":"Munger می‌گوید چه چیزی باید بسازی؟"},"options":[{"en":"A latticework of mental models from many disciplines","fa":"شبکه‌ای از مدل‌های ذهنی از رشته‌های گوناگون"},{"en":"One master formula for every problem","fa":"یک فرمول جادویی برای هر مسئله"},{"en":"A list of stock tips from experts","fa":"فهرستی از توصیه‌های سهام از کارشناسان"}],"answer":0},{"kind":"card","id":"b26c2","source":"Talk: A Lesson on Elementary, Worldly Wisdom (the 80 or 90 models)","text":{"en":"You do not need all the models: about 80 or 90 big ones carry roughly 90 percent of the freight. They come from math, physics, biology, psychology, engineering and economics.","fa":"به همهٔ مدل‌ها نیاز نداری: حدود ۸۰ تا ۹۰ مدل بزرگ، تقریباً ۹۰ درصد بار را حمل می‌کنند. این مدل‌ها از ریاضی، فیزیک، زیست‌شناسی، روان‌شناسی، مهندسی و اقتصاد می‌آیند."}},{"kind":"check","id":"b26k2","type":"tf","source":"b26c2","prompt":{"en":"Munger says you must master every model in every discipline before you can think well.","fa":"Munger می‌گوید باید همهٔ مدل‌های همهٔ رشته‌ها را بلد باشی تا بتوانی خوب فکر کنی."},"answer":false}],[{"kind":"card","id":"b26c3","source":"Talk: The Psychology of Human Misjudgment","text":{"en":"Munger lists some 25 psychological tendencies that cause misjudgment, such as incentive bias, social proof and consistency. When several act together they create a lollapalooza effect.","fa":"Munger حدود ۲۵ گرایش روانی را فهرست می‌کند که به قضاوت نادرست می‌انجامند، مانند سوگیری انگیزه‌ای، تأیید اجتماعی و ثبات‌طلبی. وقتی چند تا با هم عمل کنند، اثر lollapalooza می‌سازند."}},{"kind":"check","id":"b26k3","type":"tap","source":"b26c3","prompt":{"en":"What does Munger call several tendencies acting together in one direction?","fa":"Munger چند گرایش را که با هم در یک جهت عمل می‌کنند چه می‌نامد؟"},"options":[{"en":"A lollapalooza effect","fa":"اثر lollapalooza"},{"en":"Social proof","fa":"تأیید اجتماعی"},{"en":"A circle of competence","fa":"دایرهٔ شایستگی"}],"answer":0},{"kind":"card","id":"b26c4","source":"Ch. 2, The Munger Approach; Mungerisms (inversion)","text":{"en":"Invert, always invert: ask what would guarantee failure, then avoid it. Munger says all he wants to know is where he is going to die, so he never goes there.","fa":"وارونه کن، همیشه وارونه کن: بپرس چه چیزی شکست را تضمین می‌کند، بعد از آن دوری کن. Munger می‌گوید فقط می‌خواهد بداند کجا قرار است بمیرد تا هرگز آنجا نرود."}},{"kind":"check","id":"b26k4","type":"tf","source":"b26c4","prompt":{"en":"Inversion means asking what would guarantee failure, then avoiding it.","fa":"وارونه‌سازی یعنی بپرسی چه چیزی شکست را تضمین می‌کند، بعد از آن دوری کنی."},"answer":true},{"kind":"card","id":"b26c5","source":"Ch. 2, Investing Principles Checklist (patience, decisiveness, focus)","text":{"en":"Stay inside your circle of competence and wait patiently: a few big opportunities come, and when the odds are heavily in your favour, bet heavily. The rest of the time, sit and read.","fa":"در دایرهٔ شایستگی‌ات بمان و صبورانه منتظر باش: چند فرصت بزرگ می‌آید، و وقتی شانس به‌شدت به نفع توست، سنگین شرط ببند. باقی وقت‌ها بنشین و بخوان."}},{"kind":"card","id":"b26c6","source":"Ch. 2, Investing Principles Checklist (preparation, independence, humility, rigor)","text":{"en":"Munger's investing checklist prizes preparation, independence, intellectual humility and analytic rigor. Acknowledging what you do not know is the dawning of wisdom.","fa":"چک‌لیست سرمایه‌گذاری Munger بر آمادگی، استقلال، فروتنی فکری و دقت تحلیلی تأکید دارد. پذیرفتن آنچه نمی‌دانی، سپیده‌دم خرد است."}}],[{"kind":"card","id":"b26a1","source":"Talk: A Lesson on Elementary, Worldly Wisdom (the latticework)","text":{"en":"Your engineering models (feedback loops, bottlenecks, compounding) are already points on the lattice. Feynman notes in your own language add finance and psychology models beside them.","fa":"مدل‌های مهندسی‌ات (حلقهٔ بازخورد، گلوگاه، مرکب شدن) همین حالا نقطه‌هایی روی شبکه‌اند. یادداشت‌های فاینمنی به زبان خودت، مدل‌های مالی و روان‌شناسی را کنارشان می‌گذارد."}},{"kind":"card","id":"b26a2","source":"Mungerisms: invert, always invert","text":{"en":"Invert the roadmap: ask what would guarantee you lose the €40k, such as trading tired, FOMO, and a bet you cannot explain. Then write those into the decision journal as rules to avoid.","fa":"نقشهٔ راه را وارونه کن: بپرس چه چیزی از دست رفتن ۴۰ هزار یورو را تضمین می‌کند، مثل معاملهٔ خسته، FOMO و شرطی که نمی‌توانی توضیحش بدهی. بعد آن‌ها را به‌عنوان قواعد پرهیز در دفتر تصمیم بنویس."}},{"kind":"check","id":"b26ak1","type":"tap","source":"b26a2","prompt":{"en":"What does inversion ask you to write into the decision journal?","fa":"وارونه‌سازی می‌گوید چه چیزی در دفتر تصمیم بنویسی؟"},"options":[{"en":"Rules to avoid what would guarantee you lose","fa":"قواعد پرهیز از آنچه باخت را تضمین می‌کند"},{"en":"A list of stocks to buy next quarter","fa":"فهرست سهام برای خرید فصل بعد"},{"en":"Your target net worth for the year","fa":"دارایی خالص هدفت برای امسال"}],"answer":0},{"kind":"card","id":"b26a3","source":"Talk: The Psychology of Human Misjudgment (lollapalooza effect)","text":{"en":"Munger's tendencies combine: social proof (a friend bought), incentive bias (someone is selling) and a tired brain make a lollapalooza. A cooling-off rule before any buy breaks the stack.","fa":"گرایش‌های Munger با هم ترکیب می‌شوند: تأیید اجتماعی (دوستی خریده)، سوگیری انگیزه‌ای (کسی می‌فروشد) و مغز خسته یک lollapalooza می‌سازند. یک قاعدهٔ مهلت پیش از هر خرید، این ترکیب را می‌شکند."}},{"kind":"check","id":"b26ak2","type":"tf","source":"b26a3","prompt":{"en":"A friend who bought, a seller's pitch and a tired brain are harmless together because each one is small.","fa":"دوستی که خریده، پیشنهاد یک فروشنده و مغز خسته با هم بی‌خطرند، چون هر کدام کوچک است."},"answer":false},{"kind":"card","id":"b26a4","source":"Ch. 2, Investing Principles Checklist (circle of competence, patience)","text":{"en":"Stay in your circle of competence: software and AI products are inside it, picking single stocks is not yet. Wait patiently with index investing and read while the few big chances come.","fa":"در دایرهٔ شایستگی‌ات بمان: نرم‌افزار و محصولات AI داخل آن‌اند، انتخاب تک‌سهم هنوز نه. با سرمایه‌گذاری شاخصی صبورانه منتظر بمان و بخوان تا آن چند فرصت بزرگ برسد."}},{"kind":"check","id":"b26ak3","type":"tap","source":"b26a4","prompt":{"en":"What is inside your circle of competence right now?","fa":"همین حالا چه چیزی داخل دایرهٔ شایستگی‌ات است؟"},"options":[{"en":"Software and AI products","fa":"نرم‌افزار و محصولات AI"},{"en":"Picking single stocks","fa":"انتخاب تک‌سهم"},{"en":"Timing the market","fa":"زمان‌بندی بازار"}],"answer":0}]]},{"id":"b27","title":"High Output Management","author":{"en":"Andrew S. Grove","fa":"Andrew S. Grove"},"year":1983,"stage":6,"must":false,"why":{"en":"From engineer to real manager","fa":"از مهندس به مدیر واقعی"},"badge":{"en":"Managerial Leverage","fa":"اهرم مدیریتی"},"units":[[{"kind":"card","id":"b27c1","source":"Ch. 1, The Basics of Production (the breakfast factory)","text":{"en":"Grove starts with a breakfast factory: deliver a product at the scheduled time, at acceptable quality, at the lowest cost. Find the limiting step and build the whole process around it.","fa":"Grove با یک کارخانهٔ صبحانه شروع می‌کند: محصول را سر وقتِ برنامه، با کیفیت قابل‌قبول و با کمترین هزینه تحویل بده. مرحلهٔ محدودکننده (limiting step) را پیدا کن و کل فرایند را حول آن بچین."}},{"kind":"card","id":"b27c2","source":"Ch. 3, Managerial Leverage","text":{"en":"Manager's output = output of their organization + output of neighbouring units under their influence. So favour high-leverage acts, like a training session or a timely decision that lifts many people; delegate the rest.","fa":"خروجی مدیر = خروجی سازمانش + خروجی واحدهای همسایه‌ای که زیر نفوذ اوست. پس کارهای پراهرم را ترجیح بده، مثل یک جلسهٔ آموزشی یا تصمیمی به‌موقع که بسیاری را بالا می‌کشد، و باقی را واگذار کن."}},{"kind":"check","id":"b27k1","type":"tap","source":"b27c2","prompt":{"en":"How does Grove measure a manager's output?","fa":"Grove خروجی مدیر را چطور می‌سنجد؟"},"options":[{"en":"Output of their organization and neighbouring units under their influence","fa":"خروجی سازمانش و واحدهای همسایهٔ زیر نفوذش"},{"en":"Hours the manager works each week","fa":"ساعت‌هایی که مدیر هر هفته کار می‌کند"},{"en":"Number of reports the manager writes","fa":"تعداد گزارش‌هایی که مدیر می‌نویسد"}],"answer":0},{"kind":"card","id":"b27c3","source":"Ch. 5, Decisions, Decisions","text":{"en":"Ideal decision-making runs in three stages: free discussion, a clear decision, then full support from all, even those who objected. Grove warns against the peer-group syndrome, where nobody wants to stick their neck out.","fa":"تصمیم‌گیری ایده‌آل سه مرحله دارد: بحث آزاد، تصمیم روشن، سپس حمایت کامل همه، حتی مخالفان. Grove از «سندرم هم‌رده‌ها» (peer-group syndrome) هشدار می‌دهد، جایی که هیچ‌کس نمی‌خواهد ریسکِ اظهار نظر کند."}},{"kind":"check","id":"b27k2","type":"order","source":"b27c3","prompt":{"en":"Put Grove's ideal decision-making stages in order","fa":"مراحل تصمیم‌گیری ایده‌آل Grove را به ترتیب بچین"},"options":[{"en":"Full support","fa":"حمایت کامل"},{"en":"Free discussion","fa":"بحث آزاد"},{"en":"Clear decision","fa":"تصمیم روشن"}],"answer":[1,2,0]}],[{"kind":"card","id":"b27c4","source":"Ch. 4, Meetings, the Medium of Managerial Work (one-on-ones)","text":{"en":"Meetings are the medium of managerial work. The one-on-one belongs to the subordinate: they set the agenda, it lasts at least an hour, and it is for learning and coaching.","fa":"جلسه رسانهٔ کار مدیریتی است. جلسهٔ یک‌به‌یک (one-on-one) متعلق به زیردست است: او دستور جلسه را تعیین می‌کند، دست‌کم یک ساعت طول می‌کشد و برای یادگیری و مربی‌گری است."}},{"kind":"check","id":"b27k3","type":"tf","source":"b27c4","prompt":{"en":"In Grove's one-on-one, the manager sets the agenda and keeps it to 15 minutes.","fa":"در جلسهٔ یک‌به‌یکِ Grove، مدیر دستور جلسه را تعیین می‌کند و آن را به ۱۵ دقیقه محدود می‌کند."},"answer":false},{"kind":"card","id":"b27c5","source":"Ch. 6, Planning: Today's Actions for Tomorrow's Output (MBO)","text":{"en":"Planning becomes management by objectives (MBO): answer two questions, where do I want to go (the objective) and how will I pace myself to see if I am getting there (the key results).","fa":"برنامه‌ریزی به مدیریت بر مبنای هدف (MBO) می‌رسد: به دو پرسش پاسخ بده، کجا می‌خواهم بروم (هدف) و چطور سرعتم را تنظیم کنم تا بفهمم دارم می‌رسم یا نه (نتایج کلیدی)."}},{"kind":"check","id":"b27k4","type":"tap","source":"b27c5","prompt":{"en":"Which two questions does MBO ask?","fa":"MBO کدام دو پرسش را می‌پرسد؟"},"options":[{"en":"Where do I want to go, and how will I pace myself?","fa":"کجا می‌خواهم بروم، و چطور سرعتم را تنظیم کنم؟"},{"en":"What is my budget, and who approves it?","fa":"بودجه‌ام چقدر است، و چه کسی تأییدش می‌کند؟"},{"en":"What went wrong last year, and who was responsible?","fa":"پارسال چه اشتباهی شد، و چه کسی مسئول بود؟"}],"answer":0},{"kind":"card","id":"b27c6","source":"Ch. 11, The Sports Analogy; Ch. 16, Why Training Is the Boss's Job","text":{"en":"When someone is not doing their job, there are only two reasons: not capable or not motivated. So training and motivation are a manager's tools, and training is the boss's job.","fa":"وقتی کسی کارش را انجام نمی‌دهد، فقط دو دلیل دارد: یا توانایی ندارد یا انگیزه. پس آموزش و انگیزش ابزار مدیرند، و آموزش وظیفهٔ خودِ رئیس است."}}],[{"kind":"card","id":"b27a1","source":"Ch. 1, the breakfast factory (limiting step)","text":{"en":"Run the roadmap like Grove's breakfast factory: the limiting step is the daily reading hour, so arrange sleep, meetings and coding around it. Lose that step and the rest of the plan waits.","fa":"نقشهٔ راه را مثل کارخانهٔ صبحانهٔ Grove اداره کن: مرحلهٔ محدودکننده ساعت مطالعهٔ روزانه است، پس خواب، جلسه و کدنویسی را حول آن بچین. آن مرحله را از دست بدهی، باقی برنامه معطل می‌ماند."}},{"kind":"check","id":"b27ak1","type":"tap","source":"b27a1","prompt":{"en":"In the roadmap as a breakfast factory, what is the limiting step?","fa":"در نقشهٔ راه به‌شکل کارخانهٔ صبحانه، مرحلهٔ محدودکننده چیست؟"},"options":[{"en":"The daily reading hour","fa":"ساعت مطالعهٔ روزانه"},{"en":"The number of meetings per week","fa":"تعداد جلسه‌ها در هفته"},{"en":"The size of the capital","fa":"اندازهٔ سرمایه"}],"answer":0},{"kind":"card","id":"b27a2","source":"Ch. 3, managerial leverage","text":{"en":"High leverage is one act that lifts many outcomes: a mentor meeting or a decision journal entry shapes months of choices. Checking prices every day is low leverage.","fa":"اهرم بالا یعنی یک کار که نتایج زیادی را بالا می‌کشد: جلسه با مربی یا یک یادداشت در دفتر تصمیم، ماه‌ها انتخاب را شکل می‌دهد. هر روز قیمت چک کردن اهرم پایین است."}},{"kind":"check","id":"b27ak2","type":"tf","source":"b27a2","prompt":{"en":"Checking prices every day is a high-leverage act in Grove's sense.","fa":"هر روز قیمت چک کردن، به معنای Grove، کاری پراهرم است."},"answer":false},{"kind":"card","id":"b27a3","source":"Ch. 6, management by objectives (objective and key results)","text":{"en":"Write the roadmap as MBO: objective, €100 of ownership income from a small AI product; key results, product shipped, first paying user, net worth logged each quarter.","fa":"نقشهٔ راه را به شکل MBO بنویس: هدف، ۱۰۰ یورو درآمد مالکیتی از یک محصول کوچک AI؛ نتایج کلیدی، محصول منتشرشده، اولین کاربر پولی، دارایی خالص ثبت‌شده در هر فصل."}},{"kind":"check","id":"b27ak3","type":"tap","source":"b27a3","prompt":{"en":"In the MBO version of the roadmap, what is the objective?","fa":"در نسخهٔ MBO نقشهٔ راه، هدف چیست؟"},"options":[{"en":"€100 of ownership income from a small AI product","fa":"۱۰۰ یورو درآمد مالکیتی از یک محصول کوچک AI"},{"en":"Reading 2 books a month","fa":"خواندن ۲ کتاب در ماه"},{"en":"A higher salary in the Netherlands","fa":"حقوق بالاتر در هلند"}],"answer":0},{"kind":"card","id":"b27a4","source":"Ch. 11 and Ch. 16, not capable or not motivated; training is the boss's job","text":{"en":"When you skip the plan, ask Grove's question: not capable or not motivated? A mentor one-on-one is your training; sleep and a quiet evening fix the motivation side before any book does.","fa":"وقتی برنامه را رها می‌کنی، پرسش Grove را بپرس: توانایی نداری یا انگیزه؟ جلسهٔ یک‌به‌یک با مربی آموزشِ توست؛ خواب و یک شب آرام، سمت انگیزه را زودتر از هر کتابی درست می‌کند."}}]]},{"id":"b28","title":"So Good They Can't Ignore You","author":{"en":"Cal Newport","fa":"Cal Newport"},"year":2012,"stage":6,"must":false,"why":{"en":"Rare skill beats passion","fa":"مهارت کمیاب > اشتیاق"},"badge":{"en":"Career Capital","fa":"سرمایهٔ شغلی"},"units":[[{"kind":"card","id":"b28c1","source":"Book structure: the four rules","text":{"en":"Newport's four rules: 1 Don't Follow Your Passion, 2 Be So Good They Can't Ignore You, 3 Turn Down a Promotion, 4 Think Small, Act Big. Skill, control and mission matter more than pre-existing passion.","fa":"چهار قانون Newport: ۱ دنبال اشتیاقت نرو (Don't Follow Your Passion)، ۲ آن‌قدر خوب شو که نتوانند نادیده‌ات بگیرند، ۳ ترفیع را رد کن (Turn Down a Promotion)، ۴ کوچک فکر کن، بزرگ عمل کن. مهارت، کنترل و مأموریت مهم‌تر از اشتیاقِ از پیش موجودند."}},{"kind":"check","id":"b28k1","type":"order","source":"b28c1","prompt":{"en":"Put Newport's four rules in order","fa":"چهار قانون Newport را به ترتیب بچین"},"options":[{"en":"Turn Down a Promotion","fa":"ترفیع را رد کن"},{"en":"Don't Follow Your Passion","fa":"دنبال اشتیاقت نرو"},{"en":"Think Small, Act Big","fa":"کوچک فکر کن، بزرگ عمل کن"},{"en":"Be So Good They Can't Ignore You","fa":"آن‌قدر خوب شو که نتوانند نادیده‌ات بگیرند"}],"answer":[1,3,0,2]},{"kind":"card","id":"b28c2","source":"Rule 1, Don't Follow Your Passion","text":{"en":"Rule 1: the passion hypothesis, find your passion then match a job to it, is bad advice. Pre-existing passions are rare, and passion mostly grows after mastery, autonomy and competence.","fa":"قانون ۱: فرضیهٔ اشتیاق، یعنی اول اشتیاقت را پیدا کن بعد شغلی مطابقش بیاب، توصیهٔ بدی است. اشتیاق از پیش موجود کمیاب است و اشتیاق بیشتر بعد از تسلط، خودمختاری و شایستگی رشد می‌کند."}},{"kind":"check","id":"b28k2","type":"tf","source":"b28c2","prompt":{"en":"Newport says most people have a pre-existing passion they should match a job to.","fa":"Newport می‌گوید بیشتر مردم اشتیاقی از پیش موجود دارند که باید شغلی مطابق آن پیدا کنند."},"answer":false}],[{"kind":"card","id":"b28c3","source":"Rule 2, Be So Good They Can't Ignore You (craftsman mindset, career capital)","text":{"en":"Rule 2: adopt the craftsman mindset, asking what you can offer the world, not what it offers you. Build career capital: rare and valuable skills, earned through deliberate practice.","fa":"قانون ۲: ذهنیت صنعتگر (craftsman mindset) را بپذیر، بپرس چه چیزی می‌توانی به دنیا بدهی، نه دنیا چه به تو می‌دهد. سرمایهٔ شغلی (career capital) بساز: مهارت‌های کمیاب و ارزشمند که با تمرین عامدانه به دست می‌آیند."}},{"kind":"check","id":"b28k3","type":"tap","source":"b28c3","prompt":{"en":"What is career capital?","fa":"سرمایهٔ شغلی چیست؟"},"options":[{"en":"Rare and valuable skills earned through deliberate practice","fa":"مهارت‌های کمیاب و ارزشمند که با تمرین عامدانه به دست می‌آیند"},{"en":"A passion you discovered early in life","fa":"اشتیاقی که در جوانی کشف کرده‌ای"},{"en":"Savings that let you quit your job","fa":"پس‌اندازی که اجازه می‌دهد شغلت را رها کنی"}],"answer":0},{"kind":"card","id":"b28c4","source":"Rule 2 to Rule 3 (trading capital; the first control trap)","text":{"en":"You trade career capital for the traits that define great work: creativity, impact and control. Without capital, a bid for control is not sustainable (the first control trap).","fa":"سرمایهٔ شغلی را با ویژگی‌هایی که کار عالی را می‌سازند معاوضه می‌کنی: خلاقیت، اثرگذاری و کنترل. بدون سرمایه، تلاش برای کنترل پایدار نیست (تلهٔ اول کنترل)."}},{"kind":"card","id":"b28c5","source":"Rule 3, Turn Down a Promotion (second control trap, law of financial viability)","text":{"en":"The second control trap: once you have enough capital to win control, your employer will resist. The law of financial viability: pursue more control only if people will pay for it.","fa":"تلهٔ دوم کنترل: وقتی آن‌قدر سرمایه داری که کنترل را به دست بیاوری، کارفرمایت مقاومت می‌کند. قانون پایداری مالی: فقط وقتی دنبال کنترل بیشتر برو که مردم حاضر باشند برایش پول بدهند."}},{"kind":"card","id":"b28c6","source":"Rule 4, Think Small, Act Big (adjacent possible, little bets, remarkability)","text":{"en":"Rule 4: a mission also needs career capital first, found in the adjacent possible at the cutting edge of your field. Explore it with little bets and make the result remarkable.","fa":"قانون ۴: مأموریت هم اول به سرمایهٔ شغلی نیاز دارد و در «مجاورِ ممکن» (adjacent possible)، در لبهٔ پیشروی رشته‌ات پیدا می‌شود. آن را با شرط‌های کوچک (little bets) بکاو و نتیجه را چشمگیر کن."}},{"kind":"check","id":"b28k4","type":"tap","source":"b28c6","prompt":{"en":"Where does Newport say a mission is found?","fa":"Newport می‌گوید مأموریت کجا پیدا می‌شود؟"},"options":[{"en":"In the adjacent possible at the cutting edge of your field","fa":"در «مجاورِ ممکن»، در لبهٔ پیشروی رشته‌ات"},{"en":"In a childhood dream you never gave up","fa":"در رؤیای کودکی که هرگز رهایش نکردی"},{"en":"In a field far from your current skills","fa":"در رشته‌ای دور از مهارت‌های فعلی‌ات"}],"answer":0}],[{"kind":"card","id":"b28a1","source":"Rule 2, career capital and the craftsman mindset","text":{"en":"Your CTO skills are career capital in Newport's sense: rare and valuable. The craftsman mindset asks what the Dutch market needs from you, not whether the move feels like your passion.","fa":"مهارت‌های CTO تو به معنای Newport سرمایهٔ شغلی‌اند: کمیاب و ارزشمند. ذهنیت صنعتگر می‌پرسد بازار هلند از تو چه می‌خواهد، نه اینکه آیا این مهاجرت حس اشتیاق می‌دهد."}},{"kind":"check","id":"b28ak1","type":"tap","source":"b28a1","prompt":{"en":"What does the craftsman mindset ask about the move?","fa":"ذهنیت صنعتگر دربارهٔ مهاجرت چه می‌پرسد؟"},"options":[{"en":"What the Dutch market needs from you","fa":"بازار هلند از تو چه می‌خواهد"},{"en":"Whether the move feels like your passion","fa":"آیا مهاجرت حس اشتیاق می‌دهد"},{"en":"How soon you can get a promotion","fa":"چقدر زود می‌توانی ترفیع بگیری"}],"answer":0},{"kind":"card","id":"b28a2","source":"Rule 2 to Rule 3, trading capital for control; the first control trap","text":{"en":"Trade capital for control step by step: the small AI product is a bid for control that your skills can already fund. Quitting the job before it earns anything is the first control trap.","fa":"سرمایه را قدم‌به‌قدم با کنترل معاوضه کن: محصول کوچک AI تلاشی برای کنترل است که مهارت‌هایت از همین حالا می‌توانند تأمینش کنند. ترک شغل پیش از آنکه چیزی درآورد، تلهٔ اول کنترل است."}},{"kind":"check","id":"b28ak2","type":"tf","source":"b28a2","prompt":{"en":"Quitting the job before the product earns anything is a safe bid for control.","fa":"ترک شغل پیش از آنکه محصول چیزی درآورد، تلاشی امن برای کنترل است."},"answer":false},{"kind":"card","id":"b28a3","source":"Rule 3, the law of financial viability","text":{"en":"The law of financial viability is your €100 test: pursue more control only when people pay for the product. Until then the job and index investing stay the base.","fa":"قانون پایداری مالی همان آزمون ۱۰۰ یورویی توست: فقط وقتی دنبال کنترل بیشتر برو که مردم برای محصول پول بدهند. تا آن زمان، شغل و سرمایه‌گذاری شاخصی پایه می‌مانند."}},{"kind":"check","id":"b28ak3","type":"tap","source":"b28a3","prompt":{"en":"When does the law of financial viability let you pursue more control?","fa":"قانون پایداری مالی کی اجازه می‌دهد دنبال کنترل بیشتر بروی؟"},"options":[{"en":"Only when people pay for the product","fa":"فقط وقتی مردم برای محصول پول بدهند"},{"en":"As soon as the product ships","fa":"به محض انتشار محصول"},{"en":"When your savings reach €40k","fa":"وقتی پس‌اندازت به ۴۰ هزار یورو برسد"}],"answer":0},{"kind":"card","id":"b28a4","source":"Rule 4, the adjacent possible and little bets; Rule 2, deliberate practice","text":{"en":"Find the mission in the adjacent possible of what you already do: AI tooling at the edge of your own engineering. Explore it with little bets, and treat the reading hour as deliberate practice.","fa":"مأموریت را در «مجاورِ ممکنِ» کاری که همین حالا می‌کنی پیدا کن: ابزارهای AI در لبهٔ مهندسی خودت. آن را با شرط‌های کوچک بکاو و ساعت مطالعه را تمرین عامدانه بدان."}}]]}];
  // BOOKS:END
  // Sections of Units (ADR-0009, decisions 22 to 28). A book is three Units: two halves of its essentials, then "Put it to work".
  const UNIT_NAMES = [T('Key ideas, part 1', 'ایده‌های کلیدی، بخش ۱'), T('Key ideas, part 2', 'ایده‌های کلیدی، بخش ۲'), T('Put it to work', 'به کار بگیر')];
  const SECTION_XP = 30;
  const books = BOOKS.flatMap((b) => b.units.map((items, i) => ({
    id: `${b.id}u${i + 1}`, book: true, bookId: b.id, unit: i + 1, addition: i === 2,
    fareSize: Math.min(3, items.filter((x) => x.kind === 'check').length), xp: 20, hints: 'full', theme: 'book',
    title: b.title, author: b.author, year: b.year, stage: b.stage, must: b.must, why: b.why,
    name: UNIT_NAMES[i], badge: null, items,
  })));
  const stations = pathStations.concat(books);
  const allStations = () => pathStations;
  const rank = (b) => b.stage * 2 + (b.must ? 0 : 1);
  const bookOrder = readingOrder.concat(BOOKS.filter((b) => !readingOrder.includes(b.id)).sort((a, b) => rank(a) - rank(b) || a.id.localeCompare(b.id)).map((b) => b.id));
  const sections = [{ id: 'basics', kind: 'basics', name: T(ui.en.basics, ui.fa.basics), sub: T(ui.en.basicsSub, ui.fa.basicsSub), units: pathStations.map((st) => st.id) }]
    .concat(bookOrder.map((id) => { const b = BOOKS.find((x) => x.id === id); return { id: `sec-${id}`, kind: 'book', bookId: id, title: b.title, author: b.author, year: b.year, stage: b.stage, must: b.must, why: b.why, badge: b.badge, xp: SECTION_XP, units: [1, 2, 3].map((n) => `${id}u${n}`) }; }));
  const sectionOf = (bookId) => sections.find((x) => x.bookId === bookId);
  const totalXp = () => stations.reduce((a, st) => a + st.xp, 0) + sections.filter((x) => x.kind === 'book').length * SECTION_XP + MILESTONE_XP;


  const item = (stationId, id) => {
    const st = stations.find((s) => s.id === stationId);
    return st && st.items.find((i) => i.id === id);
  };
  const station = (stationId) => stations.find((s) => s.id === stationId);

  const FA_DIGITS = '۰۱۲۳۴۵۶۷۸۹';
  const faDigits = (str) => String(str).replace(/[0-9]/g, (d) => FA_DIGITS[+d]);
  const fmt = (n, mode) => {
    const s = Number(n).toLocaleString('en-US');
    return mode === 'FA' ? faDigits(s).replace(/,/g, '٬') : s;
  };

  // Render a {en, fa} pair for a Language Mode. Both mode is EN-led (ADR-0006).
  const text = (pair, mode) => {
    if (!pair) return { top: '', under: null };
    if (mode === 'FA') return { top: pair.fa, under: null };
