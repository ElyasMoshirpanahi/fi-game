<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FI Roadmap</title>
<meta name="description" content="A dual-language (Farsi and English) learning game built from a roadmap to financial independence. Educational, not investment advice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f6f8; --card: #ffffff; --text: #1f2937; --muted: #6b7280; --border: #e5e7eb; --line: #d9dee5;
  --accent: #0f766e; --accent-strong: #0b5d57; --accent-soft: #e6f4f1;
  --gold: #d97706; --gold-soft: #fff4e0; --gold-strong: #b45309;
  --ok: #15803d; --ok-soft: #e7f7ec; --bad: #b91c1c; --bad-soft: #fdecec;
  --shadow: 0 10px 30px rgba(17, 24, 39, .08); --radius: 18px;
  --fa-font: Vazirmatn, Tahoma, sans-serif; --en-font: Inter, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1419; --card: #171d25; --text: #e5e7eb; --muted: #9aa3af; --border: #2a3340; --line: #2f3946;
    --accent: #2dd4bf; --accent-strong: #5eead4; --accent-soft: #10302d;
    --gold: #f59e0b; --gold-soft: #3a2a0d; --gold-strong: #fbbf24;
    --ok: #4ade80; --ok-soft: #10301c; --bad: #f87171; --bad-soft: #3a1414;
    --shadow: 0 10px 30px rgba(0, 0, 0, .4);
  }
}
* { box-sizing: border-box; }
html { height: 100%; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--en-font); line-height: 1.5; -webkit-font-smoothing: antialiased; }
html[lang="fa"] body { font-family: var(--fa-font); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 12px; }
#app { width: min(480px, 100%); margin: 0 auto; padding-bottom: 90px; }
.t-fa { font-family: var(--fa-font); direction: rtl; unicode-bidi: isolate; display: block; }
.t-en { font-family: var(--en-font); direction: ltr; unicode-bidi: isolate; display: block; }
.under { color: var(--muted); font-size: .92em; margin-top: 6px; }
bdi { unicode-bidi: isolate; }
bdi.nw { white-space: nowrap; }

/* top bar */
.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.modes { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--card); }
.modes button { border: 0; background: transparent; padding: 5px 10px; border-radius: 999px; font-weight: 700; font-size: 13px; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.xpbar { flex: 1; height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; }
.xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-strong)); border-radius: 999px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
html[dir="rtl"] .xpbar i { margin-inline-start: auto; }
.coins { display: inline-flex; align-items: center; gap: 5px; font-weight: 800; font-size: 14px; color: var(--gold-strong); background: var(--gold-soft); border-radius: 999px; padding: 4px 10px; }
.coins svg { width: 14px; height: 14px; }
.coins { position: relative; }
.coins.bump .n { animation: bump .5s cubic-bezier(.2,1.6,.4,1); display: inline-block; }
.coins .plus { position: absolute; inset-inline-end: 4px; top: -4px; font-size: 12px; animation: floatup .9s ease-out forwards; pointer-events: none; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }
@keyframes floatup { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-18px); opacity: 0; } }
.icon { border: 1px solid var(--line); background: var(--card); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
.icon svg { width: 18px; height: 18px; }

/* path */
.path { padding: 22px 14px 70px; }
.path h1 { font-size: 24px; margin: 0; letter-spacing: -.01em; }
.path .sub { margin: 4px 0 26px; color: var(--muted); font-size: 14px; }
.nodes { list-style: none; margin: 0; padding: 0; position: relative; }
.nodes::before { content: ""; position: absolute; left: 50%; top: 40px; bottom: 40px; width: 4px; margin-left: -2px; background: repeating-linear-gradient(to bottom, var(--line) 0 10px, transparent 10px 20px); border-radius: 2px; }
.node { position: relative; display: flex; flex-direction: column; align-items: center; margin: 0 0 30px; width: 150px; }
.node:nth-child(odd) { margin-inline-start: 8%; }
.node:nth-child(even) { margin-inline-start: auto; margin-inline-end: 8%; }
.node > .ubtn { position: relative; width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--card); box-shadow: 0 7px 0 var(--line), var(--shadow); display: grid; place-items: center; transition: transform .15s, box-shadow .15s; }
.node > .ubtn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--line); }
@property --p { syntax: '<number>'; inherits: true; initial-value: 0; }
.node .ring { position: absolute; inset: -9px; border-radius: 50%; animation: ringin .8s cubic-bezier(.2,.8,.2,1) both; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px)); mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px)); transition: background .5s; }
.node .ico { width: 36px; height: 36px; color: var(--accent); }
.node.lit > .ubtn { background: var(--gold); box-shadow: 0 7px 0 var(--gold-strong), var(--shadow); }
.node.lit .ico { color: #fff; }
.node.lit .ring { background: conic-gradient(var(--gold) 100%, var(--gold) 0); }
.node.dim > .ubtn { background: var(--bg); box-shadow: 0 7px 0 var(--line); }
.node.dim .ico { color: var(--muted); opacity: .6; }
.node.dim .ring { background: var(--line); }
.node.cur > .ubtn { animation: pulse 1.8s ease-in-out infinite; }
@keyframes ringin { from { --p: 0; } }
@keyframes pulse { 0%, 100% { box-shadow: 0 7px 0 var(--line), 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 60% { box-shadow: 0 7px 0 var(--line), 0 0 0 16px transparent; } }
.node .label { margin-top: 14px; font-weight: 700; font-size: 14px; text-align: center; }
.node .label .under { font-size: 12px; }
.node .badge { position: absolute; top: -6px; inset-inline-end: 10px; background: var(--card); color: var(--gold-strong); border: 2px solid var(--gold); border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 800; white-space: nowrap; }
.node .planned { margin-top: 4px; font-size: 11px; color: var(--muted); }
.pathfoot { margin-top: 10px; display: flex; justify-content: center; }
.pathbar { display: flex; gap: 8px; flex-wrap: wrap; margin: -14px 0 14px; }
.linkish { border: 0; background: transparent; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 6px; }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; background: var(--bad-soft); color: var(--bad); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.confirm button { border: 1px solid currentColor; background: transparent; border-radius: 999px; padding: 5px 12px; font-weight: 700; color: inherit; }

/* station */
.station { padding: 14px 16px 24px; }
.shead { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.prog { flex: 1; height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
html[dir="rtl"] .prog i { margin-inline-start: auto; }
.count { font-size: 13px; color: var(--muted); font-weight: 700; min-width: 40px; text-align: end; }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 20px; box-shadow: var(--shadow); transition: transform .2s, box-shadow .2s; }
@media (hover: hover) { .panel.card:hover { transform: translateY(-2px); } }
.kicker { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }
.kicker.fare { color: var(--gold-strong); }
.stagechip { margin-inline-start: 10px; text-transform: none; letter-spacing: 0; font-size: 11px; padding: 2px 9px; vertical-align: middle; }
.panel.callout { border-inline-start: 5px solid var(--accent); background: var(--accent-soft); }
.slot[draggable] { cursor: grab; }
.markbtn { float: inline-end; border: 1px solid var(--line); background: var(--card); width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); margin-top: -6px; }
.markbtn svg { width: 16px; height: 16px; }
.markbtn.on { color: var(--gold-strong); border-color: var(--gold); background: var(--gold-soft); }
.footbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; color: var(--text); }
.footbtn svg { width: 14px; height: 14px; color: var(--gold-strong); }
.footbtn b { background: var(--gold-soft); color: var(--gold-strong); border-radius: 999px; padding: 0 7px; }
.marks { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.mark { border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; background: var(--bg); }
.mark .kicker { margin-bottom: 6px; }
.ctext.small { font-size: 16px; font-weight: 500; margin-bottom: 10px; }
.mark .brow { justify-content: flex-end; }
.ctext { font-size: 20px; font-weight: 600; line-height: 1.5; margin: 0; }
.ctext .t-fa { font-size: 20px; }
.ctext .under { font-size: 17px; font-weight: 400; }
.prompt { font-size: 19px; font-weight: 700; margin: 0 0 16px; line-height: 1.45; }
.addnote { margin: 14px 0 0; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.addnote a { color: var(--accent); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.actions .wide { grid-column: 1 / -1; }
.btn { border: 2px solid var(--line); border-bottom-width: 5px; background: var(--card); border-radius: 14px; padding: 13px 14px; font-weight: 700; font-size: 16px; text-align: center; transition: transform .08s, border-color .15s, background .15s; }
.btn:active { transform: translateY(3px); border-bottom-width: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent-strong); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.soft { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 25%, transparent); color: var(--accent-strong); }
.btn.soft[aria-pressed="true"] { border-color: var(--accent); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.opts { display: grid; gap: 10px; margin-top: 6px; }
.opt { text-align: start; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrongpick { border-color: var(--bad); background: var(--bad-soft); }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.slots { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; padding: 8px; border: 2px dashed var(--line); border-radius: 12px; margin-bottom: 12px; }
.slot { background: var(--accent-soft); color: var(--accent-strong); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.slot b { opacity: .7; }
.help { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
.hint { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--gold-soft); border-inline-start: 4px solid var(--gold); font-size: 15px; }
.hint .kicker { color: var(--gold-strong); margin-bottom: 6px; }
.feedback { scroll-margin-bottom: 84px; margin-top: 14px; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 800; animation: rise .25s ease-out; }
.feedback.ok { background: var(--ok-soft); color: var(--ok); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.feedback .btn { flex: 0 0 auto; padding: 10px 18px; }
.feedback.ok .btn { background: var(--ok); border-color: color-mix(in srgb, var(--ok) 70%, #000); color: #fff; }
.feedback.bad .btn { background: var(--bad); border-color: color-mix(in srgb, var(--bad) 70%, #000); color: #fff; }
.feedback .msg { display: flex; flex-direction: column; gap: 2px; }
.feedback .msg small { font-weight: 600; opacity: .85; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.result { text-align: center; padding: 34px 20px; }
.result .big { width: 120px; height: 120px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center; background: var(--gold-soft); color: var(--gold-strong); box-shadow: 0 8px 0 var(--gold); animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
.result .big svg { width: 56px; height: 56px; }
.result.fail .big { background: var(--bad-soft); color: var(--bad); box-shadow: 0 8px 0 var(--bad); }
.result h2 { margin: 0 0 6px; font-size: 22px; }
.result p { margin: 0 0 20px; color: var(--muted); }
.inl .t-en, .inl .t-fa { display: inline; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }

/* disclaimer, always visible */
.disc { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; text-align: center; font-size: 12px; padding: 8px 12px; background: var(--gold-soft); color: var(--gold-strong); border-top: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); }
.disc .t-fa, .disc .t-en { display: inline; }
.disc .sep { margin: 0 8px; opacity: .5; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
/* ---- Prompt 3: themes per Station ---- */
[data-theme="blue"] { --accent: #2563eb; --accent-strong: #1d4ed8; --accent-soft: #e6eefc; }
[data-theme="red"] { --accent: #dc2626; --accent-strong: #b91c1c; --accent-soft: #fde8e8; }
[data-theme="green"] { --accent: #16a34a; --accent-strong: #15803d; --accent-soft: #e6f6ec; }
[data-theme="amber"] { --accent: #d97706; --accent-strong: #b45309; --accent-soft: #fff1dc; }
[data-theme="purple"] { --accent: #7c3aed; --accent-strong: #6d28d9; --accent-soft: #efe8fd; }
[data-theme="book"] { --accent: #0f766e; --accent-strong: #0b5d57; --accent-soft: #e6f4f1; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) [data-theme="blue"] { --accent: #60a5fa; --accent-strong: #93c5fd; --accent-soft: #0f2340; }
  :root:not([data-theme="light"]) [data-theme="red"] { --accent: #f87171; --accent-strong: #fca5a5; --accent-soft: #3a1414; }
  :root:not([data-theme="light"]) [data-theme="green"] { --accent: #4ade80; --accent-strong: #86efac; --accent-soft: #10301c; }
  :root:not([data-theme="light"]) [data-theme="amber"] { --accent: #fbbf24; --accent-strong: #fcd34d; --accent-soft: #3a2a0d; }
  :root:not([data-theme="light"]) [data-theme="purple"] { --accent: #a78bfa; --accent-strong: #c4b5fd; --accent-soft: #26183f; }
  :root:not([data-theme="light"]) [data-theme="book"] { --accent: #2dd4bf; --accent-strong: #5eead4; --accent-soft: #10302d; }
}
/* ---- Path extras ---- */
.sections { display: grid; gap: 10px; }
.sec { border: 1px solid var(--border); border-radius: 16px; background: var(--card); overflow: hidden; }
.sec.open { background: transparent; }
.sechead { display: flex; align-items: center; gap: 12px; width: 100%; text-align: start; border: 0; background: var(--card); padding: 12px 14px; cursor: pointer; color: var(--text); }
.sechead .n { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; background: var(--line); display: grid; place-items: center; font-weight: 800; font-size: 12px; }
.sec.book .sechead .n { background: var(--accent-soft); color: var(--accent-strong); }
.sechead .st { flex: 1; min-width: 0; } .sechead .st b { display: block; font-size: 15px; line-height: 1.3; } .sechead .st > span { display: block; font-size: 12px; color: var(--muted); }
.sechead .prog { flex: 0 0 auto; font-size: 12px; font-weight: 800; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.sechead .prog .tick { width: 16px; height: 16px; border-radius: 50%; background: var(--gold); color: #fff; display: grid; place-items: center; } .sechead .prog .tick svg { width: 10px; height: 10px; }
.picker svg { width: 14px; height: 14px; vertical-align: -2px; margin-inline-start: 4px; } .sechead .prog.done { color: var(--gold-strong); }
.sec.open .sechead { border-bottom: 1px solid var(--border); }
.sechead.banner { align-items: flex-start; background: linear-gradient(135deg, var(--accent-soft), var(--card)); }
.sechead.banner .cover { flex: 0 0 auto; width: 44px; height: 60px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 20px; }
.sechead.banner .st b { font-size: 17px; } .sechead.banner .why { margin-top: 4px; font-size: 13px; color: var(--text); }
.sechead.banner .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.sechead .badge { position: static; }
.sec .nodes { padding: 16px 0 10px; }
.node .unum { font-size: 26px; font-weight: 800; color: var(--accent); }
.node.lit .unum { color: #fff; }
.picker { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); z-index: 11; border: 0; background: var(--text); color: var(--bg); border-radius: 999px; padding: 10px 18px; font-weight: 800; font-size: 14px; box-shadow: var(--shadow); }
.sheet { position: fixed; inset: auto 0 0 0; z-index: 12; background: var(--card); border-radius: 20px 20px 0 0; padding: 16px 16px 60px; max-height: 70vh; overflow: auto; box-shadow: 0 -10px 30px rgba(0,0,0,.35); width: min(480px, 100%); margin: 0 auto; }
.sheet h3 { margin: 0 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.sheet .row { display: flex; gap: 10px; align-items: center; width: 100%; text-align: start; padding: 10px 4px; border: 0; border-bottom: 1px solid var(--border); background: transparent; color: var(--text); }
.sheet .row.on { color: var(--accent-strong); }
.sheet .row .n { width: 26px; height: 26px; border-radius: 50%; background: var(--line); display: grid; place-items: center; font-size: 11px; font-weight: 800; flex: 0 0 auto; }
.sheet .row .t { flex: 1; font-weight: 600; font-size: 14px; } .sheet .row .p { font-size: 12px; color: var(--muted); font-weight: 700; }
.node .tools { margin-top: 8px; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; color: var(--muted); }
.node .tools svg { width: 13px; height: 13px; }
.milestone-chip { margin: 10px 0 0; display: flex; gap: 10px; align-items: center; background: var(--gold-soft); color: var(--gold-strong); border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: 14px; }
.milestone-chip svg { width: 18px; height: 18px; flex: 0 0 auto; }
/* ---- Tools screen ---- */
.ttitle { margin: 0; font-size: 20px; flex: 1; }
.tools .panel { margin-bottom: 14px; }
.widget { margin-top: 6px; }
.srow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; margin: 12px 0 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
.srow output { font-weight: 800; color: var(--text); }
.srow input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.sliders .out { margin: 6px 0 14px; } .sliders .out b { display: block; font-size: 28px; letter-spacing: -.01em; } .sliders .out small { color: var(--muted); font-weight: 600; }
.habitgrid { width: 100%; border-collapse: collapse; table-layout: fixed; }
.habitgrid th { font-size: 11px; color: var(--muted); font-weight: 700; padding: 4px 2px; text-align: start; }
.habitgrid th[scope="row"] { width: 34%; font-size: 12px; }
.habitgrid td { padding: 3px 2px; text-align: center; }
.cell { width: 100%; aspect-ratio: 1; max-width: 36px; border-radius: 9px; border: 2px solid var(--line); background: var(--card); display: inline-grid; place-items: center; padding: 0; }
.cell svg { width: 16px; height: 16px; color: #fff; }
.cell.on { background: var(--accent); border-color: var(--accent); }
.journal textarea { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 12px; resize: vertical; min-height: 120px; }
.journal textarea:focus { outline: none; border-color: var(--accent); }
.prog.big { height: 14px; margin-bottom: 4px; }
.clist h3 { font-size: 15px; margin: 14px 0 8px; }
.citem { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: start; background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-weight: 600; }
.citem .box { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; margin-top: 2px; }
.citem .box svg { width: 14px; height: 14px; color: #fff; }
.citem.on { border-color: var(--accent); } .citem.on .box { background: var(--accent); border-color: var(--accent); }

.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 700; color: var(--muted); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

.filters input:focus { outline: none; border-color: var(--accent); }
.order h3 { font-size: 15px; margin: 0 0 8px; }
.rorder { list-style: none; margin: 0 0 8px; padding: 0; counter-reset: ro; }
.rorder li { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
.rorder .n { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: 0 0 auto; }
.rorder .linkish { flex: 1; text-align: start; text-decoration: none; color: var(--text); font-weight: 600; font-size: 14px; padding: 2px 0; }
.rorder li.lit .linkish { color: var(--muted); }
.rorder .tick { width: 20px; height: 20px; border-radius: 50%; background: var(--gold); color: #fff; display: grid; place-items: center; } .rorder .tick svg { width: 12px; height: 12px; }
.books { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 10px; }
.book { border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; background: var(--bg); }
.book.lit { border-color: var(--gold); }
.bhead { display: flex; gap: 10px; align-items: flex-start; }
.bhead .mark, .bookhead .mark { flex: 0 0 auto; font-size: 14px; margin-top: 2px; }
.bhead b { display: block; font-size: 15px; line-height: 1.3; }
.meta { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.bhead .badge, .bookhead .badge { margin-inline-start: auto; background: var(--card); color: var(--gold-strong); border: 2px solid var(--gold); border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 800; white-space: nowrap; }
.book .why { margin: 8px 0; font-size: 14px; }

.bookhead { display: flex; gap: 10px; align-items: flex-start; padding: 0 4px 12px; }
.bookhead b { display: block; font-size: 16px; line-height: 1.3; }
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .55); display: grid; place-items: center; padding: 20px; }
.overlay .panel { width: min(420px, 100%); }
.result.milestone .big { background: var(--gold); color: #fff; box-shadow: 0 8px 0 var(--gold-strong); }
/* ---- Prompt 4: three camera moments. Each under 800 ms, CSS transforms only, off under reduced motion. ---- */
/* 1. First load: wide establishing view of the whole Path, then an ease-in to the current node ("wide shot to close-up"). */
.path.intro .nodes { animation: cam-intro .75s cubic-bezier(.2,.7,.2,1) both; }
@keyframes cam-intro { from { transform: scale(.82); opacity: .6; } 60% { opacity: 1; } to { transform: scale(1); opacity: 1; } }
/* 2. Station completion: the view pulls back to show the whole Path and the newly lit node ("pull-out"). */
.path.pullout .nodes { animation: cam-pullout .7s cubic-bezier(.2,.7,.2,1) both; }
@keyframes cam-pullout { from { transform: scale(1.1); } to { transform: scale(1); } }
.node.justlit > .ubtn { animation: cam-pop .6s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes cam-pop { from { transform: scale(.7); } 70% { transform: scale(1.12); } to { transform: scale(1); } }
/* 3. The final Milestone: a slow scale and blur of the background behind the badge (a restrained "dolly zoom"). */
.overlay.dolly { animation: cam-fade .75s ease-out both; }
.overlay.dolly .panel { animation: cam-dolly .75s cubic-bezier(.2,.7,.2,1) both; }
.dolly-bg { animation: cam-bg .75s ease-out both; }
@keyframes cam-fade { from { background: rgba(0,0,0,0); } to { background: rgba(0,0,0,.55); } }
@keyframes cam-dolly { from { transform: scale(.86); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes cam-bg { from { transform: scale(1); filter: blur(0); } to { transform: scale(1.04); filter: blur(4px); } }
.dolly-bg { transform: scale(1.04); filter: blur(4px); }

  const BOOKS = [{"id":"b01","title":"The Psychology of Money","author":{"en":"Morgan Housel","fa":"Morgan Housel"},"year":2020,"stage":1,"must":true,"why":{"en":"Behaviour matters more than formulas","fa":"رفتار مهم‌تر از فرمول است"},"badge":{"en":"Stay in the game","fa":"در بازی بمان"},"units":[[{"kind":"card","id":"b01c1","source":"ch. 1, No One's Crazy","text":{"en":"Doing well with money has little to do with how smart you are and a lot to do with how you behave. Everyone decides with their own life experience, so no one is crazy.","fa":"موفقیت مالی ربط چندانی به هوش ندارد و بیشتر به رفتار بستگی دارد. هرکس با تجربهٔ زندگی خودش تصمیم می‌گیرد، پس هیچ‌کس دیوانه نیست."}},{"kind":"card","id":"b01c2","source":"ch. 4, Confounding Compounding","text":{"en":"Warren Buffett built most of his fortune after age 65. His skill is investing, but his secret is time: compounding needs decades, not clever moves.","fa":"Warren Buffett بیشتر ثروتش را بعد از ۶۵ سالگی ساخت. مهارتش سرمایه‌گذاری است، اما رازش زمان است: مرکب شدن به دهه‌ها نیاز دارد، نه حرکت‌های زیرکانه."}},{"kind":"check","id":"b01k1","type":"tap","source":"b01c1","prompt":{"en":"According to Housel, doing well with money depends mostly on what?","fa":"به گفتهٔ Housel، موفقیت مالی بیشتر به چه چیزی بستگی دارد؟"},"options":[{"en":"How you behave","fa":"اینکه چطور رفتار می‌کنی"},{"en":"How smart you are","fa":"اینکه چقدر باهوشی"},{"en":"How much you earn","fa":"اینکه چقدر درآمد داری"}],"answer":0},{"kind":"card","id":"b01c3","source":"ch. 5, Getting Wealthy vs. Staying Wealthy","text":{"en":"Getting wealthy and staying wealthy are different skills. Getting it takes risk and optimism; keeping it takes frugality, paranoia and survival.","fa":"ثروتمند شدن و ثروتمند ماندن دو مهارت متفاوت‌اند. اولی ریسک و خوش‌بینی می‌خواهد؛ دومی صرفه‌جویی، بدگمانی و بقا."}},{"kind":"check","id":"b01k2","type":"tf","source":"b01c3","prompt":{"en":"Housel says getting wealthy and staying wealthy need the same skill.","fa":"Housel می‌گوید ثروتمند شدن و ثروتمند ماندن به یک مهارت نیاز دارند."},"answer":false}],[{"kind":"card","id":"b01c4","source":"ch. 9, Wealth is What You Don't See","text":{"en":"Wealth is the nice car not bought and the watch not worn. Spending money to show people how much money you have is the fastest way to have less money.","fa":"ثروت همان ماشین گرانی است که نخریدی و ساعتی که نبستی. خرج کردن پول برای نشان دادن پولت به دیگران، سریع‌ترین راه برای کم‌پول‌تر شدن است."}},{"kind":"card","id":"b01c5","source":"ch. 13, Room for Error","text":{"en":"Plan on the plan not going to plan. Room for error, cash and no leverage, keeps you in the game long enough for compounding to work.","fa":"برنامه‌ریزی کن که برنامه طبق برنامه پیش نرود. حاشیهٔ خطا، یعنی پول نقد و بدون اهرم، تو را آن‌قدر در بازی نگه می‌دارد که مرکب شدن کار کند."}},{"kind":"check","id":"b01k3","type":"tap","source":"b01c4","prompt":{"en":"What does Housel call the fastest way to have less money?","fa":"Housel چه چیزی را سریع‌ترین راه کم‌پول‌تر شدن می‌داند؟"},"options":[{"en":"Spending money to show people how much you have","fa":"خرج کردن پول برای نشان دادن پولت به دیگران"},{"en":"Keeping cash in a bank account","fa":"نگه داشتن پول نقد در حساب بانکی"},{"en":"Buying index funds too early","fa":"خرید زودهنگام صندوق‌های شاخصی"}],"answer":0},{"kind":"card","id":"b01c6","source":"ch. 7, Freedom","text":{"en":"The highest dividend money pays is control over your time. Doing what you want, when you want, with who you want, for as long as you want.","fa":"بالاترین سودی که پول می‌دهد، کنترل بر زمان خودت است. انجام دادن کاری که می‌خواهی، هر وقت که می‌خواهی، با هرکس که می‌خواهی، تا هر وقت که می‌خواهی."}},{"kind":"check","id":"b01k4","type":"tf","source":"b01c6","prompt":{"en":"Housel calls control over your time the highest dividend money pays.","fa":"Housel کنترل بر زمان خودت را بالاترین سود پول می‌داند."},"answer":true}],[{"kind":"card","id":"b01a1","source":"ch. 5, Getting Wealthy vs. Staying Wealthy","text":{"en":"Startup equity is Housel's getting-wealthy skill: risk and optimism. Your index core is the staying-wealthy skill, so decide before you sign what share of your €40k never goes into one bet.","fa":"سهام استارتاپ همان مهارت «ثروتمند شدن» Housel است: ریسک و خوش‌بینی. هستهٔ شاخصی‌ات مهارت «ثروتمند ماندن» است، پس پیش از امضا تصمیم بگیر چه سهمی از ۴۰ هزار یورویت هرگز وارد یک شرط‌بندی واحد نشود."}},{"kind":"card","id":"b01a2","source":"ch. 13, Room for Error","text":{"en":"Room for error, applied: before you open a broker account in the Netherlands, keep enough cash for months of expenses so a market drop never forces you to sell.","fa":"حاشیهٔ خطا در عمل: پیش از باز کردن حساب کارگزاری در هلند، آن‌قدر پول نقد برای چند ماه هزینه نگه دار که هیچ سقوط بازاری تو را مجبور به فروش نکند."}},{"kind":"check","id":"b01ak1","type":"tap","source":"b01a1","prompt":{"en":"Applying Housel, which skill does your startup equity belong to?","fa":"با نگاه Housel، سهام استارتاپ تو به کدام مهارت تعلق دارد؟"},"options":[{"en":"Getting wealthy: risk and optimism","fa":"ثروتمند شدن: ریسک و خوش‌بینی"},{"en":"Staying wealthy: survival","fa":"ثروتمند ماندن: بقا"},{"en":"Neither, it is pure luck","fa":"هیچ‌کدام، فقط شانس است"}],"answer":0},{"kind":"card","id":"b01a3","source":"ch. 3, Never Enough; ch. 7, Freedom","text":{"en":"Housel's 'enough' is a number you choose yourself. Write yours down: the roadmap's version is 25 times annual expenses, and what it buys is control over your time.","fa":"«کافیِ» Housel عددی است که خودت انتخاب می‌کنی. عددت را بنویس: نسخهٔ نقشهٔ راه ۲۵ برابر هزینهٔ سالانه است، و چیزی که می‌خرد کنترل بر زمان خودت است."}},{"kind":"check","id":"b01ak2","type":"tf","source":"b01a2","prompt":{"en":"Housel's room for error means moving all your cash into the market the day you get a BSN.","fa":"حاشیهٔ خطای Housel یعنی همان روزی که BSN می‌گیری همهٔ پول نقدت را وارد بازار کنی."},"answer":false},{"kind":"card","id":"b01a4","source":"ch. 9, Wealth is What You Don't See","text":{"en":"A Dutch salary will tempt you to show it. Wealth is the raise you invest instead of spend, so set the monthly index purchase to run automatically before your lifestyle grows.","fa":"حقوق هلندی وسوسه‌ات می‌کند که نشانش بدهی. ثروت همان افزایش حقوقی است که به جای خرج کردن سرمایه‌گذاری می‌کنی، پس خرید ماهانهٔ شاخصی را پیش از بزرگ شدن سبک زندگی‌ات خودکار کن."}},{"kind":"check","id":"b01ak3","type":"tap","source":"b01a3","prompt":{"en":"What is Housel's 'enough', applied to you?","fa":"«کافیِ» Housel برای تو چیست؟"},"options":[{"en":"A number you choose yourself","fa":"عددی که خودت انتخاب می‌کنی"},{"en":"The average market return","fa":"میانگین بازده بازار"},{"en":"Whatever your colleagues have","fa":"هرچه همکارانت دارند"}],"answer":0}]]},{"id":"b02","title":"The Simple Path to Wealth","author":{"en":"JL Collins","fa":"JL Collins"},"year":2016,"stage":1,"must":true,"why":{"en":"The whole index strategy in one simple book","fa":"کل استراتژی شاخصی در یک کتاب ساده"},"badge":{"en":"F-You Money","fa":"پول F-You"},"units":[[{"kind":"card","id":"b02c1","source":"Introduction, The Simple Path","text":{"en":"The whole path fits in one line: spend less than you earn, invest the surplus, avoid debt. Complex investments exist mainly to profit those who sell them.","fa":"کل مسیر در یک جمله جا می‌شود: کمتر از درآمدت خرج کن، مازاد را سرمایه‌گذاری کن، از بدهی دوری کن. سرمایه‌گذاری‌های پیچیده بیشتر برای سود فروشندگانشان وجود دارند."}},{"kind":"card","id":"b02c2","source":"ch. Why you need F-You Money","text":{"en":"F-You Money is enough savings to walk away from a bad job or a bad boss. For Collins it matters long before full financial independence.","fa":"F-You Money یعنی پس‌اندازی که بگذارد از یک شغل بد یا رئیس بد دور شوی. برای Collins این پول خیلی پیش از استقلال مالی کامل اهمیت دارد."}},{"kind":"check","id":"b02k1","type":"tap","source":"b02c1","prompt":{"en":"Collins' simple path: spend less than you earn, invest the surplus, and...?","fa":"مسیر سادهٔ Collins: کمتر از درآمدت خرج کن، مازاد را سرمایه‌گذاری کن و...؟"},"options":[{"en":"Avoid debt","fa":"از بدهی دوری کن"},{"en":"Buy a bigger house","fa":"خانهٔ بزرگ‌تری بخر"},{"en":"Pick winning stocks","fa":"سهم‌های برنده را انتخاب کن"}],"answer":0},{"kind":"card","id":"b02c3","source":"ch. The market always goes up","text":{"en":"Over the long run the market always goes up, through every crash. Collins' rule: nobody can time the market, so never sell in a panic.","fa":"در بلندمدت بازار همیشه بالا می‌رود، از دل هر سقوطی. قاعدهٔ Collins: هیچ‌کس نمی‌تواند بازار را زمان‌بندی کند، پس هرگز با وحشت نفروش."}},{"kind":"check","id":"b02k2","type":"tf","source":"b02c3","prompt":{"en":"Collins recommends selling when the market falls, to buy back cheaper.","fa":"Collins توصیه می‌کند وقتی بازار می‌ریزد بفروشی تا ارزان‌تر بخری."},"answer":false}],[{"kind":"card","id":"b02c4","source":"ch. Keep it simple: considerations and tools","text":{"en":"His whole portfolio fits in one fund: VTSAX, Vanguard's total stock market index fund. One low-cost fund owning nearly every listed US company beats picking stocks or managers.","fa":"کل سبد او در یک صندوق جا می‌شود: VTSAX، صندوق شاخصی کل بازار سهام Vanguard. یک صندوق کم‌هزینه که تقریباً همهٔ شرکت‌های بورسی آمریکا را دارد، از انتخاب سهم یا مدیر بهتر است."}},{"kind":"card","id":"b02c5","source":"ch. Portfolio ideas to build and keep your wealth","text":{"en":"Collins splits life into two stages. In wealth accumulation hold 100% stocks; in wealth preservation add a bond fund (VBTLX) to smooth the ride.","fa":"Collins زندگی را به دو مرحله تقسیم می‌کند. در مرحلهٔ انباشت ثروت ۱۰۰٪ سهام نگه دار؛ در مرحلهٔ حفظ ثروت یک صندوق اوراق (VBTLX) اضافه کن تا مسیر هموارتر شود."}},{"kind":"check","id":"b02k3","type":"tap","source":"b02c4","prompt":{"en":"Which single fund does Collins hold?","fa":"Collins کدام صندوق را نگه می‌دارد؟"},"options":[{"en":"VTSAX, a total stock market index fund","fa":"VTSAX، صندوق شاخصی کل بازار سهام"},{"en":"A gold ETF","fa":"یک ETF طلا"},{"en":"An actively managed growth fund","fa":"یک صندوق رشد با مدیریت فعال"}],"answer":0},{"kind":"card","id":"b02c6","source":"ch. Debt: the unacceptable burden","text":{"en":"Debt is not normal; it is an unacceptable burden. Pay off any loan above roughly 5% interest before investing; below 3%, investing may win.","fa":"بدهی عادی نیست؛ باری تحمل‌ناپذیر است. هر وامی با بهرهٔ بالای حدود ۵٪ را پیش از سرمایه‌گذاری تسویه کن؛ زیر ۳٪، شاید سرمایه‌گذاری بهتر باشد."}},{"kind":"check","id":"b02k4","type":"tf","source":"b02c6","prompt":{"en":"Collins says to pay off loans above roughly 5% interest before investing.","fa":"Collins می‌گوید وام‌های با بهرهٔ بالای حدود ۵٪ را پیش از سرمایه‌گذاری تسویه کن."},"answer":true}],[{"kind":"card","id":"b02a1","source":"Introduction, The Simple Path","text":{"en":"Spend less than you earn, invest the surplus, avoid debt: in the Netherlands that becomes a monthly transfer from salary to the broker. Set the amount before the first paycheck arrives.","fa":"کمتر از درآمدت خرج کن، مازاد را سرمایه‌گذاری کن، از بدهی دوری کن: در هلند این یعنی یک انتقال ماهانه از حقوق به کارگزار. مبلغش را پیش از رسیدن اولین حقوق تعیین کن."}},{"kind":"card","id":"b02a2","source":"ch. Why you need F-You Money","text":{"en":"F-You Money for a CTO is the runway to leave a bad role or build your own product. Count how many months your €40k covers before you treat any of it as a bet.","fa":"F-You Money برای یک CTO همان ذخیره‌ای است که بگذارد نقش بد را ترک کند یا محصول خودش را بسازد. پیش از آنکه بخشی از ۴۰ هزار یورویت را شرط‌بندی حساب کنی، بشمار چند ماه را پوشش می‌دهد."}},{"kind":"check","id":"b02ak1","type":"tap","source":"b02a1","prompt":{"en":"In the Netherlands, what does Collins' simple path turn into?","fa":"در هلند مسیر سادهٔ Collins به چه چیزی تبدیل می‌شود؟"},"options":[{"en":"A monthly transfer from salary to the broker","fa":"یک انتقال ماهانه از حقوق به کارگزار"},{"en":"A yearly stock-picking session","fa":"یک جلسهٔ سالانهٔ انتخاب سهم"},{"en":"A loan to invest faster","fa":"وامی برای سرمایه‌گذاری سریع‌تر"}],"answer":0},{"kind":"card","id":"b02a3","source":"ch. Keep it simple: considerations and tools (VTSAX)","text":{"en":"Collins holds one total market index fund; the European form is one all-world ETF such as VWCE or IWDA. The roadmap puts 80 percent of your core there, not in stock picks.","fa":"Collins یک صندوق شاخصی کل بازار دارد؛ شکل اروپایی‌اش یک ETF تمام‌جهانی مثل VWCE یا IWDA است. نقشهٔ راه ۸۰ درصد هسته‌ات را آنجا می‌گذارد، نه در انتخاب سهم."}},{"kind":"check","id":"b02ak2","type":"tf","source":"b02a2","prompt":{"en":"Collins' F-You Money is only for full retirement, not for leaving a bad role.","fa":"F-You Money از نظر Collins فقط برای بازنشستگی کامل است، نه برای ترک یک نقش بد."},"answer":false},{"kind":"card","id":"b02a4","source":"ch. The market always goes up; never sell in a panic","text":{"en":"Collins' rule for the next crash: never sell in a panic. Write it into your decision journal now, while the market is calm, and reread it the day your ETF drops 30 percent.","fa":"قاعدهٔ Collins برای سقوط بعدی: هرگز با وحشت نفروش. همین حالا که بازار آرام است آن را در دفتر تصمیمت بنویس و روزی که ETF تو ۳۰ درصد می‌ریزد دوباره بخوانش."}},{"kind":"check","id":"b02ak3","type":"tap","source":"b02a3","prompt":{"en":"Applying Collins, what fills the 80 percent core?","fa":"با نگاه Collins، ۸۰ درصد هسته با چه چیزی پر می‌شود؟"},"options":[{"en":"One all-world index ETF","fa":"یک ETF شاخصی تمام‌جهانی"},{"en":"Twenty hand-picked stocks","fa":"بیست سهم دست‌چین‌شده"},{"en":"A gold and crypto mix","fa":"ترکیبی از طلا و کریپتو"}],"answer":0}]]},{"id":"b03","title":"Your Money or Your Life","author":{"en":"Vicki Robin and Joe Dominguez","fa":"Vicki Robin و Joe Dominguez"},"year":1992,"stage":1,"must":true,"why":{"en":"The philosophy of financial independence; money equals life energy","fa":"فلسفه استقلال مالی؛ پول = زمان زندگی"},"badge":{"en":"Money is life energy","fa":"پول یعنی انرژی زندگی"},"units":[[{"kind":"card","id":"b03c1","source":"ch. 2, Money Ain't What It Used to Be","text":{"en":"Money is something you trade your life energy for. Every purchase costs hours of your one life, so the question is always: was it worth the hours?","fa":"پول چیزی است که انرژی زندگی‌ات را با آن معاوضه می‌کنی. هر خریدی ساعت‌هایی از تنها زندگی‌ات را می‌بلعد، پس سؤال همیشه این است: ارزش آن ساعت‌ها را داشت؟"}},{"kind":"card","id":"b03c2","source":"Step 2, Being in the present: your real hourly wage","text":{"en":"Your real hourly wage is far lower than your salary suggests. Subtract commuting, work clothes, decompression and job costs, add those hours, and recalculate.","fa":"دستمزد واقعی ساعتی‌ات خیلی کمتر از آن است که حقوقت نشان می‌دهد. هزینهٔ رفت‌وآمد، لباس کار، خستگی‌درکردن و خرج‌های شغلی را کم کن، ساعت‌هایش را اضافه کن و دوباره حساب کن."}},{"kind":"check","id":"b03k1","type":"tap","source":"b03c1","prompt":{"en":"In Your Money or Your Life, what is money?","fa":"در Your Money or Your Life پول چیست؟"},"options":[{"en":"Life energy you trade hours for","fa":"انرژی زندگی که ساعت‌هایت را برایش می‌دهی"},{"en":"A score to maximise","fa":"امتیازی که باید بیشینه‌اش کرد"},{"en":"Something that grows by itself","fa":"چیزی که خودبه‌خود رشد می‌کند"}],"answer":0},{"kind":"card","id":"b03c3","source":"ch. 1, The Fulfillment Curve","text":{"en":"The fulfillment curve rises with spending through survival and comforts, peaks at 'enough', then falls into clutter. More stuff past enough makes life worse.","fa":"منحنی رضایت با خرج کردن بالا می‌رود، از بقا تا آسایش، در نقطهٔ «کافی» به اوج می‌رسد و بعد در شلوغی سقوط می‌کند. چیزهای بیشتر بعد از «کافی» زندگی را بدتر می‌کند."}},{"kind":"check","id":"b03k2","type":"tf","source":"b03c3","prompt":{"en":"The book says fulfillment keeps rising the more you spend.","fa":"کتاب می‌گوید هرچه بیشتر خرج کنی، رضایت هم بیشتر می‌شود."},"answer":false}],[{"kind":"card","id":"b03c4","source":"Step 4, Three questions that will transform your life","text":{"en":"For each spending category ask three questions: did I get fulfillment in proportion to the life energy spent, is it aligned with my values, and how would it change if I did not have to work?","fa":"برای هر دستهٔ خرج سه سؤال بپرس: آیا به اندازهٔ انرژی زندگی‌ای که دادم رضایت گرفتم؟ آیا با ارزش‌هایم هم‌خوان است؟ اگر مجبور به کار کردن نبودم، چه تغییری می‌کرد؟"}},{"kind":"card","id":"b03c5","source":"Step 8, Capital and the Crossover Point","text":{"en":"Track monthly expenses and investment income on one wall chart. The crossover point is the month investment income exceeds expenses: that is financial independence.","fa":"هزینه‌های ماهانه و درآمد سرمایه‌گذاری را روی یک نمودار دیواری ثبت کن. نقطهٔ تقاطع ماهی است که درآمد سرمایه‌گذاری از هزینه‌ها بیشتر می‌شود: این یعنی استقلال مالی."}},{"kind":"check","id":"b03k3","type":"tap","source":"b03c5","prompt":{"en":"When is the crossover point reached?","fa":"نقطهٔ تقاطع کی رخ می‌دهد؟"},"options":[{"en":"Investment income exceeds monthly expenses","fa":"وقتی درآمد سرمایه‌گذاری از هزینه‌های ماهانه بیشتر شود"},{"en":"Your salary doubles","fa":"وقتی حقوقت دو برابر شود"},{"en":"You pay off your mortgage","fa":"وقتی وام مسکنت را تسویه کنی"}],"answer":0},{"kind":"card","id":"b03c6","source":"The nine steps, overview","text":{"en":"The nine steps run in order: first make peace with the past by totalling lifetime earnings and net worth, then track every cent, then tabulate monthly, and finally reach the crossover point.","fa":"نُه گام به ترتیب پیش می‌روند: اول با گذشته آشتی کن و کل درآمد عمر و دارایی خالصت را حساب کن، بعد هر ریال را ثبت کن، بعد ماهانه جدول‌بندی کن و در آخر به نقطهٔ تقاطع برس."}},{"kind":"check","id":"b03k4","type":"order","source":"b03c6","prompt":{"en":"Put the steps in order","fa":"گام‌ها را به ترتیب بچین"},"options":[{"en":"Tabulate monthly","fa":"ماهانه جدول‌بندی کن"},{"en":"Make peace with the past","fa":"با گذشته آشتی کن"},{"en":"Reach the crossover point","fa":"به نقطهٔ تقاطع برس"},{"en":"Track every cent","fa":"هر ریال را ثبت کن"}],"answer":[1,3,0,2]}],[{"kind":"card","id":"b03a1","source":"Step 2, Your real hourly wage","text":{"en":"Compute your real hourly wage before accepting a Dutch offer: subtract commuting, relocation costs and recovery hours from the salary. Compare offers by that number, not the headline.","fa":"پیش از پذیرفتن پیشنهاد کاری در هلند دستمزد واقعی ساعتی‌ات را حساب کن: رفت‌وآمد، هزینهٔ جابه‌جایی و ساعت‌های خستگی‌درکردن را از حقوق کم کن. پیشنهادها را با آن عدد مقایسه کن، نه با رقم روی کاغذ."}},{"kind":"card","id":"b03a2","source":"Step 4, Three questions that will transform your life","text":{"en":"Ask the three questions about your rent after the move: fulfillment worth the life energy, aligned with your values, and would it change if you did not have to work?","fa":"سه سؤال را دربارهٔ اجارهٔ خانه‌ات بعد از جابه‌جایی بپرس: رضایتش به اندازهٔ انرژی زندگی بود؟ با ارزش‌هایت هم‌خوان است؟ و اگر مجبور به کار نبودی تغییر می‌کرد؟"}},{"kind":"check","id":"b03ak1","type":"tap","source":"b03a1","prompt":{"en":"Applying Step 2, how do you compare two job offers?","fa":"با گام ۲، دو پیشنهاد شغلی را چطور مقایسه می‌کنی؟"},"options":[{"en":"By real hourly wage, not the headline salary","fa":"با دستمزد واقعی ساعتی، نه رقم حقوق روی کاغذ"},{"en":"By the gross yearly number","fa":"با رقم ناخالص سالانه"},{"en":"By the company's brand","fa":"با برند شرکت"}],"answer":0},{"kind":"card","id":"b03a3","source":"Step 8, Capital and the Crossover Point","text":{"en":"Your crossover point is the month ownership income plus investment income exceeds expenses. The first €100 from a small AI product is the first dot on that wall chart.","fa":"نقطهٔ تقاطع تو ماهی است که درآمد مالکیتی به‌علاوهٔ درآمد سرمایه‌گذاری از هزینه‌ها بیشتر می‌شود. اولین ۱۰۰ یورو از یک محصول کوچک AI اولین نقطه روی آن نمودار دیواری است."}},{"kind":"check","id":"b03ak2","type":"tf","source":"b03a2","prompt":{"en":"The three questions apply only to purchases above €1,000, not to rent.","fa":"سه سؤال فقط برای خریدهای بالای ۱٬۰۰۰ یورو است، نه برای اجاره."},"answer":false},{"kind":"card","id":"b03a4","source":"ch. 2, Money is life energy","text":{"en":"Every tool subscription and gadget costs hours of your one life. Before you buy, convert the price into hours at your real hourly wage and decide if those hours are worth it.","fa":"هر اشتراک ابزار و هر گجت ساعت‌هایی از تنها زندگی‌ات را می‌بلعد. پیش از خرید، قیمت را با دستمزد واقعی ساعتی‌ات به ساعت تبدیل کن و تصمیم بگیر آیا آن ساعت‌ها می‌ارزند."}},{"kind":"check","id":"b03ak3","type":"tap","source":"b03a3","prompt":{"en":"When do you reach your crossover point?","fa":"کی به نقطهٔ تقاطع می‌رسی؟"},"options":[{"en":"The month you get your BSN","fa":"ماهی که BSN می‌گیری"},{"en":"Ownership and investment income exceeds expenses","fa":"وقتی درآمد مالکیتی و سرمایه‌گذاری از هزینه‌ها بیشتر شود"},{"en":"When your salary doubles","fa":"وقتی حقوقت دو برابر شود"}],"answer":1}]]},{"id":"b04","title":"The Richest Man in Babylon","author":{"en":"George S. Clason","fa":"George S. Clason"},"year":1926,"stage":1,"must":false,"why":{"en":"Short, classic, the principles of saving","fa":"کوتاه، کلاسیک، اصول پس‌انداز"},"badge":{"en":"Pay yourself first","fa":"اول به خودت بپرداز"},"units":[[{"kind":"card","id":"b04c1","source":"The Richest Man in Babylon; First Cure, Start thy purse to fattening","text":{"en":"Arkad's first rule: a part of all you earn is yours to keep. Pay yourself first by saving at least one-tenth of everything you earn, before any spending.","fa":"قاعدهٔ اول Arkad: بخشی از هرچه به دست می‌آوری مال خودت است که نگهش داری. اول به خودت بپرداز و دست‌کم یک‌دهم هر درآمدی را پیش از هر خرجی پس‌انداز کن."}},{"kind":"card","id":"b04c2","source":"Second Cure, Control thy expenditures","text":{"en":"What each of us calls necessary expenses will always grow to equal our income unless we protest. Budget, and spend only on what is truly necessary.","fa":"آنچه هرکدام از ما «هزینه‌های ضروری» می‌نامیم همیشه آن‌قدر رشد می‌کند که با درآمدمان برابر شود، مگر اینکه مقاومت کنیم. بودجه بنویس و فقط برای ضروریات واقعی خرج کن."}},{"kind":"check","id":"b04k1","type":"tap","source":"b04c1","prompt":{"en":"What is Arkad's first rule?","fa":"قاعدهٔ اول Arkad چیست؟"},"options":[{"en":"Keep at least one-tenth of all you earn","fa":"دست‌کم یک‌دهم هر درآمدت را نگه دار"},{"en":"Lend to friends in need","fa":"به دوستان نیازمند قرض بده"},{"en":"Spend it before prices rise","fa":"پیش از گران شدن خرجش کن"}],"answer":0},{"kind":"check","id":"b04k2","type":"tf","source":"b04c2","prompt":{"en":"Clason says necessary expenses stay fixed as income rises.","fa":"Clason می‌گوید هزینه‌های ضروری با بالا رفتن درآمد ثابت می‌مانند."},"answer":false},{"kind":"card","id":"b04c3","source":"Third and Fourth Cures, Make thy gold multiply; Guard thy treasures from loss","text":{"en":"Make thy gold multiply: put savings to work so each coin earns more coins. Then guard thy treasure from loss: invest only where the principal is safe and recoverable.","fa":"طلایت را تکثیر کن: پس‌انداز را به کار بینداز تا هر سکه سکه‌های بیشتری بیاورد. بعد گنجت را از زیان حفظ کن: فقط جایی سرمایه‌گذاری کن که اصل پول امن و قابل‌بازگشت باشد."}}],[{"kind":"card","id":"b04c4","source":"Fifth to Seventh Cures","text":{"en":"The last cures: make thy dwelling a profitable investment, insure a future income for old age and family, and increase thy ability to earn by learning more.","fa":"درمان‌های آخر: خانه‌ات را سرمایه‌گذاری سودآور کن، درآمد آینده را برای پیری و خانواده تضمین کن، و با یادگیری بیشتر توان درآمدزایی‌ات را افزایش بده."}},{"kind":"card","id":"b04c5","source":"The Five Laws of Gold","text":{"en":"The Five Laws of Gold begin the same way: gold comes gladly to the one who saves at least one-tenth. It flees the one who forces it into impossible earnings or follows tricksters.","fa":"پنج قانون طلا همین‌طور شروع می‌شوند: طلا با میل سراغ کسی می‌آید که دست‌کم یک‌دهم را پس‌انداز کند. و از کسی می‌گریزد که آن را به سودهای ناممکن وادارد یا دنبال شیادان برود."}},{"kind":"check","id":"b04k3","type":"tf","source":"b04c5","prompt":{"en":"Clason says gold flees the one who forces it into impossible earnings.","fa":"Clason می‌گوید طلا از کسی که آن را به سودهای ناممکن وادارد می‌گریزد."},"answer":true},{"kind":"card","id":"b04c6","source":"Seven Cures for a Lean Purse, overview","text":{"en":"The Seven Cures for a Lean Purse run in order: start thy purse to fattening, control thy expenditures, make thy gold multiply, guard thy treasures from loss, then dwelling, future income and ability to earn.","fa":"هفت درمان برای کیسهٔ خالی به ترتیب: کیسه‌ات را پر کردن آغاز کن، خرج‌هایت را مهار کن، طلایت را تکثیر کن، گنجت را از زیان حفظ کن، سپس خانه، درآمد آینده و توان درآمدزایی."}},{"kind":"check","id":"b04k4","type":"order","source":"b04c6","prompt":{"en":"Put the first four cures in order","fa":"چهار درمان اول را به ترتیب بچین"},"options":[{"en":"Make thy gold multiply","fa":"طلایت را تکثیر کن"},{"en":"Start thy purse to fattening","fa":"کیسه‌ات را پر کردن آغاز کن"},{"en":"Guard thy treasures from loss","fa":"گنجت را از زیان حفظ کن"},{"en":"Control thy expenditures","fa":"خرج‌هایت را مهار کن"}],"answer":[1,3,0,2]}],[{"kind":"card","id":"b04a1","source":"First Cure, Start thy purse to fattening","text":{"en":"Pay yourself first, Dutch edition: the day salary lands, at least one-tenth moves to the broker before rent or anything else. Automate it so Arkad's rule never needs willpower.","fa":"اول به خودت بپرداز، نسخهٔ هلندی: روزی که حقوق می‌رسد، دست‌کم یک‌دهم پیش از اجاره یا هر چیز دیگر به کارگزار می‌رود. خودکارش کن تا قاعدهٔ Arkad هرگز به اراده نیاز نداشته باشد."}},{"kind":"card","id":"b04a2","source":"Second Cure, Control thy expenditures","text":{"en":"Expenses grow to meet income unless you protest. Write a budget before your first Dutch paycheck, because new rent and a new life will try to absorb the whole raise.","fa":"هزینه‌ها آن‌قدر رشد می‌کنند که به درآمد برسند، مگر اینکه مقاومت کنی. پیش از اولین حقوق هلندی بودجه بنویس، چون اجارهٔ تازه و زندگی تازه می‌خواهند کل افزایش حقوق را ببلعند."}},{"kind":"check","id":"b04ak1","type":"tap","source":"b04a1","prompt":{"en":"Applying Arkad's first cure, what happens the day salary lands?","fa":"با درمان اول Arkad، روزی که حقوق می‌رسد چه می‌شود؟"},"options":[{"en":"Rent is paid, then whatever is left is saved","fa":"اجاره پرداخت می‌شود، بعد هرچه ماند پس‌انداز"},{"en":"At least one-tenth moves to the broker first","fa":"اول دست‌کم یک‌دهم به کارگزار می‌رود"},{"en":"The whole salary waits in a current account","fa":"کل حقوق در حساب جاری می‌ماند"}],"answer":1},{"kind":"card","id":"b04a3","source":"Fourth Cure, Guard thy treasures from loss","text":{"en":"Guard thy treasure from loss: Arkad invests only where the principal is safe. This cure lives in your 20 percent of deliberate bets, so before funding a friend's startup ask the experienced first.","fa":"گنجت را از زیان حفظ کن: Arkad فقط جایی سرمایه‌گذاری می‌کند که اصل پول امن باشد. این درمان در ۲۰ درصد شرط‌بندی‌های آگاهانه‌ات زندگی می‌کند، پس پیش از سرمایه‌گذاری در استارتاپ یک دوست، اول از باتجربه‌ها بپرس."}},{"kind":"check","id":"b04ak2","type":"tf","source":"b04a2","prompt":{"en":"Clason's second cure means the budget can wait until your income is higher.","fa":"درمان دوم Clason یعنی بودجه می‌تواند تا بالاتر رفتن درآمد صبر کند."},"answer":false},{"kind":"card","id":"b04a4","source":"Seventh Cure, Increase thy ability to earn","text":{"en":"Increase thy ability to earn: for you that is 2 books a month with a page of notes, and shipping a small AI product. Both raise what one hour of your work is worth.","fa":"توان درآمدزایی‌ات را افزایش بده: برای تو یعنی ۲ کتاب در ماه با یک صفحه یادداشت، و عرضهٔ یک محصول کوچک AI. هر دو ارزش یک ساعت کار تو را بالا می‌برند."}},{"kind":"check","id":"b04ak3","type":"tap","source":"b04a3","prompt":{"en":"Where does Clason's fourth cure apply in your portfolio?","fa":"درمان چهارم Clason در سبد تو کجا به کار می‌رود؟"},"options":[{"en":"The 20 percent of deliberate bets","fa":"۲۰ درصد شرط‌بندی‌های آگاهانه"},{"en":"The index ETF core","fa":"هستهٔ ETF شاخصی"},{"en":"Your emergency cash","fa":"پول نقد اضطراری‌ات"}],"answer":0}]]},{"id":"b05","title":"Thinking, Fast and Slow","author":{"en":"Daniel Kahneman","fa":"Daniel Kahneman"},"year":2011,"stage":1,"must":false,"why":{"en":"The cognitive errors that eat your money","fa":"خطاهای شناختی که پولت را می‌خورند"},"badge":{"en":"Two systems","fa":"دو سیستم"},"units":[[{"kind":"card","id":"b05c1","source":"Part I, Two Systems (ch. 1, The Characters of the Story)","text":{"en":"System 1 thinks fast, automatic and effortless; System 2 thinks slow, deliberate and lazy. Errors come when System 1 answers and lazy System 2 never checks.","fa":"سیستم ۱ سریع، خودکار و بی‌زحمت فکر می‌کند؛ سیستم ۲ کند، سنجیده و تنبل. خطا وقتی رخ می‌دهد که سیستم ۱ جواب می‌دهد و سیستم ۲ تنبل هرگز بررسی نمی‌کند."}},{"kind":"card","id":"b05c2","source":"ch. 11, Anchors","text":{"en":"Anchoring: the first number you see drags your estimate toward it, even when it is random. A listed price or a past share price anchors what feels fair.","fa":"لنگر انداختن: اولین عددی که می‌بینی برآوردت را به سمت خودش می‌کشد، حتی اگر تصادفی باشد. قیمت روی برچسب یا قیمت قبلی یک سهم، حس «منصفانه» را لنگر می‌کند."}},{"kind":"check","id":"b05k1","type":"tap","source":"b05c1","prompt":{"en":"In Kahneman's model, how does System 2 think?","fa":"در مدل Kahneman سیستم ۲ چطور فکر می‌کند؟"},"options":[{"en":"Slow, deliberate and lazy","fa":"کند، سنجیده و تنبل"},{"en":"Fast and automatic","fa":"سریع و خودکار"},{"en":"Emotional and impulsive","fa":"هیجانی و تکانشی"}],"answer":0},{"kind":"card","id":"b05c3","source":"ch. 26, Prospect Theory; ch. 32, Keeping Score","text":{"en":"Loss aversion: losses hurt about twice as much as equal gains feel good. That is why people hold losing stocks too long and sell winners too early.","fa":"زیان‌گریزی: درد زیان تقریباً دو برابر لذت سودِ هم‌اندازه است. برای همین مردم سهم‌های زیان‌ده را زیادی نگه می‌دارند و برنده‌ها را زود می‌فروشند."}},{"kind":"check","id":"b05k2","type":"tf","source":"b05c3","prompt":{"en":"Kahneman finds gains feel about twice as strong as equal losses.","fa":"Kahneman می‌گوید لذت سود تقریباً دو برابر درد زیانِ هم‌اندازه است."},"answer":false}],[{"kind":"card","id":"b05c4","source":"ch. 20, The Illusion of Validity","text":{"en":"Kahneman studied a firm's 25 advisers over 8 years: the correlation between their yearly rankings was near zero. Their results were luck, yet bonuses and confidence stayed high.","fa":"Kahneman ۲۵ مشاور یک شرکت را در ۸ سال بررسی کرد: همبستگی رتبه‌های سالانه‌شان نزدیک صفر بود. نتایجشان شانس بود، اما پاداش‌ها و اعتمادبه‌نفسشان بالا ماند."}},{"kind":"card","id":"b05c5","source":"ch. 23, The Outside View","text":{"en":"Planning fallacy: we forecast from the inside view, our own best case, and ignore how similar projects went. Take the outside view: base rates first, then adjust.","fa":"مغالطهٔ برنامه‌ریزی: از نگاه درونی پیش‌بینی می‌کنیم، یعنی بهترین حالت خودمان، و سرنوشت پروژه‌های مشابه را نادیده می‌گیریم. نگاه بیرونی بگیر: اول نرخ پایه، بعد تعدیل."}},{"kind":"check","id":"b05k3","type":"tap","source":"b05c4","prompt":{"en":"What did Kahneman find about the advisers' yearly rankings?","fa":"Kahneman دربارهٔ رتبه‌های سالانهٔ مشاوران چه یافت؟"},"options":[{"en":"Their correlation was near zero","fa":"همبستگی‌شان نزدیک صفر بود"},{"en":"They beat the market every year","fa":"هر سال بازار را شکست دادند"},{"en":"The best adviser stayed best","fa":"بهترین مشاور همیشه بهترین ماند"}],"answer":0},{"kind":"card","id":"b05c6","source":"ch. 12, The Science of Availability","text":{"en":"Availability: we judge how likely something is by how easily examples come to mind. Dramatic news makes rare risks feel common and quiet risks invisible.","fa":"دسترس‌پذیری: احتمال چیزها را با این می‌سنجیم که چقدر راحت مثالش به ذهن می‌آید. خبرهای پرهیاهو ریسک‌های نادر را رایج و ریسک‌های خاموش را نامرئی جلوه می‌دهند."}},{"kind":"check","id":"b05k4","type":"tf","source":"b05c5","prompt":{"en":"The outside view means starting from the base rates of similar projects.","fa":"نگاه بیرونی یعنی شروع از نرخ پایهٔ پروژه‌های مشابه."},"answer":true}],[{"kind":"card","id":"b05a1","source":"ch. 23, The Outside View","text":{"en":"Before you forecast the AI product, take the outside view: how many small products like it reach €100 a month, and how long it took them. Start from that base rate, then adjust for yours.","fa":"پیش از پیش‌بینی برای محصول AI، نگاه بیرونی بگیر: چند محصول کوچک مثل آن به ۱۰۰ یورو در ماه می‌رسند و چقدر طول کشید. از آن نرخ پایه شروع کن، بعد برای مورد خودت تعدیل کن."}},{"kind":"card","id":"b05a2","source":"ch. 11, Anchors","text":{"en":"Anchoring at a term sheet: the first valuation named pulls every number after it. Before you sign, write down your own number from the cap table and unit economics, then read theirs.","fa":"لنگر انداختن سر term sheet: اولین ارزش‌گذاری‌ای که گفته می‌شود همهٔ عددهای بعدی را به سمت خودش می‌کشد. پیش از امضا، عدد خودت را از cap table و unit economics بنویس، بعد عدد آن‌ها را بخوان."}},{"kind":"check","id":"b05ak1","type":"tap","source":"b05a1","prompt":{"en":"Applying the outside view, where does a forecast for your product start?","fa":"با نگاه بیرونی، پیش‌بینی برای محصولت از کجا شروع می‌شود؟"},"options":[{"en":"From your own best-case plan","fa":"از بهترین حالت برنامهٔ خودت"},{"en":"From the first number an investor names","fa":"از اولین عددی که یک سرمایه‌گذار می‌گوید"},{"en":"From the base rate of small products like it","fa":"از نرخ پایهٔ محصولات کوچک مشابه"}],"answer":2},{"kind":"card","id":"b05a3","source":"ch. 26, Prospect Theory; ch. 32, Keeping Score (loss aversion)","text":{"en":"Loss aversion will make a 30 percent drop in your index ETF feel twice as bad as the gain before it felt good. Decide now, in writing, that a drop is not a sell signal.","fa":"زیان‌گریزی باعث می‌شود سقوط ۳۰ درصدی ETF شاخصی‌ات دو برابر بدتر از لذت سود قبلی حس شود. همین حالا، کتبی، تصمیم بگیر که سقوط علامت فروش نیست."}},{"kind":"check","id":"b05ak2","type":"tf","source":"b05a2","prompt":{"en":"Kahneman's anchoring means the first valuation on a term sheet should set your expectation.","fa":"لنگر انداختن Kahneman یعنی اولین ارزش‌گذاری روی term sheet باید انتظار تو را تعیین کند."},"answer":false},{"kind":"card","id":"b05a4","source":"ch. 20, The Illusion of Validity","text":{"en":"The illusion of validity: an adviser's confident story about which fund will win is not evidence. Ask any adviser or broker for their base rate, not their conviction.","fa":"توهم اعتبار: داستان مطمئن یک مشاور دربارهٔ اینکه کدام صندوق برنده می‌شود، شاهد نیست. از هر مشاور یا کارگزاری نرخ پایه‌اش را بخواه، نه اطمینانش را."}},{"kind":"check","id":"b05ak3","type":"tap","source":"b05a3","prompt":{"en":"If you planned for loss aversion, what is a 30 percent drop in your index ETF?","fa":"اگر برای زیان‌گریزی برنامه ریخته باشی، سقوط ۳۰ درصدی ETF شاخصی‌ات چیست؟"},"options":[{"en":"A reason to move to cash","fa":"دلیلی برای رفتن به پول نقد"},{"en":"Not a sell signal","fa":"علامت فروش نیست"},{"en":"Proof the strategy failed","fa":"اثبات شکست استراتژی"}],"answer":1}]]},{"id":"b06","title":"A Random Walk Down Wall Street","author":{"en":"Burton Malkiel","fa":"Burton Malkiel"},"year":1973,"stage":2,"must":true,"why":{"en":"Why the market cannot be beaten","fa":"چرا بازار را نمی‌شود شکست داد"},"badge":{"en":"Blindfolded monkey","fa":"میمون چشم‌بسته"},"units":[[{"kind":"card","id":"b06c1","source":"ch. 1, Firm Foundations and Castles in the Air","text":{"en":"A random walk means past price moves cannot predict future ones. Malkiel's famous claim: a blindfolded monkey throwing darts at the stock pages could match the experts.","fa":"گام تصادفی یعنی حرکت‌های گذشتهٔ قیمت نمی‌توانند حرکت‌های آینده را پیش‌بینی کنند. ادعای معروف Malkiel: میمونی چشم‌بسته که به صفحهٔ سهام دارت بیندازد، می‌تواند با کارشناسان برابری کند."}},{"kind":"card","id":"b06c2","source":"ch. 1, the two theories of value","text":{"en":"Two theories of value: firm foundation, where a stock is worth its future dividends, and castle in the air, where it is worth what the crowd will pay next. Bubbles are castles in the air.","fa":"دو نظریهٔ ارزش: «بنیان محکم»، که سهم به اندازهٔ سودهای نقدی آینده‌اش می‌ارزد، و «قصر در هوا»، که سهم به اندازهٔ پولی می‌ارزد که جمعیت بعداً می‌پردازد. حباب‌ها قصرهای در هوا هستند."}},{"kind":"check","id":"b06k1","type":"tap","source":"b06c1","prompt":{"en":"What does 'random walk' mean for share prices?","fa":"«گام تصادفی» برای قیمت سهام یعنی چه؟"},"options":[{"en":"Past price moves cannot predict future ones","fa":"حرکت‌های گذشتهٔ قیمت نمی‌توانند آینده را پیش‌بینی کنند"},{"en":"Prices follow long predictable trends","fa":"قیمت‌ها روندهای بلند و قابل‌پیش‌بینی دارند"},{"en":"Experts always beat a monkey with darts","fa":"کارشناسان همیشه از میمون دارت‌انداز بهترند"}],"answer":0},{"kind":"card","id":"b06c3","source":"ch. 5 and 6, Technical analysis and the random-walk theory","text":{"en":"Chartists study past price patterns to predict the future. Malkiel tested their rules and found none beat simple buy and hold once trading costs are counted.","fa":"چارتیست‌ها الگوهای گذشتهٔ قیمت را مطالعه می‌کنند تا آینده را پیش‌بینی کنند. Malkiel قواعدشان را آزمود و دید هیچ‌کدام، با احتساب هزینهٔ معاملات، از خرید و نگهداری ساده بهتر نیست."}},{"kind":"check","id":"b06k2","type":"tf","source":"b06c3","prompt":{"en":"Malkiel found chart patterns reliably beat buy and hold.","fa":"Malkiel دریافت الگوهای نموداری به‌طور قابل‌اعتماد از خرید و نگهداری بهترند."},"answer":false}],[{"kind":"card","id":"b06c4","source":"ch. 7, How good is fundamental analysis? The efficient-market hypothesis","text":{"en":"The efficient market hypothesis: prices already reflect what is known, so only news moves them, and news arrives randomly. Most professional fund managers fail to beat a broad index.","fa":"فرضیهٔ بازار کارا: قیمت‌ها از قبل هرچه دانسته شده را منعکس می‌کنند، پس فقط خبر تازه آن‌ها را تکان می‌دهد و خبر تصادفی می‌رسد. بیشتر مدیران حرفه‌ای صندوق‌ها از شکست دادن یک شاخص گسترده ناتوان‌اند."}},{"kind":"card","id":"b06c5","source":"Part Four, A Life-Cycle Guide to Investing","text":{"en":"Malkiel's rules: buy and hold a broad low-cost index fund, diversify across asset classes, rebalance once a year, and shift toward bonds as you age.","fa":"قواعد Malkiel: یک صندوق شاخصی گسترده و کم‌هزینه بخر و نگه دار، بین طبقات دارایی تنوع بده، سالی یک بار بازتوازن کن و با بالا رفتن سن به سمت اوراق قرضه برو."}},{"kind":"check","id":"b06k3","type":"tap","source":"b06c5","prompt":{"en":"What does Malkiel say to do as you age?","fa":"Malkiel می‌گوید با بالا رفتن سن چه کنی؟"},"options":[{"en":"Shift toward bonds","fa":"به سمت اوراق قرضه برو"},{"en":"Move everything into gold","fa":"همه را به طلا تبدیل کن"},{"en":"Pick more individual stocks","fa":"سهم‌های تکی بیشتری انتخاب کن"}],"answer":0},{"kind":"card","id":"b06c6","source":"ch. 2 and 3, The Madness of Crowds; Speculative Bubbles","text":{"en":"From Dutch tulip bulbs to the dot-com crash, every bubble follows the same path: a true story, crowd euphoria, prices unhinged from value, then collapse.","fa":"از پیازهای لالهٔ هلند تا سقوط دات‌کام، هر حبابی یک مسیر را می‌رود: یک داستان واقعی، سرخوشی جمعی، قیمت‌های جداشده از ارزش، و بعد فروپاشی."}},{"kind":"check","id":"b06k4","type":"tf","source":"b06c4","prompt":{"en":"Malkiel says most professional fund managers fail to beat a broad index.","fa":"Malkiel می‌گوید بیشتر مدیران حرفه‌ای صندوق‌ها نمی‌توانند یک شاخص گسترده را شکست دهند."},"answer":true}],[{"kind":"card","id":"b06a1","source":"ch. 1, the random walk; ch. 7, the efficient-market hypothesis","text":{"en":"If past prices cannot predict future ones, your 20 percent satellite should not be chart trades. Reserve it for ownership bets where you have real insight, such as a product you build yourself.","fa":"اگر قیمت‌های گذشته نمی‌توانند آینده را پیش‌بینی کنند، ۲۰ درصد ماهوارهٔ تو نباید معاملات نموداری باشد. آن را برای شرط‌بندی‌های مالکیتی نگه دار که در آن‌ها بینش واقعی داری، مثل محصولی که خودت می‌سازی."}},{"kind":"card","id":"b06a2","source":"Part Four, A Life-Cycle Guide to Investing (rebalance once a year)","text":{"en":"Malkiel's yearly rebalance, applied: once a year bring the core back to 80 percent index ETFs and the satellite to 20. A bet that grew to 40 percent is a risk, not a win.","fa":"بازتوازن سالانهٔ Malkiel در عمل: سالی یک بار هسته را به ۸۰ درصد ETF شاخصی و ماهواره را به ۲۰ درصد برگردان. شرط‌بندی‌ای که به ۴۰ درصد رسیده ریسک است، نه برد."}},{"kind":"check","id":"b06ak1","type":"tap","source":"b06a1","prompt":{"en":"Given the random walk, what belongs in your 20 percent satellite?","fa":"با توجه به گام تصادفی، چه چیزی در ۲۰ درصد ماهوارهٔ تو جا دارد؟"},"options":[{"en":"Ownership bets where you have real insight","fa":"شرط‌بندی‌های مالکیتی که در آن‌ها بینش واقعی داری"},{"en":"Short-term chart trades","fa":"معاملات نموداری کوتاه‌مدت"},{"en":"Whatever rose most last year","fa":"هرچه پارسال بیشتر بالا رفت"}],"answer":0},{"kind":"card","id":"b06a3","source":"ch. 2 and 3, The Madness of Crowds; Speculative Bubbles","text":{"en":"Every bubble starts with a true story, then euphoria. AI is a true story too, so before putting money into an AI startup ask whether the price still relates to its cash flows.","fa":"هر حبابی با یک داستان واقعی شروع می‌شود، بعد سرخوشی. AI هم یک داستان واقعی است، پس پیش از گذاشتن پول در یک استارتاپ AI بپرس آیا قیمت هنوز به جریان نقدی‌اش ربط دارد."}},{"kind":"check","id":"b06ak2","type":"tf","source":"b06a2","prompt":{"en":"After Malkiel's yearly rebalance, a bet that grew to 40 percent of the portfolio is left alone as a win.","fa":"در بازتوازن سالانهٔ Malkiel، شرط‌بندی‌ای که به ۴۰ درصد سبد رسیده به عنوان برد دست‌نخورده می‌ماند."},"answer":false},{"kind":"card","id":"b06a4","source":"ch. 7, How good is fundamental analysis? (most managers fail to beat the index)","text":{"en":"Most professional managers fail to beat a broad index, so a broker account full of actively managed funds pays fees for a coin toss. Keep the core in broad index ETFs.","fa":"بیشتر مدیران حرفه‌ای از شکست دادن یک شاخص گسترده ناتوان‌اند، پس حساب کارگزاری پر از صندوق‌های با مدیریت فعال، برای شیر یا خط کارمزد می‌دهد. هسته را در ETFهای شاخصی گسترده نگه دار."}},{"kind":"check","id":"b06ak3","type":"tap","source":"b06a4","prompt":{"en":"Per Malkiel, why keep the core in broad index ETFs?","fa":"به گفتهٔ Malkiel، چرا هسته را در ETFهای شاخصی گسترده نگه داری؟"},"options":[{"en":"Index ETFs never fall in a crash","fa":"ETFهای شاخصی هرگز در سقوط نمی‌ریزند"},{"en":"Brokers charge nothing for them","fa":"کارگزارها برایشان هیچ کارمزدی نمی‌گیرند"},{"en":"Most professional managers fail to beat a broad index","fa":"بیشتر مدیران حرفه‌ای نمی‌توانند یک شاخص گسترده را شکست دهند"}],"answer":2}]]},{"id":"b07","title":"The Little Book of Common Sense Investing","author":{"en":"John C. Bogle","fa":"John C. Bogle"},"year":2007,"stage":2,"must":true,"why":{"en":"The father of the index fund; short and decisive","fa":"پدر صندوق شاخصی؛ کوتاه و قاطع"},"badge":{"en":"Buy the haystack","fa":"کل انبار کاه را بخر"},"units":[[{"kind":"card","id":"b07c1","source":"ch. 1, A Parable (the Gotrocks family)","text":{"en":"The Gotrocks family owned every company in America and grew rich. Then Helpers arrived to trade shares among them for fees, and the family's wealth shrank by exactly those fees.","fa":"خانوادهٔ Gotrocks صاحب همهٔ شرکت‌های آمریکا بودند و ثروتمند شدند. بعد «کمک‌کارها» آمدند تا در ازای کارمزد سهام را بینشان جابه‌جا کنند، و ثروت خانواده دقیقاً به اندازهٔ همان کارمزدها آب رفت."}},{"kind":"card","id":"b07c2","source":"ch. 3, Cast Your Lot with Business","text":{"en":"Bogle's rule: don't look for the needle in the haystack, just buy the haystack. Own every listed business through one low-cost index fund and hold it forever.","fa":"قاعدهٔ Bogle: دنبال سوزن در انبار کاه نگرد، کل انبار کاه را بخر. همهٔ شرکت‌های بورسی را با یک صندوق شاخصی کم‌هزینه بخر و برای همیشه نگه دار."}},{"kind":"check","id":"b07k1","type":"tap","source":"b07c2","prompt":{"en":"What does Bogle mean by 'buy the haystack'?","fa":"منظور Bogle از «کل انبار کاه را بخر» چیست؟"},"options":[{"en":"Own every business through one low-cost index fund","fa":"همهٔ شرکت‌ها را با یک صندوق شاخصی کم‌هزینه بخر"},{"en":"Search for the next great stock","fa":"دنبال سهم بزرگ بعدی بگرد"},{"en":"Switch funds every year","fa":"هر سال صندوق عوض کن"}],"answer":0},{"kind":"check","id":"b07k2","type":"tf","source":"b07c1","prompt":{"en":"In the parable, the Helpers made the Gotrocks family richer.","fa":"در حکایت، «کمک‌کارها» خانوادهٔ Gotrocks را ثروتمندتر کردند."},"answer":false},{"kind":"card","id":"b07c3","source":"ch. 2, Rational Exuberance","text":{"en":"Investment return is dividend yield plus earnings growth; speculative return is the change in the price-earnings ratio. Over decades the first dominates and the second nets out.","fa":"بازده سرمایه‌گذاری یعنی بازده سود نقدی به‌علاوهٔ رشد سود شرکت؛ بازده سفته‌بازانه یعنی تغییر نسبت P/E. در طول دهه‌ها اولی غالب است و دومی تقریباً صفر می‌شود."}}],[{"kind":"card","id":"b07c4","source":"ch. 4, How Most Investors Turn a Winner's Game into a Loser's Game","text":{"en":"Before costs, investors as a group earn exactly the market return; after costs they earn less. The relentless rules of humble arithmetic: you cannot control the market, but you can control costs.","fa":"پیش از هزینه‌ها، سرمایه‌گذاران در مجموع دقیقاً بازده بازار را می‌گیرند؛ بعد از هزینه‌ها کمتر. قواعد بی‌رحم حسابِ ساده: بازار را نمی‌توانی کنترل کنی، اما هزینه‌ها را می‌توانی."}},{"kind":"check","id":"b07k3","type":"tap","source":"b07c4","prompt":{"en":"According to Bogle, what can an investor control?","fa":"به گفتهٔ Bogle سرمایه‌گذار چه چیزی را می‌تواند کنترل کند؟"},"options":[{"en":"Costs","fa":"هزینه‌ها"},{"en":"Market returns","fa":"بازده بازار"},{"en":"Interest rates","fa":"نرخ بهره"}],"answer":0},{"kind":"card","id":"b07c5","source":"ch. 8 and 9, Selecting Long-Term Winners; Yesterday's Winners, Tomorrow's Losers","text":{"en":"Picking funds by past performance fails: yesterday's winners become tomorrow's losers through reversion to the mean. Of 355 funds in 1970, most had vanished by 2005 and only a handful beat the market.","fa":"انتخاب صندوق بر اساس عملکرد گذشته جواب نمی‌دهد: برنده‌های دیروز با بازگشت به میانگین، بازنده‌های فردا می‌شوند. از ۳۵۵ صندوق سال ۱۹۷۰، بیشترشان تا ۲۰۰۵ ناپدید شدند و فقط چند تا بازار را شکست دادند."}},{"kind":"card","id":"b07c6","source":"ch. 18, What Should I Do Now?","text":{"en":"Bogle's closing rule: stay the course. Costs matter, time is your friend, impulse is your enemy, and the simple arithmetic of indexing wins in the end.","fa":"قاعدهٔ پایانی Bogle: در مسیر بمان. هزینه‌ها مهم‌اند، زمان دوست توست، تکانه دشمن توست، و حسابِ سادهٔ شاخصی در نهایت برنده است."}},{"kind":"check","id":"b07k4","type":"tf","source":"b07c6","prompt":{"en":"Bogle's closing advice is to stay the course.","fa":"توصیهٔ پایانی Bogle این است که در مسیر بمانی."},"answer":true}],[{"kind":"card","id":"b07a1","source":"ch. 4, The relentless rules of humble arithmetic (you can control costs)","text":{"en":"You cannot control the market, but you can control costs. Before you pick a broker in the Netherlands, compare an ETF's expense ratio plus the broker's fees per order and per year.","fa":"بازار را نمی‌توانی کنترل کنی، اما هزینه‌ها را می‌توانی. پیش از انتخاب کارگزار در هلند، نسبت هزینهٔ ETF به‌علاوهٔ کارمزد کارگزار به ازای هر سفارش و هر سال را مقایسه کن."}},{"kind":"card","id":"b07a2","source":"ch. 1, A Parable (the Gotrocks family and the Helpers)","text":{"en":"The Helpers are anyone paid a fee to move your money around. If a Dutch bank offers to manage your €40k for a yearly percentage, that percentage is exactly what the Gotrocks family lost.","fa":"«کمک‌کارها» هر کسی‌اند که برای جابه‌جا کردن پولت کارمزد می‌گیرد. اگر یک بانک هلندی پیشنهاد داد ۴۰ هزار یورویت را در ازای درصدی سالانه مدیریت کند، آن درصد دقیقاً همان است که خانوادهٔ Gotrocks از دست داد."}},{"kind":"check","id":"b07ak1","type":"tap","source":"b07a1","prompt":{"en":"Applying Bogle, what do you compare before choosing a broker?","fa":"با نگاه Bogle، پیش از انتخاب کارگزار چه چیزی را مقایسه می‌کنی؟"},"options":[{"en":"Last year's best-performing fund","fa":"بهترین صندوق پارسال"},{"en":"Expense ratio plus fees per order and per year","fa":"نسبت هزینه به‌علاوهٔ کارمزد هر سفارش و هر سال"},{"en":"The app's star rating","fa":"امتیاز ستاره‌ای اپ"}],"answer":1},{"kind":"card","id":"b07a3","source":"ch. 8 and 9, Selecting Long-Term Winners; Yesterday's Winners, Tomorrow's Losers","text":{"en":"Picking funds by past performance fails. When a broker app ranks last year's top ETFs by return, that ranking is the trap Bogle describes, not a shopping list.","fa":"انتخاب صندوق بر اساس عملکرد گذشته جواب نمی‌دهد. وقتی اپ کارگزاری ETFهای برتر پارسال را بر اساس بازده رتبه‌بندی می‌کند، آن رتبه‌بندی همان تلهٔ Bogle است، نه فهرست خرید."}},{"kind":"check","id":"b07ak2","type":"tf","source":"b07a2","prompt":{"en":"In Bogle's parable, a bank that manages your money for a yearly percentage is a Helper.","fa":"در حکایت Bogle، بانکی که پولت را در ازای درصدی سالانه مدیریت می‌کند یک «کمک‌کار» است."},"answer":true},{"kind":"card","id":"b07a4","source":"ch. 18, What Should I Do Now? (stay the course)","text":{"en":"Stay the course means the monthly purchase of the index core continues through the move, the new job and the next crash. Change the plan only in writing, in the decision journal, never in a bad week.","fa":"در مسیر ماندن یعنی خرید ماهانهٔ هستهٔ شاخصی در طول جابه‌جایی، شغل جدید و سقوط بعدی ادامه پیدا می‌کند. برنامه را فقط کتبی، در دفتر تصمیم، عوض کن، نه در یک هفتهٔ بد."}},{"kind":"check","id":"b07ak3","type":"tap","source":"b07a3","prompt":{"en":"In Bogle's terms, what is a broker app's ranking of last year's top ETFs?","fa":"به زبان Bogle، رتبه‌بندی اپ کارگزاری از ETFهای برتر پارسال چیست؟"},"options":[{"en":"A reliable guide to next year","fa":"راهنمای قابل‌اعتماد برای سال بعد"},{"en":"Bogle's recommended list","fa":"فهرست توصیه‌شدهٔ Bogle"},{"en":"The trap of past performance, not a shopping list","fa":"تلهٔ عملکرد گذشته، نه فهرست خرید"}],"answer":2}]]},{"id":"b08","title":"The Four Pillars of Investing","author":{"en":"William Bernstein","fa":"William Bernstein"},"year":2002,"stage":2,"must":true,"why":{"en":"Theory, history, psychology, the industry","fa":"تئوری، تاریخ، روانشناسی، صنعت"},"badge":{"en":"Four Pillars","fa":"چهار ستون"},"units":[[{"kind":"card","id":"b08c1","source":"Introduction, the four pillars","text":{"en":"Bernstein says a successful investor needs four pillars: the theory of risk and return, the history of markets, the psychology of investors, and the business of the investment industry.","fa":"Bernstein می‌گوید سرمایه‌گذار موفق به چهار ستون نیاز دارد: تئوری ریسک و بازده، تاریخ بازارها، روانشناسی سرمایه‌گذاران و شناخت کسب‌وکار صنعت سرمایه‌گذاری."}},{"kind":"card","id":"b08c2","source":"ch. 1, No Guts, No Glory","text":{"en":"Risk and return are inseparable: the higher the expected return of an asset, the more pain it will cause along the way. There is no high return without a real chance of loss.","fa":"ریسک و بازده از هم جدا نمی‌شوند: هرچه بازده مورد انتظار یک دارایی بالاتر باشد، در مسیر درد بیشتری می‌دهد. بازده بالا بدون احتمال واقعی زیان وجود ندارد."}},{"kind":"check","id":"b08k1","type":"tap","source":"b08c1","prompt":{"en":"Which are Bernstein's four pillars?","fa":"چهار ستون Bernstein کدام‌اند؟"},"options":[{"en":"Theory, history, psychology and the business of investing","fa":"تئوری، تاریخ، روانشناسی و کسب‌وکار سرمایه‌گذاری"},{"en":"Stocks, bonds, gold and real estate","fa":"سهام، اوراق قرضه، طلا و املاک"},{"en":"Saving, budgeting, insurance and taxes","fa":"پس‌انداز، بودجه‌بندی، بیمه و مالیات"}],"answer":0},{"kind":"card","id":"b08c3","source":"ch. 3, The Market Is Smarter Than You Are","text":{"en":"Stock picking and market timing fail for almost everyone, because the market already prices in what is known. Bernstein's answer is cheap index funds that own the whole market.","fa":"انتخاب سهم و زمان‌بندی بازار تقریباً برای همه شکست می‌خورد، چون بازار آنچه را معلوم است از قبل در قیمت آورده است. پاسخ Bernstein صندوق‌های شاخصی ارزان است که کل بازار را دارند."}},{"kind":"check","id":"b08k2","type":"tf","source":"b08c2","prompt":{"en":"According to Bernstein, some assets offer high expected returns with no real chance of loss.","fa":"به گفتهٔ Bernstein، برخی دارایی‌ها بازده مورد انتظار بالا بدون احتمال واقعی زیان دارند."},"answer":false}],[{"kind":"card","id":"b08c4","source":"ch. 5 and 6, Tops and Bottoms","text":{"en":"Markets swing between manias and panics. Bubbles form when new technology, easy credit and forgotten history meet, and the best returns go to those who buy at the bottom, when everyone is afraid.","fa":"بازارها بین جنون و وحشت نوسان می‌کنند. حباب وقتی شکل می‌گیرد که فناوری جدید، اعتبار آسان و فراموشی تاریخ به هم برسند، و بهترین بازده نصیب کسانی می‌شود که در کف، وقتی همه می‌ترسند، می‌خرند."}},{"kind":"card","id":"b08c5","source":"ch. 9 and 10, Your Broker Is Not Your Friend; Neither Is Your Mutual Fund","text":{"en":"Brokers and fund companies make money from your activity and fees, not from your results. Bernstein warns that your broker is not your friend, and neither is your mutual fund.","fa":"کارگزاران و شرکت‌های صندوق از فعالیت و کارمزد شما پول درمی‌آورند، نه از نتیجهٔ شما. Bernstein هشدار می‌دهد که کارگزارت دوست تو نیست و صندوق مشترکت هم نیست."}},{"kind":"check","id":"b08k3","type":"tap","source":"b08c5","prompt":{"en":"Why does Bernstein say your broker is not your friend?","fa":"چرا Bernstein می‌گوید کارگزارت دوست تو نیست؟"},"options":[{"en":"Brokers make money from your activity and fees, not your results","fa":"کارگزاران از فعالیت و کارمزد شما پول درمی‌آورند، نه از نتیجهٔ شما"},{"en":"Brokers are legally banned from giving any advice","fa":"کارگزاران قانوناً از دادن هر توصیه‌ای منع شده‌اند"},{"en":"Brokers only accept very wealthy clients","fa":"کارگزاران فقط مشتریان خیلی ثروتمند را می‌پذیرند"}],"answer":0},{"kind":"card","id":"b08c6","source":"ch. 13 and 14, Defining Your Mix; Getti
