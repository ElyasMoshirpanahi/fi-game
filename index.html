ng Started, Keeping It Going","text":{"en":"Your asset allocation, the mix of stocks and bonds, decides most of your results. Choose a mix you can live with, rebalance it on schedule and stay the course through bad years.","fa":"تخصیص دارایی، یعنی ترکیب سهام و اوراق قرضه، بیشترِ نتیجهٔ شما را تعیین می‌کند. ترکیبی انتخاب کن که با آن کنار بیایی، طبق برنامه متوازنش کن و در سال‌های بد در مسیر بمان."}},{"kind":"check","id":"b08k4","type":"order","source":"b08c6","prompt":{"en":"Put Bernstein's steps for running a portfolio in order","fa":"مراحل Bernstein برای ادارهٔ سبد را مرتب کن"},"options":[{"en":"Rebalance it on schedule","fa":"طبق برنامه متوازنش کن"},{"en":"Stay the course through bad years","fa":"در سال‌های بد در مسیر بمان"},{"en":"Choose a mix you can live with","fa":"ترکیبی انتخاب کن که با آن کنار بیایی"}],"answer":[2,0,1]}],[{"kind":"card","id":"b08a1","source":"ch. 1, risk and return are inseparable","text":{"en":"Bernstein's risk-return rule applies to your 20 percent satellite: that is where higher expected returns and real losses both live. Size it so that losing all of it would not change your plan.","fa":"قاعدهٔ ریسک و بازده Bernstein دربارهٔ ۲۰ درصد ماهواره‌ای سبد تو صدق می‌کند: همان‌جا که بازده مورد انتظار بالاتر و زیان واقعی هر دو زندگی می‌کنند. اندازه‌اش را طوری بچین که از دست رفتن همه‌اش برنامه‌ات را عوض نکند."}},{"kind":"card","id":"b08a2","source":"ch. 3, the market is smarter than you are","text":{"en":"As a CTO you may know AI products better than most, but Bernstein's warning still holds: the market already prices what is known. Keep the 80 percent core in whole-market index ETFs such as VWCE or IWDA.","fa":"به‌عنوان CTO شاید محصولات AI را بهتر از بیشتر مردم بشناسی، اما هشدار Bernstein همچنان پابرجاست: بازار آنچه را معلوم است از قبل در قیمت آورده. هستهٔ ۸۰ درصدی را در ETFهای شاخصی کل بازار مثل VWCE یا IWDA نگه دار."}},{"kind":"check","id":"b08ak1","type":"tap","source":"b08a1","prompt":{"en":"In your plan, where do higher expected returns and real losses both live?","fa":"در برنامهٔ تو، بازده مورد انتظار بالاتر و زیان واقعی هر دو کجا زندگی می‌کنند؟"},"options":[{"en":"In the 20 percent satellite","fa":"در ۲۰ درصد ماهواره‌ای"},{"en":"In the 80 percent index core","fa":"در هستهٔ شاخصی ۸۰ درصدی"},{"en":"In the cash you keep for rent","fa":"در نقدی که برای اجاره نگه می‌داری"}],"answer":0},{"kind":"card","id":"b08a3","source":"ch. 9, your broker is not your friend","text":{"en":"Before you open a broker account after your BSN, read the fee page the way Bernstein reads a broker: trading fees, currency conversion and custody costs are how they earn from your activity.","fa":"پیش از آنکه بعد از گرفتن BSN حساب کارگزاری باز کنی، صفحهٔ کارمزدها را همان‌طور بخوان که Bernstein کارگزار را می‌خواند: کارمزد معامله، تبدیل ارز و هزینهٔ نگهداری راه درآمد آن‌ها از فعالیت توست."}},{"kind":"check","id":"b08ak2","type":"tf","source":"b08a2","prompt":{"en":"Bernstein's warning means that knowing AI products well lets you safely skip index ETFs for your core.","fa":"هشدار Bernstein یعنی شناخت خوب محصولات AI به تو اجازه می‌دهد با خیال راحت ETF شاخصی را از هسته‌ات حذف کنی."},"answer":false},{"kind":"card","id":"b08a4","source":"ch. 13 and 14, choose a mix, rebalance, stay the course","text":{"en":"Write your stock-and-bond mix down before you move your €40k, with a fixed rebalancing date. In a bad year you then stay the course by reading the note, not by reacting to the news.","fa":"پیش از جابه‌جا کردن ۴۰ هزار یورویت، ترکیب سهام و اوراق قرضه‌ات را با یک تاریخ ثابت برای توازن مجدد بنویس. در سال بد، با خواندن همان یادداشت در مسیر می‌مانی، نه با واکنش به اخبار."}},{"kind":"check","id":"b08ak3","type":"tap","source":"b08a3","prompt":{"en":"What should you read on a broker's site before opening an account?","fa":"پیش از باز کردن حساب، چه چیزی را در سایت کارگزار باید بخوانی؟"},"options":[{"en":"The fee page: trading fees, currency conversion and custody costs","fa":"صفحهٔ کارمزدها: کارمزد معامله، تبدیل ارز و هزینهٔ نگهداری"},{"en":"The list of analyst recommendations","fa":"فهرست توصیه‌های تحلیلگران"},{"en":"The marketing page with past returns","fa":"صفحهٔ تبلیغاتی با بازده‌های گذشته"}],"answer":0}]]},{"id":"b09","title":"Global Asset Allocation","author":{"en":"Meb Faber","fa":"Meb Faber"},"year":2015,"stage":2,"must":false,"why":{"en":"Compares the world's famous portfolios; very short","fa":"مقایسه سبدهای معروف دنیا؛ خیلی کوتاه"},"badge":{"en":"Stick With It","fa":"پای آن بمان"},"units":[[{"kind":"card","id":"b09c1","source":"Introduction, the portfolios compared","text":{"en":"Faber lines up the famous portfolios side by side, from the classic 60/40 to Harry Browne's Permanent Portfolio, Ray Dalio's All Seasons and the Ivy endowment model, and tests them on data from 1973 to 2013.","fa":"Faber سبدهای معروف را کنار هم می‌گذارد، از ۶۰/۴۰ کلاسیک تا Permanent Portfolio از Harry Browne، All Seasons از Ray Dalio و مدل موقوفه‌ای Ivy، و آن‌ها را روی داده‌های ۱۹۷۳ تا ۲۰۱۳ آزمایش می‌کند."}},{"kind":"card","id":"b09c2","source":"ch. 1, A History of Stocks, Bonds, and Bills","text":{"en":"Over long periods stocks beat bonds and bonds beat bills, but every asset has decade-long stretches of loss. Cash feels safe, yet after inflation it earns almost nothing.","fa":"در دوره‌های بلند، سهام از اوراق قرضه و اوراق قرضه از اسناد خزانه جلو می‌زند، اما هر دارایی دوره‌های زیان ده‌ساله دارد. نقد امن به نظر می‌رسد، ولی پس از تورم تقریباً هیچ نمی‌سازد."}},{"kind":"card","id":"b09c3","source":"ch. 5, The Permanent Portfolio","text":{"en":"Harry Browne's Permanent Portfolio splits money into four equal parts: stocks, long-term bonds, gold and cash, one for each economic season of prosperity, inflation, deflation and recession.","fa":"Permanent Portfolio از Harry Browne پول را به چهار بخش مساوی تقسیم می‌کند: سهام، اوراق قرضهٔ بلندمدت، طلا و نقد؛ هر کدام برای یک فصل اقتصادی: رونق، تورم، تورم منفی و رکود."}},{"kind":"check","id":"b09k1","type":"tap","source":"b09c3","prompt":{"en":"What are the four parts of Harry Browne's Permanent Portfolio?","fa":"چهار بخش Permanent Portfolio از Harry Browne چیست؟"},"options":[{"en":"Stocks, long-term bonds, gold and cash","fa":"سهام، اوراق قرضهٔ بلندمدت، طلا و نقد"},{"en":"US stocks, foreign stocks, REITs and commodities","fa":"سهام آمریکا، سهام خارجی، REIT و کالا"},{"en":"Bonds, bills, crypto and real estate","fa":"اوراق قرضه، اسناد خزانه، رمزارز و املاک"}],"answer":0},{"kind":"card","id":"b09c4","source":"ch. 11, Comparison of the Strategies","text":{"en":"The surprise: over four decades all the diversified portfolios landed within about one percentage point of annual return of each other. No allocation was a clear winner.","fa":"شگفتی اینجاست: در چهار دهه، همهٔ سبدهای متنوع از نظر بازده سالانه در فاصلهٔ حدود یک واحد درصد از هم قرار گرفتند. هیچ تخصیصی برندهٔ قاطع نبود."}},{"kind":"check","id":"b09k2","type":"tap","source":"b09c4","prompt":{"en":"What did Faber find when he compared the famous portfolios?","fa":"Faber وقتی سبدهای معروف را مقایسه کرد به چه نتیجه‌ای رسید؟"},"options":[{"en":"All landed within about one percentage point of annual return","fa":"همه در فاصلهٔ حدود یک واحد درصد بازده سالانه از هم قرار گرفتند"},{"en":"The 60/40 portfolio beat every other one by a wide margin","fa":"سبد ۶۰/۴۰ با فاصلهٔ زیاد از همه جلو زد"},{"en":"Gold-heavy portfolios doubled the return of the rest","fa":"سبدهای پرطلا بازده بقیه را دو برابر کردند"}],"answer":0}],[{"kind":"card","id":"b09c5","source":"ch. 12, Implementation (ETFs, Fees, and Taxes)","text":{"en":"Fees and taxes can cost more than the gap between the best and worst allocation. A good portfolio held in expensive funds can lose to a mediocre one held in cheap ETFs.","fa":"کارمزد و مالیات می‌تواند بیش از فاصلهٔ بهترین و بدترین تخصیص هزینه داشته باشد. یک سبد خوب در صندوق‌های گران می‌تواند از یک سبد متوسط در ETFهای ارزان عقب بماند."}},{"kind":"check","id":"b09k3","type":"tf","source":"b09c5","prompt":{"en":"Faber says fees and taxes matter less than finding exactly the right allocation.","fa":"Faber می‌گوید کارمزد و مالیات کمتر از پیدا کردن دقیق‌ترین تخصیص اهمیت دارد."},"answer":false},{"kind":"card","id":"b09c6","source":"ch. 13, Summary","text":{"en":"Faber's rule: pick any sensible global, diversified allocation, buy it with low-cost funds and then stick with it. Switching portfolios after a bad year is what ruins results.","fa":"قاعدهٔ Faber: یک تخصیص معقول، جهانی و متنوع انتخاب کن، با صندوق‌های کم‌هزینه بخر و بعد پای آن بمان. عوض کردن سبد بعد از یک سال بد همان چیزی است که نتیجه را خراب می‌کند."}},{"kind":"check","id":"b09k4","type":"tf","source":"b09c6","prompt":{"en":"Faber's advice is to pick a sensible diversified allocation, buy it cheaply and stick with it.","fa":"توصیهٔ Faber این است که یک تخصیص معقول و متنوع انتخاب کنی، ارزان بخری و پای آن بمانی."},"answer":true}],[{"kind":"card","id":"b09a1","source":"ch. 11, all diversified allocations landed within one point","text":{"en":"Faber found the famous allocations within about one point of each other, so do not spend months choosing between VWCE and IWDA or a 70/30 and an 80/20 split. Pick a sensible mix and move on.","fa":"Faber دید که تخصیص‌های معروف در فاصلهٔ حدود یک واحد درصد از هم‌اند، پس ماه‌ها را صرف انتخاب بین VWCE و IWDA یا تقسیم ۷۰/۳۰ و ۸۰/۲۰ نکن. یک ترکیب معقول انتخاب کن و جلو برو."}},{"kind":"card","id":"b09a2","source":"ch. 12, fees and taxes cost more than the allocation gap","text":{"en":"Fees and taxes matter more than the exact mix, so when you compare Interactive Brokers and DEGIRO, compare the total cost of holding ETFs for ten years, and learn how Box 3 treats what you hold.","fa":"کارمزد و مالیات بیش از ترکیب دقیق اهمیت دارد، پس وقتی Interactive Brokers و DEGIRO را مقایسه می‌کنی، هزینهٔ کل نگهداری ETF در ده سال را مقایسه کن و یاد بگیر Box 3 با دارایی‌هایت چه می‌کند."}},{"kind":"check","id":"b09ak1","type":"tap","source":"b09a1","prompt":{"en":"By Faber's comparison, how far apart did the famous allocations land?","fa":"طبق مقایسهٔ Faber، تخصیص‌های معروف چقدر از هم فاصله داشتند؟"},"options":[{"en":"Within about one point of each other","fa":"در فاصلهٔ حدود یک واحد درصد از هم"},{"en":"The 60/40 beat all the others by far","fa":"سبد ۶۰/۴۰ با فاصلهٔ زیاد از همه جلو زد"},{"en":"Gold-heavy mixes doubled the rest","fa":"ترکیب‌های پرطلا بازده بقیه را دو برابر کردند"}],"answer":0},{"kind":"card","id":"b09a3","source":"ch. 1, every asset has decade-long losing stretches","text":{"en":"Before you invest your €40k, separate the money you might need within a few years for a move or a visa. Faber's history shows every asset has decade-long losing stretches, and that money cannot wait one out.","fa":"پیش از سرمایه‌گذاری ۴۰ هزار یورویت، پولی را که شاید تا چند سال دیگر برای جابه‌جایی یا ویزا لازم داشته باشی جدا کن. تاریخ Faber نشان می‌دهد هر دارایی دوره‌های زیان ده‌ساله دارد و آن پول نمی‌تواند منتظر بماند."}},{"kind":"check","id":"b09ak2","type":"tf","source":"b09a2","prompt":{"en":"Faber's evidence suggests the exact mix matters more than broker fees and taxes.","fa":"شواهد Faber نشان می‌دهد ترکیب دقیق سبد مهم‌تر از کارمزد کارگزار و مالیات است."},"answer":false},{"kind":"card","id":"b09a4","source":"ch. 13, pick a sensible allocation and stick with it","text":{"en":"Faber's rule that switching after a bad year ruins results pairs well with your decision journal: write down why you chose your core, then re-read that page before any change.","fa":"قاعدهٔ Faber که عوض کردن سبد بعد از یک سال بد نتیجه را خراب می‌کند با دفتر تصمیم تو جور درمی‌آید: بنویس چرا این هسته را انتخاب کردی، بعد پیش از هر تغییری همان صفحه را دوباره بخوان."}},{"kind":"check","id":"b09ak3","type":"tap","source":"b09a3","prompt":{"en":"What does Faber's history say about every asset?","fa":"تاریخ Faber دربارهٔ هر دارایی چه می‌گوید؟"},"options":[{"en":"Every asset has decade-long losing stretches","fa":"هر دارایی دوره‌های زیان ده‌ساله دارد"},{"en":"Stocks never lose over a full decade","fa":"سهام هرگز در یک دههٔ کامل زیان نمی‌دهد"},{"en":"Cash keeps its value after inflation","fa":"نقد ارزشش را پس از تورم حفظ می‌کند"}],"answer":0}]]},{"id":"b10","title":"Financial Intelligence","author":{"en":"Karen Berman and Joe Knight with John Case","fa":"Karen Berman and Joe Knight with John Case"},"year":2006,"stage":3,"must":true,"why":{"en":"Financial statements for the non-financial manager; essential for a CTO","fa":"صورت‌های مالی برای مدیر غیرمالی؛ برای CTO ضروری"},"badge":{"en":"Profit Is Not Cash","fa":"سود، نقد نیست"},"units":[[{"kind":"card","id":"b10c1","source":"Part 1, The Art of Finance (and Why It Matters)","text":{"en":"Finance is as much art as science: every statement rests on estimates, assumptions and judgment calls. Financial intelligence means knowing where those judgments hide and asking about them.","fa":"مالی به همان اندازه که علم است، هنر هم هست: هر صورت مالی بر برآوردها، فرض‌ها و قضاوت‌ها استوار است. هوش مالی یعنی بدانی این قضاوت‌ها کجا پنهان‌اند و درباره‌شان بپرسی."}},{"kind":"card","id":"b10c2","source":"Part 2, The (Many) Peculiarities of the Income Statement","text":{"en":"The income statement shows revenue, costs and profit for a period, but profit is an estimate. Revenue is recorded when it is earned, not when the cash arrives, and depreciation spreads a purchase over years.","fa":"صورت سود و زیان درآمد، هزینه‌ها و سود یک دوره را نشان می‌دهد، اما سود یک برآورد است. درآمد وقتی ثبت می‌شود که کسب شده، نه وقتی پولش رسیده، و استهلاک یک خرید را روی چند سال پخش می‌کند."}},{"kind":"check","id":"b10k1","type":"tf","source":"b10c2","prompt":{"en":"On an income statement, revenue is recorded only when the cash actually arrives.","fa":"در صورت سود و زیان، درآمد فقط وقتی ثبت می‌شود که پولش واقعاً رسیده باشد."},"answer":false},{"kind":"card","id":"b10c3","source":"Part 3, The Balance Sheet Reveals the Most","text":{"en":"The balance sheet is a snapshot of what the company owns and owes on one day. Assets always equal liabilities plus owners' equity, and the authors say this statement reveals the most.","fa":"ترازنامه عکسی لحظه‌ای است از آنچه شرکت در یک روز دارد و بدهکار است. دارایی‌ها همیشه برابرند با بدهی‌ها به‌علاوهٔ حقوق صاحبان سهام، و نویسندگان می‌گویند این صورت بیش از همه حرف دارد."}},{"kind":"check","id":"b10k2","type":"tap","source":"b10c3","prompt":{"en":"What does the balance sheet always balance?","fa":"ترازنامه همیشه چه چیزی را برابر نگه می‌دارد؟"},"options":[{"en":"Assets equal liabilities plus owners' equity","fa":"دارایی‌ها برابرند با بدهی‌ها به‌علاوهٔ حقوق صاحبان سهام"},{"en":"Revenue equals costs plus profit","fa":"درآمد برابر است با هزینه‌ها به‌علاوهٔ سود"},{"en":"Cash in equals cash out plus dividends","fa":"نقد ورودی برابر است با نقد خروجی به‌علاوهٔ سود تقسیمی"}],"answer":0}],[{"kind":"card","id":"b10c4","source":"Part 4, Cash Is King","text":{"en":"Profit is not cash. A profitable company can run out of cash while it waits for customers to pay, so the cash flow statement is the hardest one to dress up and the one to trust.","fa":"سود، نقد نیست. یک شرکت سودده می‌تواند در حالی که منتظر پرداخت مشتریان است بی‌پول شود؛ برای همین صورت جریان نقدی سخت‌ترین صورت برای آرایش کردن و قابل‌اعتمادترین است."}},{"kind":"check","id":"b10k3","type":"tap","source":"b10c4","prompt":{"en":"Why can a profitable company still run out of cash?","fa":"چرا یک شرکت سودده هم می‌تواند بی‌پول شود؟"},"options":[{"en":"It waits for customers to pay","fa":"منتظر پرداخت مشتریان می‌ماند"},{"en":"Depreciation takes cash out of the bank","fa":"استهلاک پول را از بانک بیرون می‌کشد"},{"en":"Profit is always smaller than cash","fa":"سود همیشه کمتر از نقد است"}],"answer":0},{"kind":"card","id":"b10c5","source":"Part 5, Ratios: Learning What the Numbers Are Really Telling You","text":{"en":"Ratios turn raw numbers into meaning: profitability (gross and net margin), leverage (debt to equity), liquidity (current ratio) and efficiency (days sales outstanding). Compare them over time and against peers.","fa":"نسبت‌ها اعداد خام را معنادار می‌کنند: سودآوری (حاشیهٔ ناخالص و خالص)، اهرم (بدهی به حقوق صاحبان سهام)، نقدشوندگی (نسبت جاری) و کارایی (روزهای وصول مطالبات). آن‌ها را در طول زمان و با رقبا مقایسه کن."}},{"kind":"card","id":"b10c6","source":"Part 7, Applied Financial Intelligence: Working Capital Management","text":{"en":"Working capital is where managers move the numbers: collect receivables faster, hold less inventory and pay suppliers on time, not early, and the company frees cash without selling anything.","fa":"سرمایه در گردش جایی است که مدیران اعداد را جابه‌جا می‌کنند: مطالبات را زودتر وصول کن، موجودی کمتری نگه دار و به تأمین‌کنندگان سر موعد، نه زودتر، پرداخت کن؛ شرکت بدون فروختن چیزی نقد آزاد می‌کند."}},{"kind":"check","id":"b10k4","type":"tf","source":"b10c6","prompt":{"en":"The authors recommend paying suppliers as early as possible to free up cash.","fa":"نویسندگان توصیه می‌کنند برای آزاد کردن نقد، هرچه زودتر به تأمین‌کنندگان پرداخت کنی."},"answer":false}],[{"kind":"card","id":"b10a1","source":"Part 4, profit is not cash","text":{"en":"When your small AI product earns its first €100, count it the way the authors count cash: money that has landed in your account, after platform fees and refunds, not subscriptions that were only signed up.","fa":"وقتی محصول کوچک AI تو اولین ۱۰۰ یورویش را درمی‌آورد، آن را همان‌طور بشمار که نویسندگان نقد را می‌شمارند: پولی که به حسابت رسیده، پس از کارمزد پلتفرم و بازپرداخت‌ها، نه اشتراک‌هایی که فقط ثبت‌نام شده‌اند."}},{"kind":"card","id":"b10a2","source":"Part 1, every statement rests on estimates and judgment calls","text":{"en":"Before you sign for startup equity, ask where the judgment calls hide in the numbers you are shown: when revenue is recognized and which costs are deferred. Financial intelligence starts with that question.","fa":"پیش از امضا برای سهام استارتاپ، بپرس قضاوت‌ها کجای اعدادی که نشانت می‌دهند پنهان‌اند: درآمد کی شناسایی می‌شود و کدام هزینه‌ها به تعویق افتاده‌اند. هوش مالی با همین پرسش شروع می‌شود."}},{"kind":"check","id":"b10ak1","type":"tap","source":"b10a1","prompt":{"en":"How should you count the first €100 from your product?","fa":"اولین ۱۰۰ یوروی محصولت را چطور باید بشماری؟"},"options":[{"en":"Money that has landed in your account, after fees and refunds","fa":"پولی که به حسابت رسیده، پس از کارمزد و بازپرداخت‌ها"},{"en":"Subscriptions signed up, paid or not","fa":"اشتراک‌های ثبت‌نام‌شده، چه پرداخت شده چه نشده"},{"en":"Projected revenue for the whole year","fa":"درآمد پیش‌بینی‌شده برای کل سال"}],"answer":0},{"kind":"card","id":"b10a3","source":"Part 5, ratios turn numbers into meaning","text":{"en":"As a CTO you can read your own company with the authors' ratios: gross margin tells you whether the product scales, and days sales outstanding tells you whether customers actually pay.","fa":"به‌عنوان CTO می‌توانی شرکت خودت را با نسبت‌های نویسندگان بخوانی: حاشیهٔ ناخالص می‌گوید محصول مقیاس‌پذیر هست یا نه، و روزهای وصول مطالبات می‌گوید مشتری‌ها واقعاً پرداخت می‌کنند یا نه."}},{"kind":"check","id":"b10ak2","type":"tf","source":"b10a2","prompt":{"en":"Before you sign for startup equity, the numbers you are shown contain no judgment calls, so there is nothing to ask.","fa":"پیش از امضا برای سهام استارتاپ، اعدادی که نشانت می‌دهند هیچ قضاوتی در خود ندارند، پس چیزی برای پرسیدن نیست."},"answer":false},{"kind":"card","id":"b10a4","source":"Part 7, working capital management","text":{"en":"Apply working capital thinking to your product: charge up front, collect receivables faster and keep paid tools on monthly terms. That frees cash without raising a cent.","fa":"منطق سرمایه در گردش را روی محصولت پیاده کن: پیش‌پرداخت بگیر، مطالبات را زودتر وصول کن و ابزارهای پولی را ماهانه نگه دار. این کار بدون جذب حتی یک سنت سرمایه، نقد آزاد می‌کند."}},{"kind":"check","id":"b10ak3","type":"tap","source":"b10a3","prompt":{"en":"Which ratio tells you whether the product scales?","fa":"کدام نسبت می‌گوید محصول مقیاس‌پذیر هست یا نه؟"},"options":[{"en":"Gross margin","fa":"حاشیهٔ ناخالص"},{"en":"Days sales outstanding","fa":"روزهای وصول مطالبات"},{"en":"Debt to equity","fa":"بدهی به حقوق صاحبان سهام"}],"answer":0}]]},{"id":"b11","title":"The Little Book of Valuation","author":{"en":"Aswath Damodaran","fa":"Aswath Damodaran"},"year":2011,"stage":3,"must":true,"why":{"en":"DCF and valuation without heavy maths","fa":"DCF و ارزش‌گذاری بدون ریاضی سنگین"},"badge":{"en":"Price Is Not Value","fa":"قیمت، ارزش نیست"},"units":[[{"kind":"card","id":"b11c1","source":"ch. 1, Value: More Than a Number!","text":{"en":"Damodaran opens with three truths: all valuations are biased, most valuations are wrong, and simpler is usually better. Price is what you pay; value is what the business is worth.","fa":"Damodaran با سه حقیقت شروع می‌کند: همهٔ ارزش‌گذاری‌ها سوگیری دارند، بیشترشان اشتباه‌اند، و ساده‌تر معمولاً بهتر است. قیمت چیزی است که می‌پردازی؛ ارزش چیزی است که کسب‌وکار می‌ارزد."}},{"kind":"card","id":"b11c2","source":"ch. 2, Power Tools of the Trade","text":{"en":"Two power tools make valuation work: the time value of money, since a dollar today is worth more than a dollar next year, and a risk-adjusted discount rate, since riskier cash flows deserve a lower price.","fa":"دو ابزار قدرتمند ارزش‌گذاری را ممکن می‌کنند: ارزش زمانی پول، چون یک دلار امروز بیش از یک دلار سال بعد می‌ارزد، و نرخ تنزیل تعدیل‌شده با ریسک، چون جریان نقدی پرریسک‌تر قیمت پایین‌تری می‌طلبد."}},{"kind":"check","id":"b11k1","type":"tf","source":"b11c1","prompt":{"en":"Damodaran says a careful analyst can produce a valuation free of bias.","fa":"Damodaran می‌گوید یک تحلیلگر دقیق می‌تواند ارزش‌گذاری بدون سوگیری تولید کند."},"answer":false},{"kind":"card","id":"b11c3","source":"ch. 3, Yes, Virginia, Every Asset Has an Intrinsic Value","text":{"en":"Intrinsic value is the present value of the cash flows an asset will produce. A DCF needs four inputs: cash flows from existing assets, expected growth, a discount rate for risk and the point where growth settles.","fa":"ارزش ذاتی، ارزش فعلی جریان‌های نقدی‌ای است که دارایی تولید خواهد کرد. یک DCF چهار ورودی می‌خواهد: جریان نقدی دارایی‌های موجود، رشد مورد انتظار، نرخ تنزیل برای ریسک و نقطه‌ای که رشد آرام می‌گیرد."}},{"kind":"check","id":"b11k2","type":"tap","source":"b11c3","prompt":{"en":"What are the four inputs of a DCF, according to Damodaran?","fa":"به گفتهٔ Damodaran، چهار ورودی یک DCF چیست؟"},"options":[{"en":"Cash flows, expected growth, a discount rate and the point where growth settles","fa":"جریان نقدی، رشد مورد انتظار، نرخ تنزیل و نقطه‌ای که رشد آرام می‌گیرد"},{"en":"Revenue, headcount, market share and brand","fa":"درآمد، تعداد کارکنان، سهم بازار و برند"},{"en":"Book value, dividends, stock price and trading volume","fa":"ارزش دفتری، سود تقسیمی، قیمت سهم و حجم معاملات"}],"answer":0}],[{"kind":"card","id":"b11c4","source":"ch. 4, It's All Relative!","text":{"en":"Relative valuation prices an asset against similar ones using multiples such as PE or EV to EBITDA. Find comparable firms, standardize price into a multiple, then adjust for differences in growth and risk.","fa":"ارزش‌گذاری نسبی یک دارایی را در برابر دارایی‌های مشابه با ضرایبی مثل PE یا EV/EBITDA قیمت می‌گذارد. شرکت‌های قابل‌مقایسه را پیدا کن، قیمت را به یک ضریب استاندارد کن، سپس تفاوت‌های رشد و ریسک را تعدیل کن."}},{"kind":"check","id":"b11k3","type":"order","source":"b11c4","prompt":{"en":"Put the steps of relative valuation in order","fa":"مراحل ارزش‌گذاری نسبی را مرتب کن"},"options":[{"en":"Adjust for differences in growth and risk","fa":"تفاوت‌های رشد و ریسک را تعدیل کن"},{"en":"Find comparable firms","fa":"شرکت‌های قابل‌مقایسه را پیدا کن"},{"en":"Standardize price into a multiple","fa":"قیمت را به یک ضریب استاندارد کن"}],"answer":[1,2,0]},{"kind":"card","id":"b11c5","source":"Part 2, From Cradle to Grave: Life Cycle and Valuation","text":{"en":"Valuation changes with the company's life cycle: a young startup is mostly a story about growth and survival, a mature firm is valued on its existing assets, and a declining firm on what it can salvage.","fa":"ارزش‌گذاری با چرخهٔ عمر شرکت عوض می‌شود: یک استارتاپ جوان بیشتر داستانی دربارهٔ رشد و بقاست، یک شرکت بالغ بر پایهٔ دارایی‌های موجودش ارزش‌گذاری می‌شود، و یک شرکت رو به افول بر پایهٔ آنچه می‌تواند نجات دهد."}},{"kind":"check","id":"b11k4","type":"tap","source":"b11c5","prompt":{"en":"How is a young startup mainly valued, in Damodaran's life-cycle view?","fa":"در نگاه چرخهٔ عمر Damodaran، یک استارتاپ جوان عمدتاً چطور ارزش‌گذاری می‌شود؟"},"options":[{"en":"As a story about growth and survival","fa":"به‌عنوان داستانی دربارهٔ رشد و بقا"},{"en":"On the book value of its existing assets","fa":"بر پایهٔ ارزش دفتری دارایی‌های موجودش"},{"en":"On what it could salvage in liquidation","fa":"بر پایهٔ آنچه در تصفیه می‌تواند نجات دهد"}],"answer":0},{"kind":"card","id":"b11c6","source":"ch. 12, rules for the road","text":{"en":"Damodaran's rules for the road: less is more, so keep the model simple; risk affects value; growth is not free, it must be paid for with reinvestment; and accept uncertainty, because your estimate will be wrong.","fa":"قاعده‌های راه Damodaran: کمتر بیشتر است، پس مدل را ساده نگه دار؛ ریسک بر ارزش اثر می‌گذارد؛ رشد مجانی نیست و باید با سرمایه‌گذاری مجدد پرداخت شود؛ و عدم‌قطعیت را بپذیر، چون برآوردت اشتباه خواهد بود."}}],[{"kind":"card","id":"b11a1","source":"ch. 1, all valuations are biased","text":{"en":"When a founder tells you the startup is worth €10 million, remember Damodaran: every valuation is biased, and the person who sets the number has a reason. Build your own simple estimate before you sign.","fa":"وقتی بنیان‌گذاری می‌گوید استارتاپ ۱۰ میلیون یورو می‌ارزد، Damodaran را به یاد بیاور: هر ارزش‌گذاری سوگیری دارد و کسی که عدد را تعیین می‌کند دلیلی دارد. پیش از امضا، برآورد سادهٔ خودت را بساز."}},{"kind":"card","id":"b11a2","source":"Part 2, a young startup is a story about growth and survival","text":{"en":"Your equity in a young startup is a story about growth and survival. Write that story on one page: what must happen for the shares to be worth anything, and what would make them worth zero.","fa":"سهم تو در یک استارتاپ جوان داستانی دربارهٔ رشد و بقاست. آن داستان را در یک صفحه بنویس: چه باید اتفاق بیفتد تا سهام ارزشی پیدا کند، و چه چیزی ارزشش را صفر می‌کند."}},{"kind":"check","id":"b11ak1","type":"tap","source":"b11a1","prompt":{"en":"What does Damodaran remind you when a founder names a valuation?","fa":"وقتی بنیان‌گذار یک ارزش‌گذاری را اعلام می‌کند، Damodaran چه چیزی را یادآوری می‌کند؟"},"options":[{"en":"Every valuation is biased","fa":"هر ارزش‌گذاری سوگیری دارد"},{"en":"The founder's number is the market price","fa":"عدد بنیان‌گذار همان قیمت بازار است"},{"en":"Valuations are only wrong in a crash","fa":"ارزش‌گذاری‌ها فقط در سقوط بازار اشتباه‌اند"}],"answer":0},{"kind":"card","id":"b11a3","source":"ch. 4, relative valuation with multiples","text":{"en":"To sanity-check a term sheet, use relative valuation: find comparable startups, turn their price into a multiple of revenue, then adjust for differences in growth and risk.","fa":"برای محک زدن یک term sheet از ارزش‌گذاری نسبی استفاده کن: استارتاپ‌های قابل‌مقایسه را پیدا کن، قیمتشان را به ضریبی از درآمد تبدیل کن، سپس تفاوت‌های رشد و ریسک را تعدیل کن."}},{"kind":"check","id":"b11ak2","type":"tf","source":"b11a2","prompt":{"en":"Damodaran's life-cycle view says your equity in a young startup is valued mainly on its existing assets.","fa":"نگاه چرخهٔ عمر Damodaran می‌گوید سهم تو در یک استارتاپ جوان عمدتاً بر پایهٔ دارایی‌های موجودش ارزش‌گذاری می‌شود."},"answer":false},{"kind":"card","id":"b11a4","source":"ch. 3, intrinsic value and the four DCF inputs","text":{"en":"For your own AI product a tiny DCF is enough: estimate the cash it produces, expected growth, a high discount rate for risk and the point where growth settles. That is what your ownership is worth today.","fa":"برای محصول AI خودت یک DCF کوچک کافی است: نقدی که تولید می‌کند، رشد مورد انتظار، نرخ تنزیل بالا برای ریسک و نقطه‌ای که رشد آرام می‌گیرد را برآورد کن. این همان ارزش امروز مالکیت توست."}},{"kind":"check","id":"b11ak3","type":"tap","source":"b11a3","prompt":{"en":"How do you sanity-check a term sheet with relative valuation?","fa":"چطور یک term sheet را با ارزش‌گذاری نسبی محک می‌زنی؟"},"options":[{"en":"Find comparable startups, turn price into a multiple, then adjust for growth and risk","fa":"استارتاپ‌های قابل‌مقایسه را پیدا کن، قیمت را به ضریب تبدیل کن، سپس رشد و ریسک را تعدیل کن"},{"en":"Accept the founder's number if investors agreed to it","fa":"اگر سرمایه‌گذاران قبول کرده‌اند، عدد بنیان‌گذار را بپذیر"},{"en":"Average the last three funding rounds","fa":"میانگین سه دور آخر جذب سرمایه را بگیر"}],"answer":0}]]},{"id":"b12","title":"Berkshire Hathaway Shareholder Letters (free)","author":{"en":"Warren Buffett","fa":"Warren Buffett"},"year":1977,"stage":3,"must":true,"why":{"en":"The best business lesson in the world, free","fa":"بهترین درس کسب‌وکار دنیا، مجانی"},"badge":{"en":"Circle of Competence","fa":"دایرهٔ صلاحیت"},"units":[[{"kind":"card","id":"b12c1","source":"1977 letter, acquisition criteria","text":{"en":"From the first letters Buffett lists what Berkshire buys: a business he understands, with favorable long-term prospects, run by honest and able people, at a very attractive price.","fa":"Buffett از همان نامه‌های اول می‌نویسد Berkshire چه می‌خرد: کسب‌وکاری که می‌فهمد، با چشم‌انداز بلندمدت مطلوب، با مدیران درستکار و توانا، و با قیمتی بسیار جذاب."}},{"kind":"card","id":"b12c2","source":"1986 letter, owner earnings","text":{"en":"Owner earnings, not reported profit, measure a business: reported earnings plus depreciation, minus the capital spending needed just to keep the business competitive. That is the cash an owner can really take out.","fa":"سود مالکانه، نه سود گزارش‌شده، معیار سنجش کسب‌وکار است: سود گزارش‌شده به‌علاوهٔ استهلاک، منهای مخارج سرمایه‌ای لازم فقط برای رقابتی ماندن کسب‌وکار. این همان نقدی است که مالک واقعاً می‌تواند بردارد."}},{"kind":"check","id":"b12k1","type":"tap","source":"b12c2","prompt":{"en":"How does Buffett define owner earnings?","fa":"Buffett سود مالکانه را چطور تعریف می‌کند؟"},"options":[{"en":"Reported earnings plus depreciation, minus the capital spending needed to keep the business competitive","fa":"سود گزارش‌شده به‌علاوهٔ استهلاک، منهای مخارج سرمایه‌ای لازم برای رقابتی ماندن کسب‌وکار"},{"en":"Revenue minus all taxes paid to the government","fa":"درآمد منهای همهٔ مالیات‌های پرداختی به دولت"},{"en":"Dividends paid plus share buybacks","fa":"سود تقسیمی پرداختی به‌علاوهٔ بازخرید سهام"}],"answer":0},{"kind":"card","id":"b12c3","source":"1987 letter, Mr. Market","text":{"en":"Mr. Market, borrowed from Graham, is a manic partner who quotes you a price every day; use him when his price is foolish and ignore him otherwise, because he is there to serve you, not to guide you.","fa":"Mr. Market، وام‌گرفته از Graham، شریکی دمدمی است که هر روز قیمتی به تو می‌گوید؛ وقتی قیمتش احمقانه است از او استفاده کن و در بقیهٔ مواقع نادیده‌اش بگیر، چون او برای خدمت به توست، نه راهنمایی تو."}},{"kind":"check","id":"b12k2","type":"tf","source":"b12c3","prompt":{"en":"Buffett says Mr. Market's daily price is the best guide to what a business is worth.","fa":"Buffett می‌گوید قیمت روزانهٔ Mr. Market بهترین راهنما برای ارزش یک کسب‌وکار است."},"answer":false}],[{"kind":"card","id":"b12c4","source":"1996 letter, circle of competence","text":{"en":"You do not need to be an expert on every company, only on those inside your circle of competence. The size of that circle is not very important; knowing its boundaries is vital.","fa":"لازم نیست در مورد هر شرکتی متخصص باشی، فقط شرکت‌های داخل دایرهٔ صلاحیت خودت. اندازهٔ این دایره خیلی مهم نیست؛ شناختن مرزهایش حیاتی است."}},{"kind":"check","id":"b12k3","type":"tap","source":"b12c4","prompt":{"en":"What matters most about your circle of competence, according to Buffett?","fa":"به گفتهٔ Buffett، دربارهٔ دایرهٔ صلاحیت چه چیزی از همه مهم‌تر است؟"},"options":[{"en":"Knowing its boundaries","fa":"شناختن مرزهایش"},{"en":"Making it as large as possible","fa":"تا جای ممکن بزرگ کردنش"},{"en":"Keeping it secret from competitors","fa":"پنهان نگه داشتنش از رقبا"}],"answer":0},{"kind":"card","id":"b12c5","source":"2007 letter, moats","text":{"en":"A truly great business needs an enduring moat that protects its high returns on capital, such as being the low-cost producer or owning a powerful brand. Capitalism keeps attacking any castle without one.","fa":"یک کسب‌وکار واقعاً عالی به خندقی پایدار نیاز دارد که بازده بالای سرمایه‌اش را حفظ کند، مثل تولیدکنندهٔ کم‌هزینه بودن یا داشتن برندی قدرتمند. سرمایه‌داری به هر قلعه‌ای بدون خندق مدام حمله می‌کند."}},{"kind":"card","id":"b12c6","source":"Insurance float (recurring) and the 1986 letter on greed and fear","text":{"en":"Insurance float is money Berkshire holds before claims are paid; when it costs less than borrowing, it funds the rest. Buffett's rule: be fearful when others are greedy, and greedy only when others are fearful.","fa":"شناوری بیمه پولی است که Berkshire پیش از پرداخت خسارت‌ها نگه می‌دارد؛ وقتی ارزان‌تر از وام تمام شود، بقیه را تأمین مالی می‌کند. قاعدهٔ Buffett: وقتی دیگران حریص‌اند بترس، و فقط وقتی دیگران می‌ترسند حریص باش."}},{"kind":"check","id":"b12k4","type":"tf","source":"b12c6","prompt":{"en":"Buffett's rule is to be greedy only when others are fearful.","fa":"قاعدهٔ Buffett این است که فقط وقتی دیگران می‌ترسند حریص باشی."},"answer":true}],[{"kind":"card","id":"b12a1","source":"1996 letter, circle of competence","text":{"en":"Your circle of competence is software and AI products, not biotech or shipping. Use it for the 20 percent satellite and for choosing which startup to join; the index core needs no circle at all.","fa":"دایرهٔ صلاحیت تو نرم‌افزار و محصولات AI است، نه بیوتک یا کشتیرانی. از آن برای ۲۰ درصد ماهواره‌ای و برای انتخاب استارتاپی که به آن می‌پیوندی استفاده کن؛ هستهٔ شاخصی اصلاً به دایره نیاز ندارد."}},{"kind":"card","id":"b12a2","source":"1986 letter, owner earnings","text":{"en":"Judge your own product by owner earnings: the cash it brings in, minus the hosting, API and tool spend needed just to keep it competitive. The first €100 of ownership income counts only after that.","fa":"محصول خودت را با سود مالکانه بسنج: نقدی که می‌آورد، منهای هزینهٔ هاستینگ، API و ابزارهایی که فقط برای رقابتی ماندنش لازم است. اولین ۱۰۰ یوروی درآمد مالکیتی فقط بعد از آن حساب می‌شود."}},{"kind":"check","id":"b12ak1","type":"tap","source":"b12a1","prompt":{"en":"Where does Buffett's circle of competence apply in your plan?","fa":"دایرهٔ صلاحیت Buffett در برنامهٔ تو کجا به کار می‌آید؟"},"options":[{"en":"The 20 percent satellite and choosing which startup to join","fa":"۲۰ درصد ماهواره‌ای و انتخاب استارتاپی که به آن می‌پیوندی"},{"en":"The 80 percent index core only","fa":"فقط هستهٔ شاخصی ۸۰ درصدی"},{"en":"Nowhere, index investing replaces it","fa":"هیچ‌جا، سرمایه‌گذاری شاخصی جایش را می‌گیرد"}],"answer":0},{"kind":"card","id":"b12a3","source":"1977 letter, acquisition criteria","text":{"en":"Before you join a startup for equity, run Buffett's four tests on it: a business you understand, favorable long-term prospects, honest and able people, and an attractive price for your time and shares.","fa":"پیش از پیوستن به یک استارتاپ برای سهام، چهار آزمون Buffett را رویش اجرا کن: کسب‌وکاری که می‌فهمی، چشم‌انداز بلندمدت مطلوب، آدم‌های درستکار و توانا، و قیمتی جذاب در برابر وقت و سهم تو."}},{"kind":"check","id":"b12ak2","type":"tf","source":"b12a2","prompt":{"en":"By owner earnings, the first €100 counts before hosting and API spend are subtracted.","fa":"طبق سود مالکانه، اولین ۱۰۰ یورو پیش از کم کردن هزینهٔ هاستینگ و API حساب می‌شود."},"answer":false},{"kind":"card","id":"b12a4","source":"2007 letter, moats","text":{"en":"Ask what moat your small AI product has: a thin wrapper over someone else's API is a castle without one, and Buffett says capitalism keeps attacking those. Build the part that is hard to copy.","fa":"بپرس محصول کوچک AI تو چه خندقی دارد: یک پوستهٔ نازک روی API دیگران قلعه‌ای بدون خندق است، و Buffett می‌گوید سرمایه‌داری مدام به چنین قلعه‌هایی حمله می‌کند. آن بخشی را بساز که کپی کردنش سخت است."}},{"kind":"check","id":"b12ak3","type":"tap","source":"b12a3","prompt":{"en":"Which of Buffett's four tests is missing: a business you understand, favorable long-term prospects, an attractive price, and ...?","fa":"کدام آزمون Buffett جا افتاده: کسب‌وکاری که می‌فهمی، چشم‌انداز بلندمدت مطلوب، قیمت جذاب، و ...؟"},"options":[{"en":"Honest and able people","fa":"آدم‌های درستکار و توانا"},{"en":"A famous investor on the cap table","fa":"یک سرمایه‌گذار معروف در cap table"},{"en":"A plan to go public within two years","fa":"برنامه‌ای برای عرضهٔ عمومی تا دو سال دیگر"}],"answer":0}]]},{"id":"b13","title":"The Intelligent Investor (chapters 8 and 20)","author":{"en":"Benjamin Graham","fa":"Benjamin Graham"},"year":1949,"stage":3,"must":false,"why":{"en":"Mr. Market and the margin of safety","fa":"Mr. Market و حاشیه امنیت"},"badge":{"en":"Margin of Safety","fa":"حاشیهٔ امنیت"},"units":[[{"kind":"card","id":"b13c1","source":"ch. 8, The Investor and Market Fluctuations: the Mr. Market parable","text":{"en":"Imagine a private business partner, Mr. Market, who every day names a price at which he will buy your share or sell you his; some days his price is sensible, but often his fear or excitement makes it silly.","fa":"تصور کن شریکی خصوصی به نام Mr. Market داری که هر روز قیمتی می‌گوید که با آن یا سهم تو را می‌خرد یا سهم خودش را به تو می‌فروشد؛ بعضی روزها قیمتش منطقی است، اما اغلب ترس یا هیجانش آن را مسخره می‌کند."}},{"kind":"check","id":"b13k1","type":"tap","source":"b13c1","prompt":{"en":"Who is Mr. Market in Graham's parable?","fa":"Mr. Market در تمثیل Graham کیست؟"},"options":[{"en":"A partner who names a price every day to buy or sell","fa":"شریکی که هر روز قیمتی برای خرید یا فروش می‌گوید"},{"en":"A regulator who sets fair prices for stocks","fa":"ناظری که قیمت منصفانهٔ سهام را تعیین می‌کند"},{"en":"A broker who charges a daily commission","fa":"کارگزاری که کارمزد روزانه می‌گیرد"}],"answer":0},{"kind":"card","id":"b13c2","source":"ch. 8, using market fluctuations","text":{"en":"The investor is free to ignore him or to profit from him: buy when he offers a price well below value, sell when his price is absurdly high. His quotes are an opportunity, never an order.","fa":"سرمایه‌گذار آزاد است او را نادیده بگیرد یا از او سود ببرد: وقتی قیمتی خیلی پایین‌تر از ارزش می‌دهد بخر، وقتی قیمتش به‌طرز مسخره‌ای بالاست بفروش. قیمت‌های او فرصت‌اند، هرگز دستور نیستند."}},{"kind":"card","id":"b13c3","source":"ch. 8, pricing versus timing","text":{"en":"Graham warns that the investor who lets a market decline stampede him into selling turns his basic advantage into a basic disadvantage. Meet price swings with pricing, not with timing.","fa":"Graham هشدار می‌دهد سرمایه‌گذاری که اجازه می‌دهد افت بازار او را به فروش هول‌زده بکشاند، مزیت اصلی‌اش را به عیب اصلی تبدیل می‌کند. با نوسان قیمت با قیمت‌گذاری روبه‌رو شو، نه با زمان‌بندی."}},{"kind":"check","id":"b13k2","type":"tf","source":"b13c3","prompt":{"en":"Graham advises selling quickly whenever the market declines sharply.","fa":"Graham توصیه می‌کند هر وقت بازار شدید افت کرد سریع بفروشی."},"answer":false}],[{"kind":"card","id":"b13c4","source":"ch. 20, Margin of Safety as the Central Concept of Investment","text":{"en":"Asked to distill sound investing into three words, Graham answers: margin of safety. Pay a price far enough below your estimate of value that errors, bad luck and a changing world cannot destroy you.","fa":"وقتی از Graham می‌خواهند سرمایه‌گذاری درست را در سه کلمه خلاصه کند، پاسخ می‌دهد: حاشیهٔ امنیت. قیمتی بپرداز آن‌قدر پایین‌تر از برآوردت از ارزش که خطا، بدشانسی و تغییر دنیا نتوانند نابودت کنند."}},{"kind":"check","id":"b13k3","type":"tap","source":"b13c4","prompt":{"en":"Which three words does Graham use for the secret of sound investing?","fa":"Graham راز سرمایه‌گذاری درست را در کدام سه کلمه خلاصه می‌کند؟"},"options":[{"en":"Margin of safety","fa":"حاشیهٔ امنیت"},{"en":"Buy and hold","fa":"بخر و نگه دار"},{"en":"Diversify, diversify, diversify","fa":"تنوع، تنوع، تنوع"}],"answer":0},{"kind":"card","id":"b13c5","source":"ch. 20, price paid and diversification","text":{"en":"The margin of safety depends entirely on the price paid; a fine company bought too dear has none. Diversification is its companion, because a margin protects on average, not on every single pick.","fa":"حاشیهٔ امنیت کاملاً به قیمت پرداختی بستگی دارد؛ شرکت خوبی که خیلی گران خریده شود هیچ حاشیه‌ای ندارد. تنوع همراه آن است، چون حاشیه به‌طور میانگین محافظت می‌کند، نه در تک‌تک انتخاب‌ها."}},{"kind":"card","id":"b13c6","source":"ch. 20, investment versus speculation","text":{"en":"An investment operation is one which, on thorough analysis, promises safety of principal and an adequate return; anything else is speculation. The margin of safety is what separates the two.","fa":"عملیات سرمایه‌گذاری عملیاتی است که با تحلیل کامل، حفظ اصل سرمایه و بازده کافی را وعده می‌دهد؛ هر چیز دیگری سفته‌بازی است. حاشیهٔ امنیت همان چیزی است که این دو را از هم جدا می‌کند."}},{"kind":"check","id":"b13k4","type":"tf","source":"b13c5","prompt":{"en":"According to Graham, a margin of safety depends on the price you pay.","fa":"به گفتهٔ Graham، حاشیهٔ امنیت به قیمتی که می‌پردازی بستگی دارد."},"answer":true}],[{"kind":"card","id":"b13a1","source":"ch. 8, meet price swings with pricing, not timing","text":{"en":"When your index ETFs fall 30 percent in a bad year, Graham's advice is pricing, not timing: a lower price for the same worldwide businesses is an opportunity, never an order to sell.","fa":"وقتی ETFهای شاخصی تو در یک سال بد ۳۰ درصد می‌ریزند، توصیهٔ Graham قیمت‌گذاری است، نه زمان‌بندی: قیمت پایین‌تر برای همان کسب‌وکارهای سراسر دنیا یک فرصت است، هرگز دستور فروش نیست."}},{"kind":"card","id":"b13a2","source":"ch. 20, margin of safety against errors and bad luck","text":{"en":"Apply margin of safety to the 25 times target: if your estimate of annual expenses in the Netherlands is a guess, pad it, because a margin protects you from errors, bad luck and a changing world.","fa":"حاشیهٔ امنیت را روی هدف ۲۵ برابر پیاده کن: اگر برآوردت از هزینهٔ سالانه در هلند یک حدس است، به آن حاشیه اضافه کن، چون حاشیه از خطا، بدشانسی و تغییر دنیا محافظتت می‌کند."}},{"kind":"check","id":"b13ak1","type":"tap","source":"b13a1","prompt":{"en":"How does Graham tell you to treat a 30 percent fall in your index ETFs?","fa":"Graham می‌گوید با ریزش ۳۰ درصدی ETFهای شاخصی‌ات چطور برخورد کنی؟"},"options":[{"en":"As pricing, not timing: an opportunity, never an order to sell","fa":"به‌عنوان قیمت‌گذاری، نه زمان‌بندی: یک فرصت، هرگز دستور فروش"},{"en":"As a signal to sell and wait for the bottom","fa":"به‌عنوان علامتی برای فروش و انتظار تا کف"},{"en":"As proof that index investing has failed","fa":"به‌عنوان اثبات شکست سرمایه‌گذاری شاخصی"}],"answer":0},{"kind":"card","id":"b13a3","source":"ch. 20, price paid and diversification","text":{"en":"A fine startup bought too dear has no margin of safety, and that includes equity you accept instead of salary. Spread your bets, because a margin protects on average, not on every single pick.","fa":"استارتاپ خوبی که خیلی گران خریده شود هیچ حاشیهٔ امنیتی ندارد، و این شامل سهامی که به‌جای حقوق می‌پذیری هم می‌شود. شرط‌هایت را پخش کن، چون حاشیه به‌طور میانگین محافظت می‌کند، نه در تک‌تک انتخاب‌ها."}},{"kind":"check","id":"b13ak2","type":"tf","source":"b13a2","prompt":{"en":"Graham's margin of safety means padding a guessed expense estimate rather than trusting it exactly.","fa":"حاشیهٔ امنیت Graham یعنی به برآورد حدسی هزینه‌ها حاشیه اضافه کنی، نه اینکه دقیقاً به آن اعتماد کنی."},"answer":true},{"kind":"card","id":"b13a4","source":"ch. 20, investment versus speculation","text":{"en":"Label each 20 percent satellite bet honestly: thorough analysis, safety of principal and an adequate return make it an investment; anything else is speculation and deserves a smaller size.","fa":"هر شرط در ۲۰ درصد ماهواره‌ای را صادقانه برچسب بزن: تحلیل کامل، حفظ اصل سرمایه و بازده کافی آن را سرمایه‌گذاری می‌کند؛ هر چیز دیگری سفته‌بازی است و اندازهٔ کوچک‌تری می‌طلبد."}},{"kind":"check","id":"b13ak3","type":"tap","source":"b13a4","prompt":{"en":"In Graham's terms, what makes a satellite bet an investment rather than speculation?","fa":"به زبان Graham، چه چیزی یک شرط ماهواره‌ای را سرمایه‌گذاری می‌کند نه سفته‌بازی؟"},"options":[{"en":"Thorough analysis, safety of principal and an adequate return","fa":"تحلیل کامل، حفظ اصل سرمایه و بازده کافی"},{"en":"A high expected return on its own","fa":"صرفاً بازده مورد انتظار بالا"},{"en":"A famous founder behind it","fa":"یک بنیان‌گذار معروف پشت آن"}],"answer":0}]]},{"id":"b14","title":"One Up on Wall Street","author":{"en":"Peter Lynch with John Rothchild","fa":"Peter Lynch with John Rothchild"},"year":1989,"stage":3,"must":false,"why":{"en":"Investing in what you yourself understand","fa":"سرمایه‌گذاری با چیزهایی که خودت می‌فهمی"},"badge":{"en":"Know What You Own","fa":"بدان چه داری"},"units":[[{"kind":"card","id":"b14c1","source":"Part 1, Preparing to Invest: the amateur's edge","text":{"en":"Lynch's claim: an amateur who pays attention at work, in the mall and at home can spot great companies long before Wall Street analysts notice them. Everyday life is a lead, not a substitute for homework.","fa":"ادعای Lynch: آماتوری که سر کار، در فروشگاه و در خانه حواسش جمع باشد می‌تواند شرکت‌های عالی را خیلی زودتر از تحلیلگران Wall Street پیدا کند. زندگی روزمره یک سرنخ است، نه جایگزین تحقیق."}},{"kind":"card","id":"b14c2","source":"ch. 7, I've Got It, I've Got It. What Is It?","text":{"en":"Lynch sorts stocks into six categories: slow growers, stalwarts, fast growers, cyclicals, turnarounds and asset plays. Know which one you own, because each needs a different plan and expectation.","fa":"Lynch سهام را به شش دسته تقسیم می‌کند: رشد کند، استوارها، رشد سریع، چرخه‌ای، بازگشتی و دارایی‌محور. بدان کدام را داری، چون هر کدام برنامه و انتظار متفاوتی می‌خواهد."}},{"kind":"check","id":"b14k1","type":"tap","source":"b14c2","prompt":{"en":"Which are Lynch's six stock categories?","fa":"شش دستهٔ سهام Lynch کدام‌اند؟"},"options":[{"en":"Slow growers, stalwarts, fast growers, cyclicals, turnarounds and asset plays","fa":"رشد کند، استوارها، رشد سریع، چرخه‌ای، بازگشتی و دارایی‌محور"},{"en":"Tech, finance, energy, health, retail and utilities","fa":"فناوری، مالی، انرژی، سلامت، خرده‌فروشی و خدمات عمومی"},{"en":"Penny, blue chip, dividend, growth, value and momentum","fa":"پنی، بلوچیپ، سود تقسیمی، رشدی، ارزشی و مومنتوم"}],"answer":0},{"kind":"card","id":"b14c3","source":"ch. 8, The Perfect Stock, What a Deal!","text":{"en":"His favourite stocks sound dull, do something dull or disagreeable, sit in a no-growth niche, are ignored by institutions and analysts, and have insiders buying or the company buying back its own shares.","fa":"سهام محبوب او اسم کسل‌کننده دارند، کار کسل‌کننده یا ناخوشایندی می‌کنند، در گوشه‌ای از یک صنعت بدون رشد نشسته‌اند، نهادها و تحلیلگران نادیده‌شان می‌گیرند، و مدیران داخلی می‌خرند یا شرکت سهام خودش را بازخرید می‌کند."}},{"kind":"check","id":"b14k2","type":"tf","source":"b14c3","prompt":{"en":"Lynch prefers exciting stocks that every big institution already owns.","fa":"Lynch سهام هیجان‌انگیزی را ترجیح می‌دهد که همهٔ نهادهای بزرگ از قبل دارند."},"answer":false}],[{"kind":"card","id":"b14c4","source":"ch. 10, Earnings, Earnings, Earnings","text":{"en":"Earnings drive stock prices in the long run. A fairly priced company has a PE ratio about equal to its earnings growth rate; a PE of half the growth rate is cheap, twice the growth rate is expensive.","fa":"در بلندمدت، سود است که قیمت سهم را می‌سازد. شرکتی با قیمت منصفانه نسبت PE تقریباً برابر نرخ رشد سودش دارد؛ PE نصف نرخ رشد ارزان است و دو برابر نرخ رشد گران."}},{"kind":"check","id":"b14k3","type":"tf","source":"b14c4","prompt":{"en":"Lynch says a fairly priced company's PE ratio is about equal to its earnings growth rate.","fa":"Lynch می‌گوید نسبت PE یک شرکت با قیمت منصفانه تقریباً برابر نرخ رشد سودش است."},"answer":true},{"kind":"card","id":"b14c5","source":"ch. 11, The Two-Minute Drill","text":{"en":"Before buying, give a two-minute monologue on the story: why you want it, what has to happen for it to succeed and what could go wrong. Never invest in an idea you cannot illustrate with a crayon.","fa":"پیش از خرید، دو دقیقه داستان سهم را برای خودت بگو: چرا می‌خواهی‌اش، چه باید اتفاق بیفتد تا موفق شود و چه چیزی می‌تواند خراب شود. هرگز روی ایده‌ای سرمایه‌گذاری نکن که نتوانی با مدادشمعی نقاشی‌اش کنی."}},{"kind":"card","id":"b14c6","source":"ch. 9, Stocks I'd Avoid; ch. 17, The Best Time to Buy and Sell","text":{"en":"Avoid the hottest stock in the hottest industry and companies that diworseify into businesses they do not understand. Selling your winners and keeping your losers is cutting the flowers and watering the weeds.","fa":"از داغ‌ترین سهم در داغ‌ترین صنعت و از شرکت‌هایی که با diworseification وارد کسب‌وکارهایی می‌شوند که نمی‌فهمند دوری کن. فروختن برنده‌ها و نگه داشتن بازنده‌ها یعنی چیدن گل‌ها و آب دادن به علف‌های هرز."}},{"kind":"check","id":"b14k4","type":"tap","source":"b14c6","prompt":{"en":"What does Lynch call selling your winners and keeping your losers?","fa":"Lynch فروختن برنده‌ها و نگه داشتن بازنده‌ها را چه می‌نامد؟"},"options":[{"en":"Cutting the flowers and watering the weeds","fa":"چیدن گل‌ها و آب دادن به علف‌های هرز"},{"en":"Diworseification","fa":"diworseification"},{"en":"Buying the hottest stock in the hottest industry","fa":"خریدن داغ‌ترین سهم در داغ‌ترین صنعت"}],"answer":0}],[{"kind":"card","id":"b14a1","source":"Part 1, the amateur's edge","text":{"en":"Your edge, in Lynch's sense, is seeing which developer tools and AI products your team actually pays for before Wall Street notices. Treat that as a lead for a satellite bet, not a substitute for homework.","fa":"مزیت تو به معنای Lynch این است که می‌بینی تیمت واقعاً برای کدام ابزارهای توسعه و محصولات AI پول می‌دهد، پیش از آنکه Wall Street متوجه شود. آن را سرنخی برای یک شرط ماهواره‌ای بدان، نه جایگزین تحقیق."}},{"kind":"card","id":"b14a2","source":"ch. 11, the two-minute drill","text":{"en":"Before you put any of the 20 percent satellite into a company, give the two-minute monologue: why you want it, what has to happen for it to succeed and what could go wrong. Write it in your decision journal.","fa":"پیش از آنکه چیزی از ۲۰ درصد ماهواره‌ای را روی یک شرکت بگذاری، تک‌گویی دو دقیقه‌ای را انجام بده: چرا می‌خواهی‌اش، چه باید اتفاق بیفتد تا موفق شود و چه چیزی می‌تواند خراب شود. آن را در دفتر تصمیمت بنویس."}},{"kind":"check","id":"b14ak1","type":"tap","source":"b14a1","prompt":{"en":"In Lynch's sense, what is your edge as a CTO?","fa":"به معنای Lynch، مزیت تو به‌عنوان CTO چیست؟"},"options":[{"en":"Seeing which developer tools and AI products your team actually pays for","fa":"دیدن اینکه تیمت واقعاً برای کدام ابزارهای توسعه و محصولات AI پول می‌دهد"},{"en":"Reading analyst reports faster than others","fa":"خواندن گزارش‌های تحلیلگران سریع‌تر از بقیه"},{"en":"Timing the market with technical charts","fa":"زمان‌بندی بازار با نمودارهای تکنیکال"}],"answer":0},{"kind":"card","id":"b14a3","source":"ch. 9, avoid the hottest stock in the hottest industry","text":{"en":"The hottest AI stock in the hottest industry is exactly what Lynch avoids, and you will hear about it first because you work in that industry. Being early to the hype is not an edge.","fa":"داغ‌ترین سهم AI در داغ‌ترین صنعت دقیقاً همان چیزی است که Lynch از آن دوری می‌کند، و تو زودتر از همه درباره‌اش می‌شنوی چون در همان صنعت کار می‌کنی. زود رسیدن به هیاهو مزیت نیست."}},{"kind":"check","id":"b14ak2","type":"tf","source":"b14a3","prompt":{"en":"By Lynch's rule, hearing about a hot AI stock early at work is a reliable edge.","fa":"طبق قاعدهٔ Lynch، زود شنیدن دربارهٔ یک سهم داغ AI سر کار یک مزیت قابل‌اتکاست."},"answer":false},{"kind":"card","id":"b14a4","source":"ch. 17, cutting the flowers and watering the weeds","text":{"en":"If a satellite bet works, do not cut the flowers and water the weeds: selling a winner only because it grew, while keeping a loser out of hope, is Lynch's classic mistake. Rebalance by rule, not by regret.","fa":"اگر یک شرط ماهواره‌ای جواب داد، گل‌ها را نچین و به علف‌های هرز آب نده: فروختن برنده فقط چون رشد کرده، در حالی که بازنده را از سر امید نگه می‌داری، همان اشتباه کلاسیک Lynch است. طبق قاعده متوازن کن، نه از سر حسرت."}},{"kind":"check","id":"b14ak3","type":"tap","source":"b14a2","prompt":{"en":"What goes into the two-minute monologue before a satellite bet?","fa":"پیش از یک شرط ماهواره‌ای، چه چیزی در تک‌گویی دو دقیقه‌ای می‌آید؟"},"options":[{"en":"Why you want it, what has to happen for it to succeed and what could go wrong","fa":"چرا می‌خواهی‌اش، چه باید اتفاق بیفتد تا موفق شود و چه چیزی می‌تواند خراب شود"},{"en":"The stock's price history and chart pattern","fa":"تاریخچهٔ قیمت سهم و الگوی نمودارش"},{"en":"What your colleagues think of the company","fa":"نظر همکارانت دربارهٔ شرکت"}],"answer":0}]]},{"id":"b15","title":"Venture Deals","author":{"en":"Brad Feld and Jason Mendelson","fa":"Brad Feld و Jason Mendelson"},"year":2011,"stage":5,"must":true,"why":{"en":"Cap table, term sheet, vesting; before you sign anything","fa":"cap table، term sheet، vesting؛ قبل از امضای هر چیزی"},"badge":{"en":"Economics and Control","fa":"اقتصاد و کنترل"},"units":[[{"kind":"card","id":"b15c1","source":"Chapter 3, Overview of the Term Sheet","text":{"en":"Chapter 3, Overview of the Term Sheet: a term sheet is full of clauses, but VCs really care about only two things: economics and control. Everything else is detail.","fa":"فصل ۳، Overview of the Term Sheet: یک term sheet پر از بند است، اما سرمایه‌گذاران خطرپذیر واقعاً فقط به دو چیز اهمیت می‌دهند: اقتصاد و کنترل. بقیه جزئیات است."}},{"kind":"card","id":"b15c2","source":"Chapter 4, Economic Terms of the Term Sheet: Price","text":{"en":"Chapter 4, Economic Terms: pre-money valuation plus the investment equals post-money valuation. If the option pool sits inside the pre-money, your effective price per share drops.","fa":"فصل ۴، Economic Terms: ارزش‌گذاری pre-money به‌علاوهٔ مبلغ سرمایه‌گذاری برابر است با ارزش‌گذاری post-money. اگر option pool داخل pre-money قرار بگیرد، قیمت مؤثر هر سهم شما پایین می‌آید."}},{"kind":"check","id":"b15k1","type":"tap","source":"b15c1","prompt":{"en":"According to Venture Deals, which two things really matter in a term sheet?","fa":"به گفتهٔ Venture Deals، کدام دو چیز در term sheet واقعاً مهم‌اند؟"},"options":[{"en":"Economics and control","fa":"اقتصاد و کنترل"},{"en":"Valuation and legal fees","fa":"ارزش‌گذاری و هزینه‌های حقوقی"},{"en":"Board size and founder salary","fa":"اندازهٔ هیئت‌مدیره و حقوق بنیان‌گذار"}],"answer":0},{"kind":"card","id":"b15c3","source":"Chapter 4, Economic Terms of the Term Sheet: Liquidation Preference","text":{"en":"Chapter 4, Liquidation preference: it decides who gets paid first and how much when the company is sold. A 1x non-participating preference is standard; participating preferred lets investors double dip.","fa":"فصل ۴، liquidation preference: تعیین می‌کند هنگام فروش شرکت چه کسی اول و چقدر پول می‌گیرد. ترجیح ۱x غیرمشارکتی استاندارد است؛ سهام ترجیحی مشارکتی به سرمایه‌گذار اجازهٔ double dip می‌دهد."}},{"kind":"check","id":"b15k2","type":"tap","source":"b15c2","prompt":{"en":"Pre-money valuation plus the investment equals what?","fa":"ارزش‌گذاری pre-money به‌علاوهٔ مبلغ سرمایه‌گذاری برابر چیست؟"},"options":[{"en":"Post-money valuation","fa":"ارزش‌گذاری post-money"},{"en":"Liquidation preference","fa":"liquidation preference"},{"en":"Option pool","fa":"option pool"}],"answer":0}],[{"kind":"card","id":"b15c4","source":"Chapter 4, Economic Terms of the Term Sheet: Vesting","text":{"en":"Chapter 4, Vesting: founders' stock typically vests over four years with a one-year cliff. If you leave before the cliff, you walk away with nothing; unvested shares return to the company.","fa":"فصل ۴، vesting: سهام بنیان‌گذاران معمولاً طی چهار سال با یک cliff یک‌ساله vest می‌شود. اگر پیش از cliff بروید، دست خالی می‌روید؛ سهام vest‌نشده به شرکت برمی‌گردد."}},{"kind":"check","id":"b15k3","type":"tf","source":"b15c4","prompt":{"en":"If a founder leaves before the one-year cliff, they keep their unvested shares.","fa":"اگر بنیان‌گذاری پیش از cliff یک‌ساله برود، سهام vest‌نشده‌اش را نگه می‌دارد."},"answer":false},{"kind":"card","id":"b15c5","source":"Chapter 5, Control Terms of the Term Sheet","text":{"en":"Chapter 5, Control Terms: the board of directors and protective provisions give investors control regardless of their ownership share. Protective provisions let them veto key decisions such as a sale.","fa":"فصل ۵، Control Terms: هیئت‌مدیره و protective provisions فارغ از درصد مالکیت، به سرمایه‌گذاران کنترل می‌دهند. protective provisions به آن‌ها حق وتو در تصمیم‌های کلیدی مثل فروش شرکت می‌دهد."}},{"kind":"card","id":"b15c6","source":"Chapter 8, How Venture Capital Funds Work","text":{"en":"Chapter 8, How VC Funds Work: a fund lives about ten years, charges a management fee near 2 percent a year and keeps about 20 percent of profits as carry. Know where your VC is in the fund's life.","fa":"فصل ۸، How Venture Capital Funds Work: عمر یک صندوق حدود ده سال است، کارمزد مدیریت سالانه نزدیک ۲ درصد می‌گیرد و حدود ۲۰ درصد سود را به‌عنوان carry برمی‌دارد. بدانید سرمایه‌گذارتان در کدام مرحله از عمر صندوق است."}},{"kind":"check","id":"b15k4","type":"tf","source":"b15c6","prompt":{"en":"A typical VC fund keeps about 20 percent of profits as carry.","fa":"یک صندوق VC معمولی حدود ۲۰ درصد سود را به‌عنوان carry برمی‌دارد."},"answer":true}],[{"kind":"card","id":"b15a1","source":"Chapter 4, Vesting: four years with a one-year cliff","text":{"en":"Before you sign a CTO equity offer, ask for the vesting schedule in writing: the book's standard is four years with a one-year cliff. Leaving in month ten means you walk away with nothing.","fa":"پیش از امضای پیشنهاد equity برای نقش CTO، برنامهٔ vesting را مکتوب بخواه: استاندارد کتاب چهار سال با cliff یک‌ساله است. اگر در ماه دهم بروی، دست خالی می‌روی."}},{"kind":"card","id":"b15a2","source":"Chapter 4, Price: the option pool inside the pre-money","text":{"en":"Your roadmap wants a written cap table. When you read it, check whether the option pool sits inside the pre-money; if it does, your share is smaller than the headline percentage suggests.","fa":"نقشهٔ راهت cap table مکتوب می‌خواهد. وقتی می‌خوانی‌اش، ببین option pool داخل pre-money هست یا نه؛ اگر هست، سهم تو از درصدی که در تیتر آمده کوچک‌تر است."}},{"kind":"check","id":"b15ak1","type":"tap","source":"b15a1","prompt":{"en":"You are offered CTO equity. What does Venture Deals tell you to get in writing before you sign?","fa":"به تو equity برای نقش CTO پیشنهاد شده. Venture Deals می‌گوید پیش از امضا چه چیزی را مکتوب بگیری؟"},"options":[{"en":"The vesting schedule","fa":"برنامهٔ vesting"},{"en":"A promise of a board seat","fa":"وعدهٔ یک کرسی در هیئت‌مدیره"},{"en":"A guaranteed first-year bonus","fa":"پاداش تضمین‌شدهٔ سال اول"}],"answer":0},{"kind":"card","id":"b15a3","source":"Chapter 3 and Chapter 5: economics and control","text":{"en":"Read any term sheet twice: once for economics (price, liquidation preference) and once for control (board seats, protective provisions). A fair price with a bad board can still cost you the company.","fa":"هر term sheet را دو بار بخوان: یک بار برای اقتصاد (قیمت، liquidation preference) و یک بار برای کنترل (کرسی‌های هیئت‌مدیره، protective provisions). قیمت منصفانه با هیئت‌مدیرهٔ بد هم می‌تواند شرکت را از تو بگیرد."}},{"kind":"check","id":"b15ak2","type":"tf","source":"b15a2","prompt":{"en":"If the option pool sits inside the pre-money, your real share is larger than the headline percentage.","fa":"اگر option pool داخل pre-money باشد، سهم واقعی تو از درصد تیتر بزرگ‌تر است."},"answer":false},{"kind":"card","id":"b15a4","source":"Chapter 8, How Venture Capital Funds Work: the ten-year fund life","text":{"en":"If you ever put part of your 20 percent satellite into a startup round, ask the lead investor where their fund is in its ten-year life. A fund near its end pushes for a fast exit.","fa":"اگر روزی بخشی از ۲۰ درصد satellite خود را در یک دور استارتاپی بگذاری، از سرمایه‌گذار اصلی بپرس صندوقش در کجای عمر ده‌سالهٔ خود است. صندوقی که به پایان نزدیک است، برای خروج سریع فشار می‌آورد."}},{"kind":"check","id":"b15ak3","type":"tap","source":"b15a3","prompt":{"en":"Which pair belongs to the control side of a term sheet?","fa":"کدام جفت به سمت کنترل term sheet تعلق دارد؟"},"options":[{"en":"Price and liquidation preference","fa":"قیمت و liquidation preference"},{"en":"Board seats and protective provisions","fa":"کرسی‌های هیئت‌مدیره و protective provisions"},{"en":"Founder salary and office lease","fa":"حقوق بنیان‌گذار و اجارهٔ دفتر"}],"answer":1}]]},{"id":"b16","title":"The Mom Test","author":{"en":"Rob Fitzpatrick","fa":"Rob Fitzpatrick"},"year":2013,"stage":5,"must":true,"why":{"en":"Validating an idea without fooling yourself","fa":"اعتبارسنجی ایده بدون خودفریبی"},"badge":{"en":"Talk Less, Listen More","fa":"کمتر بگو، بیشتر بشنو"},"units":[[{"kind":"card","id":"b16c1","source":"Chapter 1, The Mom Test","text":{"en":"Chapter 1, The Mom Test: talk about their life instead of your idea. Ask about specifics in the past instead of generics or opinions about the future, and talk less, listen more.","fa":"فصل ۱، The Mom Test: دربارهٔ زندگی آن‌ها حرف بزن، نه ایدهٔ خودت. به‌جای کلی‌گویی یا نظر دربارهٔ آینده، از جزئیات گذشته بپرس؛ و کمتر بگو، بیشتر بشنو."}},{"kind":"card","id":"b16c2","source":"Chapter 2, Avoiding Bad Data","text":{"en":"Chapter 2, Avoiding Bad Data: three kinds of bad data are compliments, fluff and ideas. 'I would definitely buy that' is fluff about the future, not evidence of anything.","fa":"فصل ۲، Avoiding Bad Data: سه نوع دادهٔ بد وجود دارد: تعریف و تمجید، حرف‌های توخالی (fluff) و ایده‌ها. جملهٔ «حتماً می‌خرمش» حرف توخالی دربارهٔ آینده است، نه شاهدی بر چیزی."}},{"kind":"check","id":"b16k1","type":"tap","source":"b16c1","prompt":{"en":"Which of these is a rule of The Mom Test?","fa":"کدام‌یک از قواعد The Mom Test است؟"},"options":[{"en":"Talk about their life instead of your idea","fa":"دربارهٔ زندگی آن‌ها حرف بزن، نه ایدهٔ خودت"},{"en":"Pitch your idea first, then ask for feedback","fa":"اول ایده‌ات را pitch کن، بعد بازخورد بخواه"},{"en":"Ask how much they would pay in the future","fa":"بپرس در آینده چقدر حاضرند بپردازند"}],"answer":0},{"kind":"check","id":"b16k2","type":"tf","source":"b16c2","prompt":{"en":"'I would definitely buy that' is strong evidence of demand.","fa":"جملهٔ «حتماً می‌خرمش» شاهد محکمی بر وجود تقاضاست."},"answer":false}],[{"kind":"card","id":"b16c3","source":"Chapter 3, Asking Important Questions","text":{"en":"Chapter 3, Asking Important Questions: in every conversation ask at least one question that could destroy your business idea. If you're scared of the answer, you need it most.","fa":"فصل ۳، Asking Important Questions: در هر گفتگو دست‌کم یک سؤال بپرس که بتواند ایدهٔ کسب‌وکارت را نابود کند. اگر از جواب می‌ترسی، یعنی بیش از همه به آن نیاز داری."}},{"kind":"card","id":"b16c4","source":"Chapter 5, Commitment and Advancement","text":{"en":"Chapter 5, Commitment and Advancement: a meeting succeeds only when they give up something: time, reputation or money. A compliment with no next step is a failed meeting.","fa":"فصل ۵، Commitment and Advancement: یک جلسه فقط وقتی موفق است که طرف چیزی بدهد: وقت، اعتبار یا پول. تعریف و تمجید بدون قدم بعدی یعنی جلسه شکست خورده."}},{"kind":"check","id":"b16k3","type":"tap","source":"b16c4","prompt":{"en":"What shows a customer meeting really succeeded?","fa":"چه چیزی نشان می‌دهد جلسه با مشتری واقعاً موفق بوده؟"},"options":[{"en":"They give up time, reputation or money","fa":"طرف وقت، اعتبار یا پول می‌دهد"},{"en":"They say they love the idea","fa":"می‌گویند عاشق ایده‌اند"},{"en":"They ask you to send more information","fa":"می‌خواهند اطلاعات بیشتری بفرستی"}],"answer":0},{"kind":"card","id":"b16c5","source":"Chapter 4, Keeping It Casual","text":{"en":"Chapter 4, Keeping It Casual: the best early conversations don't feel like meetings. Skip the pitch and the formality; a quick chat at a conference can teach more than a scheduled hour.","fa":"فصل ۴، Keeping It Casual: بهترین گفتگوهای اولیه اصلاً شبیه جلسه نیستند. pitch و تشریفات را کنار بگذار؛ یک گپ کوتاه در یک کنفرانس می‌تواند بیش از یک ساعت جلسهٔ رسمی یاد بدهد."}},{"kind":"card","id":"b16c6","source":"Chapter 7, Choosing Your Customers","text":{"en":"Chapter 7, Choosing Your Customers: if you hear inconsistent problems and goals, your customer segment is too broad. Slice it until you can say exactly who they are and where to find them.","fa":"فصل ۷، Choosing Your Customers: اگر مشکل‌ها و هدف‌هایی که می‌شنوی ناسازگارند، بخش مشتری‌ات زیادی گسترده است. آن‌قدر آن را برش بزن تا بتوانی دقیقاً بگویی چه کسانی هستند و کجا پیدایشان می‌کنی."}},{"kind":"check","id":"b16k4","type":"tf","source":"b16c3","prompt":{"en":"Fitzpatrick says to ask at least one question that could destroy your idea.","fa":"Fitzpatrick می‌گوید دست‌کم یک سؤال بپرس که بتواند ایده‌ات را نابود کند."},"answer":true}],[{"kind":"card","id":"b16a1","source":"Chapter 1, The Mom Test: talk about their life, ask about the past","text":{"en":"Before you write a line of your AI product, hold five conversations about the other person's work: ask what they did last week, not whether they would use your tool. Their past is data; your idea is not.","fa":"پیش از نوشتن حتی یک خط از محصول AI خود، پنج گفتگو دربارهٔ کار طرف مقابل داشته باش: بپرس هفتهٔ گذشته چه کرد، نه اینکه آیا ابزارت را به کار می‌برد. گذشتهٔ او داده است؛ ایدهٔ تو نه."}},{"kind":"card","id":"b16a2","source":"Chapter 2, Avoiding Bad Data: compliments and fluff","text":{"en":"When a friend says your AI tool sounds great, write it down as a compliment, not as a signal. Your first €100 of ownership income will come from people who pay, not from people who are polite.","fa":"وقتی دوستی می‌گوید ابزار AI تو عالی به نظر می‌رسد، آن را به‌عنوان تعریف یادداشت کن، نه نشانه. اولین ۱۰۰ یورو درآمد مالکیتی‌ات از کسانی می‌آید که پول می‌دهند، نه از کسانی که مؤدب‌اند."}},{"kind":"check","id":"b16ak1","type":"tap","source":"b16a1","prompt":{"en":"You talk to a possible user of your AI product. Which question follows The Mom Test?","fa":"با کاربر احتمالی محصول AI خود حرف می‌زنی. کدام سؤال از The Mom Test پیروی می‌کند؟"},"options":[{"en":"What did you do last week?","fa":"هفتهٔ گذشته چه کردی؟"},{"en":"Would you use my tool?","fa":"آیا ابزار مرا به کار می‌بری؟"},{"en":"How much would you pay later?","fa":"بعداً چقدر حاضری بپردازی؟"}],"answer":0},{"kind":"card","id":"b16a3","source":"Chapter 5, Commitment and Advancement: time, reputation or money","text":{"en":"End every conversation by asking for something that costs them: an intro, a half-hour next week, or a prepayment. If nobody gives up time, reputation or money, the idea has not passed yet.","fa":"هر گفتگو را با درخواست چیزی تمام کن که برایشان هزینه دارد: یک معرفی، نیم ساعت در هفتهٔ بعد، یا پیش‌پرداخت. اگر هیچ‌کس وقت، اعتبار یا پول نمی‌دهد، ایده هنوز قبول نشده."}},{"kind":"check","id":"b16ak2","type":"tf","source":"b16a2","prompt":{"en":"A friend saying your AI tool sounds great counts as a buying signal.","fa":"اینکه دوستی بگوید ابزار AI تو عالی به نظر می‌رسد، نشانهٔ خرید محسوب می‌شود."},"answer":false},{"kind":"card","id":"b16a4","source":"Chapter 7, Choosing Your Customers: slice the segment","text":{"en":"Keep a one-page note per conversation, like your reading notes. If the problems you hear don't line up, your customer segment is too broad; slice it until you can name who they are and where to find them.","fa":"برای هر گفتگو یک صفحه یادداشت نگه دار، مثل یادداشت‌های کتاب‌خوانی‌ات. اگر مشکل‌هایی که می‌شنوی با هم جور درنمی‌آیند، بخش مشتری‌ات زیادی گسترده است؛ آن‌قدر برشش بزن تا بتوانی بگویی چه کسانی‌اند و کجا پیدایشان می‌کنی."}},{"kind":"check","id":"b16ak3","type":"tap","source":"b16a3","prompt":{"en":"Per Commitment and Advancement, how should a conversation end?","fa":"طبق Commitment and Advancement، گفتگو چطور باید تمام شود؟"},"options":[{"en":"With a warm compliment","fa":"با یک تعریف گرم"},{"en":"Asking for something that costs them","fa":"با درخواست چیزی که برایشان هزینه دارد"},{"en":"Sending a long follow-up email","fa":"با فرستادن یک ایمیل پیگیری بلند"}],"answer":1}]]},{"id":"b17","title":"The Almanack of Naval Ravikant (free)","author":{"en":"Eric Jorgenson","fa":"Eric Jorgenson"},"year":2020,"stage":5,"must":true,"why":{"en":"Exactly the philosophy of wealth without a boss","fa":"دقیقاً فلسفه «ثروت بدون رئیس»"},"badge":{"en":"Permissionless Leverage","fa":"اهرم بدون اجازه"},"units":[[{"kind":"card","id":"b17c1","source":"Part I, Building Wealth: Understanding How Wealth Is Created","text":{"en":"Part I, Building Wealth: seek wealth, not money or status. Wealth is having assets that earn while you sleep; money is how we transfer time and wealth.","fa":"بخش اول، Building Wealth: به دنبال ثروت باش، نه پول یا جایگاه. ثروت یعنی داشتن دارایی‌هایی که وقتی خوابی درآمد می‌سازند؛ پول فقط ابزار انتقال زمان و ثروت است."}},{"kind":"card","id":"b17c2","source":"Part I, Building Wealth: own equity","text":{"en":"You won't get rich renting out your time. You must own equity, a piece of a business, to gain your financial freedom.","fa":"با اجاره دادن وقتت ثروتمند نمی‌شوی. برای رسیدن به آزادی مالی باید مالک equity باشی، یعنی تکه‌ای از یک کسب‌وکار."}},{"kind":"check","id":"b17k1","type":"tap","source":"b17c1","prompt":{"en":"In the Almanack, what is wealth?","fa":"در Almanack، ثروت چیست؟"},"options":[{"en":"Assets that earn while you sleep","fa":"دارایی‌هایی که وقتی خوابی درآمد می‌سازند"},{"en":"A high salary and a respected title","fa":"حقوق بالا و عنوان معتبر"},{"en":"Cash kept safely in a bank","fa":"پول نقدی که در بانک نگه داشته شده"}],"answer":0},{"kind":"check","id":"b17k2","type":"tf","source":"b17c2","prompt":{"en":"Naval says renting out your time is the way to get rich.","fa":"Naval می‌گوید اجاره دادن وقتت راه ثروتمند شدن است."},"answer":false}],[{"kind":"card","id":"b17c3","source":"Part I, Building Wealth: Find a Position of Leverage","text":{"en":"Leverage comes in three forms: labor, capital, and products with no marginal cost of replication, meaning code and media. Code and media are permissionless; nobody has to approve them.","fa":"اهرم سه شکل دارد: نیروی کار، سرمایه، و محصولاتی که هزینهٔ تکثیر حاشیه‌ای ندارند، یعنی کد و رسانه. کد و رسانه بدون اجازه‌اند؛ کسی لازم نیست تأییدشان کند."}},{"kind":"card","id":"b17c4","source":"Part I, Building Wealth: Find and Build Specific Knowledge","text":{"en":"Specific knowledge is found by pursuing your genuine curiosity, not by chasing whatever is hot right now. It feels like play to you but looks like work to others.","fa":"دانش خاص را با دنبال کردن کنجکاوی واقعی‌ات پیدا می‌کنی، نه با دویدن دنبال چیزی که الان داغ است. برای تو مثل بازی است، اما از بیرون شبیه کار به نظر می‌رسد."}},{"kind":"check","id":"b17k3","type":"tap","source":"b17c3","prompt":{"en":"Which forms of leverage does Naval call permissionless?","fa":"Naval کدام شکل‌های اهرم را «بدون اجازه» می‌نامد؟"},"options":[{"en":"Code and media","fa":"کد و رسانه"},{"en":"Labor and capital","fa":"نیروی کار و سرمایه"},{"en":"Loans and licenses","fa":"وام و مجوز"}],"answer":0},{"kind":"card","id":"b17c5","source":"Part I, Building Wealth: Play Long-Term Games; learn to sell, learn to build","text":{"en":"Learn to sell, learn to build; if you can do both, you will be unstoppable. Play long-term games with long-term people, because all returns in life come from compound interest.","fa":"فروختن یاد بگیر، ساختن یاد بگیر؛ اگر هر دو را بلد باشی، توقف‌ناپذیر خواهی بود. با آدم‌های بلندمدت بازی‌های بلندمدت بکن، چون همهٔ بازده‌های زندگی از مرکب شدن می‌آیند."}},{"kind":"card","id":"b17c6","source":"Part II, Learning Happiness: Happiness Is Learned","text":{"en":"Part II, Learning Happiness: happiness is a skill you can learn and a choice you make, not something that happens to you. Desire is a contract with yourself to be unhappy until you get what you want.","fa":"بخش دوم، Learning Happiness: شادی مهارتی است که می‌توان آموخت و انتخابی است که می‌کنی، نه چیزی که برایت اتفاق می‌افتد. خواستن، قراردادی با خودت است که تا رسیدن به آن چیز ناشاد بمانی."}},{"kind":"check","id":"b17k4","type":"tf","source":"b17c6","prompt":{"en":"Naval treats happiness as a skill that can be learned.","fa":"Naval شادی را مهارتی می‌داند که می‌توان آموخت."},"answer":true}],[{"kind":"card","id":"b17a1","source":"Part I, Building Wealth: own equity, don't rent out your time","text":{"en":"Your roadmap says wealth is built by ownership. In Naval's words that means equity: a written share of a startup or a product you own, not a higher salary for your hours.","fa":"نقشهٔ راهت می‌گوید ثروت با مالکیت ساخته می‌شود. به زبان Naval یعنی equity: سهمی مکتوب از یک استارتاپ یا محصولی که مال توست، نه حقوق بالاتر برای ساعت‌هایت."}},{"kind":"card","id":"b17a2","source":"Part I, Building Wealth: permissionless leverage, code and media","text":{"en":"As an engineer you already hold Naval's permissionless leverage: code. A small AI product that runs while you sleep is code leverage; nobody has to approve it, and it can earn your first €100.","fa":"به‌عنوان مهندس، اهرم بدون اجازهٔ Naval را همین حالا داری: کد. یک محصول کوچک AI که وقتی خوابی کار می‌کند، اهرم کد است؛ کسی لازم نیست تأییدش کند، و می‌تواند اولین ۱۰۰ یورویت را بسازد."}},{"kind":"check","id":"b17ak1","type":"tap","source":"b17a2","prompt":{"en":"Which form of leverage does Naval call permissionless, and which do you already hold?","fa":"Naval کدام شکل اهرم را «بدون اجازه» می‌نامد که تو همین حالا داری؟"},"options":[{"en":"Code; nobody has to approve it","fa":"کد؛ کسی لازم نیست تأییدش کند"},{"en":"Capital; a bank loan","fa":"سرمایه؛ یک وام بانکی"},{"en":"Labor; hiring a team","fa":"نیروی کار؛ استخدام یک تیم"}],"answer":0},{"kind":"card","id":"b17a3","source":"Part I, Building Wealth: specific knowledge from genuine curiosity","text":{"en":"Pick the product from your genuine curiosity, not from what is hot this month. Specific knowledge feels like play to you, so you keep going when the first version earns nothing.","fa":"محصول را از کنجکاوی واقعی‌ات انتخاب کن، نه از چیزی که این ماه داغ است. دانش خاص برای تو مثل بازی است، پس وقتی نسخهٔ اول هیچ درآمدی ندارد، باز ادامه می‌دهی."}},{"kind":"check","id":"b17ak2","type":"tf","source":"b17a1","prompt":{"en":"Naval's idea of ownership is satisfied by a higher salary for your hours.","fa":"ایدهٔ مالکیت Naval با حقوق بالاتر برای ساعت‌هایت برآورده می‌شود."},"answer":false},{"kind":"card","id":"b17a4","source":"Part I, Building Wealth: play long-term games, compound interest","text":{"en":"Play long-term games: your 80 percent index core and two books a month both compound. Naval's point is that returns, in money and in people, come from staying in the game.","fa":"بازی بلندمدت بکن: هستهٔ ۸۰ درصدی شاخصی‌ات و دو کتاب در ماه، هر دو مرکب می‌شوند. حرف Naval این است که بازده، چه در پول و چه در آدم‌ها، از ماندن در بازی می‌آید."}},{"kind":"check","id":"b17ak3","type":"tap","source":"b17a3","prompt":{"en":"How does Naval say to choose what to build?","fa":"Naval می‌گوید چطور انتخاب کنی چه بسازی؟"},"options":[{"en":"From what is hot this month","fa":"از چیزی که این ماه داغ است"},{"en":"From your genuine curiosity","fa":"از کنجکاوی واقعی‌ات"},{"en":"From what investors ask for","fa":"از چیزی که سرمایه‌گذاران می‌خواهند"}],"answer":1}]]},{"id":"b18","title":"The Hard Thing About Hard Things","author":{"en":"Ben Horowitz","fa":"Ben Horowitz"},"year":2014,"stage":5,"must":true,"why":{"en":"The reality of being a CTO or founder","fa":"واقعیت CTO/بنیان‌گذار بودن"},"badge":{"en":"Lead Bullets","fa":"گلوله‌های سربی"},"units":[[{"kind":"card","id":"b18c1","source":"Introduction; Chapter 4, The Struggle","text":{"en":"Introduction: the hard thing isn't setting a big, hairy, audacious goal; it's laying people off when you miss it. Chapter 4 names this the Struggle, and there is no recipe for it.","fa":"مقدمه: سختی کار در تعیین یک هدف بزرگ و جسورانه نیست؛ سختی در اخراج آدم‌ها وقتی است که به آن هدف نرسیده‌ای. فصل ۴ این را «Struggle» می‌نامد و می‌گوید هیچ دستورالعملی برایش نیست."}},{"kind":"card","id":"b18c2","source":"Chapter 4, When Things Fall Apart: Lead Bullets","text":{"en":"Chapter 4, Lead Bullets: when a rival's product beats yours, there are no silver bullets, only lead bullets, meaning you build a better product and outwork the problem. Focus on the road, not the wall.","fa":"فصل ۴، Lead Bullets: وقتی محصول رقیب از محصولت بهتر است، گلولهٔ نقره‌ای وجود ندارد، فقط گلولهٔ سربی؛ یعنی باید محصول بهتری بسازی و با کار بیشتر از مشکل عبور کنی. به جاده نگاه کن، نه به دیوار."}},{"kind":"check","id":"b18k1","type":"tf","source":"b18c2","prompt":{"en":"Horowitz says there is usually a silver bullet that saves a losing product.","fa":"Horowitz می‌گوید معمولاً یک گلولهٔ نقره‌ای هست که محصول بازنده را نجات می‌دهد."},"answer":false},{"kind":"card","id":"b18c3","source":"Chapter 4, When Things Fall Apart: The Right Way to Lay People Off","text":{"en":"Chapter 4, The Right Way to Lay People Off: get your head right, don't delay, be clear in your own mind about why, train your managers, address the entire company, then be visible and present.","fa":"فصل ۴، The Right Way to Lay People Off: ذهنت را سر جایش بیاور، تعلل نکن، دلیل اخراج را برای خودت روشن کن، مدیرانت را آموزش بده، با کل شرکت صحبت کن، و بعد حاضر و در دسترس باش."}},{"kind":"check","id":"b18k2","type":"order","source":"b18c3","prompt":{"en":"Put Horowitz's layoff steps in order","fa":"مراحل اخراج Horowitz را مرتب کن"},"options":[{"en":"Address the entire company","fa":"با کل شرکت صحبت کن"},{"en":"Get your head right","fa":"ذهنت را سر جایش بیاور"},{"en":"Train your managers","fa":"مدیرانت را آموزش بده"},{"en":"Don't delay","fa":"تعلل نکن"}],"answer":[1,3,2,0]}],[{"kind":"card","id":"b18c4","source":"Chapter 5, Take Care of the People, the Products, and the Profits, in That Order","text":{"en":"Chapter 5, Take Care of the People, the Products, and the Profits, in That Order: a good place to work matters most when things go wrong. Train your people; hire for strength, not lack of weakness.","fa":"فصل ۵، Take Care of the People, the Products, and the Profits, in That Order: محیط کار خوب درست وقتی اهمیت پیدا می‌کند که اوضاع خراب است. آدم‌هایت را آموزش بده؛ برای نقاط قوت استخدام کن، نه برای نداشتن ضعف."}},{"kind":"check","id":"b18k3","type":"tap","source":"b18c4","prompt":{"en":"In what order does Horowitz say to take care of things?","fa":"Horowitz می‌گوید به چه ترتیبی باید مراقب چیزها بود؟"},"options":[{"en":"People, products, profits","fa":"آدم‌ها، محصولات، سود"},{"en":"Profits, products, people","fa":"سود، محصولات، آدم‌ها"},{"en":"Products, profits, people","fa":"محصولات، سود، آدم‌ها"}],"answer":0},{"kind":"card","id":"b18c5","source":"Chapter 7, Peacetime CEO/Wartime CEO","text":{"en":"Chapter 7, Peacetime CEO/Wartime CEO: a peacetime CEO knows proper protocol leads to winning; a wartime CEO violates protocol in order to win. Being both is rare and hard to learn.","fa":"فصل ۷، Peacetime CEO/Wartime CEO: مدیرعامل زمان صلح می‌داند پروتکل درست به پیروزی می‌رسد؛ مدیرعامل زمان جنگ برای پیروزی پروتکل را زیر پا می‌گذارد. هر دو بودن نادر است و سخت یاد گرفته می‌شود."}},{"kind":"card","id":"b18c6","source":"Chapter 6, Concerning the Going Concern: One-on-One","text":{"en":"Chapter 6, One-on-One: the one-on-one is the employee's meeting, not the manager's. The employee sets the agenda and should do about 90 percent of the talking.","fa":"فصل ۶، One-on-One: جلسهٔ یک‌به‌یک متعلق به کارمند است، نه مدیر. کارمند دستور جلسه را تعیین می‌کند و باید حدود ۹۰ درصد صحبت را او انجام دهد."}},{"kind":"check","id":"b18k4","type":"tf","source":"b18c6","prompt":{"en":"In a one-on-one, the employee should set the agenda.","fa":"در جلسهٔ یک‌به‌یک، کارمند باید دستور جلسه را تعیین کند."},"answer":true}],[{"kind":"card","id":"b18a1","source":"Chapter 4, The Struggle: there is no recipe","text":{"en":"If your startup misses its goal, the Struggle is not a sign you chose wrong; the book says there is no recipe. Keep your own 25x capital target separate from the company so one failure does not take both.","fa":"اگر استارتاپت به هدفش نرسید، Struggle نشانهٔ انتخاب اشتباه نیست؛ کتاب می‌گوید دستورالعملی برایش نیست. ه
